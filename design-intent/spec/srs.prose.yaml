# scribe2 SRS（MVP）— prose manifest（folio S4 generator の③「読みやすさの足場」）
#
# 機械 SSoT = srs.srs.yaml。 assemble-srs.sh が空で出した data-prose-slot に inject-prose.sh が
# HTML escape して注入する。 slot-id ↔ 散文の 1:1（集合一致を inject が fail-closed 検査）。
#   - plain        = その FR / NFR の ears.response / target を非エンジニア向けに言い換え（情報を落とさない）
#   - rationale    = rationale_source が指す upper_needs（N-x）に接地した「なぜ要る」
#   - chapter-lead = その章が何を・なぜ示すかの導入（章構成に接地）
#   - rtm-summary  = 派生数値（req=102 / need=5 / iso=0 / unv=0）の平易要約（data-derived と一致必須）
#   - cover-summary= goals 3 つ + title の 1 文約束
# 捏造 / 歪曲 / 脱落は fidelity ceiling（fidelity-srs）の検査対象。 値は単一行（tab / 改行禁止）。

slots:
  # ---- 表紙 ----
  cover-summary: "設計から契約・実装・検証・land までを、人の手番を 3 クラスの承認と台帳の問いへの裁定だけに絞って 1 本通す器（MVP）の約束を定める文書です。人を待たせず、壊れたまま進まず、記憶に頼らない、の 3 つを守ります。"

  # ---- 章リード ----
  chapter-lead-01: "まず「これが起きたら失敗」を 3 つ先に決めます。人を待たせる・壊れたまま進む・記憶に頼る、の 3 つです。避けたい結果を共有してから要件を読むと、各要件が何を守るためのものか分かりやすくなります。"
  chapter-lead-02: "この文書が扱う範囲を 50 項目、扱わない範囲を 6 項目で示し、関わる人と process（開発者・開発 session・runner・lens・CI・台帳・裁定面）を一覧にします。扱う範囲は大きく 5 つのまとまりです。契約の受付から実装・検証・land までの便の流れ（承認の停止と再開・便の自動起動・land の終端と PR で着地した便の close を含む）、規則の値と現在地・所属の目印と hook・到達点の計測、口座の計測と選定・口座を占めない park の区画・席の役割と起動（口座の候補が無い席の起動の断りを含む）・封じ込め・管理 tick、台帳と設計 doc と契約表の検査・禁じる command と戻せない操作の見張り（host-guard）、そして発話の記帳と台帳の問いと裁定の結び・発話の仕分け・席の問いの台帳化・裁定 id の実在・未反映の裁定・床の検査・選択式の問いの遮断・memo の昇格条件と審査・memo の処置と自動の close・局面の出力・器の便でない着地の発端、です。扱わない範囲は、管理 tick の外の席の自律機能と、v3 や承認の後に回す機能です。"
  chapter-lead-03: "各要件は思いつきではなく、5 つの上位ニーズ（自律安全・消費は害・記憶に頼らない・契約は小さく・自己開発）から来ています。この章はその出どころを示し、後の対応表で「どのニーズがどの機能になったか」を追えるようにします。"
  chapter-lead-04: "器が「いつ・何をするか」を 96 本の機能要件で一つずつ定めます。うち 13 本は器が持たないことを定める不在の要件です（不在の根拠は ADR-0045・管理 tick と打刻の合図と tick の unit を持つ根拠は ADR-0058）。並びは id 順で、主題で分けると大きく 5 つのまとまりになります。契約の検査から runner・gate・land・承認の停止と再開までの便の流れ、規則の値・所属の目印と hook・計測、口座の計測と選定・席の登録と起動・管理 tick と群の移動・口座を占めない park の区画、契約表と台帳と設計 doc の検査・便の自動起動と口座の候補が無い席の起動の断り・口座の設定から呼ぶ見張り（host-guard）と公開の字面の走査、そして起票の門の 4 つの断り・発話の記帳と裁定の結び・発話の仕分け・席の問いの台帳化・裁定 id の実在・未反映の裁定・床の検査・選択式の問いの遮断・memo の引き金と審査・memo の局面と処置と自動の close・局面の出力とその読み手・器の便でない着地の発端・PR で着地した便の close、です。各行にはやさしい言い換えと「なぜ要る」の根拠を添えています。"
  chapter-lead-05: "「どれくらい速く・落ちず・安全か」を数字で約束します。lens の予算・契約の大きさ・依存の本数・黙って落とさない件数・hook の時間・host の資源の 6 点を、それぞれの測り方とセットで示します。"
  chapter-lead-06: "「MVP ができた」と言える条件を、後から確かめられる形で 57 点、先に決めておきます。大きく 5 つのまとまりです。toy repo での 5 便と scribe2 自身の 1 便・偽の PASS 0 件・別 process からの再開・承認と質問の停止と再開・remote の無い repo の便と PR で着地した便の close などの便の流れ、口座残量の計測と記録・上限で止まった便の別口座での完走・口座選定の除外の集合・口座の候補が無い席の起動の断り・群の逼迫の通知と移動・口座を占めない park の区画などの口座と席、管理 tick の合図と backoff・heartbeat の決め方・裁定の指し示しなどの席への差し込み、契約表と台帳と散文の門の名指し・禁じる command と戻せない操作の拒否・公開の字面の走査などの門と見張り、そして起票の門の 4 つの断り・発話の記帳と裁定の結び・発話の仕分け・席の問いの台帳化・裁定 id の実在・未反映の裁定・床の検査・選択式の問いの遮断・memo の引き金と審査・memo の局面と処置と自動の close・局面の出力とその読み手・器の便でない着地の発端、です。一つひとつの条件は下の表にあります。"
  chapter-lead-07: "上位ニーズ・機能要件・受入基準が途切れなくつながっているかを 1 枚の表で見ます。出どころの無い要件や、確かめる手段の無い要件が残っていないかを確認する章です。"
  chapter-lead-08: "設計の前から決まっている制約を並べます。憲法が上位にあること、repo が PUBLIC であること、test は Rust だけ、前の器の作法を持ち込まない、不可逆操作の口を持たない、headless の制約、の 6 点です。"
  chapter-lead-09: "本文に出てくる専門語（契約・runner・lens・gate・land・fleet・event log・hook・worktree など 112 語）を、やさしい言い換えと定義で並べます。本文中の専門語には同じ言い換えを併記しています。"

  # ---- FR: plain（やさしい言い換え・情報を落とさない）----
  plain-FR1: "契約の file に必須の項目（何が必須かは生成の型が持ちます）が欠けていたり、verify が複数行だったり、write-set が空だったら、問題を全部まとめて行番号付きで断り、便は作りません。"
  plain-FR2: "契約には「どの要件のためか」（SRS の要件 id）と「どの設計から来たか」（設計 doc）を必ず書きます。設計 1 本から契約が何本も出る、という形を崩しません。対象は本 SRS を根拠に起票する契約で、v1 由来の既存 bead は対象外です。"
  plain-FR3: "各段は自分の記憶ではなく、追記だけの記録（event log）を最初から読み直して現在地を知り、終わるときに記録を 1 行足します。process の中に状態を抱えません。"
  plain-FR4: "便が「受け付け済み」の段にあって起動を頼まれたら、出発点（base）を記録し、作業用の worktree を切り、触ってよい file の列を書き出してから、実装役（runner）を画面なしで起動します。"
  plain-FR5: "実装役（runner）も審査役（lens）も、同じ 1 つの形で呼びます。画面なしの claude -p に、契約や diff を入力で渡し、答えは構造化した 1 行で受け取り、許可の設定は毎回明示し、口座は環境変数で切り替えます。"
  plain-FR6: "実装役が終わったとき、正常終了（rc 0）で、出発点から commit が 1 件以上あれば「実装済み」、そうでなければ「失敗」と記録します。"
  plain-FR7: "変更した Rust の file ごとに、test の差分だけを出発点（base）に当てて「先に落ちる」こと、そして変更後（HEAD）では通ることを機械で確かめます。文書だけの変更（docs-only）を除き、test の差分が無い変更は受け付けません。"
  plain-FR8: "審査（gate）を頼まれたら、契約に書いた検証コマンドを 1 行ずつ作業用 worktree で実際に走らせ、行ごとの結果を記録します。1 本でも失敗すれば FAIL です。"
  plain-FR9: "審査役が要るのに居ない、diff が予算を超える、答えが読めない、答えが 3 値（PASS / FAIL / INCONCLUSIVE）の外、のどれかなら、合格（PASS）とは言わず「判定できなかった（INCONCLUSIVE）」にします。ただし審査役は居るのに答えの形が読めなかったときだけは、同じ審査（gate）の中で審査役を 1 回だけ撃ち直し、それでも読めなければ「判定できなかった」にします（読めたうえで規則が断ったときは、審査役を撃ち直しません）。"
  plain-FR10: "審査が合格でないとき、または main の先端が記録した出発点（base）とずれていて追いつけない（出発点が main の祖先でない、または作業用 worktree に未 commit の変更がある）ときは、着地（land）は何もしません。main も記録も変えません。push の前の走査が当たって main が remote の先端に揃うまで着地が止められている間（FR50）と、便が引く裁定の番号が台帳に結ばれていない（FR83）か、写されていない裁定に関わる（FR84）間は、main に載せずに便を待たせ（Gated）、止めた理由を便ごとに 1 件だけ記録します（同じ理由が続く間は記録し直しません）。次の送り出しの周に同じ判定を撃ち直し、この待ちは撃ち直しの回数の上限に数えず、「失敗」にもしません。"
  plain-FR11: "審査が合格で前提が揃ったら、まず main に載せる 1 つの commit の出ていく文字を、push の前と同じ公開の字面の走査で調べます。隣の private repo の識別子に当たる便と、読む上限を越える便は main に載せずに「失敗」と記録して止め、調べきれない便（規則の行が無い・解けない・締め切りを越えた）は main に載せずに理由を記録して待たせ、次の送り出しの周に同じ調べを撃ち直します（規則の行が持つ回数に達したら「失敗」で終わらせます）。どちらの場合も、候補の木に並べた便は、断った便より後ろの便も main に載せずに並びへ戻し、木を組み直して検査を撃ち直します。規則の行を off にしたときは調べません。通ったら、作業用 worktree の中身を 1 つの commit にまとめて main に載せ（中身が同一であることと、他の変更と競合しないことを確かめて）、main の上で検証を撃ち直します。落ちたら「失敗」と記録して止まります。"
  plain-FR12: "着地が成立したら、判定の結果を版番号付きの 1 行として verdicts.jsonl に追記し、「着地済み」と記録します。次の版の器がこの記録を読めるようにするためです。"
  plain-FR13: "stop --all は、動いている実装役をすべて止める 1 つのコマンドです。何度撃っても同じ結果になり、結果は 0（全部止まった、または止める対象なし）・1（止められないものが残った）・2（記録が読めない）の 3 値で返します。便 1 本を名指して止める形もあり、まだ終わっていないその便だけを止めて「止めた」と記録します。止め切れなかったときは記録せず 1 を、もう終わっている便には記録を増やさず 1 を返します。gate の結果（verdict）を読めない Gated の便は、もう終わっているかを決められないので、止めずに 2 を返して断ります。停止の権能は manifest の行 role.orchestrator が持ち（FR41）、行が許すのは便 1 本を名指す形だけで、stop --all は許しません。"
  plain-FR14: "別の process から「続きを」と頼まれたら、記録の現在地から続きの段だけを進め、着地まで到達できます。"
  plain-FR15: "契約が「消す・出す・使う」のどれかを名乗る段に来たら、承認を求める記録（approval.requested）を残して「保留」で止まり、人の入力を待たずに process を終えます。"
  plain-FR16: "人が承認（approve）を逐語付きで与えたら、それを記録（approval.received）し、次の再開（resume）で先へ進めます（承認の記帳は便の自動起動の契機です・FR68）。"
  plain-FR17: "規則の「種類」は Rust の閉じた enum と網羅 match で持ち（足し忘れは compile が止める）、規則の「値」は repo に置いた manifest 1 file から起動時に読みます。"
  plain-FR18: "manifest に知らない種類・重複した id・型の合わない値・user 由来なのに裁定 id が無い行があれば、起動する前に問題を全部まとめて行番号付きで断ります。黙って読み飛ばしません。"
  plain-FR19: "repo root の目印（.vessel）が「自分の名前」を言っている間は、hook は起動時に名乗りを出します。"
  plain-FR20: "契約で触ってよいとした file の外を編集しようとしたら、その編集の時点で止めます。許可リストが読めないときも、通すのではなく止めます。"
  plain-FR21: "hook は自分が出した 1 行について、誰が・何を・いつ・何 byte・何 token・かかった時間、の形で記録を残します。あとで計測の仕組みを足すときに、経路を作り直さなくて済むようにするためです。"
  plain-FR22: "到達点を測るときは、人が関わった記録を数え、承認の側（承認の記録と裁定の記録）の外が 0 件であることを機械で示します。人が打った字の記録（発話 event・FR82）はこの数えに入れず、問いに結んで裁定になったものは裁定の記録として承認の側に数え、未仕分けの発話・要望として仕分けた発話・会話として仕分けた発話（FR88）の本数は計測の出力の別の 3 つの欄に出して隠さず、裁定の記録は発話の経路（チャット〔対話の session〕か裁定面か）ごとに数えます。会話の欄には、承認・回答・go に使った発話も入ります。"
  plain-FR24: "repo root に目印（.vessel）が無いか、別の名前が書いてある repo では、hook の入口は何も出さず正常終了（rc 0）で黙り、その repo に 1 byte も書きません。黙るのはこの入口だけで、口座の設定から呼ばれる見張り（host-guard）は目印の有無や repo の位置に関わらず判定します。"
  plain-FR23: "器は開発 session の作業記憶を退避・復元・消費する口と、退避物の置き場を持ちません（FR42 の「圧縮の直前の 1 枠」は退避物に当たりません）。文脈の圧縮は session 側の機構（Claude Code の /compact）に任せ、session をまたぐ記憶は台帳が持ちます。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR25: "器は開発 session の context の使用量を測る口を持ちません。残量は開発 session が /compact で自分で扱います。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR26: "器は context の使用量で編集を止める段（cap guard）も、その上限の rules 行も持ちません。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR27: "器は、開発 session（orchestrator の席）が黙っていないかを周期で見に行き、登録（FR40）があり、状態の打刻（席の hook が残す 1 行）の最終行が「待っている（idle）」で、入力欄が空いている席にだけ、台帳の現在地から続きを進めるよう促す 1 行（打刻の合図。この合図を heartbeat と呼び、席ごとに決める口と実際に送るかどうか〔実効の値〕と tick が最後に周った記録は FR78）を差し込みます（ADR-0058）。合図の末尾には、置き場の file だけを読んで決める目印（alarm）を付けます。目印の語は、写されていない裁定がある unreflected（FR84）・床の検査が不合格の floor（FR85）・未仕分けの発話がある unsorted（FR88）・席の手番で年齢の閾値を越えた部品（要件を除く）がある owned（FR90）の 4 つだけで、局面の出力が古さの印を持つ周は unsorted と owned に stale を添えます。合図を送らない席（FR78 の実効の値が off の席〔park の区画の既定を含みます〕や梯子の列が尽きた席など）には目印も届かないので、doctor の行だけが知らせます。送るのは、席が最後の打刻から黙りの閾値（黙りの初段・既定 30 分）以上黙っていて、最後の合図から今の段の待ちが経ち、口座の門（かたまり〔群〕の逼迫の閾値〔FR38・rules 行 3 本〕のどれか 1 つでも以上の口座の席には送りません。計測〔FR33〕が残した記録の最新値を読むだけで測り直さず、記録が無い・古いときは通します）を通ったときだけです。条件の並びと順は ADR-0058 が正本です。席に変化が無ければ次の合図までの間隔を梯子の列（rules 行が持つ待ちの列・既定は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間）の順で伸ばし（backoff）、梯子の列が尽きたら送りません（合図は梯子の列の長さの本数・既定 6 本）。席の状態の打刻の最終行の時刻（変化の digest）が動けば、間隔は梯子の列の先頭に戻ります（比べる基準は、合図の後に席が待ちに戻ったときの値です）。周期・黙りの初段・梯子の列の 3 つは rules 行が持ちます（user 裁定 id つき）。係数（倍率）と上限の行はありません。最後に送った時刻・何本目か・比べる基準の値は席の置き場の file 1 つに残し、読めない・書けないときは送らず、理由を判定の行に出します。かたまり（群）に属する席の tick は、かたまりごとに鮮度の窓に 1 回まで、host の lockの内側でかたまりの移動の判定（FR38）を撃ち、その周だけ計測（FR33）を起こしてよいことにします。判定の周の外ではかたまりの逼迫を測りません（ADR-0066）。口座を占めない park の区画（Tier9）に属する席の tick の移動の手と起こし直しの口座は FR95 が持ちます。登録（FR40）があり、再起動や退避で窓が shell に戻った席は、黙りと変化の判定を経ずに口座（かたまりならかたまりのいま使う口座・park の区画なら FR95・どちらにも属さなければ登録の口座）を決め、席の起動（FR59）で起こし直します（FR28）。tick の周は、局面の出力（FR90）の部分の書き直しの契機でもあります。便を起こす契機は FR68 が持ちます。"
  plain-FR28: "器は退避の後に session を作り直して復元の command を差し込む cycle を持ちません。席を立て直すのは、user が席の起動（FR59）を撃つか、管理 tick（FR27）が登録のある席の窓が shell に戻っているのを見て起こし直す（直前の会話 id を渡します・ADR-0067）かの 2 つで、周期で作り直す cycle とは違います。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR29: "器は context の使用量を理由に「退避してください」を送りません。無いことは test が確かめます（廃止の決定は ADR-0045）。"

  plain-FR35: "便の実装役が「口座の上限に当たった」の上限 record（上限に当たった印）で止まったら、器はそれを、どの口座のどの窓に当たったかが分かる印付きで記録します。作業場所（worktree）と便の記録は消さず、便を失敗にもしません。"
  plain-FR36: "どの口座を使うかは、manifest に書いた口座（退役中の口座はどちらの規則でも選びません。便には、便の repo を置き場に持つ席が登録している口座と、かたまり（群）がいま使っている口座〔FR38。host 全体で外し、かたまりの候補の他の口座は外しません〕も選びません。置き場を共有する別の repo の席の口座は便の候補に残ります。外すのは次に選ぶときからで、まだ終わっていない便は止めません）と実測した残量から決めます。便は 7 日窓の reset が早い口座から使い切る側、orchestrator の席の session は（ほかの席が登録している口座を除き、自分の席の登録の口座は除かずに）いちばん余裕のある口座を選んで余裕を残す側、と規則が違います。規則の値は session 用の閾値の rules 行（R-C9-1 とその窓別の行）だけが持ち、user の裁定で有効になります。口座を占めない park の区画（Tier9・FR95）の席が登録している口座は、便にも session にも外しません。park の区画の席が選ぶ口座の候補は FR95 が持ちます。"
  plain-FR37: "上限で止まった便、または実装役が走っている段（Spawned）の便を再開するときは、器がまず実装役の process が生きているか確かめ（生きていれば断り、実装役を 2 つにしません）、口座を選び（上限で止まった便は別の口座）、同じ作業場所と同じ契約（回答済みの質問と、前の実装役が残した未 commit の変更の一覧も添えて）で実装役を起こし直し、記録した段の続きから着地まで進めます。使える口座が無いときは失敗にせず、いちばん早く枠が戻る時刻まで待ちます。この再開は通常の resume（FR14）より優先されます。"
  plain-FR38: "器は、かたまり（群）の口座の使用率（残りの裏返し）を測るための常駐の timer を持ちません。作業（便）が 1 つ終わった直後の 1 周と、席が話す番のたびに動く仕組み（hook）と、席を周期で見回る管理 tick（FR27）の 3 つで、かたまりのいま使う口座と席が実際に居る口座の使用率を、計測（FR33）が残した値からいつ測ったかの鮮度つきで、3 つの窓（5 時間・7 日・モデル別）で読みます。使用率が閾値（rules 行 3 本・user 裁定）のどれか 1 つでも以上になっていれば、1 周はそのかたまりの席の画面に 1 行で知らせて記録に残し（同じ実測には 2 度知らせません）、席の仕組みは指示文の 1 行で告げて「そろそろ移して」の記録（移動を頼む記録）を host の根にかたまりごと 1 件だけ置きます。移るときは、1 周か管理 tick が host の lockの内側でかたまり単位に 1 回だけ移り先（いま使う口座でなく、他のかたまりが使っておらず、退役中でなく、新しい計測があり 3 つの窓とも閾値未満の候補〔計測が古い候補は 1 回測ります〕を、残りの量の並べ方（残量の鍵）「7 日の窓とその席の役割の model の 7 日の窓の残りの少ない方が多い順 → 7 日の窓の reset が早い順 → 宣言の順」で並べ〔席の model の行が無い口座は最後・5 時間の窓は条件にだけ使います〕、かたまりを宣言の順に見て、どのかたまりも使っておらず前のかたまりの予約でもない先頭をそのかたまりの予約〔次に移る口座〕にします。予約は file に残さず毎周計算し直し、他のかたまりの移動と予約は避けますが、作業〔便〕の起動は避けません。宣言に並べた候補は集合で、順は同点のときだけ効きます。まだ終わっていない作業が使っている口座も候補に入ります・ADR-0069）を決め、いま使う口座の記録（前の記録は消さずに履歴の側へ戻せる形で動かします）と承認の記録を書き、古い席に退避の合図（作業を区切って終える合図）を送ってから、新しい口座で席を起こし直します（判定は 1 本で、tick はかたまりごとに鮮度の窓に 1 回までしか撃たず、その周だけ計測してよいことにします・ADR-0066。席を起こし直すのは席の起動（FR59）で、その席の状態の打刻に残った会話 id を渡して直前の会話の続きから再開します。対話の記録の file を複写することはしません・ADR-0067）。移り先が無ければ移らず、人に知らせます。余裕の無い口座へ妥協して移すこともしません。かたまりの逼迫を測るための常駐の process と、cycle・強制サイクルの印は持たず、1 周を timer で撃つこともしません（ADR-0045 / ADR-0049 / ADR-0055 / ADR-0066）。管理 tick（FR27）の timer（FR64）は判定の周の外ではかたまりの逼迫を測らず計測も起こさず、tick の口座の門（FR27）は計測（FR33）の記録の最新値を読むだけです（ADR-0058）。かたまりを宣言する表（群の表）の行の名前は Tier1〜Tier9 に限り（Tier1〜Tier8 がかたまり〔群〕、Tier9 が口座を占めない park の区画〔FR95〕です）、その外の名前・数字の重複・宣言の順が数字の小さい順でないときは host の設定の読みの時点で断ります（FR57）（優先は宣言の順 = 数字の小さい順です）。doctor のかたまりの行には next=（残量の鍵で導いた予約。無ければ none）が出て、移り先の並べ方と doctor の next= は同じ 1 本の関数（残量の鍵）を使います（ADR-0069・名前の決まりは ADR-0091）。この FR の手（逼迫の知らせ・移動を頼む記録・移動・予約）はかたまりだけに掛かり、park の区画の手は FR95 が持ちます。"
  plain-FR39: "触る file の列が、いま走っている便の列と重なる契約は、入口（intake）の時点で「どの file が誰と重なるか」を名指して断り、便を作りません。走っていた便が終わるか止められれば、同じ契約は通ります。断る理由の一覧と「まだ終わっていない便」の数え方は、同時走行の最大値の断り（FR68）と同じものを使います。"
  plain-FR40: "席の役割は orchestrator の 1 つだけで、器がそれを閉じた一覧の値として席ごとに記録します（鍵は役割と project（anchor）で、席の target・口座（席の起動（FR59）が決めた口座の写し）・起動の雛形も併せて fleet の記録に残します）。記録の無い席は何の権能も持ちません。1 つの project に orchestrator は 1 席です。"
  plain-FR41: "どの役割が何をしてよいかは manifest の行 role.orchestrator が持ちます（裁定 id 付き）。承認の記帳は rules 行 R-C7-1（対話面の identity）が名指す orchestrator の席の権能です。便を起こす・着地させる・merge するのは行に無く、器の dispatcher だけが行います（FR68）。席の本体 code（src）の編集も行に無く、落ちる test（tests/）の編集だけを行が許します。"
  plain-FR42: "契機は 2 つあります。席の session が始まるとき（/compact の後も含む）と、圧縮が始まる直前です。session が始まるたびに、器がその席の短い指示文（manifest の行と役割ごとの雛形から生成）を会話の文脈へ差し込みます（入力欄は使いません）。中身は、席が誰か・憲法のうち効く部分への pointer・役割の特性・台帳の現在地の 4 群で、行の構成と行数の上限は ADR-0045 が正本です。役割の記録が無い席には何も差し込まず、実装役には憲法の文章を 1 行も渡しません。指示文は行が持つ権能をすべて名指し、憲法の C 条文の規範文を持たず、雛形の外に手書きの規範文は置きません。役割の記録が在る席では、同じ session の開始で、指示文の後ろに、台帳と git と局面の出力（FR90）から機械で導いた直近の流れの事実行（仕掛かり中の契約・直近に更新された契約・直近の commit・未 commit の変更・席の手番のまま年齢の閾値を越えた部品（FR90）があるときの件数といちばん古い 1 件）を出します。これは規範文を持たず、指示文の行数にも数えません。圧縮の後の開始で「圧縮の直前の 1 枠」が在れば、その 1 枠を 1 回だけ出して消します。圧縮（/compact と自動圧縮）が始まる直前には、器が役割の記録が在る席の直前の発言を逐語で「圧縮の直前の 1 枠」に書きます（役割の記録が無い席では書きません）。置き場は state dir の席ごとの置き場で、repo の外です。1 枠を書く処理は圧縮を止めません（書けないときも止めません）。"
  plain-FR43: "器は席の queue（続きの pointer の並び）を持ちません（ADR-0045）。席の次の仕事は台帳が持ち、管理 tick（FR27）が台帳の現在地から「続きを」と促す 1 行を差し込みます（ADR-0058）。合図が 24 時間で打ち切られた後は、続きは user が対話面で促します。"
  plain-FR44: "1 つの project に席は orchestrator の 1 席だけなので、席どうしの連絡の経路を器は持ちません（ADR-0045・ADR-0058）。器が席の入力欄に差し込むのは、席の起動の 1 行（FR59）・管理 tick の打刻の合図（FR27）・かたまりの逼迫の通知・移動の通知・退避の合図（FR38）・park の区画の席の移動の退避の合図（FR95）・便の終端の周の通知（便の終端の周〔dispatcher の 1 周〕に器の dispatcher〔FR68〕が席へ送る 1 行。起こす便が 0 の周の 1 行は memo の要約〔FR87〕も持ちます）・外の裁定面に裁定が書かれたことの 1 行の指し示し（FR79・送る行に入る外からの値は裁定面の記帳 id だけで、中身は運ばない）だけです。台帳の現在地から続きを進めるよう促す差し込みは打刻の合図だけで、便の終端の周の通知は便の出来事と次の 1 手の在りか（起こす便が 0 の周は memo の要約も）を、裁定の指し示しは裁定が届いたことだけを知らせる 1 行です。席の turn の終わりの止め（FR88）の理由は入力欄への差し込みではありません。経路が無いことは test が確かめます。"
  plain-FR45: "権能で守られた操作は、その権能を持つ役割の席からしか通りません。検査は編集・実行の瞬間に行い、止めるときは足りない権能と、権能を持つ rules 行の id を告げます。席の本体 code（src）の編集は、契約が印で開いた便の作業範囲に限って通ります。"
  plain-FR46: "箱（封じ込め）や並列の枠が使えない host で便を起動しても、器は断りません。並列度を 1 に落として進み、落としたことと理由を記録に残します。"

  plain-FR47: "契約の正本は、tracked な設計 doc の契約表の 1 行だけです。行は少なくとも要件 id・実装する設計の節・write-set・検証を持ちます。"
  plain-FR48: "契約の行が閉じた型（enum の variant・rules 行・完了の値・event の種類）を変える（足す・消す・改名する）と宣言したら、器はその型を構造として持つ file を base から数え上げ、write-set に足りない file を名指して断ります。読めない周も通しません。"
  plain-FR49: "便が受付（intake）を通り、設計 doc の契約表の行から契約の file が作られた直後に、器が審査役へ契約とそれが実装する設計と要件を読ませて判定を採ります。判定は契約の中身（sha）付きで、審査役に渡した設計の節の本文の写しといっしょに便の記録に残し、合格でない便は実装役を起こさず Reviewed の段で FAIL として終わります。契約の中身が同じかどうかは、契約の字と、便の記録に残した設計の節の本文の写しの両方で決めます（写しを持たない便は契約の字だけで決めます）。同じ中身で審査 FAIL の便が在る契約が列に入らないことは FR68 が決めています。"
  plain-FR50: "この決まりは main に着地した便のもので、PR で着地した便は除きます（その close は FR96）。vessel 宣言に押す先（任意 key remote）がある repo では、着地した main を push する前に、器は remote の先端から main までの出ていく文字を公開の字面の走査（FR80 と同じ判定と規則の行・出す先は押す先〔key remote〕が名指す remote）で調べます。読む上限と締め切りは公開の segment と同じです（NFR5）。当たるか読む上限を越えたら push も close もせず、その push で出る便の全部を「失敗」で終わらせ（着地済みの扱い〔FR68〕から外し、契約は起き直しの印で起き直ります）、main が remote の先端に揃うまで次の着地を止めて理由を出します（main を remote の先端に揃えるのは着地した commit を捨てる操作なので、3 クラス〔消す〕の承認として人に求めます）。調べきれない（規則の行が無い・解けない・締め切りを越えた）なら push も close もせずに失敗を記録し、次の着地の push の前に同じ範囲を撃ち直します（通ったら、先に失敗を記録した便も close します）。規則の行を off にしたときは調べません。push したら、push の先端（最後に着地した commit）の CI の結果を commit id で確かめ、台帳の便を着地の形の理由（着地した commit の番号を持ち、末尾に CI の結果を持ちます・FR91・ADR-0094）で close します。land の終端が台帳へ書くのは、この close と、押す先の無い repo の close と、PR で着地した便の close（FR96）と、条件を満たした memo の自動の close（昇格済みの形・FR93）だけで、3 つの close の道は ADR-0094 が持ちます。候補の木に並べた順に着地した便のうち先端でない便は、自分の commit を含む先端の commit の CI の結果で確かめ、理由の末尾に先端の commit id も書きます。終端の各手は typed な event として記録します。CI が緑でなければ close せず失敗を記録します。vessel 宣言に押す先（任意 key remote）が無い repo の便は、外へ出さないので、走査も push も CI の確かめもせずに、着地の形の理由（着地した commit の番号と、末尾に「CI の確かめなし」）で close します（宣言が読めないときは押す先が無いとは読まず、close せずに失敗を記録し、その便の終端だけを撃ち直す口で撃ち直します）。"
  plain-FR51: "台帳を読み取り専用の台帳 adapter で読み、解決できる設計 pointer（設計 doc の path と契約 id）を持たない open な契約と、設計の中身を持つのに設計 doc や research への pointer が無い open な memo を名指す lint を、doctor の項目として提供します。「問い」の印（label intake:question）を付けた記録（台帳の問い・FR81）は、epic と decision の型の記録と同じく、契約にも memo にも数えず名指しません。同じ項目は、処置の待ちの memo（局面の出力の memo-actionable・FR91）の本数と、いちばん古いものの年齢も出し、notes の大きさが規則の行 memo.notes_max_bytes を越えた open な memo も名指します。"
  plain-FR52: "設計 doc の文のうち規範の印を持つ文は、根拠の pointer を持ち、数 + 単位を持ちません。破った文は file と行で名指し、CI を非 0 で止めます。"
  plain-FR53: "intake に設計 pointer（設計 doc の path と契約 id）を添え、それが解決すると、器は記録した base の設計 doc からその行を読み、便の契約 file をその行から作ります。"
  plain-FR54: "設計 pointer が指す設計 doc・契約表の行・実装する設計の節のどれかが無いとき、または契約 file を直接渡したときは、器は断る理由（無いもの、または契約 file の直接の受け渡し）を名指して断り、便を作りません。"
  plain-FR55: "CI は tracked な設計 doc の契約表の全行に、intake と同じ write-set の閉包の検査と設計 pointer の解決を回し、違反する行を file と行で名指し、CI を非 0 で止めます。"
  plain-FR56: "口座の設定を読む session（人と話す席と、口座の設定 dir を指定して起こした session。器を積まない素の session でも同じで、既定の設定 dir だけを読む起動は含みません）や実装役（runner）が撃つ Bash の command が、規則 file の行が持つ「禁じる語列」（撃ってはいけない語の並び。口座の設定から呼ばれる見張りが読むのは有効な行だけ）に当たるときは、器が実行の前に止め、どの rules 行のどの並びに当たったかを告げます。口座の設定を読む session には口座の設定から呼ばれる見張り（host-guard）が掛かり、器の plugin を積む席と実装役には器の plugin の command guard（禁じる語列の見張り）も掛かり、審査役（lens）には掛かりません。渡された中身が読めないときも見張りは止めます。契約と repo の宣言 file（vessel 宣言）の検証行も受付の時点で同じ判定に掛け、当たる行は行番号付きで断って便を作りません。禁じる語列に当たらない command はこの規則では止めません。"
  plain-FR57: "host ごとに違う値（どの口座があるか・席に積む plugin の場所・起動引数・かたまりを宣言する表〔群の表・FR38・FR95〕・公開の除外の表〔FR80〕）は、state dir の 1 つの file（host の面）だけが持ちます。器は tracked の manifest と同じ読み方・同じ断り方でこの file を読み、rules 行が在る・口座 label が両面で重なる・schema に無い項目が在る・群の表の名が Tier1〜Tier9 の外か数字が重なるか小さい順でない（FR38）・行の heartbeat の key が on と off の外（FR78）・公開の除外の表の行に裁定 id の欄が無いか空（FR80）・公開の規則の行が除外の要素を持つ（FR80）、のどれかなら行番号付きで断ります。file が無い host では宣言 0 として動き続け、在るのに読めない host（断る行を 1 つでも持つ host を含みます）では、host の面を読む口（計測・口座選び・管理 tick・doctor・席の起動・公開の字面の見張り）が止まります（見張りは公開を断ります）。"
  plain-FR58: "口座を足すときは、器が state dir の下に口座の設定 dir を作り、席に要る設定だけを書き、host の面に宣言を 1 行足し、login 用の起動 command を渡します。login は user が行い、器は credential を読みも書きもしません。既存の dir や宣言済みの口座 label では断ります。退役では設定 dir を退役先へ動かし（消さない）、event を 1 件記録し、その口座は計測と選定の候補から外れます。復帰では設定 dir を元へ戻し、event を 1 件記録します。席の登録 row が持つ口座は退役できません。"
  plain-FR59: "器の subcommand で席を起こすとき（かたまりの移動（FR38）や管理 tick（FR27）が席を起こし直すときも同じ）は、席の役割（orchestrator）を必ず指定します。口座は、置き場がかたまり（群）に属するときはそのかたまりのいま使う口座（書き換えるのはかたまりの移動（FR38）だけです・ADR-0049）にします（このとき指定した口座がそれと違えば断ります）。かたまりに属さないときは、指定した口座か session 用の口座選定で決めます（park の区画の席の候補は FR95）（閾値未満の候補が無いときは席を起こさずに断ります・FR69）。起動行は器が組み（何を含めるかは決定記録が正本）、手書きの雛形は読みません。席を起こし直すときは、その席の状態の打刻に残った会話 id を起動行で渡して会話の続きから再開します（会話 id の形でなければ渡しません・対話の記録の file の複写はしません・渡し方は ADR-0067 が正本）。席の登録を先に書き、窓の shell へ起動行を差し込みます。窓が無ければ作りますが、tmux の session は作りません。tmux の session が無い・入力欄に文字がある・閾値未満の候補が無い（FR69）とき・口座が退役中・指定した口座がそのかたまりのいま使う口座と違うときは断り、key を 1 つも送りません。"
  plain-FR60: "器は役割を持たない素の対話 session を起こす口を持ちません。席の起動は役割を必ず指定します（FR59）。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR61: "他の project に入っている scribe2 が「どの版の本体・どの版の hook」で動いているかを、doctor の 1 項目として器が自分で測り、導入先（install 帳簿が指す repo と worktree、席の登録 row の anchor）ごとに 1 行ずつ出します。本体が自己申告する build 元 commit（測れなければ unknown）、plugin の読み込み元と hook 集合の digest、install 帳簿の記録、共有 cache の実体、scribe2 repo の HEAD を並べ、食い違いを none / binary / plugin / install の語で名指しし、推測で埋めません。更新は 1 つの口で、自分の checkout を上流の既定 branch へ前進だけで揃え（揃えられなければ typed に断る）、本体を build して呼ばれる場所へ入れ、その install を sha・時刻・host の記録に残します。"
  plain-FR62: "器は hook の配線の食い違いを理由に席へ「退避してください」を送らず、席を作り直しません。食い違いそのものは導入先の同期（FR61）が doctor の行で名指します。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR63: "器は開発 session の画面の下の 1 行（statusline）を描く口を持たず、口座の設定に描画 command を書きません。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR64: "器は、管理 tick（FR27）を周期で撃つ host の登録（systemd user の service と timer）を、登録（FR40）のある席ごとに組んで host の駆動機構に置いて有効にする口と、退役の場所へ移して撤去する口を持ちます。登録の本文は器が名前・target・置き場・binary・周期の rules 行から 1 つの関数で組み、repo には入れず、器が作ったのでない file は上書きも移動もせず、有効にすることと撤去は 3 クラス（人に聞く操作）に当たりません（形は ADR-0030 と同じ・ADR-0058）。健康診断（doctor）は席ごとに登録の有無と一致を 1 行で言います。"
  plain-FR65: "器は user の発言を直命の表として持たず（席の指示文や復元へ運ぶ記録を持ちません）、復元の DATA も出しません。user の言葉そのままが載るのは、承認の記録（FR16）と、人が打った字の記録（発話 event）と裁定の行（FR82）だけです。人が打った字の記録（発話）は、裁定の行の写し元・到達点の計測の分け方（FR22）・仕分け済みかの判定（FR88）・問いを起こした時刻との比べ（FR89）・局面の出力の発話の部品（FR90）〔この 3 つは発話の時刻と session と仕分けの記録だけを読み、言葉は読みません〕・席が時刻を名指して 1 件を読む口（FR88）にだけ使い、言葉を席の指示文・復元・合図・通知・局面の出力・doctor の行・turn の終わりの止めの理由へ運びません（直命の表との線引きは ADR-0083 と ADR-0087）。裁定は台帳の notes が持ちます。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR66: "器は復元・退避の skill に反応する hook、退避物の状態を知らせる hook、自動圧縮の直前に AI が書く散文の退避物を書く hook、session の終わり方を打刻する hook を持たず、skill も持ちません。器が session の開始と圧縮の直前に持つ口は FR42 の 2 つ（指示文と事実行の注入・圧縮の直前の 1 枠）だけです。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR67: "orchestrator の席の指示文に、「user に向けて出す文の形」を出所を指す 1 行（pointer 付き）で載せます。形は、言い切りに信頼度を必ず付けることをいちばん上に置く 1 つの体系で、決まりの本文は設計 doc 1 本だけが持ち、指示文にも規則の表にも書きません。席でない process（実装役・審査役）には適用しません。"
  plain-FR68: "要するに、器の dispatcher が、条件のそろった契約を席の手を借りずに起こし、起こせない契約には待ちの理由を付けて列に残す、という決まりです。便を起こすのは器の dispatcher です。便が終わったとき（着地・失敗・停止）、便を運ぶ器の process が退役したとき、手動で 1 周を頼まれたとき、介入の印を記録した直後、回答 event（FR32）か approval.received（FR16）を記帳した直後に、台帳の open な契約のうち依存が終わり・設計 pointer が解け・memo でも台帳の問い〔FR81〕でもなく・同じ中身で終端に達した便（審査 FAIL の便を含む）が無い契約の並び（起動の列）を、orchestrator の介入 first → 契約の優先度（priority） → 起票順の順に見て、まだ終わっていない便と触る file が重ならず・受付（契約を便にする前の検査の段。触る file の余地・host の memory の枠・同時走行の最大値）を通る契約を、席の操作なしに条件を満たす本数だけ起こします。起こし方はふつうの便の起動（受付 → 審査 → 実装役の起動）をそのまま通る形で、起動の前に待つ段はありません。契機が重なっても同じ契約を二重には起こしません。同時に走らせる本数には最大値が 1 つあり（同時走行の最大値。値は規則の表の 1 行が持ち、user の裁定で決めます）、受付がまだ終わっていない便を数えて最大値に達している周は起こさず、その契約は理由を付けて列に残します。本数を絞るのは受付の host の memory の枠とこの最大値です。起動の列の周に受付が契約を断ったときは、断った契約ごとに断りの名と契約の番号を出来事の log に 1 件残し、局面の出力（FR90）の理由に使います。同じ周で起こした便の file は次の候補の重なりに数え、起こせない契約は「まだ出ていない理由」（依存・重なり〔Overlap〕・受付・同時走行の最大値・終端に達した便〔審査 FAIL を含む〕・hold・未反映の裁定〔unreflected-ruling・FR84〕・床の検査の不合格〔floor・FR85〕）を決まった型で持って列に残し、hold の契約は起こさず release で戻します。待ちの理由のうち新しい 2 つは、待たせる範囲が違います。未反映の裁定で待たせるのはその裁定を受入条件か notes で引く契約と、その問いに blocks される契約だけですが、床の検査の不合格の間は、介入の印 first を持つ契約のほかは、列の契約を全部待たせます（first は main を直す便に付ける印ですが、器は直す便かを判じないので、first を持つ契約はどれもこの理由では待たず、直す便でなくても赤の main の上で起きます）。終端に達した便が起動の列から外した契約も、release の印 1 つにつき 1 回だけ起動の列へ戻します（着地済みの便の契約は戻さず、審査 FAIL の便の契約は中身が変わるまで戻しません・FR49）。介入は起動の列の記録に残します。便を運ぶ器の process が退役した便は、同じ周で器が再開（FR37）を 1 回起こします（便を運ぶ器の process が残す所有者の印を持たない、まだ終わっていない便は起こし直しません）。所有者の印を持たなくても再開（FR14）を 1 回起こす便は、次の 5 種だけです: 回答が記帳された質問中（Questioned）の便（FR32 の回答を添えます）、承認が記帳された承認待ち（Blocked）の便（FR16 の承認を添えます）、gate の結果（verdict）が合格（PASS）の Gated の便（gate がもう一度頼まれて PASS が記録された便を含みます・FR8）、regate（FR77。gate の結果が不合格（FAIL）の便を裁定の言葉つきで Implemented〔実装が済んで gate を待つ段〕へ 1 段戻す器の口）で Gated から Implemented へ戻され、その後 gate を通っていない便（所有者の印が無いか、印の process が退役した便。印の process が退役した便の再開はこの 4 種目の再開（FR14）の 1 回に寄せ、退役した便の再開（FR37）と同じ周で重なっても、同じ便を二重には起こしません。regate の記帳も追随の記帳も持たない Implemented の便は起こし直しません）、追随（main に追いつくこと）でいちばん新しい gate の後に Implemented へ戻され、その後 gate を通っていない便（所有者の印が無いか、印の process が退役した便。regate の種目と同じ周に重なっても同じ便を二重には起こさず、退役した便の再開〔FR37〕は Implemented の便には当たらないので重なりません）。gate の結果が合格でない Gated の便と、gate の結果を読めない Gated の便は起こしません。gate の結果が合格の Gated の便と regate で戻された便と追随で戻された便は専用の契機を持たず、5 種とも上に挙げた契機の周で拾います。便を運ぶ器の process が生きている便と生死を読めない便には触りません。周期の timer は持ちません。台帳が読めないときは 1 本も起こさず「測れなかった」と記録します。"
  plain-FR69: "要するに、口座に余裕が無ければ席を無理に起こさず、理由を 1 語で告げて断る、という決まりです。かたまり（群）に属さない置き場で、口座を指定せずに席を起こすとき、session 用の口座選定が閾値より余裕のある口座を 1 つも見つけられなければ、器は席を起こしません。席の登録も書かず、key も 1 つも送らず、理由の語 no-account と、候補が無い理由を決まった 4 つの語（閾値以上の over-threshold・上限に当たった all-limited・測れない unmeasured・口座選定の除外〔FR36〕に当たる excluded。いくつも当たるときはこの順で前の 1 つ）で 1 行に告げて断ります。閾値以上でもまだ上限に当たっていない口座や、ほかの役割の席の口座に同居させて、無理に席を起こすこと（妥協の起動）はしません。かたまりの移動も同じく妥協しません（FR38）。"
  plain-FR70: "器は強制サイクルの印も、印の在る席の操作を断る hook も持ちません。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR71: "器は session の開始で実際の口座を測って記録することも、登録と食い違うかを判定することもしません。席の口座は席の起動（FR59）が登録に書いた値だけです。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR72: "口座の設定を読む session（人と話す席など。器が起こす実装役 runner や審査役 lens には届きません）が、見張り自身を呼ぶ設定 file（口座ごとの settings.json とその実体、作業中の repo の root にある .claude の settings.json と settings.local.json）を書き換えようとしたら、器の見張り（host-guard）が実行の前に止めます。編集の道具の対象 path でも、Bash の書き込み（rm・tee・sed の上書き・リダイレクトの先・mv の両端・cp と ln の行き先）でも同じで、path は作業 dir から解いた形と実体（symlink の先）の形の両方で比べ、file そのものか、その file を含む dir に当たれば止めます。止めるときは区分（見張りの種類）と当たった実体の path を告げ、代わりに user が編集するよう示します。この区分だけは規則の行を持たず、切れません。"
  plain-FR73: "器の健康診断（doctor）は、見張り（host-guard）の状態を 1 行で出します。区分（見張りの種類）ごとの on / off（出所は区分ごとの規則の行の enabled。行が無ければ no-row、見張り自身の設定の区分は常に on）、効いている行の数、呼び出しの行（host-guard の配線）を持つ口座の数と口座の数、呼び出し先の設定 file の実体の数、器のプログラムが見つかるか（ok / missing / other。見つからないときは harness が通してしまうので、それを言えるのはこの行だけです）、席の登録の anchor のうちかたまりを宣言する表のどの行（かたまりと park の区画）にも無いものの件数（隣の private repo の漏れに気づくため・FR80）を測って並べます。区分が off や no-row、配線を持つ口座の数が口座の数より少ない、プログラムが missing、のどれかなら見張りは効いていません。判定はせず、終了コードも変えません。規則の file が読めないときはその旨を 1 行で出します。"
  plain-FR74: "口座の設定を読む session（人と話す席など。器が起こす実装役 runner には届きません）が撃つ rm（削除の命令）は、行き先で止めるかを決めます。守る場所は 3 つで、器の置き場とその中、作業中の repo の管理下（git が追う）file、repo の履歴の置き場（.git）と worktree の本体です。行き先がその場所そのもの・それを包む dir・その中のどれかなら止めます。行き先が確かめられない形（変数・命令の結果・home を表す ~ で始まる・{ } のまとめ書き・同じ命令の中で dir を移った後の相対の場所・守る dir の中の * のまとめ指定）も止めます。止めるときは当たった場所の記号か確かめられない形を告げ、代わりに管理下の file なら git rm（履歴から戻せる削除）、それ以外は退役の mv（消さずに脇へ移す）を示します。守る場所は machine に依らない 3 つの記号（state-dir / repo-tracked / repo-git）で rm の区分の規則の行が持ち、実行のたびに解きます。その行が無ければ止める側に倒し、行を off にしたときだけ rm の区分が外れます。当たらない rm は通します。"
  plain-FR75: "口座の口（口座を器に足す・退役させる subcommand）に「見張りの呼び出しをつなぐ」と頼まれたら、器は machine の宣言（host の面）にある全口座の settings.json を、道しるべ（symlink）の先の実体まで解き、実体ごとに 1 回だけ書きます。書くのは、道具の直前に器の見張り（host-guard）を呼ぶ hook の行 1 本を「足すだけ」で、対象の道具と待ち時間は版を跨いで固定して増やさず、行がすでにあれば触らず、他の設定と道しるべは保ち、読めない設定 file には 1 byte も書きません。結果は口座の数・実体の数・足した数・触らなかった数・断った数の 1 行で、断った file が 1 つでもあれば終了コード 2 です。つないだかどうかの正本は設定 file そのもので、記録（event）には書きません。"
  plain-FR76: "口座の設定を読む session が撃つ bd / bdw（作業の記録簿＝台帳の道具）の command は、作業中の repo の root に台帳（.beads）と台帳の script（scripts/bdw）の両方があるときだけ見張ります。台帳を壊す語の並び（見張りの台帳の規則の行）か、起票の門と同じ 4 つの書き込みの形（素 write。起票の門の規則の行）に当たれば、器の見張り（host-guard）が実行の前に止め、区分と当たった並びか形を告げます。見張りの台帳の行を off にすると語の並びも形も止めなくなります。起票の門の行が効いていない（無い・off など）ときは、見張りの台帳の行が on のときだけ、bd の書き込みの subcommand を全部止めます（読むだけの subcommand は通します）。別の台帳（foreign の台帳。-C・--db・--global・別の prefix）は見張りません。"
  plain-FR78: "席を見回る管理 tick が、黙っている席に送る合図（打刻の合図）を heartbeat と呼びます。heartbeat は席ごとに決められます（scribe2 seat heartbeat on|off|default|status）。on は「明示 on」の記録を、off は「明示 off」の記録を席の dir に 1 つ置いて他方を消し、default は両方を消します（戻せます・ADR-0092）。明示 off の記録は前の決定（ADR-0070）の停止の記録と同じ置き場と形で、すでにある停止の記録は明示 off と読みます。実際に送るかどうか（実効の値）は次の順で決まり、どこで決まったか（決まり方）を 3 つの語で名乗ります。(1) 明示の記録が 1 つだけあればその値（explicit）。2 つとも在るときと、在るのに読めないときは off（explicit）。(2) 明示の記録が無く、席の置き場が属する、かたまりを宣言する表（群の表）の行（群か park の区画 Tier9 の行）に任意で書く heartbeat の key（on か off）があればその値（group）。(3) それ以外は種類の既定で、かたまりの席は on・park の区画の席は off・どちらにも属さない席は on（default）。口の default は記録を消す操作で、決まり方の default は (3) で決まったという意味です。行の heartbeat の key が on と off の外なら、host の設定の読みの時点で断ります（FR57）。off でも管理 tick 自体は止まらず、死んだ席の起こし直し（FR59）・口座の移動のための退避・かたまりの移動の判定（FR38）と park の移り先の判定（FR95）はそのまま動き、合図だけ送りません（判定の行には heartbeat-off と残ります）。管理 tick は毎周「最後に周った時刻と判定と理由」を席の dir に 1 行残し（失敗した周も）、seat tick status がそれを読んで、最後に周った時刻・経過・健全か（周期の 2 倍以内に周ったか）・heartbeat の実効の値・決まり方・梯子の段・次の合図の 7 つを席ごとに出します。seat heartbeat status は実効の値と決まり方と最後に周った記録の 3 つを、doctor の席の行は実効の値と健全かの 2 つを出します。健全かを判じるのは読む側で、管理 tick は判じません。画面（別 project の GUI など）は heartbeat の実効の値を器の口の出力から読み（記録の file が在るかどうかは実効の値ではありません）、on・off・default は器の口を叩きます（明示の記録を書くのは器の口だけで、管理 tick は書きません）。最後に周った記録は出来事の log には書きません（ADR-0070）。"
  plain-FR79: "器の口（seat deliver）が撃たれると、器は待っている席へ「裁定が届いた」の 1 行を 1 回だけ送ります。撃つのは、別の project の裁定面（持ち主が裁定を書き込む画面と server）が自分の置き場に裁定を書いた後です。器は、誰が撃ったか・裁定が本当に書かれたか・裁定の中身を確かめません（中身は消費側の仕組みが自分の置き場から読みます）。送るのは器が決めた形（指し示しの雛形）の 1 行で、送る行に入る外からの値は裁定面の記帳 id 1 つだけです（ASCII の英数字と 4 つの記号（ピリオド・ハイフン・下線・コロン）だけの 1 語で、長さに上限があります）。行は届いたことを知らせるだけで、続きを促す文は持ちません。送り先は、登録（FR40）があり、撃たれた時点で状態の打刻の最終行が「待っている（idle）」で、入力欄が空いている席だけで、送る前の入力欄の確かめ（入力欄の門）は管理 tick（FR27）と同じです。結果（送れた・断った理由）は 1 行で返します。空の id・形の外の id（空白・制御文字・4 つの記号の外の ASCII 記号・ASCII の外の文字を含む）・長すぎる id・登録の無い宛先・考え中の席や打刻が無い・読めない席・入力欄に文字が在る席には、キーを 1 つも（Enter も）送らずに理由の語を返して断ります。宛先や置き場などほかの引数の値は送る行に入らないので、席どうしの連絡の経路にしない作りです（FR44・ADR-0077）。"
  plain-FR80: "口座の設定を読む session が、git の push や、gh の本文を出す命令と repo を作る・編集する命令（公開の segment）を撃つと、器の見張り（host-guard）は実行の前に次の順で判じます。まず publish の種類の規則の行を読み、行が無ければ止め、off なら何も調べずに通します。次に、repo を public に切り替える命令と public の repo を作る命令（器が形の一覧を持ち、gh api で可視性を変える書きも含みます）は、repo の全履歴を調べずに出してしまうので、出す先の repo の可視性や隣の private repo の数に依らず、GitHub に問わずに止めます（その操作は人が行います）。次に出す先の repo（公開先の repo）と出ていく文字を解き、解けない・読めないときは隣の private repo が 0 の host でも止めます。次に public か private かを GitHub に問い合わせます。送るのは、公開先の repo と、host の面のかたまりを宣言する表（群の表）の行に登録した repo（anchor・park の区画 Tier9 に置いた repo も含みます）のうち実体が在り公開先の repo と別のものの owner と名と、remote の先端の問いだけで、これを外へ出してよい範囲とする解釈は ADR-0078 が持ちます。owner と名は、git が実際に押す先の URL（gh の出す先は gh 自身が解いた repo）から同じ規則で導き（GitHub の外の host の URL からは導きません）、同じ repo かは owner と名の一致で判じ、owner と名を導けない repo は確かめられない可視性として扱います。群の表の行に公開先の repo の外の repo が無い host は問い合わせません。確かめられない可視性は、公開先の repo なら public、群の表の行の repo なら private と読みます（止める側に倒します）。公開先の repo が private と確かめられたときと、群の表の行の repo のうち実体が在り公開先と別で public と確かめられないもの（隣の private repo）が 0 のとき（群の表の行を持たない host を含む。park の区画だけを宣言した host は行を持つ host です）は、調べずに通します。最後に出ていく文字（出ていく commit の説明文・書いた人と commit した人の名・変更の足した行と file の path・押す tag の説明・押す branch や tag の名・gh の本文と本文の file）を調べ、隣の private repo の識別子（repo の名・隣の repo が持ち、公開先の最新から辿れない commit などの id〔7 桁以上に縮めた形も含む〕・/ を含み、隣の git が追う file の path を / の区切りで切った末尾と一致し、公開先の最新に無い path・隣の台帳の id の 4 つの形）が 1 つでもあるか、出ていく文字が読む上限を越えれば止めます。repo の名は、出ていく文字と名をともに ASCII の英数字と _ の外の字（- や . や / を含む）で区切った部分の並びで、大文字と小文字を区別せずに照合し、一般的な単語の名でも除きません。公開の規則の行が持つのは識別子の形の記号の列だけで、除外の要素を持つ行は読みの時点で断ります（FR57）。repo の名の当たりのうち除くのは、持ち主の裁定で足した無害な字句（公開の除外の表）を同じ区切りで切った並びと、大文字と小文字を区別せずに一致するところの中の当たりだけで、表は git で追う file に書かず、host の面（state dir ごとに置く host 固有の宣言）に字句のまま持ちます。表の行は裁定 id を持ち、裁定 id の欄が無いか空の行があれば host の設定の読みの時点で断ります（FR57・ADR-0093）。表の行を求める台帳の問いは effect を operation（操作で済む）で立てます。document で立てると写されていない裁定（FR84）に数えられ、待たせる側に倒れます。どの段でも調べが締め切りに間に合わないときも止めます（数値は NFR5）。止めるときは理由と、理由ごとの代わりの道を告げます（規則の行が無いなら持ち主の裁定を添えて行を置く・識別子なら当たった形と語と repo を先頭 5 件と件数で示して、識別子を消して『隣の project』と件数に言い換えて出し直す・解けない形なら解ける形で書き直す・上限なら分けて出す・締め切りなら撃ち直す・全履歴を出す命令なら人が行う）。公開の segment でないとき、publish の種類は git も gh も撃ちません。"
  plain-FR77: "gate の結果が不合格（FAIL）で止まった便を、人が裁定の逐語（言葉をそのままの字面で）を添えて Implemented〔実装が済んで gate を待つ段〕へ 1 段だけ戻す口が regate です。器が戻すのは 4 つの条件を全部満たすときだけです。段が Gated であること、gate の結果が不合格であること、便を運ぶ process の所有者の印が無いか、その process が退役していること、逐語が空でないことです。戻すときは便の記録に段と逐語を持つ記帳を 1 件だけ書き、作業の場所（worktree）・commit・gate の結果の記録には触れません。戻った便は同じ作業の場所で再開の候補になります（FR68）。条件が 1 つでも外れるときと、結果や所有者の印を読めないときは、何も書かずに理由を 1 行で告げて断ります。戻した直後は段が Implemented なので、gate がもう一度 Gated の段を記帳するまで次の regate は段の条件で断られます（1 つの不合格につき戻せるのは 1 回）。不合格の理由（契約の赤か・器の欠陥か・環境か）を器が自分で分けることはせず、裁定なしに自動で戻すこともしません。"
  plain-FR81: "要するに、台帳への書き込みのうち決まった 4 つの形を、器の門が実行の前に止める、という決まりです。器の plugin を積む席の session が自分の道具の呼び出しとして台帳に書くとき（bd か bdw の command）、器の起票の門は次の 4 つを止めます（席が起こした子 process〔Bash から起こした常駐の server など〕の書き込みは道具の呼び出しではないので、この門は判じません）。1 つ目は、「問い」の印（label intake:question）を付けた記録（台帳の問い）の起票で、本文に「概要」「技術」「理由」「推奨」で始まる 4 つの行のどれかが無いか、付帯の情報（metadata）に effect（答えを文書へ写すべき問いなら document、操作で済む問いなら operation）が無いか、その 2 つの値の外のもの、問いのきっかけ（asked・seat か user・FR89）が無いかその 2 つの値の外のもの、memo の印（label intake:memo）も併せ持つもの、親の記録を名指しながら親の印を継がない指定を持たないものです。2 つ目は、notes に裁定の行を足す書き込みで、裁定の行を書くのは器の口（seat ruling bind と裁定面の答えの口・FR82）だけです。3 つ目は、引き金の行（FR87）を持たない memo の起票と、昇格条件の節を引き金の行の無い中身に書き換える更新です。4 つ目は、close の理由が決まった形（FR91）の外である close（理由の無い close を含む）と、着地の形の理由を持つ close（着地の形は land の終端〔FR50・FR96〕だけが書きます）です。止めるときは形ごとに、欠けた欄か外れた値・裁定の行は器の口だけが書くこと・引き金の 5 つの形・close の理由の決まった形か着地の形は land の終端だけが書くことを告げ、台帳は変えません。器が問いとして読むのは「問い」の印を付けた記録だけで、印の無い記録の起票には 1 つ目の検査を掛けません。"
  plain-FR82: "要するに、user が打った字（または裁定面で書いた字）をそのまま記録し、席は問いとその字を結ぶだけ、という決まりです。器を導入した repo（目印 .vessel に器の名が書かれた repo）で、user が対話の session（実装役と審査役を除きます）へ文を打つと、器はその文が model に読まれる前に、開いている台帳の問いの有無に依らず、一字一句そのまま人が打った字の記録（発話 event。打った時刻がその発話を指し、session と発話の経路も持ちます）として出来事の log に残します。器が入力欄へ差し込んだ行（FR44 の決まった一覧の全部。管理 tick の打刻の合図も含みます）と、別の session から届いた message の包みは残しません。席は器の口（seat ruling bind）に問いの番号と発話の時刻を渡して、問いと答えを結びます。器は、その発話が在ってその問いへまだ結ばれておらず（1 つの発話を複数の問いへ結べます）、その問いがまだ開いている台帳の問いであるときだけ（問いは発話の後に起こしたものでも構いません。問われる前に user が出した指示も、席が後から問いを起こして結べます）、裁定 id（<問いの番号>:<UTC の年月日と時分>-1 の形。末尾の番号は、器を導入した別の repo の台帳の書き方と形を揃えるために持ち、この口では 1 です）を発行し、問いの notes に裁定の行（裁定 id・問い・発話の時刻・発話の経路・user の言葉の順に 5 つを持つ 1 行。言葉を最後に置くのは、言葉の中の区切りの字で後ろの欄が割れないためです・ADR-0083。4 つを持つ既存の行は、発話の経路をチャット〔対話の session〕と読みます）を書き、裁定の形（FR91）の理由で問いを閉じ、裁定の記録（裁定 event。問いの asked・問いを起こした時刻・発話の時刻・発話の経路を持ちます・FR89）を残します。言葉は人が打った字の記録から写すので、席は言葉を自分で打ちません。発話が無い・その発話がその問いへもう結ばれている・問いが閉じている・問いでない記録のときは、何も書かずに理由を告げて断ります。席が notes に裁定の行を書こうとすると、起票の門が止めます（FR81）。裁定面（消費側の project の、裁定を書く画面）の答えの口では、空白だけの言葉・閉じた問い・問いでない記録への答えを何も書かずに断り（言葉は command の文字の外で受けます）、通るときは言葉を発話の経路が裁定面の発話として記録し、同じ書き込みで問いに結んで、裁定 id を 1 行で返します。答えの口は承認の記録を作りません（承認は便の承認の口だけが受けます）。席が自分の道具の呼び出しでこの口を撃つと、器の hook が実行の前に止めます（席が起こした子 process からの撃ちは門の外です）。席の道具の呼び出しが言葉を渡して裁定を記録する口はありません。"
  plain-FR83: "要するに、repo が選んだときだけ、文書が引く裁定の番号が台帳の本物の裁定に結ばれているかを器が確かめ、結ばれていないものを成果に使わせない、という決まりです。repo の宣言 file（vessel 宣言）に ruling-check = true を書いて選んだ repo で、器は、文書が引く裁定の番号（裁定 id）が台帳の閉じた問いの裁定の行に本当に在るかを確かめます。番号の形は決まった 3 つです。器の口が発行する問いの番号の形（FR82）と、器を導入した別の repo（消費側）の台帳が自分の経路で書く裁定の行の batch: と policy: で始まる形で、後の 2 つはその台帳の裁定の行の裁定 id の欄か束の欄（消費側の台帳の行が持つことのある、もう 1 つの id の欄。器の結びの口が書く行には在りません）に一致すれば解けます。問いの番号の形は、この repo の台帳の番号の頭（接頭辞）で始まるものだけを数え、ほかの頭の番号の形の字（test の見本など）は引用に数えず、断りもせず、一覧に載せる要もありません（下の判断の欄の条件でも数えません）。ほかに、これまで使ってきた時刻だけの形（user <UTC の時刻>）がありますが、これは台帳の問いに結べないので、選んだ時点（ruling-check が main で初めて true になった commit。opt-in の線）より前の引用は数えるだけにし、後から足した引用は断ります。ただし test の見本のように、わざと台帳に無い番号を書く字もあるので、batch: と policy: で始まる形と線の後の時刻の形は、宣言の file の ruling-fixtures（見本の字をそのまま並べた決まった一覧）に一字違わず同じ字が在れば数えません。一覧に無い字は数え、backtick や code の囲みなどの書式で囲んでも外れません。受付に出た契約の設計の節か契約表の行が、台帳に無い番号・まだ開いている問いの番号・線の後に足した時刻の形を持つときは、受付で断って便にしません。着地の差分が同じものを足すときと、差分が足すか変える「判断の欄」（規則の行の裁定の欄・決定記録の承認の裁定の欄・設計の節の裁定の欄）が引用に数える問いの番号の形（この repo の台帳の接頭辞で始まるもの）を 1 つも持たないとき（ほかの頭の番号だけを持つ欄も、持たないのと同じです）は、main に載せずに待たせ（Gated・FR10）、当たった番号か欄を名指す理由を便ごとに 1 件記録します。判断の欄が台帳の記録の id だけを引く形は、その記録が在っても番号に数えません。記録の id は問いと答えの組を指さないので、持ち主の字に結ばれている証しにならないからです。ruling-check を true から外す差分も、引用に数える問いの番号（この repo の台帳の接頭辞のもの）を足さなければ断るので、裁定なしには確かめを外せません。器は字を数えるだけで文書の意味は読まず、FR84 と同じ決まりで数えます。差分に無い判断の欄と線の前の引用は断らずに数え、doctor の 1 行に main の中の解けない引用と線の前の時刻の形の引用の件数と番号を出します。この文書の中の時刻の形の引用は、どれも線より前のもの（数えるだけ）です。"
  plain-FR84: "要するに、持ち主が決めたことが文書に写されるまで、その決めごとに関わる契約だけを待たせて知らせる、という決まりです。答えを文書へ写すべき（effect が document の）閉じた問いの裁定の番号のうち、main の追跡された file がどれも引いていないもの（未反映の裁定）がある間、器は送り出しの周ごとに未反映の番号の一覧を置き場の file に書きます（0 件の周も空の一覧を書きます）。doctor の 1 行に件数と番号を出し、管理 tick の合図の末尾に目印 unreflected を付けます（FR27）。その番号を受入条件か notes で引く契約と、その問いに blocks される（問いが閉じるまで待つ依存を持つ）契約は、起動の列で理由 unreflected-ruling:<番号> を付けて待たせ、着地の周もその契約の便を main に載せずに待たせます（Gated・FR10）。それ以外の契約と便と、裁定を文書へ写す変更のうち器の便でないものは止めません。未反映かどうかは main の文字だけで判じ（数え方は FR83 と同じで、ruling-check を書いたかどうかに依りません）、経った時間は使わず、答えが操作で済む（effect が operation の）裁定は数えません。未反映が 0 件になった周には、一覧が空になり、doctor の行と目印 unreflected が消えます。"
  plain-FR85: "要するに、main がこれだけは通るべきと repo が決めた最低限の検査（床の検査）に落ちている間は、orchestrator が介入の印 first を付けた便（main を直す便に付ける印です）のほかは起こさない、という決まりです。repo の宣言 file（vessel 宣言）に floor-check（最低限の検査の 1 行の command）を書いた repo で、器は送り出しの周ごとに、main のいちばん新しい commit の結果（終了コード）がまだ無ければ、その commit の中身で floor-check を 1 回撃ちます。撃つ前に、1 行の形か・禁じる語列（FR56）に当たらないか・shell の記号を持たないかを確かめ、当たる行は撃たずに断って、その周を撃てなかった周と読みます。撃つときは shell を通さず、頭の語を PATH から探し（実装役に許した command の一覧には縛られません）、memory の上限付きの箱（封じ込め）の中で撃ちます。終了コード 0 だけを合格と読み、結果（終了コードと要約 1 行）を commit ごとに残して、同じ commit では撃ち直さず、main が進んだら撃ち直します。撃てないときと、時間の上限（規則の行 floor.timeout_s が持ち、値は user の裁定で決めます）を越えたときは、その周を不合格と読み、結果を残さずに次の周で撃ち直します。不合格の間は、first の印を付けた契約はどれもこの理由では待たせず（ほかの待ちの条件はそのままです）、それ以外の起動の列の契約を全部、理由の語（floor:<終了コード>・floor:unfireable・floor:timeout のどれか）で待たせ、doctor の 1 行に結果を出し、管理 tick の合図の末尾に目印 floor を付けます（FR27）。器は first の印を持つ契約が main を直す便かどうかを判じないので、直す便でない契約に first を付けると、その契約も赤の main の上で起きます。列は時計を持たないので、main を直した後の撃ち直しは次の送り出しの周（first の印で起きた便が終わった周を含みます）に起きます。目印 floor が orchestrator の席を起こし、席が手で頼む 1 周がその周になります。"
  plain-FR86: "要するに、器を導入した repo では、選択式の問いの窓を例外なく使わせない、という決まりです。器を導入した repo（目印 .vessel に器の名が書かれた repo）で、器の plugin を積む session が選択式の問いの道具（AskUserQuestion）を使おうとすると、器の hook の入口は実行の前に止めます。止めるときは、問いの経路（平文の返事で問うこと・持ち主の裁定が要る問いは台帳の問い〔FR81〕として立てること）と、repo の宣言 file（vessel 宣言）が question-route を書いていればその 1 行を告げます。席として登録されているか・役割・持ち主が自分で開いた session か・skill の文が選択式の問いを求めているか（skill を起動した直後も）に依らず止め、止めるのを切る規則の行も例外の印もありません。ほかの道具（Bash や Edit など）の判定は、この遮断に左右されません。"
  plain-FR87: "要するに、器が周ごとに memo（契約にする前の覚え書き）の「契約へ上げる条件」を機械で判じ、処置の待ちの memo と長く放っておかれた memo を orchestrator の席に知らせ続ける、という決まりです。器は送り出しの周ごとに、開いている memo のうち昇格の行が「全部」の memo を除くすべての「昇格条件」の節にある引き金の行を判じます。引き金の形は 5 つに決まっています。再発（同じことが起きたと notes に書いた行が決めた数以上）・同梱（閉じていない契約の行の触る file にその path がある）・依存（名指した記録が閉じた）・期日（名指した <UTC の年月日と時分> を過ぎた）・着地（名指した設計 doc の行が着地した）で、行の書き方は設計 doc が持ちます。1 つでも満ちた memo は「引き金の満ちた memo」になります。知らせと lint が数えるのは、引き金の満ちた memo に限らず、局面が処置の待ち（FR91）の memo の全部です（分けた契約が開いている memo と子の問いが開いている memo は、昇格の途中と問いの返事待ちの局面が先に立ちます）。引き金が満ちない memo のうち、前の判定から規則の行 memo.triage_interval_h の時間が過ぎたものは、起こす便が 0 の周に限り、規則の行 memo.triage_per_round の本数まで、読むだけの審査役（memo の審査の lens。口座は便用の規則〔FR36〕で選び、memory の上限付きの箱〔封じ込め・NFR6〕の中で撃ちます）に読ませ、判定（昇格・閉じる・保つのどれか、証拠、昇格なら設計の下書き）を置き場の file に、出来事を log に 1 行残します。器は判定で memo を閉じず、台帳にも書きません（2 つの規則の行の値は user の裁定で決めます）。送り出しの周は時計を持たないので、審査も送り出しの周（FR68）にだけ回ります。pipe dispatch ls には memo の行（引き金の成否・審査の判定・年齢・前の判定の時刻）を出し、起こす便が 0 の周に orchestrator の席へ送る便の終端の周の通知（FR44）で、開いている memo の数・処置の待ちの memo の数・次の 1 本とその判定を知らせ、処置（昇格〔2 つの形・FR91〕・閉じる〔決まった理由の形・FR91〕・引き金の書き直し・保つの記録）で memo の局面が処置の待ちを出るまで周ごとに知らせ直します。処置の待ちの memo（局面の出力の memo-actionable）の本数と、いちばん古いものの年齢は、doctor の台帳の lint の行（FR51）が出します。引き金の行を持たない memo の書き込みは起票の門が止めます（FR81）。"
  plain-FR88: "要するに、user の発話（人が打った字の記録）を、要望・答え・会話のどれかで仕分けさせ、仕分け忘れは席の turn の終わりで止めて告げ、残りを数える、という決まりです。器が記録した発話（FR82）は、要望なら開いている memo へ「この発話から来た」と結び（発端）、答えなら台帳の問いへ結んで裁定にし（FR82）、会話なら台帳を変えずに仕分け済みにします（3 クラスの承認・実装役への回答・go に使った発話も会話にし、承認や回答の記録には結びません）。要望と会話の仕分けは器が出来事の log に 1 件残すだけで、台帳は書きません。1 つの発話を複数の memo や複数の問いへ仕分けることもできます。要望か答えを持つ発話に会話は付けられず、会話の後に要望か答えを足すと会話は外れます。記録の無い時刻や、開いた memo でない記録を名指すと、何も書かずに断ります。その session（実装役と審査役の session は除きます）の turn が終わろうとするとき、その session の未仕分けの発話のうちまだ告げていないものが在れば、器は終わりを 1 度止め、未仕分けの発話の時刻を全部並べて仕分けの口を告げます（言葉そのものは運びません）。止めた周は（登録された席なら）「待っている」の打刻をせず、告げ済みの発話だけが残る周は止めません。この判定は台帳を読まず、出来事の log の大きさに依らない読み方で決め、局面の出力と同じ入力なら同じ結果になります。判定の入力を読めないときは止めずに、読めないことを記録します。席は時刻を名指して発話 1 件の言葉を読めます。doctor の行は未仕分けの件数といちばん古い時刻と、要望と会話で仕分けた件数を出します。"
  plain-FR89: "要するに、席が user に判断を求める問いは台帳の問いとして立て、器は問いが発話より後に起こされた結びを数える、という決まりです。台帳の問いには、問いのきっかけ（asked）を 2 つの値で持たせます。seat は席が user の判断を求めた問い、user は user が先に出した指示や方針を受けるために席が起こした問いです。問いと発話を結ぶたびに（FR82）、器は裁定の記録に asked・問いを起こした時刻・発話の時刻・発話の経路を残し、問いが発話より後に起こされた結びを、asked の値ごとの件数と裁定 id で doctor の行に出します。asked が seat のその形は、席がチャット（対話の session）だけで問い、後から問いを起こした形です。asked が user の問いを発話の後に起こすのは、先立つ指示を受ける正しい形です。asked の無い問いの結びは、doctor の行で asked 無しとして別に数えます。asked が無いか値の外の問いの起票は、起票の門が止めます（FR81）。"
  plain-FR90: "要するに、部品（発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・便でない着地の commit）がそれぞれ一生のどこにいて、次に誰が動く番かを器が導き、state dir に 1 つの出力として書く、という決まりです。器は部品ごとに、局面（決まった語の一覧から 1 つ）・手番（user・seat・vessel・runner・ci・none の 6 つ）・その局面に入った時刻・理由（起動の列の待ちの理由・受付の断りの名・便の段の語をそのまま使う）・結び（発端・子の問い・昇格した契約・便・着地の commit・仕分けた発話の行き先）を導き、版の欄を持つ出力に書きます。局面の語の一覧・手番への対応・misfit の理由の一覧は設計 doc が持ち、memo の局面は FR91 が持ちます。送り出しの周・器が台帳を書いた直後・全部を書き直す口を撃ったときは全部を書き直し、判定には台帳の全部・出来事の log・main の設計 doc の契約表と SRS・main の commit の trailer を使い、close した部品を出す窓は表示にだけ掛けます。管理 tick の周と、発話や仕分けの記録の直後は、台帳も git も撃たずに、出来事の log と時刻で決まる部分だけを、log の大きさに依らない読み方で書き直します。出力は版と入力の印と古さの印を持ち、席の手番のまま局面ごとの年齢の閾値を越えた部品（要件を除く）の件数といちばん古い 1 件も持ちます。席の道具の呼び出しが起票の門を通って台帳を書くとき（子 process の書きには印が付きません）と、便でない merge を門が通したときは、書き直さずに、その時点の入力の印を持つ古さの印を出力に付け、印の後に始まり、印を付けた門が守る入力（台帳か main）がそれより新しい全部の書き直しだけが印を消します。便の段の値はすべて便の部品の局面へ写り、memo の引き金が満ちたかは FR87 と同じ判定で決めます。古い入力からの書きは残らず、入力を読めない周は書き直さずに古さの印を付けて理由を残し、その印は、印の後に始まり全部の入力を読めた全部の書き直しが消します。古さの印は起票の門・merge の門・読めない周の 3 種類で、種類ごとに 1 つまでとし、同じ種類の後の印が前の印を置き換えます。close した部品を出す窓は、局面が終わりでない部品（未反映の裁定を持つ閉じた問いなど）には掛けません。閉じと着地の commit から来る misfit は、この版がその state dir で初めて全部を書き直した時（切り替えの線）より後の記録だけに掛けます。線は state dir ごとに 1 度だけ記帳し、後の版は動かしません。ほかの misfit は線に依りません。発話の部品は言葉を持ちません。どの局面にも当たらない部品と、FR91・FR92 が定める部品は、misfit と理由の語で出します。出力を読む側の決まりは FR94 が持ちます。"
  plain-FR91: "要するに、開いた memo は決まった 4 つの局面のどれかにいて、close の理由も決まった形に限る、という決まりです。開いた memo の局面は、優先の順に、昇格の途中（分けた契約が開いている。自動の close の条件〔FR93〕を満たして閉じるのを待つ memo も含む）・問いの返事待ち（子の台帳の問いが開いている）・処置の待ち（引き金が満ちて保つの記録が無い・処置の無い昇格か close の審査の判定が在る・昇格の行を持つが開いている分けた契約が無く、自動の close の条件を満たさない〔分けた契約が 0 本のときも〕）・引き金待ち（読める引き金が在って満ちない。保つの判定の memo と、満ちた引き金に保つの記録が付いた memo も含む）です。読める引き金が無く、昇格の途中でも問いの返事待ちでもない memo（処置の待ちより先に判じます）と、どれにも当たらない memo は misfit です。昇格には 2 つの形があります。memo にそのまま設計 pointer を書いて契約にする形と、memo を残して契約を分け、memo の notes に「全部」か「一部」と契約の番号を書いた昇格の行を足し、分けた契約から discovered-from の線を張る形です。「全部」の行は、その memo から分けた契約を全部並べます。昇格の行が複数あれば最後の行で判じます。close の理由は記録の種類ごとに決まった形に限り、memo なら昇格済み・まとめた（まとめ先の memo の番号）・見送り（user の裁定 id）の 3 つ、契約なら着地の形と、重複・後継・取り下げの形、台帳の問いと decision の型の記録なら裁定の形、epic なら完了と取り下げの形です。形の外の理由で閉じる席の書き込みと、席が着地の形で閉じる書き込みは起票の門が止め（FR81）、種類と形の食い違いや解けない番号、裁定の記録に無い裁定 id で閉じた問い、子の問いの裁定でない見送りの閉じ、まとめ先が開いた memo でない「まとめた」の閉じ、閉じた時点で自動の close の条件（FR93）を満たさないか番号の列が最後の昇格の行と違う昇格済みの閉じは、局面の出力が misfit で数えます。"
  plain-FR92: "要するに、器の便を通らずに main へ入る変更（設計・ADR・要件の文書の変更など）にも、どの台帳の記録（memo・問い・契約など）のための変更かを示す発端の trailer（commit の本文の行・記録の番号を空白で区切って 1 つ以上並べる）を必ず付ける、という決まりです。席が PR を main へ入れる merge の command を撃つとき、その command が発端の trailer か器の便の trailer を持つ本文を渡さなければ、器の hook が実行の前に止めて欠けを告げます。CI の main の検査も、trailer の無い便でない commit を名指して止めます。どちらも trailer の形だけを見て、台帳に無い番号と、event log に無い便を名指す器の便の trailer と、切り替えの線より後の trailer の無い便でない commit は、局面の出力が misfit で数えます。"
  plain-FR93: "要するに、分けた契約が全部着地した memo は、器が自分で閉じる、という決まりです。land の終端（FR50・FR96）と送り出しの周に、器は、最後の昇格の行が「全部」で、その行の契約の番号の列と discovered-from の線で辿れる契約の列が一致して 1 本以上在り、全部が着地の形で閉じ、子の開いた問いも処置の無い昇格か close の審査の判定も持たない開いた memo を、昇格済みの形（契約の番号の列を持つ）の理由で閉じます。条件を満たさない memo は閉じず、局面は FR91 のとおりです。台帳を読めない周は閉じず、次の周に判じ直します。"
  plain-FR94: "要するに、局面の出力を読むものは自分で判定し直さず、出力が古いときは古いと示す、という決まりです。便の終端の通知が便の段に添える 1 語（便の部品の理由の語）・doctor の行（未仕分けの発話・処置の待ちの memo・席の手番の閾値越え）・管理 tick の目印 unsorted と owned・直近の流れの事実行・memo の判定の通知の処置の待ちの数は、局面の出力（FR90）と同じ判定の結果を使い、自前の判定を持ちません。読み手は書きかけの出力を見ず、出力が持つ入力の印と古さの印を自分が読める今の印と比べて古さを判じ（どの印を比べるかは読み手ごとに設計 doc が持ちます）、古いときは古いと示し、出力が無いか読めないときは読めないことを示します。doctor の閾値越えの行は、出力が持つ件数といちばん古い 1 件を出します。器は同じ中身を text で出す口も持ちます。"
  plain-FR95: "要するに、Tier9 の行で宣言する置き場（park の区画）は、口座を独り占めしない、という決まりです（ADR-0091）。park の区画はいま使う口座の記録・最初の口座（種）・予約・かたまりの移動の判定・移動を頼む記録を持たず、park の区画の行に並べた口座と、park の区画の席が登録している口座は、便の口座選び・session の口座選び・かたまりの移り先と予約のどれからも外しません。park の区画の席を起こすときの口座は、口座を指定すればその口座（行に並べた口座の外でも）、指定しなければ行に並べた口座だけから session 用の選び方（FR36）で選び、候補が無ければ FR69 の断りで起こしません。管理 tick は毎周、park の移り先の判定を撃ちます。登録の口座の使用率の記録が session 用の閾値（FR36 の rules 行）のどれか 1 つでも以上のときだけ、行に並べた口座から登録の口座を除いて同じ選び方で選んだ口座を返し、記録が無いか古いとき・候補が無いときは返しません（候補も記録の最新値だけで選び、古い記録の候補は数えません）。返したときだけ、かたまりの移動と同じ退避の合図と、窓が shell に戻ったときの起こし直し（会話の続きから）でその口座へ移ります。返さなければ移らず、候補が無いときは判定の行に park-no-candidate と出します。同じ登録の口座への退避の合図は、窓が shell に戻るまで重ねて送りません。窓が shell に戻った席の起こし直しは、判定が返せばその口座、返さなければ登録の口座で行います。park の区画の手は計測を起こさず、host の lock も取らず（かたまりの移動を待たせません）、いま使う口座の記録も承認の記録も書きません。移り先は席を起こすときと同じ session 用の選び方で決まり、行に並べた口座の宣言を、その口座を「使う」ことの常設の承認（A1）と読むからで、移った事実は判定の行に残ります（席の登録は起動〔FR59〕が書き直します）。席の仕組み（hook）は park の区画の席でも、登録の口座の使用率がかたまりの逼迫の閾値（rules 行 3 本・FR38）のどれか 1 つでも以上なら指示文の 1 行で告げますが、移動を頼む記録は置きません。doctor の park の区画の行は kind=park を持ち（かたまりの行は kind を持ちません）、いま使う口座・next・断りの欄を - で出します。"
  plain-FR96: "要するに、PR を作って終わった便（PR で着地した便。--pr-cmd の形で着地し、main は動かさず自分の repo へ PR を作った便）は、PR が merge された後に器が確かめてから閉じる、という決まりです。PR の merge の後に便の作業場を畳む器の口（pipe retire。便を起こす権能の口で、席からは撃てません）を撃つと、器はまず作業場が在って clean かを確かめ、vessel 宣言が名指す押す先（任意 key remote）について、merge の commit が remote の main の先端（最新の commit）から辿れる（先端の祖先である）ことと、先端の commit の CI の結果を確かめ、緑のときだけ台帳の便を着地の形の理由（着地した commit は merge の commit。末尾に CI の結果と、merge の commit が先端でないときは先端の commit の番号を持ちます）で close してから作業場を畳み、同じ周に memo の自動の close（FR93）も撃ちます（ADR-0094）。通らないときは close も畳みも記録もせず、理由の語を 1 行出して rc 1 で終わり、同じ口で撃ち直せます。語は、作業場が無いか clean でない worktree-unready・merge されていない not-merged・祖先でない not-ancestor・CI が緑でない（まだ結果が無いときを含む）ci-not-success・確かめに要る git や forge の問い合わせが撃てないときと宣言に押す先が無いか読めないときの unmeasured・確かめが通ったのに close が台帳に届かないときの unwritten の 6 つです。畳むだけの指定（--fold-only）を付けたときは、確かめも close もせずに作業場を戻せる形で畳み、契約は開いたまま残します（merge されずに閉じた PR の便や、押す先を宣言しない repo の PR の便の出口です）。"

  # ---- FR: rationale（rationale_source の N-x に接地した「なぜ要る」）----
  rationale-FR1: "契約が書き切れることを求めるニーズ（N-4）から来ています。欠けた契約を後の段で見つけると QA の周回が始まるので、入口で全件まとめて断る方が安いからです。"
  rationale-FR2: "契約は小さく、しかし出どころは失わない、というニーズ（N-4）から来ています。要件 id と設計 doc を指していれば、契約を書き直すときも全部の bead が同じ形を保てます。"
  rationale-FR3: "記憶に頼らない、というニーズ（N-3）から来ています。process の中に状態を持つと、その process が死んだ瞬間に現在地が消えるからです。"
  rationale-FR4: "人の手が入らなくても安全に進む、というニーズ（N-1）から来ています。出発点と触ってよい範囲を先に記録しておけば、実装役を無人で走らせても後から検証できます。"
  rationale-FR5: "自律安全のニーズ（N-1）から来ています。画面のある席を建てると宛先解決や見張りの仕組みが要りますが、画面なしの 1 形なら process の起動と終了だけで完結します。"
  rationale-FR6: "記憶に頼らない、というニーズ（N-3）から来ています。「終わった」と言葉で申告させず、rc と commit の数という機械の事実で判定します。"
  rationale-FR7: "契約は小さく、検証は base で落ちる test で表す、というニーズ（N-4）から来ています。先に落ちない test は何も守っていないので、入口で機械が確かめます。"
  rationale-FR8: "自律安全のニーズ（N-1）から来ています。検証コマンドを実際に走らせた結果だけを信じ、実装役の自己申告を根拠にしません。"
  rationale-FR9: "自律安全のニーズ（N-1）から来ています。判定できなかった便を合格と呼ぶと、壊れたものが無人で着地します。"
  rationale-FR10: "自律安全のニーズ（N-1）から来ています。合格していない便や、出発点が main の祖先でない（main が巻き戻った・分岐した）便が main に載る経路を構造的に持たないためです。着地が止められている間に着地を重ねないのは、隣の private repo の識別子を持つ commit が残る main の上に次の便を積まないためです（N-1）。裁定の待ちと push の前の停止を回数の上限に数えないのは、写す手や承認が来るまで待つのが正しい状態で、回数を重ねても解けないからです。止めた理由を便ごとに 1 件だけ記録するのは、便がなぜ載らないかを記録から読めるようにしつつ、同じ理由で記録を増やさないためです（N-3）。"
  rationale-FR11: "自律安全のニーズ（N-1）から来ています。main に載せた直後に検証を撃ち直すことで、「作業用の木では通ったが main では落ちる」を無人で検知します。載せる前に公開の字面の走査を撃つのは、断った commit が main に残って後の便の push まで止めないためです（FR50）。"
  rationale-FR12: "自分で自分を作る、というニーズ（N-5）から来ています。着地ごとの判定を外から読める形で残しておけば、次の版がこの器を見張るときの材料になります。"
  rationale-FR13: "自律安全のニーズ（N-1）から来ています。無人で動くものは、いつでも 1 コマンドで止められる必要があります。"
  rationale-FR14: "記憶に頼らない、というニーズ（N-3）から来ています。途中で死んでも記録から続きを引けるなら、長い便を小さな process の列に分けられます。"
  rationale-FR15: "自律安全のニーズ（N-1）から来ています。取り消せない操作だけは人が決める、という線を守るために、機械は止まって記録し、勝手に待ち続けたり進んだりしません。"
  rationale-FR16: "自律安全のニーズ（N-1）から来ています。承認を会話の記憶ではなく逐語付きの記録として残せば、誰が何を許したかを後から確かめられます。"
  rationale-FR17: "規則の値は manifest に、というニーズ（N-3）から来ています。種類を型で閉じれば足し忘れを compile が止め、値を 1 file に置けば AI が場当たりで規則を生やせません。"
  rationale-FR18: "記憶に頼らない、というニーズ（N-3）から来ています。壊れた規則を黙って読み飛ばすと、規則が効いていないことに誰も気づかないからです。"
  rationale-FR19: "自分で自分を作る、というニーズ（N-5）から来ています。どの器がその repo に仕えるかを目印 1 つで決め、別の器や別の版と二重に動かないようにします。"
  rationale-FR20: "契約は小さく、というニーズ（N-4）から来ています。契約の外を触った変更は後の審査では見つけにくく、編集の時点で止めるのが最も安いからです。"
  rationale-FR21: "消費は害、というニーズ（N-2）から来ています。起動時に注入される文章の量を後から測れるように、記録の形だけ先に決めておきます。"
  rationale-FR22: "自律安全のニーズ（N-1）から来ています。「人手 0」を言葉で主張せず、記録を数えて示すためです。人が打った字には会話と指示が混ざっていて機械では分けられないので、人手の数えに混ぜず、裁定に結んだものは承認の側に、未仕分けのものと要望と会話は別の欄に出して隠しません（経緯と却下した案は ADR-0083 と ADR-0087 に在ります）。"
  rationale-FR24: "自分で自分を作る、というニーズ（N-5）から来ています。管轄外の repo を 1 byte も汚さないことが、別の器や別の版と同居できる条件だからです。見張りの口を黙らせないのは、目印の無い repo でも壊す操作は壊す操作で、止める判定に repo の所属は要らないからです（こちらは自律安全 N-1 の側・ADR-0056）。"
  rationale-FR23: "記憶に頼らない（N-3）から来ています。session をまたぐ記憶は台帳の構造が持ち、文脈の圧縮は session 側の機構で足りるので、器が退避物の file を持つと状態の置き場が増えるだけだからです（憲法 C3・ADR-0045）。"
  rationale-FR25: "記憶に頼らない（N-3）から来ています。context の残量を器が測る理由は cap guard と退避の合図のためで、その 2 つを持たない器には測る口も要らないからです（ADR-0045）。"
  rationale-FR26: "自律安全（N-1）と消費は害（N-2）から来ています。編集を止める段は退避と cycle と組で意味を持つもので、圧縮を session 側の機構に任せる形では要らないからです（ADR-0045）。"
  rationale-FR27: "自律安全（N-1）・消費は害（N-2）・記憶に頼らない（N-3）から来ています。器を使う他の project では席が黙ると誰も続きを促さず止まるので、席の外から周期で見て促す機構が要ります（N-1）。合図の頻度を席の変化で決め、無変化なら梯子の列の順で伸ばして列が尽きたら打ち切るのは、同じ合図で席の token を無駄に消費しないためです（N-2）。列を式でなく rules 行 1 本の値で持つのは、持ち主の裁定の列が等比でなく、裁定した値は式に畳まず列のまま持つためです（ADR-0068）。変化を状態の打刻の時刻だけで測るのは、画面の文字や散文を判定に使わない（N-3）ためです（ADR-0058）。tick が判定と計測を持つのは、便の無い host でもかたまりが移るためで、判定の写しは作らず 1 周と同じ 1 本を呼びます（ADR-0066）。窓が shell に戻った席を tick が起こすのは、席を立て直す手番を人に残さないためです（裁定 2026-09-25T04:13Z）。alarm の語 unsorted と owned の経緯は ADR-0087 と ADR-0088 に在ります。"
  rationale-FR28: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。退避物を持たない器では作り直しの周が成り立たず、席の立て直しを user が器の口で撃つ方が状態の置き場を増やさないからです（ADR-0045）。窓が shell に戻った席を tick が起こすのは、席を立て直す手番を人に残さないためで、退避物を持たない点は変わりません（裁定 2026-09-25T04:13Z）。"
  rationale-FR29: "自律安全（N-1）と消費は害（N-2）から来ています。退避の合図は前の器の管理 tick の 1 出力で、退避物を持たない器には合図が残る理由が無いからです（ADR-0045）。管理 tick（FR27・ADR-0058）が送るのは続きを促す打刻の合図だけで、退避の合図は送りません。"
  plain-FR30: "便の配送構造は、orchestrator の席（役割は 1 つ。席数と一意性は FR40）と器の dispatcher からなり、便を起こす・着地させる・merge するのは席ではなく器の dispatcher です（いつ・どれを・どの順で起こすかは FR68、land の終端は FR50）。口座は便ごとに器が選びます（FR36）。orchestrator が書くのは契約と優先度（priority）と介入の印（first / hold / release）、それに実装役の質問への回答か契約の直しだけで、実装は自分ではしません（落ちる test〔tests/ の編集〕は書きます・FR41）。"
  rationale-FR30: "自律安全（N-1）と記憶に頼らない（N-3）のニーズから来ています。便を pipeline が運び、起こすのも着地させるのも器が担えば、人手なしで進む経路と判定の記録が 1 本に揃い、席の手番で便が待つことが無くなるからです。人と話す席を 1 つにした経緯は ADR-0045 に、却下した案は ADR-0016 と ADR-0034 に在ります。"
  plain-FR31: "実装役が「この契約では作れない」と判断したら、勝手に決めずに決まった形の合図（質問 record）を返して手を止めます。pipeline はそれを読んで便を「質問中」の段に倒し、質問の文面をそのまま記録し、回答が来るまで再開しません。"
  rationale-FR31: "記憶に頼らない（N-3）と自律安全（N-1）のニーズから来ています。契約の穴が失敗や黙った推測として消えず、質問の逐語が記録に残るからです。"
  plain-FR32: "orchestrator が回答を逐語のまま記録したうえで再開が要求されると、同じ便がそこから続きます（回答の記帳の後の再開は dispatcher が起こします・FR68）。質問と回答の文面は実装役への入力に添えられます。"
  rationale-FR32: "記憶に頼らない（N-3）と自律安全（N-1）のニーズから来ています。再開に要るものがすべて記録に在れば、別の process からでも同じ便を続けられるからです。"
  plain-FR33: "口座残量の計測を求められると、器は manifest に書かれた口座（退役中の口座を除く）ごとに、5 時間・7 日・モデル別 7 日の残りと reset の時刻を口座の endpoint から 1 つのコマンドで読みます。読んだ値は「どの口座を・どこから・いつ読んだか」を添えて fleet の event log に残し、読めなかったときは理由を添えて「測れなかった」と残します（0 の値に読み替えません）。"
  plain-FR34: "着地を求められたとき、審査が合格していて、作業用 worktree に未 commit の変更が無く、main の先端が便の出発点（base）より進み、その出発点が main の祖先（枝分かれした位置）なら、作業用の branch を main の先端の上に積み直し（rebase＝main に追いつく・追随）、審査をやり直します。進んだ後の出発点と、ぶつかった（衝突）事実は記録に残します。ぶつかっても、規則の値が決める回数までは便を終わりにせず、その回数に達したら「失敗」で終わります。積み直した結果、便の変更がすでに main に入っていたときは、審査をやり直さずに記録して終わります。main 自体は動かしません。"
  rationale-FR33: "消費は害（N-2）と自律安全（N-1）のニーズから来ています。口座の残りが記録に無いと、口座を allowance 窓の終わりまで使い切る判断（憲法 C9.2）を器が持てず、余った枠を無駄にするか上限に当たって止まるかのどちらかになるためです。runner が受ける上限 record（ADR-0012）は便を止める合図であって残量の正本ではなく、残量の正本は本要件の実測値です。"
  rationale-FR34: "自律安全のニーズ（N-1）から来ています。便を並べて流すと、後から着地する便は main に置き去りにされます。追いつく手順を器が持たないと、合格した便が出発点のずれだけで着地できず、人が手で直す経路が生まれます。ぶつかったときの解き方は決定記録（ADR-0019）が正本です。"

  rationale-FR35: "自律安全のニーズ（N-1）から来ています。上限で止まった便を失敗に数えると、成果（worktree）を捨てて人が手で直す経路が生まれます。止まった事実を typed に残せば、別の口座で続きから再開できます（憲法 C9）。"
  rationale-FR36: "自律安全（N-1）と消費は害（N-2）から来ています。口座を人が選ぶと席が止まり、規則が散文に残ると drift します。1 本の純関数と rules 行に置けば、器が同じ規則で選び直せます（憲法 C9.2・C2・C1）。群の今の口座を便の候補から外す決定と、役割の口座と実効の口座をそれに置き換えた決定は ADR-0049 に、便用を 7 日窓の reset の早い順に並べる決定は ADR-0042 に、park の区画の席の口座をどの選定からも除かない決定は ADR-0091 に在ります。"
  rationale-FR37: "自律安全のニーズ（N-1）から来ています。再開のたびに契約や作業場所を作り直すと成果が失われます。同じ worktree と契約で続きから進める形なら、上限に当たっても成果が失われません。"
  rationale-FR38: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。複数の project の席を同じ口座にまとめ、上限が来たら群ごと一斉に移す要求（ADR-0049）を、時計を戻さずに満たすには、残りが減る周（席が話す・便が終わる）と見回りの判定の周に測れば足ります（ADR-0055・ADR-0066）。移動をかたまり単位の 1 回に閉じるのは同じ口座への殺到を構造で消すためで、席の起こし直しで会話 id を運ぶのは、会話を reset しても得るものが無いため（裁定 2026-09-25T03:58Z・ADR-0067）で、運ぶのは打刻に残った id 1 つだけなので、復帰の道は台帳と git から組む 1 本のままです（N-3）。管理 tick を 3 つ目のきっかけに持つのは、便の無い host では 1 周が来ず、席の仕組み（hook）は移動を頼む記録を置くまでで判定を撃たないため、かたまりが移らないからです（ADR-0066）。移り先の候補から終端でない段の便の口座を外さないのは、新しい便がその口座で起きないことを便用の口座選定（FR36）が既に保っていて、同じ目的の条件を 2 か所に持たないためです（ADR-0068）。移り先を残りの量で並べるのは、席は何日も同じ口座に居るので、いま残りが多い口座ほど長く働けるからで、7 日の窓と役割の model の窓の少ない方を取るのは、役割の model の窓だけが高い口座を上位に並べないためです。予約を宣言の順に導いて記録しないのは、かたまりが幾つ増えても数字の小さい群が良い口座を取り、記録が実測とずれる事故を作らないためで、予約が作業の起動を避けないのは、移った後に新しい作業がその口座で起きないことを口座選定（FR36）が既に保っているからです（ADR-0069）。名前を Tier1〜Tier9 に限り Tier9 を口座を占めない park の区画にする理由は ADR-0091 に在ります。"
  rationale-FR39: "自律安全のニーズ（N-1）から来ています。並列の便が同じ file を触ると、着地で衝突して人が解く経路が生まれます。入口で断れば衝突は起きず、決定記録（ADR-0019）の設計と揃います。"
  rationale-FR40: "記憶に頼らない（N-3）から来ています。役割を窓の名前や環境変数の慣習で決めると、器は席の同一性を持てず、規律を守らせる相手を機械が特定できません（憲法 C3.3・C2.2）。"
  rationale-FR41: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。権能を rules 行に置けば、執行（FR45）も指示文（FR42）も同じ行を読めます（憲法 C1・C14・N2）。"
  rationale-FR42: "記憶に頼らない（N-3）から来ています。書かれた規律が席の文脈に届く経路が無いと、要件が在っても守られません。生成した指示文を器が差し込めば、届く経路が構造になります（憲法 C1.2・C14.2）。席の記憶に頼らず続きを拾えるよう、台帳と git から機械で導いた事実行と、圧縮をまたぐ逐語の 1 枠も器が出します。事実行の 5 種目（席の手番の閾値越え）の経緯は ADR-0088 に在ります。"
  rationale-FR43: "自律安全（N-1）から来ています。席の次の仕事は台帳が構造で持てるので、器が席の queue を別に持つ必要はありません（ADR-0045）。黙った席に続きを促す役は管理 tick が担い、人が気づいて促す手間を減らします（ADR-0058）。"
  rationale-FR44: "記憶に頼らない（N-3）から来ています。席間の連絡は席が 2 つ在る配送構造にだけ要る経路で、席が orchestrator の 1 つなら経路そのものが無いからです（ADR-0045）。打刻の合図は席どうしの連絡ではなく器から席への 1 行で、既存の入力欄の門を通ります（ADR-0058）。便の終端の周の通知も、器から席へ便の出来事と次の 1 手の在りかを知らせる 1 行で台帳の現在地から続きを進めるよう促さないので、席どうしの連絡ではありません（持ち主の裁定 2026-09-27T00:59Z）。裁定の指し示しが運ぶ外からの値は裁定面の記帳 id 1 つだけで、席どうしの連絡の経路にしない作りです（ADR-0077）。turn の終わりの止めを差し込みの一覧に入れない経緯は ADR-0087 に在ります。"
  rationale-FR45: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。権能が行に在っても、破る操作を止める点が無ければ規律は散文のままです。編集・実行の時点で止め、誰の権能かを告げる形が、規律を散文でなく構造に置きます（憲法 C16・C16.2）。"
  rationale-FR46: "自律安全（N-1）と消費は害（N-2）から来ています。資源の防御が無い host で便を断ると、便が 1 本も流れません。"

  rationale-FR47: "契約は小さく（N-4）と記憶に頼らない（N-3）から来ています。契約が設計 doc の散文・台帳の受入条件・契約 file の 3 段の写しになっていると、写しの各段で write-set の落ちや設計の混入が起き、正本がどれか分からなくなるからです。"
  rationale-FR48: "契約は小さく（N-4）と記憶に頼らない（N-3）から来ています。閉じた型に variant を足すと触る面は構造で決まるのに、それを人の記憶で write-set に写すと落ちが出るからです。"
  rationale-FR49: "消費は害（N-2）と自律安全（N-1）から来ています。契約側の穴を実装後の gate で初めて見つけると、実装役と審査役の消費を丸ごと捨てて再受付になるからです。実装前に席が手で審査役を回す運用は散文の規則になり、器の段でなければなりません。"
  rationale-FR50: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。push・CI の照合・台帳の close が席の手順のままだと、「着地したのに close されていない」「close したが CI が赤」のずれを目視に頼ることになるからです。候補の木に並べた順に着地した便のうち push の先端でない便には CI の run が無く、先端の CI で確かめなければ手で close するしかありません（N-1）。着地の push も実装役の書いた commit を remote へ出す経路なので、手の push と同じ走査を掛けます（持ち主の裁定 2026-09-27T22:21Z）。close の理由の頭の形と memo の自動の close の経緯は ADR-0089 に在ります。押す先の無い repo の便を器が閉じるのは、着地の形を書けるのが land の終端だけ（FR81 (d)）なので、器が閉じなければその契約を着地として閉じる手段が無くなるためで、3 つの close の道の理由は ADR-0094 に在ります（持ち主の裁定 2026-09-29T05:46Z）。"
  rationale-FR51: "記憶に頼らない（N-3）から来ています。設計の中身が台帳の memo にだけ在ると、tracked な設計 doc に無い設計が判定入力になり、pointer の欠落を機械が拒めなくなるからです。CI は private な台帳に届かないので、doctor が照合します。notes の大きさの上限は、作業の記録を memo に積む形を名指すためで、持ち主の裁定 2026-09-28T13:14Z に従い、経緯は ADR-0089 に在ります。"
  rationale-FR52: "記憶に頼らない（N-3）から来ています。設計 doc の散文にだけ在る規則は規則ではなく、根拠の無い規範文が設計 doc に増えると、器の外の散文が判定入力になるからです。"

  rationale-FR53: "契約は小さく（N-4）と記憶に頼らない（N-3）から来ています。契約 file を席が手で写すと、写しの段で write-set の落ちや設計の混入が起きるからです。"
  rationale-FR54: "契約は小さく（N-4）から来ています。解決しない pointer や手書きの契約 file を通すと、正本の無い便が走るからです。"
  rationale-FR55: "記憶に頼らない（N-3）から来ています。intake の後に設計 doc の行が改訂されると、intake の検査だけでは閉包の不足が見えなくなるからです。"
  rationale-FR56: "人の手が入らなくても安全に進む（N-1）から来ています。許可を command の先頭語の粒度で与える形では、資源を枯渇させる検査や取り消せない操作が許可の内側に入ります。禁じる並びを規則の値として manifest に置き（N-3）、実行の前に機械が止めれば、散文の手順に頼らずに済むからです。器を積まない session も対象に含めるのは、見張りの本体を器へ移しても、いま守られている session を守りの外に落とさないためです。本体を器の外の script に置くと、本体が消えたときに黙って通ります（ADR-0056）。"
  rationale-FR57: "記憶に頼らない（N-3）から来ています。口座の宣言が tracked の manifest と host の写しの 2 か所に割れると、rules 行が動くたびに写しを手で作り直す作業と、2 つの宣言のずれが生まれます。host の値を 1 file に置き同じ読み手で読めば、写しを作り直す手間が消え、人の手が入らなくても安全に進める（N-1）からです。群の表と公開の除外の表を host の面に置く理由は ADR-0091・ADR-0093 に在ります。"
  rationale-FR58: "人の手が入らなくても安全に進む（N-1）から来ています。口座の準備が手作業だと、link の張り間違いや設定の抜けで立て直しが落ち、原因が記録に残りません。器の口で揃え、退役を記録に残せば、記憶に頼らず（N-3）に口座の集合を正しく保てるからです。"
  rationale-FR59: "人の手が入らなくても安全に進む（N-1）から来ています。席の起動が別 repo の wrapper と前の器の launcher に乗っていると、器の視野の外の script に依存し、起動行の手書きが host 固有の値を散らします。器が導出して登録を先に書けば、記憶に頼らず（N-3）に席を立てられるからです。口座をかたまり（群）のいま使う口座から先に決める決定は ADR-0049 に在ります（群の宣言も同じ決定）。"
  rationale-FR60: "自律安全（N-1）から来ています。役割なしの起動は役割の席が立たない不測の事態のための入口で、席が orchestrator の 1 つならその起動は席の起動（FR59）で足りるからです（ADR-0045）。"
  rationale-FR61: "人の手が入らなくても安全に進む（N-1）から来ています。複数の project に入った scribe2 の本体と hook が黙って古くなると、guard の無い席が動き続けます。器が自分で測って名指しし、更新を 1 つの口で行えば、手順書を人が覚える形（N-3 の逆）にならないからです。"
  rationale-FR62: "自律安全（N-1）から来ています。hook の配線の食い違いで席を作り直す経路は退避と立て直しの機構の上に載るもので、それらを持たない器では食い違いを doctor が名指すだけで足りるからです（ADR-0045）。"
  rationale-FR63: "記憶に頼らない（N-3）から来ています。statusline は器の context 計測（FR25）の読み手と対になる描き手で、計測を持たない器には描き手も要らないからです（ADR-0045）。"
  rationale-FR64: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。黙った席は自分を起こせず、便の周に相乗りすると便が流れない project では動かないので、host の timer が管理 tick を周期で撃ちます。本文を器が組んで置くのは、決めた形（ADR-0030）をそのまま使え、host ごとの値を引数だけで受けて env を読まずに済むためです（ADR-0058）。"
  rationale-FR65: "記憶に頼らない（N-3）から来ています。裁定は台帳の notes が、user の逐語は承認の記録が持てば足り、直命の表は状態の置き場を増やすだけだからです（憲法 C3・ADR-0045）。人が打った字の記録（発話 event）は、裁定の言葉を持ち主の打った字に結ぶ写し元として出来事の log（状態の置き場の 1 つ）に残すだけで、席の指示文へ戻す経路を持たず（席が時刻を名指して読む口は席自身の読みです）、仕分けの状態も時刻と行き先だけなので、直命の表とは別のものです。"
  rationale-FR66: "自律安全（N-1）から来ています。4 つの hook は復元・退避の撃ち忘れを器で埋めるためのもので、復元と退避を持たない器には hook も skill も要らないからです（ADR-0045）。圧縮の直前に器が機械で取る逐語の 1 枠（FR42）は、AI が書く退避物とは別のものです。"
  rationale-FR67: "記憶に頼らない（N-3）から来ています。user に向けて出す文の形が user ごとの global の設定 file にだけ在ると、他の user や他の host の orchestrator に届かず、prose だけの規則になります。設計 doc 1 本に置き、器が生成する指示文が pointer で運べば、どの host でも同じ形で届き、人の手が入らなくても（N-1）読める報告が保てるからです。経緯と却下した案は ADR-0032 に在ります。"
  rationale-FR68: "人の手が入らなくても安全に進む（N-1）と記憶に頼らない（N-3）から来ています。便の起動が席の中継に乗っていると、着地から次の起動までの待ちと優先便の後回しが席の手番で起き、「同時に何本」のような規則が散文に残ります（最大値を持つなら規則の表の 1 行に置きます）。起動に要る判定（依存・重なり・受付・審査）は器がすべて持っているので、判定と起動を器の同じ関数に置けば、待ちは重なり・受付・同時走行の最大値と、終端に達した便が起動の列から外したこと（release の印 1 つにつき 1 回だけ戻す）で決まり、回答と承認の記帳も同じ周の契機になり、介入も記録に残るからです。regate で戻された便を専用の契機を足さずに同じ周で拾うのは、regate を撃つのが人の席で、その席が手動の 1 周も撃てるからです（裁定の記帳と再開の契機を分けても、契機が 1 つ増えるだけで拾う便は変わりません）。周期の timer を持たず便の終端を契機にする決定は ADR-0045 に、経緯と却下した案は ADR-0034 に、同時走行の最大値を 1 つだけ持つ決定は ADR-0035 に在ります。追随で戻された便に専用の契機を足さないのは、追随を撃つ着地の列の周と便の終端の周がすでに契機で、その周に所有者の印を失った便を拾えるからです（ADR-0068）。受付の断りを event に記帳する経緯は ADR-0088 に在ります。"
  rationale-FR69: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。余裕の無い口座で席を立てても上限ですぐに止まるだけなので、起こさずに理由の語で断れば、候補が無い理由が 1 語で残り、人が口座を足すか、口座を指定して起こし直すかを決められます。口座の指定と群の今の口座は選定を通らないので、この断りに当たりません（FR59）。理由の語で断る形は持ち主の裁定 2026-09-28T09:04Z に従い、ADR-0041 の妥協の起動を置き換える経緯と却下した案は ADR-0086 に在ります。"
  rationale-FR70: "自律安全（N-1）と消費は害（N-2）から来ています。強制サイクルは退避の合図の後に新しい作業を始めさせないための機構で、退避の合図を持たない器には印も guard も要らないからです（ADR-0045）。"
  rationale-FR71: "記憶に頼らない（N-3）から来ています。実測の口座の食い違いの判定は、合図の宛先を実測の口座で決める tick にだけ要るものです。管理 tick（FR27・ADR-0058）の判定の列に口座の食い違いの判定は無いので要らず、席の口座は登録に書いた値だけを信じれば足ります（ADR-0045）。"
  rationale-FR72: "人の手が入らなくても安全に進む（N-1）から来ています。見張りを呼ぶのは口座の設定 file の 1 行なので、AI の席がその file を書き換えれば見張りは黙って外れます。他の区分を切る・緩めるのは user の決定の印がついた規則の行だけにし、この区分は行も持たず切れないことにして（N-3）、設定 file の書き換えを見張り自身が止めれば、事故で守りが消えないからです（ADR-0056）。"
  rationale-FR73: "記憶に頼らない（N-3）から来ています。見張りが切れている・呼び出しの行が欠けている・器のプログラムが見つからない、のどれも黙って通る側に倒れるので、その状態を席の記憶や散文でなく健康診断の実測 1 行で読めるようにし、黙って無効にならないようにするためです（N-1・ADR-0056）。群の表のどの行にも属さない置き場を数えるのは、口座を占めない park の区画ができても、どこにも宣言されていない置き場の席を見落とさないためです（ADR-0091）。"
  rationale-FR74: "人の手が入らなくても安全に進む（N-1）から来ています。元に戻せない削除は憲法が禁じる操作で、器の置き場を消す rm は一度通ると取り返しがつかず、repo の管理下の file も未 commit の変更ごと消えうるので、戻せる経路（git rm）に揃えます。守る場所を machine ごとの path でなく記号で規則の行に置き（N-3）、行き先を確かめられない削除は止める側に倒し、戻せる経路（git rm・退役の mv）へ向ければ、散文の注意書きに頼らずに済むからです（ADR-0056）。"
  rationale-FR75: "人の手が入らなくても安全に進む（N-1）から来ています。見張り（FR56 / FR72 / FR74 / FR76 / FR80）が口座の設定を読む全 session に効くのは、口座の設定 file に呼び出しの行があるときだけです。その行を machine ごとの配備 script や手書きに任せると、machine 固有の値が散り、欠けても気づけません。器の口が実体へ足すだけの merge で書き、正本を file に置いて健康診断（FR73）が実測すれば（N-3）、配線の欠けが黙って残らないからです（ADR-0056）。"
  rationale-FR76: "人の手が入らなくても安全に進む（N-1）から来ています。作業の記録簿（台帳）を壊す語の並びと、台帳の script を経ない書き込み（素 write）の判定は、器の中では器の plugin を積む席の hook の入口（command guard と起票の門）にしかありません。判定の本体を器の外の script に置くと、本体が消えたときに黙って通ります。同じ規則の行と同じ判定を見張り（host-guard）が使えば（N-3）、台帳を持つ repo でだけ、どの session からでも同じ形で止まるからです（ADR-0056）。"
  rationale-FR78: "自律安全（N-1）と消費は害（N-2）から来ています。合図だけを席ごとに決める口が無いと管理 tick の timer ごと止めるしかなく、口座の移動と死んだ席の起こし直しも止まります（N-1）。合図を受けない席は token を消費しません（N-2）。健全かを読む側が判じることと書き手を器の 1 本にする理由は ADR-0070 が、明示の記録を 2 つにし、行の key と種類の既定で既定を決める理由と採らなかった案は ADR-0092 が持ちます（持ち主の裁定 2026-09-26T00:53Z・2026-09-28T01:55Z・02:00Z）。"
  rationale-FR79: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。待っている席は、放っておくと次の管理 tick の合図まで裁定に気づかず、持ち主との対話が止まります（N-1）。知らせるのは裁定の在りかの指し示しだけで、中身は消費側の仕組みが自分の置き場から読んで席へ届けるので、差し込まれた文を裁定の出所にしません（N-3）。送る行に入る外からの値を記帳 id に絞る理由と、送る前の確かめを管理 tick と揃える理由は ADR-0077 が持ちます（持ち主の裁定 2026-09-27T00:51Z）。"
  rationale-FR80: "人の手が入らなくても安全に進む（N-1）と記憶に頼らない（N-3）から来ています。public の repo へ出た push は取り消せないので、止めるなら撃つ前でなければなりません。公開の前に相手の可視性を確かめ差分を目で探す手順は散文の規則なので、手順が抜けた回には隣の private repo の内部の事実がそのまま public の repo へ出ます（N-3）。器の見張りが公開の直前に同じ判定を撃てば、口座の設定を読むどの session からも同じ形で止まり、器の着地には FR11（main に載せる前）と FR50（push の前）が同じ判定を掛けます（N-1）。見張りの種類に足す理由と、GitHub へ問い合わせることを外へ出してよい範囲とする解釈は ADR-0078 が持ちます（持ち主の裁定 2026-09-27T17:39Z・2026-09-27T22:21Z・2026-09-27T23:55Z）。無害な字句の表を host の面に字句のまま置く理由と採らなかった案は ADR-0093 に在ります（持ち主の裁定 2026-09-29T05:46Z）。"
  rationale-FR77: "人の手が入らなくても安全に進む（N-1）と記憶に頼らない（N-3）から来ています。gate の一時の赤（負荷や環境）で落ちた便を捨てると、実装役の成果が消えます。かといって器が赤の理由を自分で分類して戻すと、契約の赤を無限に撃ち直す形が作れてしまいます。理由の分類は裁定であって述語ではないので、人が裁定の逐語を添えたときだけ戻します。戻したことは記帳 1 件を正本として残し、後から誰が何を根拠に戻したかを読めるようにします（N-3）。"
  rationale-FR81: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。問いと答えと写すべきかを決まった形で台帳に残せば、答えを結ぶ先と写し忘れを機械が数えられ（FR84）、裁定の行と memo の条件も同じ門で形を守れるので、席の手順に頼らずに済みます。形は持ち主の裁定 2026-09-28T00:05Z・2026-09-28T00:54Z・2026-09-28T13:14Z に従い、経緯と却下した案は ADR-0083（(a) の元の形と (b)・(c)）・ADR-0087（asked と印）・ADR-0089（(d)）と ADR-0094（(d) の land の終端の 3 つの経路）に在ります。"
  rationale-FR82: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。bind では裁定の言葉は必ず器が記録した発話の写しになり、席は言葉を自分で打てないので、席の手順に頼らずに問いと答えの組が台帳に残ります。裁定面の答えの口は席の道具の呼び出しからは撃てませんが、席が起こした子 process からの撃ちは止めず、発話の経路で分けて残し数えます（信頼の線を画面の分だけ下げる形です）。問いと答えを結ぶ形は user の裁定 2026-09-28T00:05Z に、打った字を問いの有無に依らず記録する範囲は user の裁定 2026-09-28T09:04Z に、裁定面の答えを同じ裁定の行にする口は user の裁定 2026-09-28T13:47Z に従い、経緯と却下した案は ADR-0083 と ADR-0087 に在ります。"
  rationale-FR83: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。判断の欄が空でないことだけを見る形では、覚えている番号や手で写した字も裁定として門を通れますが、引用が台帳の閉じた問いの裁定の行に解けることを受付と着地で確かめれば、持ち主の字に結ばれない判断は成果に使えません。ただし、test の code の見本や決まった done の文の見本まで断ると、器自身の歯や消費側の repo の見本が通らなくなります。そこで、問いの番号の形は自分の台帳の接頭辞のものだけを数え、batch: と policy: の形と線の後の時刻の形の見本は宣言の閉じた一覧に一字違わず載せたものだけを外します。これとは別に、batch: と policy: の形は消費側の台帳の束の欄にも解けるようにします。消費側の行はその欄にも同じ形の id を書くからです。全体は持ち主の裁定 2026-09-28T00:05Z・2026-09-28T00:54Z に従い、見本の数え方と束の欄は後の裁定（決めてほしいことは推奨で進める）の下の orchestrator の決定です。経緯と却下した案は ADR-0083 に在ります。"
  rationale-FR84: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。決めたことが文書に写されないまま進むと次の設計が古い文書を正として読むので、写されていない裁定を数えて知らせ、関わる契約だけを待たせて写す手を先に促します。持ち主の裁定 2026-09-28T00:05Z・2026-09-28T00:54Z に従い、経緯と却下した案は ADR-0083 に在ります。"
  rationale-FR85: "自律安全（N-1）と消費は害（N-2）から来ています。main が床の検査に落ちている間に便を起こすと、どの便も同じ赤の上に積まれて便の枠を無駄にするので、介入の印 first を持つ便だけを床の検査では待たせず（main を直す便の経路）、ほかの便は main が通るまで待たせます（GOAL 2）。直す便まで待たせると、src を直せない orchestrator の席（FR41）には、code が原因の赤を直す道が無くなるからです。器は first を持つ便が直す便かを判じないので、直す便でない便に付けた first でも、その便は赤の main の上で起きます。これは既存の印を直す道に使う代償です。持ち主の裁定 2026-09-28T00:05Z・2026-09-28T00:54Z に従い、経緯と却下した案は ADR-0084 に在ります。"
  rationale-FR86: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。選択式の問いの窓は持ち主の操作を待って席を止め、選んだ選択肢は人が打った字の記録に残らず裁定に結べないので、例外を持たずに塞ぎます。持ち主の裁定 2026-09-28T00:49Z に従い、経緯と却下した案は ADR-0084 に在ります。"
  rationale-FR87: "記憶に頼らない（N-3）と消費は害（N-2）から来ています。memo の昇格条件を機械が判じられる引き金の行にして周ごとに判じ、満ちない memo も間隔を置いて審査役に読ませれば、処置の要る memo が埋もれずに orchestrator の席へ届き、審査は起こす便が 0 の周に本数を絞って撃つので便の枠を奪いません。持ち主の裁定 2026-09-28T07:27Z に従い、経緯と却下した案は ADR-0085 に在ります。判定の範囲と処置の待ちの数え方は、ADR-0089 が ADR-0085 の一部を置き換えます。"
  rationale-FR88: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。user の要望を bead にするかを席の判断に任せると、しなかったことを誰も数えず、要望が会話の中で消えます。発話を決まった 3 つの形のどれかで仕分けさせ、仕分け忘れを器が turn の終わりで止め、会話として仕分けた件数も隠さず数えれば（FR22）、要望が黙って消えたかを後から数えて確かめられます（仕分けの正しさは器が判じません・ADR-0087）。時刻を名指して 1 件を読む口は、前の session の発話を仕分けるためにあります。user の裁定 2026-09-28T13:12Z に従い、経緯と却下した案は ADR-0087 に在ります。"
  rationale-FR89: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。問いがチャットにだけ在ると、圧縮で消え、答えを待つ問いが画面にも出ません。先に台帳の問いにすれば、チャットでも裁定面でも同じ裁定の行で答えられます。チャットの文は編集ではないので編集の時点では止められず、平文の中の問いを字面で探す判定も持たずに、結ぶ周に数える検出の線にしています。user の裁定 2026-09-28T13:14Z に従い、経緯と却下した案は ADR-0087 に在ります。"
  rationale-FR90: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。「今どこか」を器・消費側・席がそれぞれ自分で計算すると食い違い、どこにも出ない死角が生まれます。判定を器の 1 か所に集めて 1 つの出力に書けば、器の整理と見せ方が作りの上で 1 対 1 になり、席の手番で止まった部品は打刻の合図の目印と直近の流れの事実行で席へ届きます（合図を止めた席には doctor の行が知らせます）。user の裁定 2026-09-28T13:14Z に従い、経緯と却下した案は ADR-0088 に在ります。"
  rationale-FR91: "記憶に頼らない（N-3）と消費は害（N-2）から来ています。memo の状態と閉じ方が決まっていないと、開いた memo が膨らみ、要望が席の判断で黙って落ちます。見送りに user の裁定を要し、一部だけ昇格した memo を残りの候補ごと閉じない形にすれば、要望の取りこぼしを数えて見せられます（その場で昇格した契約を取り下げる閉じは数えの外に残ります）。開いた memo を名のある局面と閉じ方に限る形は user の裁定 2026-09-28T13:14Z に、close の理由の文法を全部の種類へ広げる形は常設の指示 2026-09-28T00:54Z の下の決定に従い、経緯と却下した案は ADR-0089 に在ります。"
  rationale-FR92: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。設計や要件の変更が台帳のどの記録のためかを持たないと、案件の設計の局面が見えず、どの要望が文書まで届いたかを追えません。merge の時点で trailer を求めれば、編集の時点で止める形になります（憲法 C16）。この形は、死角を残さないという user の方向の裁定 2026-09-28T12:46Z と、段の全部を出力に入れる問い 3 の裁定 2026-09-28T13:14Z から導いたもので、trailer と merge の門そのものは個別の問いを経ていません（常設の指示 2026-09-28T00:54Z の下の決定）。経緯と却下した案は ADR-0088 に在ります。"
  rationale-FR93: "記憶に頼らない（N-3）と消費は害（N-2）から来ています。分けた契約が全部着地した memo を席の手で閉じる形にすると、閉じ忘れた memo が開いたまま積もり、開いた memo の数が要望の残りを表さなくなります。条件が機械で決まる閉じは器が行い、条件に届かない memo は処置の待ちに残して席へ知らせます。memo を名のある閉じ方に限る形は user の裁定 2026-09-28T13:14Z に、自動の close の契機と条件は常設の指示 2026-09-28T00:54Z の下の決定に従い、経緯と却下した案は ADR-0089 に、PR で着地した便の close も契機に数える理由は ADR-0094 に在ります。"
  rationale-FR94: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。読み手がそれぞれ「今どこか」を判じ直すと、同じ部品が画面ごとに違う局面で描かれ、どれが正しいかを人が確かめる手間が残ります。判定を局面の出力の 1 か所に置いて読み手はそれを読むだけにし、古さを印で示せば、器の整理と見せ方が 1 対 1 のまま保たれます。user の裁定 2026-09-28T13:14Z に従い、経緯と却下した案は ADR-0088 に在ります。"
  rationale-FR95: "自律安全（N-1）と消費は害（N-2）から来ています。席は残すが日々は動かさずに置いておく repo を、かたまりに入れると口座を 1 つ占めて他のかたまりの移動と作業の流れを妨げ、かたまりの外に置くと席の登録の口座が他の席の口座選びから外れて口座を占めます（N-1）。口座を占めない置き場の種類を 1 つ持ち、合図の既定を off にすれば、置いておく席は口座を占めず、既定では合図で token を使いません（N-2）。名前で種類を決める理由・移る閾値を session 用の閾値にする理由・採らなかった案は ADR-0091 に在ります（持ち主の裁定 2026-09-28T01:55Z・2026-09-29T05:01Z・2026-09-29T05:44Z）。"
  rationale-FR96: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。着地の形の close を書けるのは land の終端だけ（FR81 (d)）なので、main を動かさずに PR を作って終わる便は、器が merge を確かめて閉じなければ着地として閉じる手段がありません（N-1）。merge の commit が remote の main の先端から辿れることと先端の CI を確かめるのは、merge されていない PR や赤い main を着地として閉じないためです（N-3）。畳むだけの指定を残すのは、merge されずに閉じた PR の作業場を戻せる形で片付ける道を失わないためです（N-1）。採らなかった案は ADR-0094 に在ります（持ち主の裁定 2026-09-29T05:46Z）。"

  # ---- NFR: plain ----
  plain-NFR1: "審査役 1 回に使う token は 0.15M 以内を目標にします。diff の大きさと上限の照合結果を判定に記録します。"
  plain-NFR2: "1 つの契約の変更は 300 行程度、見積は 550 行以内にします。PR の行数と契約の見積を記録して見比べます。"
  plain-NFR3: "実行時に使う外部 crate は 0 本で、標準ライブラリだけで build します。許可リストの外の依存は CI の検査が毎回落とします。"
  plain-NFR4: "不正な入力を黙って落とす件数は 0 です。記録が読めないときは rc 2 で止まります。壊した入力を実際に流して、全部が声を上げて止まることを確かめます。"
  plain-NFR5: "道具 1 回の呼び出しにつき、器の binary を呼ぶのは 2 回まで（器の hook の入口と、口座の設定から呼ばれる見張り host-guard）で、1 回ごとに 2.0 秒以内に終わり、重い読み書きをしません。見張りが git に問い合わせるのは 1 回までです。turn の終わりの判定の hook と発話の記帳の hook の呼び出しも 1 回ごとに 2.0 秒以内に終わり、出来事の log が大きくなっても読む量は変わりません（test が測ります）。ただし公開の segment（FR80）のときの見張りだけは、2.0 秒と git 1 回と重い読み書きをしないことの代わりに、git と gh への問い合わせ（GitHub への問いを含む）を回数で縛らず、出ていく文字を 8 MB まで読み、全体を 6 秒の締め切りで縛ります（越えたときに止めるのは FR80）。hook の入口のかかった時間と、見張りが止めた回のかかった時間は注入計測の記録に残し、見張りが通した回の時間の上限と git の回数と公開の segment のときの締め切りは test が測ります。着地の段の走査（FR11・FR50）も同じ 8 MB と 6 秒で縛ります。"
  plain-NFR6: "器が起こす子 process は、すべて封じ込めの箱の中で走らせます（箱の外で走る子 process は 0 本）。変異検査を何本同時に走らせるかは、host 全体の並列の枠から決めます。便ごとに、封じ込めの有無・並列度・縮退の理由が記録に残ることを fixture で確かめます。"

