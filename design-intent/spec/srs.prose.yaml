# scribe2 SRS（MVP）— prose manifest（folio S4 generator の③「読みやすさの足場」）
#
# 機械 SSoT = srs.srs.yaml。 assemble-srs.sh が空で出した data-prose-slot に inject-prose.sh が
# HTML escape して注入する。 slot-id ↔ 散文の 1:1（集合一致を inject が fail-closed 検査）。
#   - plain        = その FR / NFR の ears.response / target を非エンジニア向けに言い換え（情報を落とさない）
#   - rationale    = rationale_source が指す upper_needs（N-x）に接地した「なぜ要る」
#   - chapter-lead = その章が何を・なぜ示すかの導入（章構成に接地）
#   - rtm-summary  = 派生数値（req=73 / need=5 / iso=0 / unv=0）の平易要約（data-derived と一致必須）
#   - cover-summary= goals 3 つ + title の 1 文約束
# 捏造 / 歪曲 / 脱落は fidelity ceiling（fidelity-srs）の検査対象。 値は単一行（tab / 改行禁止）。

slots:
  # ---- 表紙 ----
  cover-summary: "設計から契約・実装・検証・land までを、人の手番を 3 クラス承認だけに絞って 1 本通す器（MVP）の約束を定める文書です。人を待たせず、壊れたまま進まず、記憶に頼らない、の 3 つを守ります。"

  # ---- 章リード ----
  chapter-lead-01: "まず「これが起きたら失敗」を 3 つ先に決めます。人を待たせる・壊れたまま進む・記憶に頼る、の 3 つです。避けたい結果を共有してから要件を読むと、各要件が何を守るためのものか分かりやすくなります。"
  chapter-lead-02: "この文書が扱う範囲（intake から land まで・承認の停止と再開・規則の値と現在地・器の所属 marker と hook・到達点の計測・開発 session の自律機能・口座残量の計測と記録・追随・上限停止した便の別口座での再開・開発 session の役割と権能・席の指示文の注入・席の継続・席間の連絡・封じ込めと受付の枠・契約表からの契約 file の生成・契約の審査・write-set の閉包・land の終端・台帳の lint・設計 doc の散文の門・契約表の検査・禁じる語列の command の拒否・host の面・口座の登録・口座の退役・席の起動・役割なしの起動・導入先の同期・hook 集合の食い違い・statusline の描画・管理 tick の駆動・直命の表・取得の強制と自動退避・対話面の作法）と、扱わない範囲（interpreter 経路の中身の解析・lane 計画と席の dashboard・台帳への write〔close と notes 1 行の外〕・複数の対話面・rtk / graphify の有効化と SQLite 化）をはっきりさせ、関わる人と process（開発者・開発 session・runner・lens・CI・台帳）を一覧にします。"
  chapter-lead-03: "各要件は思いつきではなく、5 つの上位ニーズ（自律安全・消費は害・記憶に頼らない・契約は小さく・自己開発）から来ています。この章はその出どころを示し、後の対応表で「どのニーズがどの機能になったか」を追えるようにします。"
  chapter-lead-04: "器が「いつ・何をするか」を 67 本の機能要件で一つずつ定めます。契約の検査 → 便の永続 → runner の起動と完了判定 → flip check と gate → land と export → stop と resume → 承認の停止と再開 → rules manifest → marker と hook → 計測 → 作業記憶の作法 → 開発 session の計測・cap guard・管理 tick・cycle・退避の合図 → 配送構造と質問の停止・再開 → 口座残量の計測 → 追随 → 上限停止の検知・口座選定・別口座での再開・session の上限前の退避 → intake の排他 → 席の登録・権能の所在・指示文の注入・席の継続・席間の連絡 → 権能の執行 → 縮退 → 契約の正本・write-set の閉包・契約の審査・land の終端・台帳の lint・設計 doc の散文の門・契約 file の生成・設計 pointer の拒否・契約表の検査 → 禁じる語列の command の拒否 → host の面・口座の登録と退役・席の起動 → 役割なしの起動・導入先の同期・hook 集合の食い違い → statusline の描画・管理 tick の駆動 → 直命の表・取得の強制と自動退避・対話面の作法、という主な並び（id 順）で、各行にはやさしい言い換えと「なぜ要る」の根拠を添えています。"
  chapter-lead-05: "「どれくらい速く・落ちず・安全か」を数字で約束します。lens の予算・契約の大きさ・依存の本数・黙って落とさない件数・hook の時間・host の資源の 6 点を、それぞれの測り方とセットで示します。"
  chapter-lead-06: "「MVP ができた」と言える条件を、後から確かめられる形で先に決めておきます。toy repo で 5 便、scribe2 自身で 1 便、偽の PASS が 0 件、別 process からの再開、承認の停止と再開、不正入力の loud な拒否、write-set の外の deny、作業記憶の作法、開発 session の自律機能（計測・cap guard・管理 tick・cycle・退避の合図）、質問で止まり回答で再開する便、口座残量の計測と記録、上限で止まった便の別口座での完走、session の別口座での立て直し、交差する契約の拒否、権能の外の記帳の deny、役割の外の編集の deny、席の指示文の drift 0、席の継続の注入、席間の連絡の記録、資源不足で断らないこと、契約表からの生成と拒否、審査を通らない便の runner 起動 0、land の終端が席の手順なしに通ること、台帳の pointer 欠落の名指し、散文の門の違反の名指し、契約表の検査の違反の名指し、禁じる語列の command の deny、host の面と口座の登録・退役、器の subcommand からの席の起動、役割なしの対話 session の起動、導入先の同期の測定と 1 つの口の更新、hook 集合の食い違いでの席の作り直し、statusline の描画と口座の設定、管理 tick の駆動の unit、直命の表と確認候補、復元と退避の取得の強制と自動要約前の自動退避、対話面の作法の指示文と 5 slot の brief、の 37 点です。"
  chapter-lead-07: "上位ニーズ・機能要件・受入基準が途切れなくつながっているかを 1 枚の表で見ます。出どころの無い要件や、確かめる手段の無い要件が残っていないかを確認する章です。"
  chapter-lead-08: "設計の前から決まっている制約を並べます。憲法が上位にあること、repo が PUBLIC であること、test は Rust だけ、前の器の作法を持ち込まない、不可逆操作の口を持たない、headless の制約、の 6 点です。"
  chapter-lead-09: "本文に出てくる専門語（契約・runner・lens・gate・land・fleet・event log・hook・worktree など 69 語）を、やさしい言い換えと定義で並べます。本文中の専門語には同じ言い換えを併記しています。"

  # ---- FR: plain（やさしい言い換え・情報を落とさない）----
  plain-FR1: "契約の file に必須の 7 項目（goal / done / write-set / verify / size / owner / disposition）が欠けていたり、verify が複数行だったり、write-set が空だったら、問題を全部まとめて行番号付きで断り、便は作りません。"
  plain-FR2: "契約には「どの要件のためか」（SRS の要件 id）と「どの設計から来たか」（設計 doc）を必ず書きます。設計 1 本から契約が何本も出る、という形を崩しません。対象は本 SRS を根拠に起票する契約で、v1 由来の既存 bead は対象外です。"
  plain-FR3: "各段は自分の記憶ではなく、追記だけの記録（event log）を最初から読み直して現在地を知り、終わるときに記録を 1 行足します。process の中に状態を抱えません。"
  plain-FR4: "便が「受け付け済み」の段にあって起動を頼まれたら、出発点（base）を記録し、作業用の worktree を切り、触ってよい file の列を書き出してから、実装役（runner）を画面なしで起動します。"
  plain-FR5: "実装役（runner）も審査役（lens）も、同じ 1 つの形で呼びます。画面なしの claude -p に、契約や diff を入力で渡し、答えは構造化した 1 行で受け取り、許可の設定は毎回明示し、口座は環境変数で切り替えます。"
  plain-FR6: "実装役が終わったとき、正常終了（rc 0）で、出発点から commit が 1 件以上あれば「実装済み」、そうでなければ「失敗」と記録します。"
  plain-FR7: "変更した Rust の file ごとに、test の差分だけを出発点（base）に当てて「先に落ちる」こと、そして変更後（HEAD）では通ることを機械で確かめます。文書だけの変更（docs-only）を除き、test の差分が無い変更は受け付けません。"
  plain-FR8: "審査（gate）を頼まれたら、契約に書いた検証コマンドを 1 行ずつ作業用 worktree で実際に走らせ、行ごとの結果を記録します。1 本でも失敗すれば FAIL です。"
  plain-FR9: "審査役が要るのに居ない、diff が予算を超える、答えが読めない、答えが 3 値（PASS / FAIL / INCONCLUSIVE）の外、のどれかなら、合格（PASS）とは言わず「判定不能（INCONCLUSIVE）」にします。"
  plain-FR10: "審査が合格でないとき、または main の先端が記録した出発点（base）とずれていて追いつけない（出発点が main の祖先でない、または作業用 worktree に未 commit の変更がある）ときは、着地（land）は何もしません。main も記録も変えません。"
  plain-FR11: "審査が合格で前提が揃ったら、作業用 worktree の中身を 1 つの commit にまとめて main に載せ（中身が同一であることと、他の変更と競合しないことを確かめて）、main の上で検証を撃ち直します。落ちたら「失敗」と記録して止まります。"
  plain-FR12: "着地が成立したら、判定の結果を版番号付きの 1 行として verdicts.jsonl に追記し、「着地済み」と記録します。次の版の器がこの記録を読めるようにするためです。"
  plain-FR13: "stop --all は、動いている実装役をすべて止める 1 つのコマンドです。何度撃っても同じ結果になり、結果は 0（全部止まった、または止める対象なし）・1（止められないものが残った）・2（記録が読めない）の 3 値で返します。"
  plain-FR14: "別の process から「続きを」と頼まれたら、記録の現在地から続きの段だけを進め、着地まで到達できます。"
  plain-FR15: "契約が「消す・出す・使う」のどれかを名乗る段に来たら、承認を求める記録（approval.requested）を残して「保留」で止まり、人の入力を待たずに process を終えます。"
  plain-FR16: "人が承認（approve）を逐語付きで与えたら、それを記録（approval.received）し、次の「続きを」で先へ進めます。"
  plain-FR17: "規則の「種類」は Rust の閉じた enum と網羅 match で持ち（足し忘れは compile が止める）、規則の「値」は repo に置いた manifest 1 file から起動時に読みます。"
  plain-FR18: "manifest に知らない種類・重複した id・型の合わない値・user 由来なのに裁定 id が無い行があれば、起動する前に問題を全部まとめて行番号付きで断ります。黙って読み飛ばしません。"
  plain-FR19: "repo root の目印（.vessel）が「自分の名前」を言っている間は、hook は起動時に名乗りを出します。"
  plain-FR20: "契約で触ってよいとした file の外を編集しようとしたら、その編集の時点で止めます。許可リストが読めないときも、通すのではなく止めます。"
  plain-FR21: "hook は自分が出した 1 行について、誰が・何を・いつ・何 byte・何 token・かかった時間、の形で記録を残します。あとで計測の仕組みを足すときに、経路を作り直さなくて済むようにするためです。"
  plain-FR22: "到達点を測るときは、人が関わった記録を数え、承認以外が 0 件であることを機械で示します。"
  plain-FR24: "repo root に目印（.vessel）が無いか、別の名前が書いてある repo では、hook は何も出さず正常終了（rc 0）で黙り、その repo に 1 byte も書きません。"
  plain-FR23: "開発 session（この AI）の作業記憶の退避と復元は器の subcommand で行います。退避 file を session id で一意にし、使い終えた file は決まった名前の付け方（同じ suffix）で見分け、削除でなく移動し、DATA が無い周は状況説明を出さず、別 session の退避物は勝手に片付けず、二重に起動しても同じ結果になるようにし、退避 file は state dir の席ごとの dir に置いて repo の作業ツリーには置かず、repo の作業ツリーに残った退避 file は doctor が数え、同じ session id の未消費の退避 file が在るまま再退避したときは前の file を置換名に改名して置き換え、削除はしません。復元の DATA は、出どころの pointer を持たない行（暫定行）を印付きで並べ、次の cycle には引き継ぎません。"
  plain-FR25: "開発 session（この AI）の context がどれだけ埋まっているかを、どこから読んだかを添えて 1 件返します。読めないときは rc を 0 以外にして「読めなかった」と言い、0% と偽りません。"
  plain-FR26: "編集の手前で動く hook が、context の使用量を rules の行に書いた上限と見比べます。上限以上なら退避の操作だけを通し、それ以外の編集を止めて理由を 1 行出します。上限未満なら止めません。使用量が測れないときは止めず、理由だけを注入計測の記録の「何を」の欄に残します。"
  plain-FR27: "開発 session の context が上限に達しておらず（測れないときを含む）、口座の使用率が session 用の閾値未満で、手を止めていて、まだ使っていない自分の退避物が残っておらず、作り直しが走っていないときだけ、管理 tick が打刻の合図を 1 行送ります。席の queue に続きがあれば、その続きの pointer を合図に載せます（FR43）。この条件が 1 つでも崩れていれば送りません。退避の合図は FR29 / FR38 の別の決まりです。"
  plain-FR28: "開発 session が退避を終えたら、二重に動かないよう排他を取ってから、作り直しと復元の command を送ります。退避物が無い session には送りません。"
  plain-FR29: "開発 session の context が rules の行に書いた上限以上に埋まっていて、まだ使っていない自分の退避物が無く、作り直しが走っていないときは、管理 tick は session が手を止めるのを待たずに「退避してください」の合図を 1 行送ります。使用量が測れないとき・退避物が残っているとき・作り直しが走っているときは送りません。"

  plain-FR35: "便の実装役が「口座の上限に当たった」の上限 record（上限に当たった印）で止まったら、器はそれを、どの口座のどの窓に当たったかが分かる印付きで記録します。作業場所（worktree）と便の記録は消さず、便を失敗にもしません。"
  plain-FR36: "どの口座を使うかは、manifest に書いた口座（退役中の口座はどちらの規則でも選びません。便にはさらに planner や管理席が使っている口座も選びません）と実測した残量から決めます。便は残りを使い切る側、planner や管理席の session は余裕を残す側、と規則が違います。規則の値は rules 行 R-C9-1 だけが持ち、user の裁定で有効になります。"
  plain-FR37: "上限で止まった便を再開するときは、器が別の口座を選び、同じ作業場所と同じ契約（回答済みの質問も添えて）で実装役を起こし直し、記録した段の続きから着地まで進めます。使える口座が無いときは失敗にせず、いちばん早く枠が戻る時刻まで待ちます。"
  plain-FR38: "開発 session の口座の窓（5 時間・7 日・モデル別 7 日）の使用率が session 用の閾値以上である間は、管理 tick は（退避物が残っている周や作り直しが走っている周を除き）手が止まるのを待たずに「退避してください」を送ります。退避して止まったら、器が別の口座で session を立て直し、復元の command を送ります。"
  plain-FR39: "触る file の列が、いま走っている便の列と重なる契約は、入口（intake）の時点で「どの file が誰と重なるか」を名指して断り、便を作りません。走っていた便が終わるか止められれば、同じ契約は通ります。"
  plain-FR40: "planner や管理席がどの役割かは、器が閉じた一覧の値として席ごとに記録します（鍵は役割と project（anchor）で、席の target・口座・起動の雛形も併せて fleet の記録に残します）。記録の無い席は何の権能も持ちません。1 つの project に planner は 1 席、管理席は 1 席です。"
  plain-FR41: "どの役割が何をしてよいかは manifest の行が持ちます（裁定 id 付き）。承認の記帳は対話面（R-C7-1）の役割の権能です。"
  plain-FR42: "席の会話の文脈が新しくなるたびに、器がその席の指示文（manifest の行と役割ごとの雛形から生成）を会話の文脈へ直接差し込みます（入力欄は使いません）。役割の記録が無い席には何も差し込みません。指示文は行が持つ権能をすべて名指し、雛形の外に手書きの規範文は置きません。"
  plain-FR43: "席がやること（席に向けた dispatch・席宛ての質問・裁定済みの次の行動）を抱えたまま止まっていたら、管理 tick が「続きを」を差し込みます。止まっていてよいのは、抱えている物が全部 user の承認（消す / 出す / 使う）か裁定の待ちであるときだけです。"
  plain-FR44: "planner と管理席のやり取りは、相手の入力欄に文字を置く形でなく、届いたことを記録で確かめられる経路で送ります。入力欄への差し込みは、器の tick・heartbeat・復元の合図にだけ使います。"
  plain-FR45: "権能で守られた操作は、その権能を持つ役割の席からしか通りません。検査は編集・実行の瞬間に行い、止めるときはどの役割の権能かを告げます。契約が印で開いた便では、その便の作業範囲に限って管理席の code 編集が通ります。"
  plain-FR46: "箱（封じ込め）や受付の枠が使えない host で便を起動しても、器は断りません。並列度を 1 に落として進み、落としたことと理由を記録に残します。"

  plain-FR47: "契約の正本は、tracked な設計 doc の契約表の 1 行だけです。行は少なくとも要件 id・実装する設計の節・write-set・検証を持ちます。"
  plain-FR48: "契約の行が閉じた型（enum の variant・rules 行・完了の値・event の種類）を変える（足す・消す・改名する）と宣言したら、器はその型を構造として持つ file を base から数え上げ、write-set に足りない file を名指して断ります。読めない周も通しません。"
  plain-FR49: "intake を通ったら、実装役を起こす前に審査役が契約とそれが実装する設計と要件を読んで判定します。判定は便の段として記録し、PASS でなければ実装役を起こしません。"
  plain-FR50: "着地したら、器が push し、その commit の CI の結果を commit id で確かめ、台帳の便を「着地した commit と CI の結果」の 1 行付きで close します。終端の各手は typed な event として記録します。CI が緑でなければ close せず失敗を記録します。台帳へ書くのはこれだけです。"
  plain-FR51: "台帳を読み取り専用の台帳 adapter で読み、解決できる設計 pointer（設計 doc の path と契約 id）を持たない open な契約と、設計の中身を持つのに設計 doc や research への pointer が無い open な memo を名指す lint を、doctor の項目として提供します。"
  plain-FR52: "設計 doc の文のうち規範の印を持つ文は、根拠の pointer を持ち、数 + 単位を持ちません。破った文は file と行で名指し、CI を非 0 で止めます。"
  plain-FR53: "intake に設計 pointer（設計 doc の path と契約 id）を添え、それが解決すると、器は記録した base の設計 doc からその行を読み、便の契約 file をその行から作ります。"
  plain-FR54: "設計 pointer が指す設計 doc・契約表の行・実装する設計の節のどれかが無いとき、または契約 file を直接渡したときは、器は断る理由（無いもの、または契約 file の直接の受け渡し）を名指して断り、便を作りません。"
  plain-FR55: "CI は tracked な設計 doc の契約表の全行に、intake と同じ write-set の閉包の検査と設計 pointer の解決を回し、違反する行を file と行で名指し、CI を非 0 で止めます。"
  plain-FR56: "席や実装役が撃つ Bash の command が、規則 file の行が持つ「禁じる語列」（撃ってはいけない語の並び）に当たるときは、器が実行の前に止め、どの rules 行のどの並びに当たったかを告げます。契約と対象 repo の宣言 file の検証行も受付の時点で同じ判定に掛け、当たる行は行番号付きで断って便を作りません。禁じる語列に当たらない command はこの規則では止めません。"
  plain-FR57: "host ごとに違う値（どの口座があるか・席に積む plugin の場所・起動引数）は、state dir の 1 つの file（host の面）だけが持ちます。器は tracked の manifest と同じ読み方・同じ断り方でこの file を読み、rules 行が在る・口座 label が両面で重なる・schema に無い項目が在る、のどれかなら行番号付きで断ります。file が無い host では宣言 0 として動き続け、在るのに読めない host では止まります。"
  plain-FR58: "口座を足すときは、器が state dir の下に口座の設定 dir を作り、席に要る設定だけを書き、host の面に宣言を 1 行足し、login 用の起動 command を渡します。login は user が行い、器は credential を読みも書きもしません。既存の dir や宣言済みの口座 label では断ります。退役では設定 dir を退役先へ動かし（消さない）、event を 1 件記録し、その口座は計測と選定の候補から外れます。復帰では設定 dir を元へ戻し、event を 1 件記録します。席の登録 row が持つ口座は退役できません。"
  plain-FR59: "器の subcommand で席を起こすときは、席の役割を必ず指定します。口座は指定してもよく、無ければ器が session 用の口座選定で選びます。起動行は器が組み（何を含めるかは決定記録が正本）、手書きの雛形は読みません。席の登録を先に書き、立て直しと同じ経路で窓の shell へ起動行を差し込みます。窓が無ければ作りますが、tmux の session は作りません。tmux の session が無い・入力欄に文字がある・口座の候補が無い・口座が退役中のときは断り、key を 1 つも送りません。"
  plain-FR60: "役割を持たない素の対話 session を、器の subcommand で起こせるようにします。口座を 1 つ指定すると、その口座の設定で claude を起動する 1 行を、席の起動と同じ導出で器が組みます（手書きの雛形は読みません）。cwd は anchor（省略時は今の repo）で、再開する session の id を渡せば同じ口座でその session を再開します。窓を指定すれば席の起動と同じ経路で差し込み、指定しなければ 1 行を表示するだけで自分では起動しません。席の登録は書かず権能もありません。口座が宣言に無い・退役中・設定 dir が無いときは typed に断り、key を 1 つも送りません。"
  plain-FR61: "他の project に入っている scribe2 が「どの版の本体・どの版の hook」で動いているかを、doctor の 1 項目として器が自分で測り、導入先（install 帳簿が指す repo と worktree、席の登録 row の anchor）ごとに 1 行ずつ出します。本体が自己申告する build 元 commit（測れなければ unknown）、plugin の読み込み元と hook 集合の digest、install 帳簿の記録、共有 cache の実体、scribe2 repo の HEAD を並べ、食い違いを none / binary / plugin / install の語で名指しし、推測で埋めません。更新は 1 つの口で、自分の checkout を上流の既定 branch へ前進だけで揃え（揃えられなければ typed に断る）、本体を build して呼ばれる場所へ入れ、その install を sha・時刻・host の記録に残します。"
  plain-FR62: "hook 集合（配線）が起動したときと違う席が在る間、管理 tick は退避の合図と同じ除外（退避物が在る周・cycle 中は注入しない）の下でその席に退避の合図を送り、退避して止まった後に立て直しと同じ経路で同じ窓・同じ口座で作り直します。復元のときに「どの版の hook と本体で動いているか（食い違いの語つき）」が 1 行見えます。"
  plain-FR63: "開発 session の画面の下に出る 1 行（statusline）を、器自身が描きます。payload（Claude Code が渡す JSON）だけから 1 行を組み、file も環境変数も読まず、他の command も起こしません。値が取れない部分は描かず、「0%」のような嘘の値は出しません。payload でない入力には空行を返し、claude を止めません。この行の先頭の形は、器の context 計測（FR25）がこの行を読むときの読み方とぴったり対になる 1 つの規則です。口座の登録（FR58）で作る口座の設定には「この 1 行は器の command で描く」と書き込まれ、すでに在る口座は器の口でその項目だけを書き換えます。doctor は口座ごと・導入先ごとに、描いているのが器か・別の物か・無いか・読めないかを 1 語で示します。"
  plain-FR64: "管理 tick を周期で撃つ tick の unit を、席ごとに器が組んで host に置き有効化する口と、撤去する口を器が持ちます。導入では、席の窓（target）・状態の置き場・作業記憶の置き場・器の本体（binary）・unit の置き場を全部 command の引数で受け取り、環境変数・home・器自身の置き場所は読みません。unit は 1 つの関数で組み、途中の状態の file を残さずに置きます。間隔は rules 行から取り、読めなければ既定値に倒さず断ります。同じ名前の file が器の生成物でなければ（誰が置いたかに依らず）上書きせずに断ります。置いた後は host の駆動機構に反映させて有効化します。撤去は無効化してから unit を退役 dir へ移すだけで、消しません。doctor は登録された席ごとに、unit が在って器の組む中身と同じか・違うか・無いか・読めないかを 1 語で示します。"
  plain-FR65: "user が planner の席で言ったこと（直命）は、器の event log に 1 件ずつ入れます。入れるときに器が時刻を打ち、言葉はそのまま保ち、「この発言はどの bead や決定記録を前提にしているか」の矢印と、有効・完了・撤回・失効の状態を添えます。復元のとき器は有効な直命を言葉のまま並べ、発令から rules 行の日数を超えたもの・前提の bead が閉じたもの・前提の決定記録が置き換わったものだけを「確認候補」として理由の語付きで印します。直命を閉じるときの記録には、結果（完了・撤回・失効）と裁定 id が必ず付きます。続けるかどうかは器が決めず、user が対話面で決めます。"
  plain-FR66: "器は hook を 4 つ持ちます。1 つ目は、復元の skill を呼んだ瞬間に復元の DATA を、退避の skill を呼んだ瞬間に現在地の DATA（anchor の先端・走っている便・席の状態・前回の退避から着地した便）を会話の文脈に注入します（AI が口を撃ち忘れることはできず、skill 自体は止めません）。2 つ目は session の始まりに退避物の状態を found（在る）/ missing（無い）/ unreadable（読めない）の 3 語のどれかで 1 行注入します（前の session の退避物だけが在る周は found、自分の退避物が 2 つ以上あって 1 つに決められない周は unreadable です。復元の DATA が出す退避物の状態の行とは別の 1 行です）。3 つ目は自動圧縮が来る直前に自分の退避物が無ければ現在地と持ち越し分だけの退避物を自動で書き、圧縮は止めません。4 つ目は session の終わり方（理由）を席の状態に打刻します。退避物が無いまま終わった session の数は doctor が席ごとに示します。"
  plain-FR67: "planner の席の指示文に、「user に向けて出す文の形」を矢印付きの行で載せます。形は、言い切りに信頼度を必ず付けることをいちばん上に置き、読み手本位の決まりをその下にまとめた 1 つの体系で、決まりの本文は設計 doc 1 本だけが持ち、指示文にも skill にも規則の表にも書きません。復元の brief の user 向けの面は、次の 1 手・成果・現在地・計画・危険、の 5 枠で組みます（組むのは復元の skill で、器は材料の DATA を出します）。planner の席でない席には適用しません。"

  # ---- FR: rationale（rationale_source の N-x に接地した「なぜ要る」）----
  rationale-FR1: "契約が書き切れることを求めるニーズ（N-4）から来ています。欠けた契約を後の段で見つけると QA の周回が始まるので、入口で全件まとめて断る方が安いからです。"
  rationale-FR2: "契約は小さく、しかし出どころは失わない、というニーズ（N-4）から来ています。要件 id と設計 doc を指していれば、契約を書き直すときも全部の bead が同じ形を保てます。"
  rationale-FR3: "記憶に頼らない、というニーズ（N-3）から来ています。process の中に状態を持つと、その process が死んだ瞬間に現在地が消えるからです。"
  rationale-FR4: "人の手が入らなくても安全に進む、というニーズ（N-1）から来ています。出発点と触ってよい範囲を先に記録しておけば、実装役を無人で走らせても後から検証できます。"
  rationale-FR5: "自律安全のニーズ（N-1）から来ています。画面のある席を建てると宛先解決や見張りの仕組みが要りますが、画面なしの 1 形なら process の起動と終了だけで完結します。"
  rationale-FR6: "記憶に頼らない、というニーズ（N-3）から来ています。「終わった」と言葉で申告させず、rc と commit の数という機械の事実で判定します。"
  rationale-FR7: "契約は小さく、検証は base で落ちる test で表す、というニーズ（N-4）から来ています。先に落ちない test は何も守っていないので、入口で機械が確かめます。"
  rationale-FR8: "自律安全のニーズ（N-1）から来ています。検証コマンドを実際に走らせた結果だけを信じ、実装役の自己申告を根拠にしません。"
  rationale-FR9: "自律安全のニーズ（N-1）から来ています。判定できなかった便を合格と呼ぶと、壊れたものが無人で着地します。"
  rationale-FR10: "自律安全のニーズ（N-1）から来ています。合格していない便や、出発点が main の祖先でない（main が巻き戻った・分岐した）便が main に載る経路を構造的に持たないためです。"
  rationale-FR11: "自律安全のニーズ（N-1）から来ています。main に載せた直後に検証を撃ち直すことで、「作業用の木では通ったが main では落ちる」を無人で検知します。"
  rationale-FR12: "自分で自分を作る、というニーズ（N-5）から来ています。着地ごとの判定を外から読める形で残しておけば、次の版がこの器を見張るときの材料になります。"
  rationale-FR13: "自律安全のニーズ（N-1）から来ています。無人で動くものは、いつでも 1 コマンドで止められる必要があります。"
  rationale-FR14: "記憶に頼らない、というニーズ（N-3）から来ています。途中で死んでも記録から続きを引けるなら、長い便を小さな process の列に分けられます。"
  rationale-FR15: "自律安全のニーズ（N-1）から来ています。取り消せない操作だけは人が決める、という線を守るために、機械は止まって記録し、勝手に待ち続けたり進んだりしません。"
  rationale-FR16: "自律安全のニーズ（N-1）から来ています。承認を会話の記憶ではなく逐語付きの記録として残せば、誰が何を許したかを後から確かめられます。"
  rationale-FR17: "規則の値は manifest に、というニーズ（N-3）から来ています。種類を型で閉じれば足し忘れを compile が止め、値を 1 file に置けば AI が場当たりで規則を生やせません。"
  rationale-FR18: "記憶に頼らない、というニーズ（N-3）から来ています。壊れた規則を黙って読み飛ばすと、規則が効いていないことに誰も気づかないからです。"
  rationale-FR19: "自分で自分を作る、というニーズ（N-5）から来ています。どの器がその repo に仕えるかを目印 1 つで決め、別の器や別の版と二重に動かないようにします。"
  rationale-FR20: "契約は小さく、というニーズ（N-4）から来ています。契約の外を触った変更は後の審査では見つけにくく、編集の時点で止めるのが最も安いからです。"
  rationale-FR21: "消費は害、というニーズ（N-2）から来ています。起動時に注入される文章の量を後から測れるように、記録の形だけ先に決めておきます。"
  rationale-FR22: "自律安全のニーズ（N-1）から来ています。「人手 0」を言葉で主張せず、記録を数えて示すためです。"
  rationale-FR24: "自分で自分を作る、というニーズ（N-5）から来ています。管轄外の repo を 1 byte も汚さないことが、別の器や別の版と同居できる条件だからです。"
  rationale-FR23: "記憶に頼らない、というニーズ（N-3）から来ています。開発 session が context を切り替えるときに作業状態を失わず、別 session の記憶を自分のものと取り違えないためです。機械層（file の生成・突合・消費）を器が持つのは、退避と復元の判断入力を席の記憶や散文に置かないためで、状況説明の文章だけを開発 session が器の DATA から組みます。"
  rationale-FR25: "記憶に頼らない、というニーズ（N-3）から来ています。開発 session が自分の残量を感覚で見積もると、退避が遅れて作業状態を失うからです。"
  rationale-FR26: "自律安全（N-1）と消費は害（N-2）のニーズから来ています。満杯まで走ると自動要約が起き、退避物の無いまま作り直されて作業状態が消えるからです。"
  rationale-FR27: "自律安全（N-1）と記憶に頼らない（N-3）のニーズから来ています。session の中の周期処理は session の作り直しで死に、死んだことを誰も検知しないからです。"
  rationale-FR28: "記憶に頼らない（N-3）と自律安全（N-1）のニーズから来ています。退避物が無いまま作り直すと作業状態が消え、二重に作り直すと退避物を取り合うからです。"
  rationale-FR29: "自律安全（N-1）と消費は害（N-2）のニーズから来ています。編集の手前の guard は編集の瞬間にしか効かず、読みや待ちが続く session は誰にも止められないまま満杯に達し、退避の前に作業状態が失われるからです。"
  plain-FR30: "便を運ぶのは pipeline です。席は project（anchor）ごとに 2 つで、計画役（planner）の席が 1 つ、便を流す係（管理席）が 1 つ。口座は便ごとに器が選びます（FR36）。係の席の仕事は「契約を pipeline に流す」「実装役の質問を計画役へ届ける」「着地の許可が出たら着地させる」の 3 つです。係の席が自分の手で実装してよいのは、pipeline が回せない便だけです。"
  rationale-FR30: "自律安全（N-1）と記憶に頼らない（N-3）のニーズから来ています。便を pipeline が運べば、人手なしで進む経路と判定の記録が 1 本に揃うからです。"
  plain-FR31: "実装役が「この契約では作れない」と判断したら、勝手に決めずに決まった形の合図（質問 record）を返して手を止めます。pipeline はそれを読んで便を「質問中」の段に倒し、質問の文面をそのまま記録し、回答が来るまで再開しません。"
  rationale-FR31: "記憶に頼らない（N-3）と自律安全（N-1）のニーズから来ています。契約の穴が失敗や黙った推測として消えず、質問の逐語が記録に残るからです。"
  plain-FR32: "計画役が回答を逐語のまま記録したうえで再開をかけると、同じ便がそこから続きます。質問と回答の文面は実装役への入力に添えられます。"
  rationale-FR32: "記憶に頼らない（N-3）と自律安全（N-1）のニーズから来ています。再開に要るものがすべて記録に在れば、別の process からでも同じ便を続けられるからです。"
  plain-FR33: "口座残量の計測を求められると、器は manifest に書かれた口座ごとに、5 時間・7 日・モデル別 7 日の残りと reset の時刻を口座の endpoint から 1 つのコマンドで読みます。読んだ値は「どの口座を・どこから・いつ読んだか」を添えて fleet の event log に残し、読めなかったときは理由を添えて「測れなかった」と残します（0 の値に読み替えません）。"
  plain-FR34: "着地を求められたとき、審査が合格していて、作業用 worktree に未 commit の変更が無く、main の先端が便の出発点（base）より進み、その出発点が main の祖先（枝分かれした位置）なら、作業用の branch を main の先端の上に積み直し（rebase＝main に追いつく・追随）、審査をやり直します。進んだ後の出発点と、ぶつかった（衝突）事実は記録に残します。ぶつかっても、規則の値が決める回数までは便を終わりにせず、その回数に達したら「失敗」で終わります。積み直した結果、便の変更がすでに main に入っていたときは、審査をやり直さずに記録して終わります。main 自体は動かしません。"
  rationale-FR33: "消費は害（N-2）と自律安全（N-1）のニーズから来ています。口座の残りが記録に無いと、口座を allowance 窓の終わりまで使い切る判断（憲法 C9.2）を器が持てず、余った枠を無駄にするか上限に当たって止まるかのどちらかになるためです。runner が受ける上限 record（ADR-0012）は便を止める合図であって残量の正本ではなく、残量の正本は本要件の実測値です。"
  rationale-FR34: "自律安全のニーズ（N-1）から来ています。便を並べて流すと、後から着地する便は main に置き去りにされます。追いつく手順を器が持たないと、合格した便が出発点のずれだけで着地できず、人が手で直す経路が生まれます。ぶつかったときの解き方は決定記録（ADR-0019）が正本です。"

  rationale-FR35: "自律安全のニーズ（N-1）から来ています。上限で止まった便を失敗に数えると、成果（worktree）を捨てて人が手で直す経路が生まれます。止まった事実を typed に残せば、別の口座で続きから再開できます（憲法 C9）。"
  rationale-FR36: "自律安全（N-1）と消費は害（N-2）から来ています。口座を人が選ぶと席が止まり、規則が散文に残ると drift します。1 本の純関数と rules 行に置けば、器が同じ規則で選び直せます（憲法 C9.2・C2・C1）。"
  rationale-FR37: "自律安全のニーズ（N-1）から来ています。再開のたびに契約や作業場所を作り直すと成果が失われます。同じ worktree と契約で続きから進める形なら、上限に当たっても成果が失われません。"
  rationale-FR38: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。planner や管理席が上限で止まると他の仕事が詰まります。context の cap guard（FR26）と同じ型を口座の残りにも持てば、詰まる前に退避できます。"
  rationale-FR39: "自律安全のニーズ（N-1）から来ています。並列の便が同じ file を触ると、着地で衝突して人が解く経路が生まれます。入口で断れば衝突は起きず、決定記録（ADR-0019）の設計と揃います。"
  rationale-FR40: "記憶に頼らない（N-3）から来ています。役割を窓の名前や環境変数の慣習で決めると、器は席の同一性を持てず、規律を守らせる相手を機械が特定できません（憲法 C3.3・C2.2）。"
  rationale-FR41: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。権能を rules 行に置けば、執行（FR45）も指示文（FR42）も同じ行を読めます（憲法 C1・C14・N2）。"
  rationale-FR42: "記憶に頼らない（N-3）から来ています。書かれた規律が席の文脈に届く経路が無いと、要件が在っても守られません。生成した指示文を器が差し込めば、届く経路が構造になります（憲法 C1.2・C14.2）。"
  rationale-FR43: "自律安全のニーズ（N-1）から来ています。やることが在るのに「指示があれば」と止まる席は、無人運転（FR22）を壊します。止まってよい条件を機械の判定にすれば、人の合図なしに続きます。"
  rationale-FR44: "記憶に頼らない（N-3）から来ています。入力欄への注入は、届いたかを描画で読むしかない経路です。経路の記録で確かめる形なら、席の状態を字面で判定しません（憲法 C3.3）。"
  rationale-FR45: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。権能が行に在っても、破る操作を止める点が無ければ規律は散文のままです。編集・実行の時点で止め、誰の権能かを告げる形が、規律を散文でなく構造に置きます（憲法 C16・C16.2）。"
  rationale-FR46: "自律安全（N-1）と消費は害（N-2）から来ています。資源の防御が無い host で便を断ると、便が 1 本も流れません。"

  rationale-FR47: "契約は小さく（N-4）と記憶に頼らない（N-3）から来ています。契約が設計 doc の散文・台帳の受入条件・契約 file の 3 段の写しになっていると、写しの各段で write-set の落ちや設計の混入が起き、正本がどれか分からなくなるからです。"
  rationale-FR48: "契約は小さく（N-4）と記憶に頼らない（N-3）から来ています。閉じた型に variant を足すと触る面は構造で決まるのに、それを人の記憶で write-set に写すと落ちが出るからです。"
  rationale-FR49: "消費は害（N-2）と自律安全（N-1）から来ています。契約側の穴を実装後の gate で初めて見つけると、実装役と審査役の消費を丸ごと捨てて再受付になるからです。実装前に席が手で審査役を回す運用は散文の規則になり、器の段でなければなりません。"
  rationale-FR50: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。push・CI の照合・台帳の close が席の手順のままだと、「着地したのに close されていない」「close したが CI が赤」のずれを目視に頼ることになるからです。"
  rationale-FR51: "記憶に頼らない（N-3）から来ています。設計の中身が台帳の memo にだけ在ると、tracked な設計 doc に無い設計が判定入力になり、pointer の欠落を機械が拒めなくなるからです。CI は private な台帳に届かないので、doctor が照合します。"
  rationale-FR52: "記憶に頼らない（N-3）から来ています。設計 doc の散文にだけ在る規則は規則ではなく、根拠の無い規範文が設計 doc に増えると、器の外の散文が判定入力になるからです。"

  rationale-FR53: "契約は小さく（N-4）と記憶に頼らない（N-3）から来ています。契約 file を席が手で写すと、写しの段で write-set の落ちや設計の混入が起きるからです。"
  rationale-FR54: "契約は小さく（N-4）から来ています。解決しない pointer や手書きの契約 file を通すと、正本の無い便が走るからです。"
  rationale-FR55: "記憶に頼らない（N-3）から来ています。intake の後に設計 doc の行が改訂されると、intake の検査だけでは閉包の不足が見えなくなるからです。"
  rationale-FR56: "人の手が入らなくても安全に進む（N-1）から来ています。許可を command の先頭語の粒度で与える形では、資源を枯渇させる検査や取り消せない操作が許可の内側に入ります。禁じる並びを規則の値として manifest に置き（N-3）、実行の前に機械が止めれば、散文の手順に頼らずに済むからです。"
  rationale-FR57: "記憶に頼らない（N-3）から来ています。口座の宣言が tracked の manifest と host の写しの 2 か所に割れると、rules 行が動くたびに写しを手で作り直す作業と、2 つの宣言のずれが生まれます。host の値を 1 file に置き同じ読み手で読めば、写しを作り直す手番が消え、人の手が入らなくても安全に進める（N-1）からです。"
  rationale-FR58: "人の手が入らなくても安全に進む（N-1）から来ています。口座の準備が手作業だと、link の張り間違いや設定の抜けで立て直しが落ち、原因が記録に残りません。器の口で揃え、退役を記録に残せば、記憶に頼らず（N-3）に口座の集合を正しく保てるからです。"
  rationale-FR59: "人の手が入らなくても安全に進む（N-1）から来ています。席の起動が別 repo の wrapper と前の器の launcher に乗っていると、器の視野の外の script に依存し、起動行の手書きが host 固有の値を散らします。器が導出して登録を先に書けば、記憶に頼らず（N-3）に席を立てられるからです。"
  rationale-FR60: "人の手が入らなくても安全に進む（N-1）から来ています。planner や admin が立たない不測の事態で人が入る入口が器の外の script にしか無いと、器の視野の外に依存します。起動行を器が導出すれば、手書きの雛形を散らさず（N-3）に素の session を立てられるからです。"
  rationale-FR61: "人の手が入らなくても安全に進む（N-1）から来ています。複数の project に入った scribe2 の本体と hook が黙って古くなると、guard の無い席が動き続けます。器が自分で測って名指しし、更新を 1 つの口で行えば、手順書を人が覚える形（N-3 の逆）にならないからです。"
  rationale-FR62: "人の手が入らなくても安全に進む（N-1）から来ています。hook 集合は session の起動時に固定され、画面を消すだけでは新しい hook が載りません。器がその食い違いを見つけて既存の退避と立て直しの経路で席を作り直せば、古い配線の席が残らないからです。本体だけが新しくなった席は次の hook から新しい本体が動くので、作り直しの対象にしません。"
  rationale-FR63: "規則の値は manifest に、現在地は永続面に置き、席の記憶や散文を判定入力にしない（N-3）から来ています。計測の入力である画面の 1 行の形が器の外で決まると、表示が変わるだけで計測が黙って「測れない」に落ちます。描く側と読む側を器の中の同じ 1 つの規則にすれば、人の手が入らなくても計測が安定する（N-1）からです。経緯と却下した案は ADR-0029 に在ります。"
  rationale-FR64: "人の手が入らなくても安全に進む（N-1）から来ています。tick の駆動が器の外で host ごとに書かれる形だと、導入先が増えるたびに手順が要り、間隔が rules 行でなく host の file に散ります（N-3 の逆）。器が席ごとに導出して書けば、間隔は rules 行 1 つで全席に効き、doctor が古い unit を名指せるからです。経緯と却下した案は ADR-0030 に在ります。"
  rationale-FR65: "記憶に頼らない（N-3）から来ています。user の発言が退避 file の逐語としてだけ運ばれると、いつ・どの前提で言われたか・まだ有効かを機械が持てず、古い直命が消えずに積み上がるか、AI が黙って落とすかのどちらかになります。器の記録に時刻と前提と状態を typed に持てば、失効の候補を機械が印し、人の手が入らなくても（N-1）直命の集合を正しく保てるからです。経緯と却下した案は ADR-0031 に在ります。"
  rationale-FR66: "人の手が入らなくても安全に進む（N-1）から来ています。復元と退避が AI の撃ち忘れに依存する形だと、作業状態を失う経路が構造に残り、自動要約が来た周は退避物 0 で作り直されます。skill の起動と要約の直前に器が hook で差し込み・自動退避すれば、記憶に頼らず（N-3）に session の切れ目を器が埋めるからです。経緯と却下した案は ADR-0031 に在ります。"
  rationale-FR67: "記憶に頼らない（N-3）から来ています。user に向けて出す文の形が user ごとの global の設定 file にだけ在ると、他の user や他の host の planner に届かず、prose だけの規則になります。設計 doc 1 本に置き、器が生成する指示文が pointer で運べば、どの host でも同じ形で届き、人の手が入らなくても（N-1）読める報告が保てるからです。経緯と却下した案は ADR-0032 に在ります。"

  # ---- NFR: plain ----
  plain-NFR1: "審査役 1 回に使う token は 0.15M 以内を目標にします。diff の大きさと上限の照合結果を判定に記録します。"
  plain-NFR2: "1 つの契約の変更は 300 行程度、見積は 550 行以内にします。PR の行数と契約の見積を記録して見比べます。"
  plain-NFR3: "実行時に使う外部 crate は 0 本で、標準ライブラリだけで build します。許可リストの外の依存は CI の検査が毎回落とします。"
  plain-NFR4: "不正な入力を黙って落とす件数は 0 です。記録が読めないときは rc 2 で止まります。壊した入力を実際に流して、全部が声を上げて止まることを確かめます。"
  plain-NFR5: "hook は binary 1 本を 1 回呼ぶだけで 2.0 秒以内に終わり、重い読み書きをしません。かかった時間は注入計測の記録に残します。"
  plain-NFR6: "器が起こす子 process は、すべて封じ込めの箱の中で走らせます（箱の外で走る子 process は 0 本）。変異検査を何本同時に走らせるかは、host 全体の受付の枠から決めます。便ごとに、封じ込めの有無・並列度・縮退の理由が記録に残ることを fixture で確かめます。"

