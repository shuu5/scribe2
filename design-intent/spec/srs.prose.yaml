# scribe2 SRS（MVP）— prose manifest（folio S4 generator の③「読みやすさの足場」）
#
# 機械 SSoT = srs.srs.yaml。 assemble-srs.sh が空で出した data-prose-slot に inject-prose.sh が
# HTML escape して注入する。 slot-id ↔ 散文の 1:1（集合一致を inject が fail-closed 検査）。
#   - plain        = その FR / NFR の ears.response / target を非エンジニア向けに言い換え（情報を落とさない）
#   - rationale    = rationale_source が指す upper_needs（N-x）に接地した「なぜ要る」
#   - chapter-lead = その章が何を・なぜ示すかの導入（章構成に接地）
#   - rtm-summary  = 派生数値（req=84 / need=5 / iso=0 / unv=0）の平易要約（data-derived と一致必須）
#   - cover-summary= goals 3 つ + title の 1 文約束
# 捏造 / 歪曲 / 脱落は fidelity ceiling（fidelity-srs）の検査対象。 値は単一行（tab / 改行禁止）。

slots:
  # ---- 表紙 ----
  cover-summary: "設計から契約・実装・検証・land までを、人の手番を 3 クラス承認だけに絞って 1 本通す器（MVP）の約束を定める文書です。人を待たせず、壊れたまま進まず、記憶に頼らない、の 3 つを守ります。"

  # ---- 章リード ----
  chapter-lead-01: "まず「これが起きたら失敗」を 3 つ先に決めます。人を待たせる・壊れたまま進む・記憶に頼る、の 3 つです。避けたい結果を共有してから要件を読むと、各要件が何を守るためのものか分かりやすくなります。"
  chapter-lead-02: "この文書が扱う範囲（intake から land まで・承認の停止と再開・規則の値と現在地・器の所属 marker と hook・到達点の計測・口座残量の計測と記録・追随・上限停止した便の別口座での再開・席の役割と権能・席の指示文の注入・封じ込めと並列の枠・契約表からの契約 file の生成・契約の審査・便の自動起動・妥協の起動・write-set の閉包・land の終端・台帳の lint・設計 doc の散文の門・契約表の検査・禁じる語列の command の拒否・host-guard・host の面・口座の登録・口座の退役・席の起動・導入先の同期・対話面の作法・管理 tick・heartbeat の停止）と、扱わない範囲（席の自律機能（管理 tick の外）・interpreter 経路の中身の解析（v3）・lane 計画と席の dashboard（v3）・台帳への write〔close と notes 1 行の外〕・複数の対話面（v3）・rtk / graphify の有効化と SQLite 化（Ask-first））をはっきりさせ、関わる人と process（開発者・開発 session・runner・lens・CI・台帳）を一覧にします。"
  chapter-lead-03: "各要件は思いつきではなく、5 つの上位ニーズ（自律安全・消費は害・記憶に頼らない・契約は小さく・自己開発）から来ています。この章はその出どころを示し、後の対応表で「どのニーズがどの機能になったか」を追えるようにします。"
  chapter-lead-04: "器が「いつ・何をするか」を 78 本の機能要件で一つずつ定めます。うち 13 本は器が持たないことを定める不在の要件です（不在の根拠は ADR-0045・管理 tick と打刻の合図と tick の unit を持つ根拠は ADR-0058）。契約の検査 → 便の永続 → runner の起動と完了判定 → flip check と gate → land と export → stop と resume → 承認の停止と再開 → rules manifest → marker と hook → 計測 → 廃止した作業記憶・context 計測・cap guard → 管理 tick→ 廃止した cycle・退避の合図 → 配送構造と質問の停止・再開 → 口座残量の計測 → 追随 → 上限停止の検知・口座選定・別口座での再開・群の逼迫の通知と移動 → intake の排他 → 席の登録・権能の所在・指示文の注入・席の継続・廃止した席間の連絡 → 権能の執行 → 縮退 → 契約の正本・write-set の閉包・契約の審査・land の終端・台帳の lint・設計 doc の散文の門・契約 file の生成・設計 pointer の拒否・契約表の検査 → 禁じる語列の command の拒否 → host の面・口座の登録と退役・席の起動 → 廃止した役割なしの起動・導入先の同期・廃止した hook 集合の食い違い・statusline → tick の unit → 廃止した直命の表・取得の強制 → 対話面の作法・便の自動起動 → 妥協の起動・廃止した強制サイクルと口座の食い違いの検出 → 口座の設定から呼ぶ見張り（host-guard）の 5 本（見張り自身の設定の編集の拒否・doctor の行・rm の不可逆削除の拒否・配線（host-guard の配線）・台帳の破壊と素 write の拒否）→ regate（裁定つきの 1 段戻し） → heartbeat の停止と管理 tick の健全、という主な並び（id 順）で、各行にはやさしい言い換えと「なぜ要る」の根拠を添えています。"
  chapter-lead-05: "「どれくらい速く・落ちず・安全か」を数字で約束します。lens の予算・契約の大きさ・依存の本数・黙って落とさない件数・hook の時間・host の資源の 6 点を、それぞれの測り方とセットで示します。"
  chapter-lead-06: "「MVP ができた」と言える条件を、後から確かめられる形で先に決めておきます。toy repo で 5 便、scribe2 自身で 1 便、偽の PASS が 0 件、別 process からの再開、承認の停止と再開、不正入力の loud な拒否、write-set の外の deny、質問で止まり回答で再開する便、口座残量の計測と記録、上限で止まった便の別口座での完走、実効の口座の除外と履歴、交差する契約の拒否、権能の外の記帳の deny、役割の外の編集の deny、席の指示文の drift 0、資源不足で断らないこと、契約表からの生成と拒否、審査を通らない便の runner 起動 0、land の終端が席の手順なしに通ること、台帳の pointer 欠落の名指し、散文の門の違反の名指し、契約表の検査の違反の名指し、禁じる語列の command の deny、host の面と口座の登録・退役、器の subcommand からの席の起動、導入先の同期の測定と 1 つの口の更新、dispatcher の自動起動、runner が死んだ便の起こし直し、妥協の起動と実効の口座、廃止した作業記憶と context の機構の不在、管理 tick の合図と backoff と打ち切り（cycle の不在を含む）、廃止した席の形の機構の不在、群の逼迫の通知と移動、見張り自身の設定の編集の拒否、doctor の host-guard の行、rm の不可逆削除の拒否と代わりの経路、配線（host-guard の配線）の足すだけの merge、台帳の破壊と素 write の拒否、regate の受付と段の条件による 1 回の制限、heartbeat の停止と管理 tick の健全、の 40 点です。"
  chapter-lead-07: "上位ニーズ・機能要件・受入基準が途切れなくつながっているかを 1 枚の表で見ます。出どころの無い要件や、確かめる手段の無い要件が残っていないかを確認する章です。"
  chapter-lead-08: "設計の前から決まっている制約を並べます。憲法が上位にあること、repo が PUBLIC であること、test は Rust だけ、前の器の作法を持ち込まない、不可逆操作の口を持たない、headless の制約、の 6 点です。"
  chapter-lead-09: "本文に出てくる専門語（契約・runner・lens・gate・land・fleet・event log・hook・worktree など 79 語）を、やさしい言い換えと定義で並べます。本文中の専門語には同じ言い換えを併記しています。"

  # ---- FR: plain（やさしい言い換え・情報を落とさない）----
  plain-FR1: "契約の file に必須の項目（何が必須かは生成の型が持ちます）が欠けていたり、verify が複数行だったり、write-set が空だったら、問題を全部まとめて行番号付きで断り、便は作りません。"
  plain-FR2: "契約には「どの要件のためか」（SRS の要件 id）と「どの設計から来たか」（設計 doc）を必ず書きます。設計 1 本から契約が何本も出る、という形を崩しません。対象は本 SRS を根拠に起票する契約で、v1 由来の既存 bead は対象外です。"
  plain-FR3: "各段は自分の記憶ではなく、追記だけの記録（event log）を最初から読み直して現在地を知り、終わるときに記録を 1 行足します。process の中に状態を抱えません。"
  plain-FR4: "便が「受け付け済み」の段にあって起動を頼まれたら、出発点（base）を記録し、作業用の worktree を切り、触ってよい file の列を書き出してから、実装役（runner）を画面なしで起動します。"
  plain-FR5: "実装役（runner）も審査役（lens）も、同じ 1 つの形で呼びます。画面なしの claude -p に、契約や diff を入力で渡し、答えは構造化した 1 行で受け取り、許可の設定は毎回明示し、口座は環境変数で切り替えます。"
  plain-FR6: "実装役が終わったとき、正常終了（rc 0）で、出発点から commit が 1 件以上あれば「実装済み」、そうでなければ「失敗」と記録します。"
  plain-FR7: "変更した Rust の file ごとに、test の差分だけを出発点（base）に当てて「先に落ちる」こと、そして変更後（HEAD）では通ることを機械で確かめます。文書だけの変更（docs-only）を除き、test の差分が無い変更は受け付けません。"
  plain-FR8: "審査（gate）を頼まれたら、契約に書いた検証コマンドを 1 行ずつ作業用 worktree で実際に走らせ、行ごとの結果を記録します。1 本でも失敗すれば FAIL です。"
  plain-FR9: "審査役が要るのに居ない、diff が予算を超える、答えが読めない、答えが 3 値（PASS / FAIL / INCONCLUSIVE）の外、のどれかなら、合格（PASS）とは言わず「判定できなかった（INCONCLUSIVE）」にします。ただし審査役は居るのに答えの形が読めなかったときだけは、同じ審査（gate）の中で審査役を 1 回だけ撃ち直し、それでも読めなければ「判定できなかった」にします（読めたうえで規則が断ったときは、審査役を撃ち直しません）。"
  plain-FR10: "審査が合格でないとき、または main の先端が記録した出発点（base）とずれていて追いつけない（出発点が main の祖先でない、または作業用 worktree に未 commit の変更がある）ときは、着地（land）は何もしません。main も記録も変えません。"
  plain-FR11: "審査が合格で前提が揃ったら、作業用 worktree の中身を 1 つの commit にまとめて main に載せ（中身が同一であることと、他の変更と競合しないことを確かめて）、main の上で検証を撃ち直します。落ちたら「失敗」と記録して止まります。"
  plain-FR12: "着地が成立したら、判定の結果を版番号付きの 1 行として verdicts.jsonl に追記し、「着地済み」と記録します。次の版の器がこの記録を読めるようにするためです。"
  plain-FR13: "stop --all は、動いている実装役をすべて止める 1 つのコマンドです。何度撃っても同じ結果になり、結果は 0（全部止まった、または止める対象なし）・1（止められないものが残った）・2（記録が読めない）の 3 値で返します。便 1 本を名指して止める形もあり、まだ終わっていないその便だけを止めて「止めた」と記録します。止め切れなかったときは記録せず 1 を、もう終わっている便には記録を増やさず 1 を返します。gate の結果（verdict）を読めない Gated の便は、もう終わっているかを決められないので、止めずに 2 を返して断ります。停止の権能は manifest の行 role.orchestrator が持ち（FR41）、行が許すのは便 1 本を名指す形だけで、stop --all は許しません。"
  plain-FR14: "別の process から「続きを」と頼まれたら、記録の現在地から続きの段だけを進め、着地まで到達できます。"
  plain-FR15: "契約が「消す・出す・使う」のどれかを名乗る段に来たら、承認を求める記録（approval.requested）を残して「保留」で止まり、人の入力を待たずに process を終えます。"
  plain-FR16: "人が承認（approve）を逐語付きで与えたら、それを記録（approval.received）し、次の再開（resume）で先へ進めます（承認の記帳は便の自動起動の契機です・FR68）。"
  plain-FR17: "規則の「種類」は Rust の閉じた enum と網羅 match で持ち（足し忘れは compile が止める）、規則の「値」は repo に置いた manifest 1 file から起動時に読みます。"
  plain-FR18: "manifest に知らない種類・重複した id・型の合わない値・user 由来なのに裁定 id が無い行があれば、起動する前に問題を全部まとめて行番号付きで断ります。黙って読み飛ばしません。"
  plain-FR19: "repo root の目印（.vessel）が「自分の名前」を言っている間は、hook は起動時に名乗りを出します。"
  plain-FR20: "契約で触ってよいとした file の外を編集しようとしたら、その編集の時点で止めます。許可リストが読めないときも、通すのではなく止めます。"
  plain-FR21: "hook は自分が出した 1 行について、誰が・何を・いつ・何 byte・何 token・かかった時間、の形で記録を残します。あとで計測の仕組みを足すときに、経路を作り直さなくて済むようにするためです。"
  plain-FR22: "到達点を測るときは、人が関わった記録を数え、承認以外が 0 件であることを機械で示します。"
  plain-FR24: "repo root に目印（.vessel）が無いか、別の名前が書いてある repo では、hook の入口は何も出さず正常終了（rc 0）で黙り、その repo に 1 byte も書きません。黙るのはこの入口だけで、口座の設定から呼ばれる見張り（host-guard）は目印の有無や repo の位置に関わらず判定します。"
  plain-FR23: "器は開発 session の作業記憶を退避・復元・消費する口と、退避物の置き場を持ちません（FR42 の「圧縮の直前の 1 枠」は退避物に当たりません）。文脈の圧縮は session 側の機構（Claude Code の /compact）に任せ、session をまたぐ記憶は台帳が持ちます。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR25: "器は開発 session の context の使用量を測る口を持ちません。残量は開発 session が /compact で自分で扱います。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR26: "器は context の使用量で編集を止める段（cap guard）も、その上限の rules 行も持ちません。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR27: "器は、開発 session（orchestrator の席）が黙っていないかを周期で見に行き、登録（FR40）があり、状態の打刻（席の hook が残す 1 行）の最終行が「待っている（idle）」で、入力欄が空いている席にだけ、台帳の現在地から続きを進めるよう促す 1 行（打刻の合図。この合図を heartbeat と呼び、席ごとに止める口と tick が最後に周った記録は FR78・ADR-0070）を差し込みます（ADR-0058）。送るのは、席が最後の打刻から黙りの閾値（黙りの初段・既定 30 分）以上黙っていて、最後の合図から今の段の待ちが経ち、口座の門（かたまり〔群〕の逼迫の閾値〔FR38〕以上の口座の席には送りません。計測〔FR33〕が残した記録の最新値を読むだけで測り直さず、記録が無い・古いときは通します）を通ったときだけです。条件の並びと順は ADR-0058 が正本です。席に変化が無ければ次の合図までの間隔を梯子の列（rules 行が持つ待ちの列・既定は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間）の順で伸ばし（backoff）、梯子の列が尽きたら送りません（合図は梯子の列の長さの本数・既定 6 本）。席の状態の打刻の最終行の時刻（変化の digest）が動けば、間隔は梯子の列の先頭に戻ります（比べる基準は、合図の後に席が待ちに戻ったときの値です）。周期・黙りの初段・梯子の列の 3 つは rules 行が持ちます（user 裁定 id つき）。係数（倍率）と上限の行はありません。最後に送った時刻・何本目か・比べる基準の値は席の置き場の file 1 つに残し、読めない・書けないときは送らず、理由を判定の行に出します。かたまり（群）に属する席の tick は、かたまりごとに鮮度の窓に 1 回まで、host の lockの内側でかたまりの移動の判定（FR38）を撃ち、その周だけ計測（FR33）を起こしてよいことにします。判定の周の外ではかたまりの逼迫を測りません（ADR-0066）。登録（FR40）があり、再起動や退避で窓が shell に戻った席は、黙りと変化の判定を経ずに口座（かたまりならかたまりのいま使う口座・かたまりの外なら登録の口座）を決め、席の起動（FR59）で起こし直します（FR28）。便を起こす契機は FR68 が持ちます。"
  plain-FR28: "器は退避の後に session を作り直して復元の command を差し込む cycle を持ちません。席を立て直すのは、user が席の起動（FR59）を撃つか、管理 tick（FR27）が登録のある席の窓が shell に戻っているのを見て起こし直す（直前の会話 id を渡します・ADR-0067）かの 2 つで、周期で作り直す cycle とは違います。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR29: "器は context の使用量を理由に「退避してください」を送りません。無いことは test が確かめます（廃止の決定は ADR-0045）。"

  plain-FR35: "便の実装役が「口座の上限に当たった」の上限 record（上限に当たった印）で止まったら、器はそれを、どの口座のどの窓に当たったかが分かる印付きで記録します。作業場所（worktree）と便の記録は消さず、便を失敗にもしません。"
  plain-FR36: "どの口座を使うかは、manifest に書いた口座（退役中の口座はどちらの規則でも選びません。便にはさらに orchestrator の席が使っている口座と、host が役割ごとに決めた口座〔役割の口座〕と、その役割がいま使っている口座〔実効の口座〕と、かたまり（群）がいま使っている口座〔FR38。かたまりの候補の他の口座は外しません〕も選びません。外すのは次に選ぶときからで、まだ終わっていない便は止めません）と実測した残量から決めます。便は 7 日窓の reset が早い口座から使い切る側、orchestrator の席の session は（席が登録している口座は除かずに〔席は 1 役割で、同じ口座に揃います・FR59〕）いちばん余裕のある口座を選んで余裕を残す側、と規則が違います。規則の値は session 用の閾値の rules 行（R-C9-1 とその窓別の行）だけが持ち、user の裁定で有効になります。"
  plain-FR37: "上限で止まった便、または実装役が走っている段（Spawned）の便を再開するときは、器がまず実装役の process が生きているか確かめ（生きていれば断り、実装役を 2 つにしません）、口座を選び（上限で止まった便は別の口座）、同じ作業場所と同じ契約（回答済みの質問と、前の実装役が残した未 commit の変更の一覧も添えて）で実装役を起こし直し、記録した段の続きから着地まで進めます。使える口座が無いときは失敗にせず、いちばん早く枠が戻る時刻まで待ちます。この再開は通常の resume（FR14）より優先されます。"
  plain-FR38: "器は、かたまり（群）の口座の使用率（残りの裏返し）を測るための常駐の timer を持ちません。作業（便）が 1 つ終わった直後の 1 周と、席が話す番のたびに動く仕組み（hook）と、席を周期で見回る管理 tick（FR27）の 3 つで、かたまりのいま使う口座と席が実際に居る口座の使用率を、計測（FR33）が残した値からいつ測ったかの鮮度つきで、3 つの窓（5 時間・7 日・モデル別）で読みます。使用率が閾値（rules 行 3 本・user 裁定）以上になっていれば、1 周はそのかたまりの席の画面に 1 行で知らせて記録に残し（同じ実測には 2 度知らせません）、席の仕組みは指示文の 1 行で告げて「そろそろ移して」の記録（移動を頼む記録）を host の根にかたまりごと 1 件だけ置きます。移るときは、1 周か管理 tick が host の lockの内側でかたまり単位に 1 回だけ移り先（いま使う口座でなく、他のかたまりが使っておらず、退役中でなく、新しい計測があり 3 つの窓とも閾値未満の候補〔計測が古い候補は 1 回測ります〕を、残りの量の並べ方（残量の鍵）「7 日の窓とその席の役割の model の 7 日の窓の残りの少ない方が多い順 → 7 日の窓の reset が早い順 → 宣言の順」で並べ〔席の model の行が無い口座は最後・5 時間の窓は条件にだけ使います〕、かたまりを宣言の順に見て、どのかたまりも使っておらず前のかたまりの予約でもない先頭をそのかたまりの予約〔次に移る口座〕にします。予約は file に残さず毎周計算し直し、他のかたまりの移動と予約は避けますが、作業〔便〕の起動は避けません。宣言に並べた候補は集合で、順は同点のときだけ効きます。まだ終わっていない作業が使っている口座も候補に入ります・ADR-0069）を決め、いま使う口座の記録（前の記録は消さずに履歴の側へ戻せる形で動かします）と承認の記録を書き、古い席に退避の合図（作業を区切って終える合図）を送ってから、新しい口座で席を起こし直します（判定は 1 本で、tick はかたまりごとに鮮度の窓に 1 回までしか撃たず、その周だけ計測してよいことにします・ADR-0066。席を起こし直すのは席の起動（FR59）で、その席の状態の打刻に残った会話 id を渡して直前の会話の続きから再開します。対話の記録の file を複写することはしません・ADR-0067）。移り先が無ければ移らず、人に知らせます。余裕の無い口座へ妥協して移すこともしません。かたまりの逼迫を測るための常駐の process と、cycle・強制サイクルの印は持たず、1 周を timer で撃つこともしません（ADR-0045 / ADR-0049 / ADR-0055 / ADR-0066）。管理 tick（FR27）の timer（FR64）は判定の周の外ではかたまりの逼迫を測らず計測も起こさず、tick の口座の門（FR27）は計測（FR33）の記録の最新値を読むだけです（ADR-0058）。かたまりの名前は Tier1・Tier2 のように Tier<数字> に限り（数字は重複しません）、宣言の順が数字の小さい順でなければ host の設定の読みの時点で断ります（優先は宣言の順 = 数字の小さい順です）。doctor のかたまりの行には next=（残量の鍵で導いた予約。無ければ none）が出て、移り先の判定と doctor は同じ 1 本の関数を使います（ADR-0069）。"
  plain-FR39: "触る file の列が、いま走っている便の列と重なる契約は、入口（intake）の時点で「どの file が誰と重なるか」を名指して断り、便を作りません。走っていた便が終わるか止められれば、同じ契約は通ります。断る理由の一覧と「まだ終わっていない便」の数え方は、同時走行の最大値の断り（FR68）と同じものを使います。"
  plain-FR40: "席の役割は orchestrator の 1 つだけで、器がそれを閉じた一覧の値として席ごとに記録します（鍵は役割と project（anchor）で、席の target・口座（席の起動（FR59）が決めた口座の写し）・起動の雛形も併せて fleet の記録に残します）。記録の無い席は何の権能も持ちません。1 つの project に orchestrator は 1 席です。"
  plain-FR41: "どの役割が何をしてよいかは manifest の行 role.orchestrator が持ちます（裁定 id 付き）。承認の記帳は rules 行 R-C7-1（対話面の identity）が名指す orchestrator の席の権能です。便を起こす・着地させる・merge するのは行に無く、器の dispatcher だけが行います（FR68）。席の本体 code（src）の編集も行に無く、落ちる test（tests/）の編集だけを行が許します。"
  plain-FR42: "契機は 2 つあります。席の session が始まるとき（/compact の後も含む）と、圧縮が始まる直前です。session が始まるたびに、器がその席の短い指示文（manifest の行と役割ごとの雛形から生成）を会話の文脈へ差し込みます（入力欄は使いません）。中身は、席が誰か・憲法のうち効く部分への pointer・役割の特性・台帳の現在地の 4 群で、行の構成と行数の上限は ADR-0045 が正本です。役割の記録が無い席には何も差し込まず、実装役には憲法の文章を 1 行も渡しません。指示文は行が持つ権能をすべて名指し、憲法の C 条文の規範文を持たず、雛形の外に手書きの規範文は置きません。役割の記録が在る席では、同じ session の開始で、指示文の後ろに、台帳と git から機械で導いた直近の流れの事実行（仕掛かり中の契約・直近に更新された契約・直近の commit・未 commit の変更）を出します。これは規範文を持たず、指示文の行数にも数えません。圧縮の後の開始で「圧縮の直前の 1 枠」が在れば、その 1 枠を 1 回だけ出して消します。圧縮（/compact と自動圧縮）が始まる直前には、器が役割の記録が在る席の直前の発言を逐語で「圧縮の直前の 1 枠」に書きます（役割の記録が無い席では書きません）。置き場は state dir の席ごとの置き場で、repo の外です。1 枠を書く処理は圧縮を止めません（書けないときも止めません）。"
  plain-FR43: "器は席の queue（続きの pointer の並び）を持ちません（ADR-0045）。席の次の仕事は台帳が持ち、管理 tick（FR27）が台帳の現在地から「続きを」と促す 1 行を差し込みます（ADR-0058）。合図が 24 時間で打ち切られた後は、続きは user が対話面で促します。"
  plain-FR44: "1 つの project に席は orchestrator の 1 席だけなので、席どうしの連絡の経路を器は持ちません（ADR-0045・ADR-0058）。器が席の入力欄に差し込むのは、席の起動の 1 行（FR59）・管理 tick の打刻の合図（FR27）・かたまりの逼迫の通知と退避の合図（FR38）だけで、席に続きを促す差し込みは打刻の合図だけです。経路が無いことは test が確かめます。"
  plain-FR45: "権能で守られた操作は、その権能を持つ役割の席からしか通りません。検査は編集・実行の瞬間に行い、止めるときは足りない権能と、権能を持つ rules 行の id を告げます。席の本体 code（src）の編集は、契約が印で開いた便の作業範囲に限って通ります。"
  plain-FR46: "箱（封じ込め）や並列の枠が使えない host で便を起動しても、器は断りません。並列度を 1 に落として進み、落としたことと理由を記録に残します。"

  plain-FR47: "契約の正本は、tracked な設計 doc の契約表の 1 行だけです。行は少なくとも要件 id・実装する設計の節・write-set・検証を持ちます。"
  plain-FR48: "契約の行が閉じた型（enum の variant・rules 行・完了の値・event の種類）を変える（足す・消す・改名する）と宣言したら、器はその型を構造として持つ file を base から数え上げ、write-set に足りない file を名指して断ります。読めない周も通しません。"
  plain-FR49: "便が受付（intake）を通り、設計 doc の契約表の行から契約の file が作られた直後に、器が審査役へ契約とそれが実装する設計と要件を読ませて判定を採ります。判定は契約の中身（sha）付きで、審査役に渡した設計の節の本文の写しといっしょに便の記録に残し、合格でない便は実装役を起こさず Reviewed の段で FAIL として終わります。契約の中身が同じかどうかは、契約の字と、便の記録に残した設計の節の本文の写しの両方で決めます（写しを持たない便は契約の字だけで決めます）。同じ中身で審査 FAIL の便が在る契約が列に入らないことは FR68 が決めています。"
  plain-FR50: "着地したら、器が push し、その commit の CI の結果を commit id で確かめ、台帳の便を「着地した commit と CI の結果」の 1 行付きで close します。終端の各手は typed な event として記録します。CI が緑でなければ close せず失敗を記録します。台帳へ書くのはこれだけです。"
  plain-FR51: "台帳を読み取り専用の台帳 adapter で読み、解決できる設計 pointer（設計 doc の path と契約 id）を持たない open な契約と、設計の中身を持つのに設計 doc や research への pointer が無い open な memo を名指す lint を、doctor の項目として提供します。"
  plain-FR52: "設計 doc の文のうち規範の印を持つ文は、根拠の pointer を持ち、数 + 単位を持ちません。破った文は file と行で名指し、CI を非 0 で止めます。"
  plain-FR53: "intake に設計 pointer（設計 doc の path と契約 id）を添え、それが解決すると、器は記録した base の設計 doc からその行を読み、便の契約 file をその行から作ります。"
  plain-FR54: "設計 pointer が指す設計 doc・契約表の行・実装する設計の節のどれかが無いとき、または契約 file を直接渡したときは、器は断る理由（無いもの、または契約 file の直接の受け渡し）を名指して断り、便を作りません。"
  plain-FR55: "CI は tracked な設計 doc の契約表の全行に、intake と同じ write-set の閉包の検査と設計 pointer の解決を回し、違反する行を file と行で名指し、CI を非 0 で止めます。"
  plain-FR56: "口座の設定を読む session（人と話す席と、口座の設定 dir を指定して起こした session。器を積まない素の session でも同じで、既定の設定 dir だけを読む起動は含みません）や実装役（runner）が撃つ Bash の command が、規則 file の行が持つ「禁じる語列」（撃ってはいけない語の並び。口座の設定から呼ばれる見張りが読むのは有効な行だけ）に当たるときは、器が実行の前に止め、どの rules 行のどの並びに当たったかを告げます。口座の設定を読む session には口座の設定から呼ばれる見張り（host-guard）が掛かり、器の plugin を積む席と実装役には器の plugin の command guard（禁じる語列の見張り）も掛かり、審査役（lens）には掛かりません。渡された中身が読めないときも見張りは止めます。契約と対象 repo の宣言 file の検証行も受付の時点で同じ判定に掛け、当たる行は行番号付きで断って便を作りません。禁じる語列に当たらない command はこの規則では止めません。"
  plain-FR57: "host ごとに違う値（どの口座があるか・席に積む plugin の場所・起動引数）は、state dir の 1 つの file（host の面）だけが持ちます。器は tracked の manifest と同じ読み方・同じ断り方でこの file を読み、rules 行が在る・口座 label が両面で重なる・schema に無い項目が在る、のどれかなら行番号付きで断ります。file が無い host では宣言 0 として動き続け、在るのに読めない host では止まります。"
  plain-FR58: "口座を足すときは、器が state dir の下に口座の設定 dir を作り、席に要る設定だけを書き、host の面に宣言を 1 行足し、login 用の起動 command を渡します。login は user が行い、器は credential を読みも書きもしません。既存の dir や宣言済みの口座 label では断ります。退役では設定 dir を退役先へ動かし（消さない）、event を 1 件記録し、その口座は計測と選定の候補から外れます。復帰では設定 dir を元へ戻し、event を 1 件記録します。席の登録 row が持つ口座は退役できません。"
  plain-FR59: "器の subcommand で席を起こすとき（かたまりの移動（FR38）や管理 tick（FR27）が席を起こし直すときも同じ）は、席の役割（orchestrator）を必ず指定します。口座は、置き場がかたまり（群）に属するときはそのかたまりのいま使う口座（書き換えるのはかたまりの移動（FR38）だけです・ADR-0049）にします（このとき指定した口座がそれと違えば断ります）。かたまりに属さないときは、指定した口座か session 用の口座選定で決めます（閾値未満の候補が無いときは妥協の起動・FR69）。起動行は器が組み（何を含めるかは決定記録が正本）、手書きの雛形は読みません。席を起こし直すときは、その席の状態の打刻に残った会話 id を起動行で渡して会話の続きから再開します（会話 id の形でなければ渡しません・対話の記録の file の複写はしません・渡し方は ADR-0067 が正本）。席の登録を先に書き、窓の shell へ起動行を差し込みます。窓が無ければ作りますが、tmux の session は作りません。tmux の session が無い・入力欄に文字がある・妥協の起動（FR69）でも断るとき・口座が退役中・指定した口座がそのかたまりのいま使う口座と違うときは断り、key を 1 つも送りません。"
  plain-FR60: "器は役割を持たない素の対話 session を起こす口を持ちません。席の起動は役割を必ず指定します（FR59）。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR61: "他の project に入っている scribe2 が「どの版の本体・どの版の hook」で動いているかを、doctor の 1 項目として器が自分で測り、導入先（install 帳簿が指す repo と worktree、席の登録 row の anchor）ごとに 1 行ずつ出します。本体が自己申告する build 元 commit（測れなければ unknown）、plugin の読み込み元と hook 集合の digest、install 帳簿の記録、共有 cache の実体、scribe2 repo の HEAD を並べ、食い違いを none / binary / plugin / install の語で名指しし、推測で埋めません。更新は 1 つの口で、自分の checkout を上流の既定 branch へ前進だけで揃え（揃えられなければ typed に断る）、本体を build して呼ばれる場所へ入れ、その install を sha・時刻・host の記録に残します。"
  plain-FR62: "器は hook の配線の食い違いを理由に席へ「退避してください」を送らず、席を作り直しません。食い違いそのものは導入先の同期（FR61）が doctor の行で名指します。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR63: "器は開発 session の画面の下の 1 行（statusline）を描く口を持たず、口座の設定に描画 command を書きません。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR64: "器は、管理 tick（FR27）を周期で撃つ host の登録（systemd user の service と timer）を、登録（FR40）のある席ごとに組んで host の駆動機構に置いて有効にする口と、退役の場所へ移して撤去する口を持ちます。登録の本文は器が名前・target・置き場・binary・周期の rules 行から 1 つの関数で組み、repo には入れず、器が作ったのでない file は上書きも移動もせず、有効にすることと撤去は 3 クラス（人に聞く操作）に当たりません（形は ADR-0030 と同じ・ADR-0058）。健康診断（doctor）は席ごとに登録の有無と一致を 1 行で言います。"
  plain-FR65: "器は user の発言（直命）を記録に持たず、復元の DATA も出しません。user の言葉そのままが載るのは承認の記録（FR16）だけで、裁定は台帳の notes が持ちます。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR66: "器は復元・退避の skill に反応する hook、退避物の状態を知らせる hook、自動圧縮の直前に AI が書く散文の退避物を書く hook、session の終わり方を打刻する hook を持たず、skill も持ちません。器が session の開始と圧縮の直前に持つ口は FR42 の 2 つ（指示文と事実行の注入・圧縮の直前の 1 枠）だけです。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR67: "orchestrator の席の指示文に、「user に向けて出す文の形」を出所を指す 1 行（pointer 付き）で載せます。形は、言い切りに信頼度を必ず付けることをいちばん上に置く 1 つの体系で、決まりの本文は設計 doc 1 本だけが持ち、指示文にも規則の表にも書きません。席でない process（実装役・審査役）には適用しません。"
  plain-FR68: "便を起こすのは器の dispatcher です。便が終わったとき（着地・失敗・停止）、便を運ぶ器の process が退役したとき、手動で 1 周を頼まれたとき、介入の印を記録した直後、回答 event（FR32）か approval.received（FR16）を記帳した直後に、台帳の open な契約のうち依存が終わり・設計 pointer が解け・memo でなく・同じ中身で終端に達した便（審査 FAIL の便を含む）が無い契約の並び（起動の列）を、orchestrator の介入 first → 契約の優先度（priority） → 起票順の順に見て、まだ終わっていない便と触る file が重ならず・受付（契約を便にする前の検査の段。触る file の余地・host の memory の枠・同時走行の最大値）を通る契約を、席の操作なしに条件を満たす本数だけ起こします。起こし方はふつうの便の起動（受付 → 審査 → 実装役の起動）をそのまま通る形で、起動の前に待つ段はありません。契機が重なっても同じ契約を二重には起こしません。同時に走らせる本数には最大値が 1 つあり（同時走行の最大値。値は規則の表の 1 行が持ち、user の裁定で決めます）、受付がまだ終わっていない便を数えて最大値に達している周は起こさず、その契約は理由を付けて列に残します。本数を絞るのは受付の host の memory の枠とこの最大値です。同じ周で起こした便の file は次の候補の重なりに数え、起こせない契約は「まだ出ていない理由」（依存・重なり〔Overlap〕・受付・同時走行の最大値・終端に達した便〔審査 FAIL を含む〕・hold）を決まった型で持って列に残し、hold の契約は起こさず release で戻します。終端に達した便が起動の列から外した契約も、release の印 1 つにつき 1 回だけ起動の列へ戻します（着地済みの便の契約は戻さず、審査 FAIL の便の契約は中身が変わるまで戻しません・FR49）。介入は起動の列の記録に残します。便を運ぶ器の process が退役した便は、同じ周で器が再開（FR37）を 1 回起こします（便を運ぶ器の process が残す所有者の印を持たない、まだ終わっていない便は起こし直しません）。所有者の印を持たなくても再開（FR14）を 1 回起こす便は、次の 5 種だけです: 回答が記帳された質問中（Questioned）の便（FR32 の回答を添えます）、承認が記帳された承認待ち（Blocked）の便（FR16 の承認を添えます）、gate の結果（verdict）が合格（PASS）の Gated の便（gate がもう一度頼まれて PASS が記録された便を含みます・FR8）、regate（FR77。gate の結果が不合格（FAIL）の便を裁定の言葉つきで Implemented〔実装が済んで gate を待つ段〕へ 1 段戻す器の口）で Gated から Implemented へ戻され、その後 gate を通っていない便（所有者の印が無いか、印の process が退役した便。印の process が退役した便の再開はこの 4 種目の再開（FR14）の 1 回に寄せ、退役した便の再開（FR37）と同じ周で重なっても、同じ便を二重には起こしません。regate の記帳も追随の記帳も持たない Implemented の便は起こし直しません）、追随（main に追いつくこと）でいちばん新しい gate の後に Implemented へ戻され、その後 gate を通っていない便（所有者の印が無いか、印の process が退役した便。regate の種目と同じ周に重なっても同じ便を二重には起こさず、退役した便の再開〔FR37〕は Implemented の便には当たらないので重なりません）。gate の結果が合格でない Gated の便と、gate の結果を読めない Gated の便は起こしません。gate の結果が合格の Gated の便と regate で戻された便と追随で戻された便は専用の契機を持たず、5 種とも上に挙げた契機の周で拾います。便を運ぶ器の process が生きている便と生死を読めない便には触りません。周期の timer は持ちません。台帳が読めないときは 1 本も起こさず「測れなかった」と記録します。"
  plain-FR69: "席を起こすときに、閾値より余裕のある口座が 1 つも無くても、器は席を断りません。残量を測れていて上限に当たっていない口座のうち、いちばん余裕のある口座で席を立てます。妥協で立てたことと理由は、その役割のいま使う口座の記録と起動の記録の両方に残し、席の指示文にも出します。席は作業を止めて user に進め方を聞きます。残量を測れていて上限に当たっていない口座が 1 つも無いときだけ断り、key を 1 つも送りません。"
  plain-FR70: "器は強制サイクルの印も、印の在る席の操作を断る hook も持ちません。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR71: "器は session の開始で実際の口座を測って記録することも、登録と食い違うかを判定することもしません。席の口座は席の起動（FR59）が登録に書いた値だけです。無いことは test が確かめます（廃止の決定は ADR-0045）。"
  plain-FR72: "口座の設定を読む session（人と話す席など。器が起こす実装役 runner や審査役 lens には届きません）が、見張り自身を呼ぶ設定 file（口座ごとの settings.json とその実体、作業中の repo の root にある .claude の settings.json と settings.local.json）を書き換えようとしたら、器の見張り（host-guard）が実行の前に止めます。編集の道具の対象 path でも、Bash の書き込み（rm・tee・sed の上書き・リダイレクトの先・mv の両端・cp と ln の行き先）でも同じで、path は作業 dir から解いた形と実体（symlink の先）の形の両方で比べ、file そのものか、その file を含む dir に当たれば止めます。止めるときは区分（見張りの種類）と当たった実体の path を告げ、代わりに user が編集するよう示します。この区分だけは規則の行を持たず、切れません。"
  plain-FR73: "器の健康診断（doctor）は、見張り（host-guard）の状態を 1 行で出します。区分（見張りの種類）ごとの on / off（出所は区分ごとの規則の行の enabled。行が無ければ no-row、見張り自身の設定の区分は常に on）、効いている行の数、呼び出しの行（host-guard の配線）を持つ口座の数と口座の数、呼び出し先の設定 file の実体の数、器のプログラムが見つかるか（ok / missing / other。見つからないときは harness が通してしまうので、それを言えるのはこの行だけです）を測って並べます。区分が off や no-row、配線を持つ口座の数が口座の数より少ない、プログラムが missing、のどれかなら見張りは効いていません。判定はせず、終了コードも変えません。規則の file が読めないときはその旨を 1 行で出します。"
  plain-FR74: "口座の設定を読む session（人と話す席など。器が起こす実装役 runner には届きません）が撃つ rm（削除の命令）は、行き先で止めるかを決めます。守る場所は 3 つで、器の置き場とその中、作業中の repo の管理下（git が追う）file、repo の履歴の置き場（.git）と worktree の本体です。行き先がその場所そのもの・それを包む dir・その中のどれかなら止めます。行き先が確かめられない形（変数・命令の結果・home を表す ~ で始まる・{ } のまとめ書き・同じ命令の中で dir を移った後の相対の場所・守る dir の中の * のまとめ指定）も止めます。止めるときは当たった場所の記号か確かめられない形を告げ、代わりに管理下の file なら git rm（履歴から戻せる削除）、それ以外は退役の mv（消さずに脇へ移す）を示します。守る場所は machine に依らない 3 つの記号（state-dir / repo-tracked / repo-git）で rm の区分の規則の行が持ち、実行のたびに解きます。その行が無ければ止める側に倒し、行を off にしたときだけ rm の区分が外れます。当たらない rm は通します。"
  plain-FR75: "口座の口（口座を器に足す・退役させる subcommand）に「見張りの呼び出しをつなぐ」と頼まれたら、器は machine の宣言（host の面）にある全口座の settings.json を、道しるべ（symlink）の先の実体まで解き、実体ごとに 1 回だけ書きます。書くのは、道具の直前に器の見張り（host-guard）を呼ぶ hook の行 1 本を「足すだけ」で、対象の道具と待ち時間は版を跨いで固定して増やさず、行がすでにあれば触らず、他の設定と道しるべは保ち、読めない設定 file には 1 byte も書きません。結果は口座の数・実体の数・足した数・触らなかった数・断った数の 1 行で、断った file が 1 つでもあれば終了コード 2 です。つないだかどうかの正本は設定 file そのもので、記録（event）には書きません。"
  plain-FR76: "口座の設定を読む session が撃つ bd / bdw（作業の記録簿＝台帳の道具）の command は、作業中の repo の root に台帳（.beads）と台帳の script（scripts/bdw）の両方があるときだけ見張ります。台帳を壊す語の並び（見張りの台帳の規則の行）か、起票の門と同じ 4 つの書き込みの形（素 write。起票の門の規則の行）に当たれば、器の見張り（host-guard）が実行の前に止め、区分と当たった並びか形を告げます。見張りの台帳の行を off にすると語の並びも形も止めなくなります。起票の門の行が効いていない（無い・off など）ときは、見張りの台帳の行が on のときだけ、bd の書き込みの subcommand を全部止めます（読むだけの subcommand は通します）。別の台帳（foreign の台帳。-C・--db・--global・別の prefix）は見張りません。"
  plain-FR78: "席を見回る管理 tick が、黙っている席に送る合図（打刻の合図）を heartbeat と呼びます。heartbeat は席ごとに止められます（scribe2 seat heartbeat off|on|status。off は席の dir に停止の記録を 1 つ置き、on は消します。戻せます）。止めても管理 tick 自体は止まらず、死んだ席の起こし直し（FR59）・口座の移動のための退避・かたまりの判定（FR38）はそのまま動き、合図だけ送りません（判定の行には heartbeat-off と残ります）。記録が在るのに読めないときも止めたと読みます。管理 tick は毎周「最後に周った時刻と判定と理由」を席の dir に 1 行残し（失敗した周も）、seat tick status がそれを読んで、最後に周った時刻・経過秒・健全か（周期の 2 倍以内に周ったか）・heartbeat が on か off か・梯子の段・次の合図までの秒、の 6 つを席ごとに 1 行で出します。seat heartbeat status は on か off かと最後に周った記録を、doctor の席の行は on/off と健全かの 2 つを出します。健全かを判じるのは読む側で、管理 tick は判じません。画面（別 project の GUI など）はその 2 つの file を読んで表示してよく、止める・戻すは器の口を叩きます（停止の記録の書き手は器の 1 本）。最後に周った記録は出来事の log には書きません（ADR-0070）。"
  plain-FR77: "gate の結果が不合格（FAIL）で止まった便を、人が裁定の逐語（言葉をそのままの字面で）を添えて Implemented〔実装が済んで gate を待つ段〕へ 1 段だけ戻す口が regate です。器が戻すのは 4 つの条件を全部満たすときだけです。段が Gated であること、gate の結果が不合格であること、便を運ぶ process の所有者の印が無いか、その process が退役していること、逐語が空でないことです。戻すときは便の記録に段と逐語を持つ記帳を 1 件だけ書き、作業の場所（worktree）・commit・gate の結果の記録には触れません。戻った便は同じ作業の場所で再開の候補になります（FR68）。条件が 1 つでも外れるときと、結果や所有者の印を読めないときは、何も書かずに理由を 1 行で告げて断ります。戻した直後は段が Implemented なので、gate がもう一度 Gated の段を記帳するまで次の regate は段の条件で断られます（1 つの不合格につき戻せるのは 1 回）。不合格の理由（契約の赤か・器の欠陥か・環境か）を器が自分で分けることはせず、裁定なしに自動で戻すこともしません。"

  # ---- FR: rationale（rationale_source の N-x に接地した「なぜ要る」）----
  rationale-FR1: "契約が書き切れることを求めるニーズ（N-4）から来ています。欠けた契約を後の段で見つけると QA の周回が始まるので、入口で全件まとめて断る方が安いからです。"
  rationale-FR2: "契約は小さく、しかし出どころは失わない、というニーズ（N-4）から来ています。要件 id と設計 doc を指していれば、契約を書き直すときも全部の bead が同じ形を保てます。"
  rationale-FR3: "記憶に頼らない、というニーズ（N-3）から来ています。process の中に状態を持つと、その process が死んだ瞬間に現在地が消えるからです。"
  rationale-FR4: "人の手が入らなくても安全に進む、というニーズ（N-1）から来ています。出発点と触ってよい範囲を先に記録しておけば、実装役を無人で走らせても後から検証できます。"
  rationale-FR5: "自律安全のニーズ（N-1）から来ています。画面のある席を建てると宛先解決や見張りの仕組みが要りますが、画面なしの 1 形なら process の起動と終了だけで完結します。"
  rationale-FR6: "記憶に頼らない、というニーズ（N-3）から来ています。「終わった」と言葉で申告させず、rc と commit の数という機械の事実で判定します。"
  rationale-FR7: "契約は小さく、検証は base で落ちる test で表す、というニーズ（N-4）から来ています。先に落ちない test は何も守っていないので、入口で機械が確かめます。"
  rationale-FR8: "自律安全のニーズ（N-1）から来ています。検証コマンドを実際に走らせた結果だけを信じ、実装役の自己申告を根拠にしません。"
  rationale-FR9: "自律安全のニーズ（N-1）から来ています。判定できなかった便を合格と呼ぶと、壊れたものが無人で着地します。"
  rationale-FR10: "自律安全のニーズ（N-1）から来ています。合格していない便や、出発点が main の祖先でない（main が巻き戻った・分岐した）便が main に載る経路を構造的に持たないためです。"
  rationale-FR11: "自律安全のニーズ（N-1）から来ています。main に載せた直後に検証を撃ち直すことで、「作業用の木では通ったが main では落ちる」を無人で検知します。"
  rationale-FR12: "自分で自分を作る、というニーズ（N-5）から来ています。着地ごとの判定を外から読める形で残しておけば、次の版がこの器を見張るときの材料になります。"
  rationale-FR13: "自律安全のニーズ（N-1）から来ています。無人で動くものは、いつでも 1 コマンドで止められる必要があります。"
  rationale-FR14: "記憶に頼らない、というニーズ（N-3）から来ています。途中で死んでも記録から続きを引けるなら、長い便を小さな process の列に分けられます。"
  rationale-FR15: "自律安全のニーズ（N-1）から来ています。取り消せない操作だけは人が決める、という線を守るために、機械は止まって記録し、勝手に待ち続けたり進んだりしません。"
  rationale-FR16: "自律安全のニーズ（N-1）から来ています。承認を会話の記憶ではなく逐語付きの記録として残せば、誰が何を許したかを後から確かめられます。"
  rationale-FR17: "規則の値は manifest に、というニーズ（N-3）から来ています。種類を型で閉じれば足し忘れを compile が止め、値を 1 file に置けば AI が場当たりで規則を生やせません。"
  rationale-FR18: "記憶に頼らない、というニーズ（N-3）から来ています。壊れた規則を黙って読み飛ばすと、規則が効いていないことに誰も気づかないからです。"
  rationale-FR19: "自分で自分を作る、というニーズ（N-5）から来ています。どの器がその repo に仕えるかを目印 1 つで決め、別の器や別の版と二重に動かないようにします。"
  rationale-FR20: "契約は小さく、というニーズ（N-4）から来ています。契約の外を触った変更は後の審査では見つけにくく、編集の時点で止めるのが最も安いからです。"
  rationale-FR21: "消費は害、というニーズ（N-2）から来ています。起動時に注入される文章の量を後から測れるように、記録の形だけ先に決めておきます。"
  rationale-FR22: "自律安全のニーズ（N-1）から来ています。「人手 0」を言葉で主張せず、記録を数えて示すためです。"
  rationale-FR24: "自分で自分を作る、というニーズ（N-5）から来ています。管轄外の repo を 1 byte も汚さないことが、別の器や別の版と同居できる条件だからです。見張りの口を黙らせないのは、目印の無い repo でも壊す操作は壊す操作で、止める判定に repo の所属は要らないからです（こちらは自律安全 N-1 の側・ADR-0056）。"
  rationale-FR23: "記憶に頼らない（N-3）から来ています。session をまたぐ記憶は台帳の構造が持ち、文脈の圧縮は session 側の機構で足りるので、器が退避物の file を持つと状態の置き場が増えるだけだからです（憲法 C3・ADR-0045）。"
  rationale-FR25: "記憶に頼らない（N-3）から来ています。context の残量を器が測る理由は cap guard と退避の合図のためで、その 2 つを持たない器には測る口も要らないからです（ADR-0045）。"
  rationale-FR26: "自律安全（N-1）と消費は害（N-2）から来ています。編集を止める段は退避と cycle と組で意味を持つもので、圧縮を session 側の機構に任せる形では要らないからです（ADR-0045）。"
  rationale-FR27: "自律安全（N-1）・消費は害（N-2）・記憶に頼らない（N-3）から来ています。器を使う他の project では席が黙ると誰も続きを促さず止まるので、席の外から周期で見て促す機構が要ります（N-1）。合図の頻度を席の変化で決め、無変化なら梯子の列の順で伸ばして列が尽きたら打ち切るのは、同じ合図で席の手番を無駄に消費しないためです（N-2）。列を式でなく rules 行 1 本の値で持つのは、持ち主の裁定の列が等比でなく、裁定した値は式に畳まず列のまま持つためです（ADR-0068）。変化を状態の打刻の時刻だけで測るのは、画面の文字や散文を判定に使わない（N-3）ためです（ADR-0058）。tick が判定と計測を持つのは、便の無い host でもかたまりが移るためで、判定の写しは作らず 1 周と同じ 1 本を呼びます（ADR-0066）。窓が shell に戻った席を tick が起こすのは、席を立て直す手番を人に残さないためです（裁定 2026-09-25T04:13Z）。"
  rationale-FR28: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。退避物を持たない器では作り直しの周が成り立たず、席の立て直しを user が器の口で撃つ方が状態の置き場を増やさないからです（ADR-0045）。窓が shell に戻った席を tick が起こすのは、席を立て直す手番を人に残さないためで、退避物を持たない点は変わりません（裁定 2026-09-25T04:13Z）。"
  rationale-FR29: "自律安全（N-1）と消費は害（N-2）から来ています。退避の合図は前の器の管理 tick の 1 出力で、退避物を持たない器には合図が残る理由が無いからです（ADR-0045）。管理 tick（FR27・ADR-0058）が送るのは続きを促す打刻の合図だけで、退避の合図は送りません。"
  plain-FR30: "便の配送構造は、orchestrator の席（役割は 1 つ。席数と一意性は FR40）と器の dispatcher からなり、便を起こす・着地させる・merge するのは席ではなく器の dispatcher です（いつ・どれを・どの順で起こすかは FR68、着地の終端は FR50）。口座は便ごとに器が選びます（FR36）。orchestrator が書くのは契約と優先度（priority）と介入の印（first / hold / release）、それに実装役の質問への回答か契約の直しだけで、実装は自分ではしません（落ちる test〔tests/ の編集〕は書きます・FR41）。"
  rationale-FR30: "自律安全（N-1）と記憶に頼らない（N-3）のニーズから来ています。便を pipeline が運び、起こすのも着地させるのも器が担えば、人手なしで進む経路と判定の記録が 1 本に揃い、席の手番で便が待つことが無くなるからです。人と話す席を 1 つにした経緯は ADR-0045 に、却下した案は ADR-0016 と ADR-0034 に在ります。"
  plain-FR31: "実装役が「この契約では作れない」と判断したら、勝手に決めずに決まった形の合図（質問 record）を返して手を止めます。pipeline はそれを読んで便を「質問中」の段に倒し、質問の文面をそのまま記録し、回答が来るまで再開しません。"
  rationale-FR31: "記憶に頼らない（N-3）と自律安全（N-1）のニーズから来ています。契約の穴が失敗や黙った推測として消えず、質問の逐語が記録に残るからです。"
  plain-FR32: "orchestrator が回答を逐語のまま記録したうえで再開が要求されると、同じ便がそこから続きます（回答の記帳の後の再開は dispatcher が起こします・FR68）。質問と回答の文面は実装役への入力に添えられます。"
  rationale-FR32: "記憶に頼らない（N-3）と自律安全（N-1）のニーズから来ています。再開に要るものがすべて記録に在れば、別の process からでも同じ便を続けられるからです。"
  plain-FR33: "口座残量の計測を求められると、器は manifest に書かれた口座（退役中の口座を除く）ごとに、5 時間・7 日・モデル別 7 日の残りと reset の時刻を口座の endpoint から 1 つのコマンドで読みます。読んだ値は「どの口座を・どこから・いつ読んだか」を添えて fleet の event log に残し、読めなかったときは理由を添えて「測れなかった」と残します（0 の値に読み替えません）。"
  plain-FR34: "着地を求められたとき、審査が合格していて、作業用 worktree に未 commit の変更が無く、main の先端が便の出発点（base）より進み、その出発点が main の祖先（枝分かれした位置）なら、作業用の branch を main の先端の上に積み直し（rebase＝main に追いつく・追随）、審査をやり直します。進んだ後の出発点と、ぶつかった（衝突）事実は記録に残します。ぶつかっても、規則の値が決める回数までは便を終わりにせず、その回数に達したら「失敗」で終わります。積み直した結果、便の変更がすでに main に入っていたときは、審査をやり直さずに記録して終わります。main 自体は動かしません。"
  rationale-FR33: "消費は害（N-2）と自律安全（N-1）のニーズから来ています。口座の残りが記録に無いと、口座を allowance 窓の終わりまで使い切る判断（憲法 C9.2）を器が持てず、余った枠を無駄にするか上限に当たって止まるかのどちらかになるためです。runner が受ける上限 record（ADR-0012）は便を止める合図であって残量の正本ではなく、残量の正本は本要件の実測値です。"
  rationale-FR34: "自律安全のニーズ（N-1）から来ています。便を並べて流すと、後から着地する便は main に置き去りにされます。追いつく手順を器が持たないと、合格した便が出発点のずれだけで着地できず、人が手で直す経路が生まれます。ぶつかったときの解き方は決定記録（ADR-0019）が正本です。"

  rationale-FR35: "自律安全のニーズ（N-1）から来ています。上限で止まった便を失敗に数えると、成果（worktree）を捨てて人が手で直す経路が生まれます。止まった事実を typed に残せば、別の口座で続きから再開できます（憲法 C9）。"
  rationale-FR36: "自律安全（N-1）と消費は害（N-2）から来ています。口座を人が選ぶと席が止まり、規則が散文に残ると drift します。1 本の純関数と rules 行に置けば、器が同じ規則で選び直せます（憲法 C9.2・C2・C1）。役割の口座と実効の口座を便の候補から外す決定は ADR-0036 と ADR-0041 に、便用を 7 日窓の reset の早い順に並べる決定は ADR-0042 に在ります。"
  rationale-FR37: "自律安全のニーズ（N-1）から来ています。再開のたびに契約や作業場所を作り直すと成果が失われます。同じ worktree と契約で続きから進める形なら、上限に当たっても成果が失われません。"
  rationale-FR38: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。複数の project の席を同じ口座にまとめ、上限が来たら群ごと一斉に移す要求（ADR-0049）を、時計を戻さずに満たすには、残りが減る周（席が話す・便が終わる）と見回りの判定の周に測れば足ります（ADR-0055・ADR-0066）。移動をかたまり単位の 1 回に閉じるのは同じ口座への殺到を構造で消すためで、席の起こし直しで会話 id を運ぶのは、会話を reset しても得るものが無いため（裁定 2026-09-25T03:58Z・ADR-0067）で、運ぶのは打刻に残った id 1 つだけなので、復帰の道は台帳と git から組む 1 本のままです（N-3）。管理 tick を 3 つ目のきっかけに持つのは、便の無い host では 1 周が来ず、席の仕組み（hook）は移動を頼む記録を置くまでで判定を撃たないため、かたまりが移らないからです（ADR-0066）。移り先の候補から終端でない段の便の口座を外さないのは、新しい便がその口座で起きないことを便用の口座選定（FR36）が既に保っていて、同じ目的の条件を 2 か所に持たないためです（ADR-0068）。移り先を残りの量で並べるのは、席は何日も同じ口座に居るので、いま残りが多い口座ほど長く働けるからで、7 日の窓と役割の model の窓の少ない方を取るのは、役割の model の窓だけが高い口座を上位に並べないためです。予約を宣言の順に導いて記録しないのは、かたまりが幾つ増えても数字の小さい群が良い口座を取り、記録が実測とずれる事故を作らないためで、予約が作業の起動を避けないのは、移った後に新しい作業がその口座で起きないことを口座選定（FR36）が既に保っているからです（ADR-0069）。"
  rationale-FR39: "自律安全のニーズ（N-1）から来ています。並列の便が同じ file を触ると、着地で衝突して人が解く経路が生まれます。入口で断れば衝突は起きず、決定記録（ADR-0019）の設計と揃います。"
  rationale-FR40: "記憶に頼らない（N-3）から来ています。役割を窓の名前や環境変数の慣習で決めると、器は席の同一性を持てず、規律を守らせる相手を機械が特定できません（憲法 C3.3・C2.2）。"
  rationale-FR41: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。権能を rules 行に置けば、執行（FR45）も指示文（FR42）も同じ行を読めます（憲法 C1・C14・N2）。"
  rationale-FR42: "記憶に頼らない（N-3）から来ています。書かれた規律が席の文脈に届く経路が無いと、要件が在っても守られません。生成した指示文を器が差し込めば、届く経路が構造になります（憲法 C1.2・C14.2）。席の記憶に頼らず続きを拾えるよう、台帳と git から機械で導いた事実行と、圧縮をまたぐ逐語の 1 枠も器が出します。"
  rationale-FR43: "自律安全（N-1）から来ています。席の次の仕事は台帳が構造で持てるので、器が席の queue を別に持つ必要はありません（ADR-0045）。黙った席に続きを促す役は管理 tick が担い、人が気づいて促す手番を減らします（ADR-0058）。"
  rationale-FR44: "記憶に頼らない（N-3）から来ています。席間の連絡は席が 2 つ在る配送構造にだけ要る経路で、席が orchestrator の 1 つなら経路そのものが無いからです（ADR-0045）。打刻の合図は席どうしの連絡ではなく器から席への 1 行で、既存の入力欄の門を通ります（ADR-0058）。"
  rationale-FR45: "記憶に頼らない（N-3）と自律安全（N-1）から来ています。権能が行に在っても、破る操作を止める点が無ければ規律は散文のままです。編集・実行の時点で止め、誰の権能かを告げる形が、規律を散文でなく構造に置きます（憲法 C16・C16.2）。"
  rationale-FR46: "自律安全（N-1）と消費は害（N-2）から来ています。資源の防御が無い host で便を断ると、便が 1 本も流れません。"

  rationale-FR47: "契約は小さく（N-4）と記憶に頼らない（N-3）から来ています。契約が設計 doc の散文・台帳の受入条件・契約 file の 3 段の写しになっていると、写しの各段で write-set の落ちや設計の混入が起き、正本がどれか分からなくなるからです。"
  rationale-FR48: "契約は小さく（N-4）と記憶に頼らない（N-3）から来ています。閉じた型に variant を足すと触る面は構造で決まるのに、それを人の記憶で write-set に写すと落ちが出るからです。"
  rationale-FR49: "消費は害（N-2）と自律安全（N-1）から来ています。契約側の穴を実装後の gate で初めて見つけると、実装役と審査役の消費を丸ごと捨てて再受付になるからです。実装前に席が手で審査役を回す運用は散文の規則になり、器の段でなければなりません。"
  rationale-FR50: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。push・CI の照合・台帳の close が席の手順のままだと、「着地したのに close されていない」「close したが CI が赤」のずれを目視に頼ることになるからです。"
  rationale-FR51: "記憶に頼らない（N-3）から来ています。設計の中身が台帳の memo にだけ在ると、tracked な設計 doc に無い設計が判定入力になり、pointer の欠落を機械が拒めなくなるからです。CI は private な台帳に届かないので、doctor が照合します。"
  rationale-FR52: "記憶に頼らない（N-3）から来ています。設計 doc の散文にだけ在る規則は規則ではなく、根拠の無い規範文が設計 doc に増えると、器の外の散文が判定入力になるからです。"

  rationale-FR53: "契約は小さく（N-4）と記憶に頼らない（N-3）から来ています。契約 file を席が手で写すと、写しの段で write-set の落ちや設計の混入が起きるからです。"
  rationale-FR54: "契約は小さく（N-4）から来ています。解決しない pointer や手書きの契約 file を通すと、正本の無い便が走るからです。"
  rationale-FR55: "記憶に頼らない（N-3）から来ています。intake の後に設計 doc の行が改訂されると、intake の検査だけでは閉包の不足が見えなくなるからです。"
  rationale-FR56: "人の手が入らなくても安全に進む（N-1）から来ています。許可を command の先頭語の粒度で与える形では、資源を枯渇させる検査や取り消せない操作が許可の内側に入ります。禁じる並びを規則の値として manifest に置き（N-3）、実行の前に機械が止めれば、散文の手順に頼らずに済むからです。器を積まない session も対象に含めるのは、見張りの本体を器へ移しても、いま守られている session を守りの外に落とさないためです。本体を器の外の script に置くと、本体が消えたときに黙って通ります（ADR-0056）。"
  rationale-FR57: "記憶に頼らない（N-3）から来ています。口座の宣言が tracked の manifest と host の写しの 2 か所に割れると、rules 行が動くたびに写しを手で作り直す作業と、2 つの宣言のずれが生まれます。host の値を 1 file に置き同じ読み手で読めば、写しを作り直す手番が消え、人の手が入らなくても安全に進める（N-1）からです。"
  rationale-FR58: "人の手が入らなくても安全に進む（N-1）から来ています。口座の準備が手作業だと、link の張り間違いや設定の抜けで立て直しが落ち、原因が記録に残りません。器の口で揃え、退役を記録に残せば、記憶に頼らず（N-3）に口座の集合を正しく保てるからです。"
  rationale-FR59: "人の手が入らなくても安全に進む（N-1）から来ています。席の起動が別 repo の wrapper と前の器の launcher に乗っていると、器の視野の外の script に依存し、起動行の手書きが host 固有の値を散らします。器が導出して登録を先に書けば、記憶に頼らず（N-3）に席を立てられるからです。口座をかたまり（群）のいま使う口座から先に決める決定は ADR-0049 に在ります（群の宣言も同じ決定）。"
  rationale-FR60: "自律安全（N-1）から来ています。役割なしの起動は役割の席が立たない不測の事態のための入口で、席が orchestrator の 1 つならその起動は席の起動（FR59）で足りるからです（ADR-0045）。"
  rationale-FR61: "人の手が入らなくても安全に進む（N-1）から来ています。複数の project に入った scribe2 の本体と hook が黙って古くなると、guard の無い席が動き続けます。器が自分で測って名指しし、更新を 1 つの口で行えば、手順書を人が覚える形（N-3 の逆）にならないからです。"
  rationale-FR62: "自律安全（N-1）から来ています。hook の配線の食い違いで席を作り直す経路は退避と立て直しの機構の上に載るもので、それらを持たない器では食い違いを doctor が名指すだけで足りるからです（ADR-0045）。"
  rationale-FR63: "記憶に頼らない（N-3）から来ています。statusline は器の context 計測（FR25）の読み手と対になる描き手で、計測を持たない器には描き手も要らないからです（ADR-0045）。"
  rationale-FR64: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。黙った席は自分を起こせず、便の周に相乗りすると便が流れない project では動かないので、host の timer が管理 tick を周期で撃ちます。本文を器が組んで置くのは、決めた形（ADR-0030）をそのまま使え、host ごとの値を引数だけで受けて env を読まずに済むためです（ADR-0058）。"
  rationale-FR65: "記憶に頼らない（N-3）から来ています。裁定は台帳の notes が、user の逐語は承認の記録が持てば足り、直命の表は状態の置き場を増やすだけだからです（憲法 C3・ADR-0045）。"
  rationale-FR66: "自律安全（N-1）から来ています。4 つの hook は復元・退避の撃ち忘れを器で埋めるためのもので、復元と退避を持たない器には hook も skill も要らないからです（ADR-0045）。圧縮の直前に器が機械で取る逐語の 1 枠（FR42）は、AI が書く退避物とは別のものです。"
  rationale-FR67: "記憶に頼らない（N-3）から来ています。user に向けて出す文の形が user ごとの global の設定 file にだけ在ると、他の user や他の host の orchestrator に届かず、prose だけの規則になります。設計 doc 1 本に置き、器が生成する指示文が pointer で運べば、どの host でも同じ形で届き、人の手が入らなくても（N-1）読める報告が保てるからです。経緯と却下した案は ADR-0032 に在ります。"
  rationale-FR68: "人の手が入らなくても安全に進む（N-1）と記憶に頼らない（N-3）から来ています。便の起動が席の中継に乗っていると、着地から次の起動までの待ちと優先便の後回しが席の手番で起き、「同時に何本」のような規則が散文に残ります（最大値を持つなら規則の表の 1 行に置きます）。起動に要る判定（依存・重なり・受付・審査）は器がすべて持っているので、判定と起動を器の同じ関数に置けば、待ちは重なり・受付・同時走行の最大値と、終端に達した便が起動の列から外したこと（release の印 1 つにつき 1 回だけ戻す）で決まり、回答と承認の記帳も同じ周の契機になり、介入も記録に残るからです。regate で戻された便を専用の契機を足さずに同じ周で拾うのは、regate を撃つのが人の席で、その席が手動の 1 周も撃てるからです（裁定の記帳と再開の契機を分けても、契機が 1 つ増えるだけで拾う便は変わりません）。周期の timer を持たず便の終端を契機にする決定は ADR-0045 に、経緯と却下した案は ADR-0034 に、同時走行の最大値を 1 つだけ持つ決定は ADR-0035 に在ります。追随で戻された便に専用の契機を足さないのは、追随を撃つ着地の列の周と便の終端の周がすでに契機で、その周に所有者の印を失った便を拾えるからです（ADR-0068）。"
  rationale-FR69: "自律安全（N-1）と記憶に頼らない（N-3）から来ています。余裕のある口座が無いからと席を断ると、orchestrator の席が立たず、user が進め方を決める対話面そのものが消えます。余裕が無くても席を立て、妥協したことを記録と指示文に出して user の裁定を待てば、止まり方が記録に残り、人が決められます。経緯と却下した案は ADR-0041 に在ります。"
  rationale-FR70: "自律安全（N-1）と消費は害（N-2）から来ています。強制サイクルは退避の合図の後に新しい作業を始めさせないための機構で、退避の合図を持たない器には印も guard も要らないからです（ADR-0045）。"
  rationale-FR71: "記憶に頼らない（N-3）から来ています。実測の口座の食い違いの判定は、合図の宛先を実測の口座で決める tick にだけ要るものです。管理 tick（FR27・ADR-0058）の判定の列に口座の食い違いの判定は無いので要らず、席の口座は登録に書いた値だけを信じれば足ります（ADR-0045）。"
  rationale-FR72: "人の手が入らなくても安全に進む（N-1）から来ています。見張りを呼ぶのは口座の設定 file の 1 行なので、AI の席がその file を書き換えれば見張りは黙って外れます。他の区分を切る・緩めるのは user の決定の印がついた規則の行だけにし、この区分は行も持たず切れないことにして（N-3）、設定 file の書き換えを見張り自身が止めれば、事故で守りが消えないからです（ADR-0056）。"
  rationale-FR73: "記憶に頼らない（N-3）から来ています。見張りが切れている・呼び出しの行が欠けている・器のプログラムが見つからない、のどれも黙って通る側に倒れるので、その状態を席の記憶や散文でなく健康診断の実測 1 行で読めるようにし、黙って無効にならないようにするためです（N-1・ADR-0056）。"
  rationale-FR74: "人の手が入らなくても安全に進む（N-1）から来ています。元に戻せない削除は憲法が禁じる操作で、器の置き場を消す rm は一度通ると取り返しがつかず、repo の管理下の file も未 commit の変更ごと消えうるので、戻せる経路（git rm）に揃えます。守る場所を machine ごとの path でなく記号で規則の行に置き（N-3）、行き先を確かめられない削除は止める側に倒し、戻せる経路（git rm・退役の mv）へ向ければ、散文の注意書きに頼らずに済むからです（ADR-0056）。"
  rationale-FR75: "人の手が入らなくても安全に進む（N-1）から来ています。見張り（FR56 / FR72 / FR74 / FR76）が口座の設定を読む全 session に効くのは、口座の設定 file に呼び出しの行があるときだけです。その行を machine ごとの配備 script や手書きに任せると、machine 固有の値が散り、欠けても気づけません。器の口が実体へ足すだけの merge で書き、正本を file に置いて健康診断（FR73）が実測すれば（N-3）、配線の欠けが黙って残らないからです（ADR-0056）。"
  rationale-FR76: "人の手が入らなくても安全に進む（N-1）から来ています。作業の記録簿（台帳）を壊す語の並びと、台帳の script を経ない書き込み（素 write）の判定は、器の中では器の plugin を積む席の hook の入口（command guard と起票の門）にしかありません。判定の本体を器の外の script に置くと、本体が消えたときに黙って通ります。同じ規則の行と同じ判定を見張り（host-guard）が使えば（N-3）、台帳を持つ repo でだけ、どの session からでも同じ形で止まるからです（ADR-0056）。"
  rationale-FR78: "自律安全（N-1）と消費は害（N-2）から来ています。合図だけを席ごとに止める口が無いと管理 tick の timer ごと止めるしかなく、口座の移動と死んだ席の起こし直しも止まります（N-1）。止めた席は手番を消費しません（N-2）。止める口を可逆な記録 1 つにすること、健全かを読む側が判じること、書き手を器の 1 本にすることの理由は ADR-0070 が持ちます（持ち主の裁定 2026-09-26T00:53Z）。"
  rationale-FR77: "人の手が入らなくても安全に進む（N-1）と記憶に頼らない（N-3）から来ています。gate の一時の赤（負荷や環境）で落ちた便を捨てると、実装役の成果が消えます。かといって器が赤の理由を自分で分類して戻すと、契約の赤を無限に撃ち直す形が作れてしまいます。理由の分類は裁定であって述語ではないので、人が裁定の逐語を添えたときだけ戻します。戻したことは記帳 1 件を正本として残し、後から誰が何を根拠に戻したかを読めるようにします（N-3）。"

  # ---- NFR: plain ----
  plain-NFR1: "審査役 1 回に使う token は 0.15M 以内を目標にします。diff の大きさと上限の照合結果を判定に記録します。"
  plain-NFR2: "1 つの契約の変更は 300 行程度、見積は 550 行以内にします。PR の行数と契約の見積を記録して見比べます。"
  plain-NFR3: "実行時に使う外部 crate は 0 本で、標準ライブラリだけで build します。許可リストの外の依存は CI の検査が毎回落とします。"
  plain-NFR4: "不正な入力を黙って落とす件数は 0 です。記録が読めないときは rc 2 で止まります。壊した入力を実際に流して、全部が声を上げて止まることを確かめます。"
  plain-NFR5: "道具 1 回の呼び出しにつき、器の binary を呼ぶのは 2 回まで（器の hook の入口と、口座の設定から呼ばれる見張り host-guard）で、1 回ごとに 2.0 秒以内に終わり、重い読み書きをしません。見張りが git に問い合わせるのは 1 回までです。hook の入口のかかった時間と、見張りが止めた回のかかった時間は注入計測の記録に残し、見張りが通した回の時間の上限と git の回数は test が測ります。"
  plain-NFR6: "器が起こす子 process は、すべて封じ込めの箱の中で走らせます（箱の外で走る子 process は 0 本）。変異検査を何本同時に走らせるかは、host 全体の並列の枠から決めます。便ごとに、封じ込めの有無・並列度・縮退の理由が記録に残ることを fixture で確かめます。"

