      condition: 常時
      response: 器は開発 session を周期で見張り打刻の合図を注入する管理 tick と、 その間隔と backoff の rules 行を持たない（ADR-0045 §2 (2) で廃止）。 便の起動の契機は FR68 が持つ。 不在は不在を測る歯が確かめる
  - id: FR28
