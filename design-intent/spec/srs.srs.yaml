    ears:
      pattern: ubiquitous
      condition: 常時
      response: "口座は、 manifest に宣言した口座（退役中の口座は FR58 で候補から外れ、 便用は便の repo を anchor に持つ席の登録 row の口座（置き場を共有する他の repo の席の口座と、 park の区画〔FR95〕の置き場の席の row の口座は候補に残る）と宣言された各群の今の口座（FR38・host 全体で除き、 群の候補の他の口座は除かない）を次の選定から除き、 終端でない段の便は止めない）と実測した口座残量（FR33）だけから決定的に選び、 便用（7 日窓の reset の早い口座から使い切る側）と開発 session 用（自席の鍵〔役割と anchor〕の外の登録 row の口座を除き〔park の区画の置き場の席の row の口座は除かない〕、 自席の鍵の row の口座は除かず、 逼迫度が最小の口座を選び余裕を残す側）の 2 つの規則を持ち、 規則の値は session 用の閾値の rules 行（R-C9-1 とその窓別の行・user 裁定で発効）だけから取る。 park の区画の置き場の席の選定の候補は FR95 が持つ"
  - id: FR37
    type: FR
    label: 別口座での途中再開
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC12, AC39] }
    ears:
      pattern: event
      condition: FR35 で記帳された便、 または Spawned の段の便の再開が要求されたとき（この便の再開は FR14 に優先する）
      response: 器は runner の process が生きているかを測り（生きている便は typed に断り、 runner を 2 本にしない）、 FR36 で口座を選び（上限で止まった便は別の口座）、 同じ worktree と同じ契約（回答済みの質問と、 前の runner が残した未 commit の変更の一覧を添えて・FR32）で runner を起こし直し、 記帳した段から Landed まで続ける。 候補となる口座が無い周は便を Failed にせず、 いずれかの口座の窓が最も早く reset する時刻まで待ってから再開する
  - id: FR38
    type: FR
    label: 群の逼迫の通知と移動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC18, AC41, AC63] }
    ears:
      pattern: event
      condition: 便の終端の周（dispatch の 1 周）か席自身の hook か管理 tick（FR27）の周期が動いたとき
      response: 器は群の逼迫を計測のための常駐 timer では測らず、 便の終端の周（dispatch の 1 周）と席自身の hook と管理 tick（FR27）の周期（群ごとに鮮度の窓に 1 回まで）の 3 系統で、 群の今の口座と群の席が居る口座の使用率を計測（FR33）から鮮度つきで読み、 5 時間窓・7 日窓・モデル別窓の閾値の rules 行 3 本（user 裁定で発効）のいずれか以上になった群について、 便の終端の周は群の置き場の席の pane へ通知を 1 行注入して event に記し（同じ実測には 2 度通知しない）、 席自身の hook は指示文の 1 行で告げて移動を頼む記録を host の根へ群ごと高々 1 件置き、 便の終端の周と管理 tick は群単位で host の lock の内側で 1 回だけ移り先（群の候補のうち、 今の口座でなく・他の群の今の口座でなく・退役中でなく・口座の墓標〔FR97〕でなく〔鮮度の内側の実測を持つ墓標の口座も外す〕・鮮度の内側の実測を持ち 3 窓とも閾値未満の口座を、 残量の鍵〔7 日窓と群の席の役割の model（rules 行 seat.model.<役割>）の 7 日窓の残量（100 − 使用率）の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順〕で並べ〔役割の model の行が無い口座は最後・5 時間窓は門にだけ使う・鮮度の外の候補は 1 回測る〕、 群を宣言順に見て「どの群の今の口座でもなく先の群の予約でもない先頭」をその群の予約〔群の予約〕とし、 移る群は自分の予約へ移る。 予約は記録せず周ごとに lock の内側で導出し、 他の群の移動と予約を排他するが便の起動は排他しない〔便用の口座選定の除外は群の今の口座だけ〕。 宣言の候補の列は集合で、 順は同点の tie-break にだけ効く。 終端でない段の便が使う口座は候補から外さない・ADR-0069）を決めて群の今の口座の記録（書き換える周は前の記録を消さず履歴の側へ可逆な move で移す）と承認 event を書き（判定は 1 本の関数で、 便の終端の周と管理 tick が同じ 1 本を呼び、 管理 tick は群ごとに鮮度の窓〔rules 行〕に 1 回まで撃ち、 判定の周だけ計測〔FR33〕を起こしてよい・ADR-0066）、 古い席へ退避の合図を送って新しい口座で席を起こし直し（席の起こし直しは席の起動〔FR59〕が行い、 直前の会話 id を運んで会話の続きから再開する・ADR-0067）、 候補が無い周は移らず user へ通知し妥協の移動を作らず、 群の逼迫の計測のための常駐 process と、 cycle・強制サイクルの印は持たず、 dispatch の 1 周を timer では撃たない（ADR-0045 §2 (2) / ADR-0049 / ADR-0055 / ADR-0066）。 群の今の口座が口座の墓標（FR97）である群も、 同じ 1 本の判定が同じ移り先の決め方で移り先を決め、 同じ記録と承認 event（承認の逐語は群の宣言の行が持つ逐語）と同じ退避と起こし直しで移り、 候補が無い周は逼迫の群と同じ断りの手（移らず、 断りの event を記す）を使い、 墓標を知らせる口は足さない（墓標は群の逼迫でなく移動のもう 1 つの契機）。 判定は墓標の口座を測らず、 群の予約を持つのは、 群の今の口座の実測が閾値の rules 行のいずれか以上の群か、 群の今の口座が口座の墓標の群である（ADR-0074・ADR-0098）。 管理 tick（FR27）の timer（FR64）は判定の周の外では群の逼迫を測らず計測も起こさず、 tick の口座の門（FR27）は計測（FR33）の記録の最新値を読むだけである（ADR-0058）。 群の表（host の面）の行の名は Tier1〜Tier9 に限り（Tier1〜Tier8 の行が群・Tier9 の行が park の区画〔FR95〕）、 Tier1〜Tier9 の外の名・数字の重複・宣言順が数字の昇順でない host の面は FR57 の読みで断り（fail-closed）、 優先は宣言順のままで、 doctor の群の行は next=<label|none>（残量の鍵で導出した群の予約）を持ち、 移り先の判定と doctor は同じ 1 本の残量の鍵の関数を呼ぶ（ADR-0069・名の句は ADR-0091）。 本 FR の手（逼迫の通知・移動を頼む記録・移動・予約）は群だけに掛かり、 park の区画の手は FR95 が持つ
  - id: FR39
    type: FR
    label: intake の排他
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC14, AC75] }
    ears:
      pattern: unwanted
      condition: 契約が intake に出され、 その write-set が終端でない段の便の write-set と交差するとき
      response: 器は交差する file と相手の便を名指す typed な理由で契約を断り、 便を作らない。 相手の便が終端の段に達するか止められた後は、 同じ契約を受け付ける。 契約を断る理由の閉じた一覧と終端でない段の便の判定は、 同時走行の最大値の断り（FR68）と共有する
  - id: FR40
    type: FR
    label: 席の登録
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC15, AC19, AC29] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は開発 session の席の役割を閉じた一覧の値（orchestrator の 1 つ）として持ち、 席の識別子（役割, anchor）を鍵に、 席の target・口座 label（FR59 が解いた口座の写し）・起動の雛形を項目として fleet の event log へ記録し、 役割の記録が無い席をどの権能も持たない席として扱う。 1 つの anchor に orchestrator は 1 席とする
  - id: FR41
    type: FR
    label: 権能の所在
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC15, AC84] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 役割ごとの権能は rules manifest の行 role.orchestrator（裁定 id 付き）が持ち、 承認の記帳と上限の許可の記帳と取り消し（FR110）は rules 行 R-C7-1 が名指す orchestrator の席の権能〔approve〕とし、 便の起動・着地・merge は行に無く器の dispatcher だけが行い（FR68）、 止まった終端を閉じる器の 2 つの口（便の終端だけの撃ち直し〔pipe land --terminal-only・FR50〕と worktree を畳む口〔pipe retire・FR96〕）は、 便 1 本を名指す形（畳むだけの指定〔--fold-only〕を 1 つ足した pipe retire を含み、 置き場と repo は席のものに限り規則を差し替えない）だけを行 role.orchestrator の権能〔settle〕で席が撃て、 それ以外の形は撃ち直しが権能〔merge〕・pipe retire が権能〔launch〕の手に残り（名指しの pipe retire が畳める便の列は ADR-0048・ADR-0097）、 席の src の編集は行に無く、 落ちる歯の編集（tests/ の path 種別）だけを行が与える
  - id: FR42
    type: FR
    label: 席の指示文の注入
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC17, AC60] }
    ears:
      pattern: event
      condition: 開発 session の席で session が開始されるとき（/compact の後を含む）、 または圧縮（/compact と自動圧縮）が始まる直前
      response: session の開始では、 器は、 その席に役割の記録が在ればその役割の manifest 行と役割ごとの雛形から生成した短い指示文（席の同一性・憲法の効く部分の pointer・役割の特性・台帳の現在地の 4 群からなり、 行の構成と行数の上限は ADR-0045 が正本）を session の開始で文脈へ注入し（入力欄を経由しない）、 役割の記録が無ければ注入せず、 runner には憲法の散文を 1 行も注入しない。 生成した指示文は行が持つ権能をすべて名指し、 C 条文の規範文を持たず、 雛形の外に手書きの規範文を含まない（両向きの drift は CI が検査する・FR18）。 役割の記録が在る席の session の開始では、 器は指示文の後ろに、 台帳と git と局面の出力から機械で導いた直近の流れの事実行（仕掛かり中の契約・直近に更新された契約・直近の commit・未 commit の変更・局面の出力〔FR90〕が持つ席の手番の閾値越えの件数と最古の 1 件〔在る周だけ〕。 規範文を持たず指示文の行数に数えない）を出し、 圧縮の後の開始で圧縮の直前の 1 枠が在れば、 その 1 枠を 1 回だけ出して消す。 圧縮が始まる直前では、 器は役割の記録が在る席の直前の発言を逐語で圧縮の直前の 1 枠（state dir の席ごとの置き場・repo の外）に書き、 圧縮を止めない（役割の記録が無い席では書かない）
  - id: FR43
    type: FR
    label: 席の継続
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC18] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は席の queue を持たず、 続きの pointer を queue から注入しない（ADR-0045 §2 (2)）。 席が抱える次の仕事は台帳の現在値が持ち、 管理 tick（FR27）が台帳の現在地から続きを進めるよう促す 1 行を注入する（ADR-0058）。 合図が 24 時間で打ち切られた後の席の続きは user が対話面で促す
  - id: FR44
    type: FR
    label: 席間の連絡（廃止）
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC19, AC49, AC57, AC58] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: "1 つの anchor の席は orchestrator の 1 席（FR40）であり、 器は席間の連絡の経路を持たない（ADR-0045 §2 (2) で廃止・ADR-0058）。 器から席の入力欄への差し込みは席の起動（FR59）の起動行・管理 tick（FR27）の打刻の合図・群の逼迫の通知と移動（FR38）の通知と退避の合図・park の区画の移動（FR95）の退避の合図・便の終端の周の通知（器の dispatcher〔FR68〕が便の終端の周に orchestrator の席へ送る 1 行・形は dispatcher の設計が持つ。 起こす便が 0 の周の 1 行は memo の要約〔FR87〕も持つ）・裁定の指し示し（FR79・送る行に入る外からの値は裁定面の記帳 id だけ・ADR-0077）にだけ使い、 台帳の現在地から続きを進めるよう促す差し込みは打刻の合図だけで、 便の終端の周の通知は便の出来事と次の 1 手の在りか（起こす便が 0 の周は memo の要約も）を、 裁定の指し示しは裁定が届いたことだけを知らせる 1 行である。 席の turn の終わりの止め（FR88）の理由は入力欄への差し込みではない。 経路の不在は不在を測る歯が確かめる"
  - id: FR45
    type: FR
    label: 権能の執行
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC15, AC16, AC86] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 権能で守られた操作はその権能を持つ役割の席からだけ通し、 検査は編集・実行の時点で（in-loop に）行い、 断るときは欠けた権能と権能を持つ rules 行の id を告げる。 席の src の編集は、 契約が typed な印で開いた便の write-set の内側に限り通す
  - id: FR46
    type: FR
    label: 縮退
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC20] }
    ears:
      pattern: event
      condition: 封じ込めか並列の枠が使えない host で便が起動されたとき
      response: 器は並列度 1 で進み、 便を断らず、 縮退の事実と理由を record に残す

  - id: FR47
    type: FR
    label: 契約の正本
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4, N-3], acceptance: [AC21, AC77, AC83, AC87, AC88] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 契約は契約表の置き場（tracked・ADR-0109）の契約表の 1 行（少なくとも要件 id・実装する設計の節・write-set・検証を持ち、 done の項目ごとの歯を名指す任意の欄と、 code の事実を数で名乗る任意の欄〔要素は列・項目・値の組で、 列は閉じた 7 語・項目は touches と同じ path の形・値は件数か可視性の字〕を持てる）だけから取る。 契約表の置き場は既定で設計 doc の dir（docs/design/）の直下の markdown で、 vessel 宣言の任意 key contract-tables が dir（直下の拡張子が .md か .toml の file）か file を足し（置き換えない）、 宣言を読めない周は既定の置き場に倒さない（読み手ごとの倒れ方は ADR-0109）
  - id: FR48
    type: FR
    label: write-set の閉包
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4, N-3], acceptance: [AC21, AC73, AC82] }
    ears:
      pattern: unwanted
      condition: "intake に出された契約の行が閉じた型（variant を得る列挙・rules 行・完了の値・event の種類）を変えると宣言し、 base でその型を構造として持つ source file の集合（vessel 宣言が code の索引を名乗り base の索引が在る周は、 索引が別名・自分の型の短縮の構築・一括の取り込みを解いて名指す構築と match の場所の file を加えた集合）を write-set が含まないとき（導出が source を読めない周を含む）"
      response: "器は足りない file（読めない周はその source）を名指す typed な理由で契約を断り、 便を作らない（索引を作り中の周と作れない周の扱いは FR107）"
  - id: FR49
    type: FR
    label: 契約の審査
    priority: must
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2, N-1], acceptance: [AC22, AC68, AC73, AC81] }
    ears:
      pattern: event
      condition: 便が intake を通ったとき（契約表の行から契約 file が生成された直後）
      response: 器はその直後に、 契約とそれが実装する設計と要件を lens に読ませて verdict を採り、 その verdict を契約の中身（sha）付きで、 lens に渡した設計の節の本文の写しとともに便の記録に残し、 PASS でない便は runner を起こさず Reviewed の段で FAIL として終端する。 lens を撃つ周は、 器が材料を組む前に対象 repo の HEAD の commit を読み、 その commit を便の記録の dir の直下（材料の dir の外）に detach した審査の木を lens の cwd にして lens を読みの道具（FR5）で起こし、 判定の後に木を worktree の登録ごと外し、 木の commit id を審査の記録に残す（同じ path に前の周の木が在る周はそれを先に外し、 木を作れない周は lens を撃たずに INCONCLUSIVE として理由に審査の木を名指し、 anchor の作業木へ倒さない）。 ただし、 実物の base で組んだ判定の鍵（FR100）が、 basis が actual で判定が PASS の行の審査の記録と同じ周は、 lens を撃たず審査の木も作らずにその判定を写し、 写したことを段の記録に残す（判定の鍵に lens の cmd の字は入れない）。 契約の中身の同一性は、 契約の字と、 便の記録に残る設計の節の本文の写しの両方で判定し（写しを持たない便は契約の字だけで判定する）、 同じ中身で審査 FAIL の便が在る契約が列に入らないことは FR68 が定める
  - id: FR50
    type: FR
    label: land の終端
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC15, AC23, AC61, AC65, AC89] }
    ears:
      pattern: event
      condition: 便が main に着地して Landed に達したとき（PR で着地した便を除く・その close は FR96）
      response: vessel 宣言が任意 key remote（押す先）を持つ repo では、 器は着地した main をその remote へ push する前に、 remote の先端から main までの出ていく字面を公開の字面の走査（FR80 と同じ判定と publish の種類の rules 行・読む上限と締め切りは公開の segment と同じ値〔NFR5〕・公開先の repo は key remote が名指す remote）に掛ける。 当たる周（識別子に当たる周と読む上限を越える周）は push も close もせず（main の commit は remote へ出ない）、 その push で出る便の全部を Failed と記帳して終端させ（FR68 の着地済みの扱いから外し、 契約は release の印で起き直る）、 main が remote の先端に揃うまで以後の着地を止めて理由を出す（main を remote の先端に揃えるのは着地した commit を捨てる操作で、 3 クラス〔消す〕の承認として user に求める・FR16）。 判定できない周（rules 行が無い周・解けない周・締め切りを越えた周・host の面を読めない周〔FR57〕）は push も close もせずに、 その push で出る便の全部に失敗を記帳し、 次の Landed の周の push の前に同じ範囲を撃ち直す（通った周は、 先に失敗を記帳した便も close する）。 rules 行の enabled が false の周は走査しない。 push の後は push の先端（最後に着地した commit）の CI の結果を commit id で照合し、 台帳の便を着地の形の close の理由（FR91・着地 commit id を持ち、 理由の尾に CI の結果を持つ・尾の字面は ADR-0094）で close し（land の終端が台帳へ書くのは、 この close と、 remote を持たない repo の close と、 PR で着地した便の close〔FR96〕と、 memo の自動の close〔FR93〕だけで、 3 つの close の経路は ADR-0094 が持つ）、 終端の各手を typed な event として記帳する。 候補の木に並べた順に着地し push の先端でない便は、 自分の着地 commit を含む push の先端の commit の CI の結果で照合し、 理由の尾に先端の commit id も持つ。 CI の結果が success でなければ close せず失敗を記帳する。 vessel 宣言が任意 key remote を持たない repo の便は、 走査も push も CI の照合も撃たずに（出さない）、 台帳の便を着地の形の close の理由（着地 commit id を持ち、 理由の尾に CI の照合なしを持つ）で close する（vessel 宣言を読めない周は remote を持たないと読まず、 close せずに失敗を記帳する。 撃ち直しは器が自動では撃たず、 その便の終端だけを撃ち直す器の口〔pipe land --terminal-only・撃ち手の権能は FR41〕が、 撃った時点の宣言で本 FR の経路を選び直す）。
  - id: FR51
    type: FR
    label: 台帳の lint
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC24, AC51, AC57, AC61] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: "器は doctor の 1 項目として台帳の lint を提供し、 読み取り専用の台帳 adapter で台帳を読み、 解決できる設計 pointer（契約表の置き場の file の path と行の id）を持たない open な契約と、 tracked な設計 doc か research への pointer 無しに設計の中身を持つ open な memo を名指す。 label intake:question の bead（台帳の問い・FR81）は、 epic と decision の型の bead と同じく契約にも memo にも数えず名指さない。 同じ項目は、 処置の待ちの memo（局面の出力の memo-actionable・FR91）の本数と最古の年齢も出し、 notes の byte が rules 行 memo.notes_max_bytes（値は user 裁定 id 付き）を越えた open な memo も名指す（ADR-0089）"
  - id: FR52
    type: FR
    label: 設計 doc の散文の門
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC25] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: CI は全 tracked 設計 doc を検査し、 規範の印を持つ文が pointer（憲法の条・rules 行 id・要件 id・決定 id・契約 id のいずれか）を持ち数 + 単位を持たないことを確かめ、 違反する文を file と行で名指して非 0 で止める
  - id: FR53
    type: FR
    label: 契約 file の生成
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4, N-3], acceptance: [AC21, AC88] }
    ears:
      pattern: event
      condition: 設計 pointer（契約表の置き場の file の path と行の id）を添えて intake が要求され、 その pointer が解決したとき
      response: 器は記録した base の契約表の置き場の file からその行を読み、 便の契約 file をその行から生成する
  - id: FR54
    type: FR
    label: 設計 pointer の拒否
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC21, AC88] }
    ears:
      pattern: unwanted
      condition: intake に添えた設計 pointer が解決しないとき（pointer の file が、 受付が読む commit の契約表の置き場〔既定と、 その commit の vessel 宣言の contract-tables が足す分・FR47〕に無い・契約表の行・実装する設計の節のいずれかが無い）、 または契約 file が直接渡されたとき
      response: 器は断る理由（解決しないもの、 または契約 file の直接の受け渡し）を名指す typed な理由で契約を断り、 便を作らない
  - id: FR55
    type: FR
    label: 契約表の検査
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC26, AC77, AC82, AC83, AC87] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: CI は契約表の置き場の全 tracked な契約表の全行に、 intake と同じ write-set の閉包の導出（FR48。 ただし code の索引の分を除く字面の閉包）と設計 pointer の解決（FR54）と done の項目ごとの歯を名指す任意の欄の照らし（FR105）と code の事実を名乗る欄の形の照らし（FR47）を回し、 PR のときだけ比べる base の commit を渡してそこから変わった行に欄を求める検査（FR104）も回し、 違反する行を file と行で名指して非 0 で止める。 vessel 宣言の contract-tables の dir か file のどれかが tracked な file に 1 つも当たらないとき（tracked でない file にだけ当たるときも）と、 契約表の置き場の file 名の stem（契約 id の doc id）が重なるときも、 宣言の行か file を名指して非 0 で止める（ADR-0109）

  - id: FR56
    type: FR
    label: 禁じる語列の command の拒否
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC27] }
    ears:
      pattern: unwanted
      condition: 口座の設定を読む session（対話の席・口座の設定 dir を指定した起動・器を積まない session）または runner の session が撃つ Bash の command が manifest の禁じる語列（host-guard の口が読むのは発効している行だけ）のいずれかに当たるとき
      response: "器は実行の前に deny し（口座の設定を読む session には host-guard の口が掛かり、 器の plugin を積む席と runner には器の plugin の command guard も掛かり、 lens は対象の外。 host-guard の口は payload が読めない周も断る）、 断る理由に規則の出所と当たった並びを告げ、 intake は契約と vessel 宣言の verify 各行に同じ判定を掛け、 当たる行を行番号付きで断り便を作らない"

  - id: FR57
    type: FR
    label: host の面
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC28, AC31, AC41, AC50, AC64] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は host 固有の宣言値（口座 label・席に積む plugin dir・起動引数・群の表〔FR38・FR95・行の任意 key heartbeat は FR78〕・公開の除外の表〔FR80〕）を state dir の host の面 1 file だけから読み、 tracked の manifest と同じ読み手と同じ拒否の形で検査し、 rules 行を持つ file・両面で重複する口座 label・schema 外の項目・群の表の名が Tier1〜Tier9 の外か数字が重複するか宣言順が数字の昇順でない行（FR38）・key heartbeat が on と off の外の値の行（FR78）・裁定 id の欄が無いか空の公開の除外の表の行（FR80）と、 除外の要素を持つ publish の種類の rules 行（FR80・manifest の側の断りで、 帰結は rules 行が無い周と同じ fail-closed）を行番号付きで typed に拒み、 file が無い host では 0 宣言として続き、 在るが読めない host（拒む行を 1 つでも持つ host を含む）では host の面を読む口（計測・選定・管理 tick・doctor・席の起動・公開の字面の走査）が typed に止まる（公開の字面の走査は公開の segment を断る）

  - id: FR58
    type: FR
    label: 口座の登録と退役
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC28] }
    ears:
      pattern: event
      condition: 口座の登録・退役・復帰が要求されたとき
      response: 登録では器が口座の設定 dir を state dir の下に作り、 席の前提の設定だけを書き、 host の面に宣言を 1 行足し、 login 用の起動 command を user へ渡し（登録の口は credential を読まず書かない・既存の dir と宣言済みの口座 label は typed に断る）、 退役と復帰では設定 dir を可逆に動かして event を 1 件記録し、 席の登録 row（FR40）が持つ口座の退役は typed に断り、 退役の後はその口座を計測（FR33）と選定（FR36）の候補から外す（復帰で戻す）

  - id: FR59
    type: FR
    label: 席の起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC13, AC29, AC40, AC41, AC63] }
    ears:
      pattern: event
      condition: 器の口から席の起動が要求されたとき、 または群の移動（FR38）か管理 tick（FR27）が席の起こし直しを要求したとき
      response: 器は席の役割（orchestrator）を必須で受け、 口座を、 置き場が群に属する周は群の今の口座（用語・書き換えは FR38 の移動だけが行う・ADR-0049）に決め（引数が在って群の今の口座と違う周は typed に断る）、 それ以外の周は引数か session 用の口座選定（FR36・park の区画の置き場の席の候補は FR95・閾値未満の候補が無い周は FR69）で決め、 起動行を手書きの起動の雛形を読まずに導出し（起動行の構成は決定記録が正本）、 席の起こし直しの周（群の移動と管理 tick の起こし・FR38 / FR27）はその席の状態の打刻の最終行の会話 id を起動行で運んで会話の続きから再開し（会話 id の形でない周は運ばない・対話の記録の file は複写しない・運び方は ADR-0067 が正本）、 席の登録（FR40）を起動の前に書き、 target の窓の shell へ起動行を差し込み、 窓が無ければ作り tmux の session は作らず、 tmux の session が無い・入力欄に文字が在る・FR69 が断る周・口座が退役中・引数の口座が群の今の口座と違うのいずれかでは typed に断り key を 1 つも送らない

  - id: FR60
    type: FR
    label: 役割なしの起動（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC19] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は役割なしの対話 session を起こす subcommand を持たない（ADR-0045 §2 (2) で廃止）。 席の起動は役割を必須に受ける（FR59）。 不在は不在を測る歯が確かめる

  - id: FR61
    type: FR
    label: 導入先の同期
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC31] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は doctor の 1 項目として、 この host の導入先（install 帳簿が指す repo と worktree・席の登録 row の anchor）ごとに、 呼ばれる binary が自己申告する build 元 commit（測れない周は unknown）・plugin の読み込み元と hook 集合の digest・install 帳簿の記録・共有 cache の実体・scribe2 repo の HEAD を実測して 1 行に並べ、 食い違いを typed な語（none / binary / plugin / install）で名指し、 推測で埋めず、 自分の checkout を上流の既定 branch へ前進のみで揃え（揃えられない周は typed に断る）そこから binary を build して呼ばれる場所へ入れ、 その install を記録（sha・時刻・host）に残す 1 つの口を提供する

  - id: FR62
    type: FR
    label: hook 集合の食い違い（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC19] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は hook 集合の digest の食い違いを理由に席へ退避の合図を送らず、 席を作り直さない（ADR-0045 §2 (2) で廃止）。 食い違いの測定は導入先の同期（FR61）が doctor の行で名指す。 不在は不在を測る歯が確かめる

  - id: FR63
    type: FR
    label: statusline の描画（廃止）
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC19] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は開発 session の statusline を描く subcommand を持たず、 口座の設定に描画 command を書かない（ADR-0045 §2 (2) で廃止）。 不在は不在を測る歯が確かめる

  - id: FR64
    type: FR
    label: 管理 tick の駆動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC18, AC60] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は管理 tick（FR27）の unit（systemd user の service と timer の対）を登録 row（FR40）を持つ席ごとに導出して host の駆動機構へ置き有効化する口と、 退役 dir への移動で撤去する口を持つ。 unit の本文は NAME・target・置き場・binary・周期の rules 行と、 台帳 client（bd）の絶対 path（席の起動では host の面の宣言、 unit を入れる口と撤去の口では flag で渡したもの・どちらも無い導出の unit は台帳 client を名指さず、 その bytes は PATH の台帳 client の有無に依らない）から器が 1 関数で導出し（器自身は env・home・PATH を探して台帳 client を解かない〔素の名の解決は子 process の PATH に任せる〕・C2.2・ADR-0108）、 repo には入れず、 器の作った印の無い file は上書きも移動もせず、 有効化と撤去は 3 クラスに当たらない（ADR-0030 §2.1〜§2.5 の形・ADR-0058）。 doctor は flag の組（unit dir・binary・台帳 client）か host の面の組のどちらか 1 つを丸ごと使い（欄ごとに混ぜない）、 席ごとに unit の有無と一致を 1 行で言う。 台帳 client を持たない unit の tick は既定の素の名で台帳 client を撃ち、 撃てない周の全部の書き直しは入力を読めない周（FR90）になる

  - id: FR65
    type: FR
    label: 直命の表（廃止）
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC8, AC52, AC58] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: "器は user の発言を直命の表として持たず（席の指示文や復元へ運ぶ直命の記録を持たない）、 復元の DATA を出さない（ADR-0045 §2 (2) で廃止）。 user の逐語は承認 event（FR16）・発話 event と裁定の行（FR82）にだけ載り、 発話 event は裁定の行の写し元・到達点の計測の分類（FR22）・仕分け済みかの判定（FR88）・問いの起票との前後の比べ（FR89）・局面の出力の発話の部品（FR90）〔この 3 つは発話 event の ts と session と仕分けの event だけを読み、 逐語を読まない〕・席が ts を名指して 1 件を読む口（FR88）にだけ使い、 席の指示文・復元・合図・通知・局面の出力・doctor の行・turn の終わりの止めの理由へ逐語を運ばず（直命の表との線引きは ADR-0083 と ADR-0087）、 裁定は台帳の notes が持つ。 不在は不在を測る歯が確かめる"

  - id: FR66
    type: FR
    label: 取得の強制と自動退避（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC8] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は復元・退避の skill の起動に反応する hook・退避物の状態を注入する hook・自動圧縮の直前に AI が書く散文の退避物を書く hook・session の終端の理由を打刻する hook と、 skill そのものを持たない（ADR-0045 §2 (2) で廃止）。 器が session の開始と圧縮の直前に持つ口は FR42 の 2 つ（指示文と事実行の注入・圧縮の直前の 1 枠）だけである。 不在は不在を測る歯が確かめる

  - id: FR67
    type: FR
    label: 対話面の作法
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC17] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は orchestrator の席の指示文に user に向けて出す文の形（信頼度を上位に置く 1 体系の作法・本文は設計 doc 1 本が正本）を pointer 付きの 1 行で運び（指示文・rules 行には作法の則の本文を置かない）、 席でない process（runner / lens）には適用しない
  - id: FR68
    type: FR
    label: 便の自動起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC22, AC38, AC54, AC55, AC51, AC60, AC75, AC76] }
    ears:
      pattern: event
      condition: 便が終端の段（Landed / Failed / Stopped）に達したとき、 便を運ぶ器の process が退役したとき、 手動の 1 周が要求されたとき、 介入の印が記録された直後、 または回答 event（FR32）か approval.received（FR16）が記帳された直後
      response: "器の dispatcher は起動の列（台帳の open な契約のうち、 依存が閉じ ∧ 設計 pointer が解決し ∧ memo でなく ∧ 台帳の問い（label intake:question・FR81）でなく ∧ 同じ契約の中身で終端に達した便（審査（FR49）FAIL の便を含む）が無い契約の並び）を orchestrator の介入 first → 契約の priority → 起票順で評価し（起動の列の外の契約もこの順序の上の位置を持つ・FR102）、 終端でない段の便と write-set が交差せず（FR39 と同じ判定）∧ 受付（write-set の余地・host の memory の枠・同時走行の最大値〔rules 行 pipe.max_live・値は user 裁定 id 付き〕・契約表の行の閉包と code の索引と code の事実の判定〔FR48・FR107・FR109〕など）を通る契約を、 席の操作なしに条件を満たす本数だけ起こし（本数の絞りは受付の host の memory の枠と同時走行の最大値が行い、 受付が最大値で断った契約は列に留めて理由を持つ）、 起動の列の周に受付が契約を断ったときは、 断った契約ごとに断りの名と bead を event 1 件に記帳し（局面の出力〔FR90〕の入力）、 起動は通常の便の起動の段（受付 → 審査（FR49）→ runner の起動）をそのまま通り起動の前に待機の段を持たず、 契機が重なっても同じ契約を二重に起こさず、 同じ周で起こした便の write-set を次の候補の交差の相手に数え、 起こせない契約はまだ出ていない理由（依存 / 交差（Overlap）/ 受付 / 同時走行の最大値 / 終端に達した便（審査 FAIL を含む）/ hold / 未反映の裁定（unreflected-ruling・FR84）/ 床の検査の不合格（floor・FR85）/ 行の予約の待ち（reserved・FR102）/ 兄弟の待ち（sibling・FR103））を閉じた型で持って列に留め（未反映の裁定で待つのはその裁定 id を acceptance か notes で引く契約とその問いに blocks される契約だけで、 床の検査の不合格の間は介入 first の印を持つ契約（main を直す便に付ける印。 器は直す便かを判じない）のほかの全部の契約が待つ）、 hold の契約は起こさず release で戻し、 終端に達した便が起動の列から外した契約も release の印 1 つにつき 1 回だけ起動の列へ戻し（着地済みの便の契約は戻さず、 審査 FAIL の便の契約は中身が変わるまで戻さない・FR49）、 介入を起動の列の記録として残し、 便を運ぶ器の process が退役した便は同じ周で器が再開（FR37）を 1 回起こし（便を運ぶ器の process が残す所有者の印を持たない、 終端でない段の便は起こし直さない）、 所有者の印を持たなくても再開（FR14）を 1 回起こす便は次の 5 種に閉じ＝回答が記帳された Questioned の便（FR32 の回答を添える）・承認が記帳された Blocked の便（FR16 の承認を添える）・verdict が PASS の Gated の便（gate が再び要求されて〔FR8〕PASS が記録された便を含む）・regate（FR77）で Gated から Implemented へ戻され、 その後 gate を通っていない便（所有者の印が無いか印の process が退役した便。 印の process が退役した便の再開は本種目の再開（FR14）の 1 回に寄せ、 退役の節の再開（FR37・Implemented の便には当たらない）と同じ周で重なっても同じ便を二重には起こさない。 regate の記帳も追随の記帳も持たない Implemented の便は起こし直さない）・追随で最新の gate の後に Implemented へ戻され、 その後 gate を通っていない便（所有者の印が無いか印の process が退役した便。 regate の種目と同じ周に重なっても同じ便を二重には起こさず、 退役の節の再開〔FR37〕は Implemented の便に当たらないので重ならない・5 種目）、 verdict が PASS でない Gated の便と verdict を読めない Gated の便は起こさず、 verdict が PASS の Gated の便と regate で戻された便と追随で戻された便は専用の契機を持たず、 5 種とも上の契機の周で拾い、 便を運ぶ器の process が生きている便と生死を読めない便には触らず、 周期の timer を持たず、 台帳が読めない周は 1 本も起こさず測れなかったことを記帳する"
  - id: FR69
