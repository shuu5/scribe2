    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2, N-3], acceptance: [AC18, AC48, AC54, AC55, AC58, AC60, AC63, AC64] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: "器は開発 session（orchestrator の席）が黙っていないかを周期で見て、 登録 row（FR40）を持ち状態の打刻の最終行が idle で入力欄が空いている席にだけ、 台帳の現在地から続きを進めるよう促す打刻の合図（heartbeat）1 行を注入する管理 tick を持つ（ADR-0058・heartbeat を席ごとに決める口と実効の値と管理 tick の最後の周の打刻は FR78）。 打刻の合図の末尾には alarm（閉じた語 unreflected〔FR84 の置き場の file が id を 1 つ以上持つ周〕・floor〔FR85 の床の検査が不合格の周〕・unsorted〔局面の出力〔FR90〕に未仕分けの発話〔FR88〕が 1 つ以上在る周〕・owned〔局面の出力〔FR90〕に席の手番の閾値越えが 1 つ以上在る周〕・unreadable〔局面の出力が無いか読めない周〕・stale〔局面の出力が古さの印を持ち、 添える先の unsorted も owned も無い周〕）を足し、 局面の出力が古さの印を持つ周は unsorted と owned の語に閉じた 1 語 stale を添え（FR94・添える stale はその数が古いことを、 単独の stale は数えるものは無いが出力が古いことを言う）、 alarm は置き場の file だけを読んで決め（台帳も git も撃たない）、 合図を送らない周の席（FR78 の実効の値が off の席・梯子の列が尽きた席など）には alarm も届かず、 doctor の行（FR84・FR85・FR88・FR94）だけが知らせる。 送るのは席が最後の打刻から黙りの初段（rules 行 1 本・既定 30 分）以上黙り、 最後の合図から今の段の待ち（段 n の待ちは梯子の列の n 番目・列を越えた段は送らない）が経ち、 口座の門（群の逼迫〔FR38〕の閾値の rules 行のいずれか以上の口座の席には送らず、 計測〔FR33〕の記録の最新値だけを読んで計測は起こさず、 記録が無い・古い周は通す）を通った周だけで、 登録 row の口座が口座の墓標（FR97）の席は、 状態の打刻と梯子の記録を読まずに進み（群の席は群の移動の判定〔鮮度の窓に 1 回まで〕を撃ち、 移った周と群の今の口座の記録が既に登録 row の口座と違う周は移動の周の退避と起こし直し〔FR38〕へ進む）、 移らない周は入力欄の門の前で合図を送らず、 判定行の理由を heartbeat の実効の値が off の席（FR78）なら heartbeat-off・そうでなければ account-dead とし、 条件の列と順は ADR-0058 と ADR-0098 が正本で、 梯子の列と打ち切りの段は ADR-0068 が正本。 合図の間隔は席に変化が無ければ梯子の列（rules 行 1 本が持つ空でない昇順の秒の列・既定は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間）の順で伸ばし（backoff）、 梯子の列が尽きた段では送らず（合図は梯子の列の長さまで・既定 6 本）、 席に変化（状態の打刻の最終行の時刻 = 変化の digest が動く。 比べる基準は合図の後に席が idle へ戻った周に取る）があれば梯子の列の先頭へ戻す。 周期・黙りの初段・梯子の列は rules 行 3 本（user 裁定 id つき）が持ち、 係数と上限の行は持たない。 梯子の記録（最後に送った時刻・何本目か・変化の digest）は席の置き場の file 1 つで、 記録が読めない・書けない周は送らず理由を判定行に出す（fail-closed）。 自席の置き場が群に属する周は、 群の移動の判定（FR38・1 本の関数）を群ごとに鮮度の窓に 1 回まで host の lock の内側で撃ち、 その周だけ計測（FR33）を起こしてよく、 他の周は測らない（ADR-0066）。 自席の置き場が park の区画に属する周の移動の手と起こし直しの口座は FR95 が持つ。 登録 row を持ち窓が shell に戻った席（再起動・退避の後）は、 黙りと変化の判定（打刻の最終行の状態と梯子）を経ずに口座（群なら群の今の口座・park の区画なら FR95・どちらにも属さなければ row の口座）を決めて席の起動（FR59）で席の起こし直しを撃つ（FR28）。 群の今の口座が口座の墓標である群の席は、 起こす前に群の移動の判定（鮮度の窓に 1 回まで）を撃ってから群の今の口座を読み直す（起こす口座は FR59 が決める・判定を撃たない周と移り先の無い周は墓標の口座のまま起こす・ADR-0098）。 管理 tick の周は、 局面の出力（FR90）の部分の書き直しの契機であり、 台帳か main の印が局面の出力の入力の印と違い書き直しの下限（FR90）を過ぎた周は全部の書き直しの契機でもある（ADR-0108）。 便の起動の契機は FR68 が持つ"
