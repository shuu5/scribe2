  - { id: AC14, criterion: 走っている便と write-set が 1 file でも交差する契約を intake が typed な理由で断り便が作られず、 その便が終端に達した後は同じ契約が通る,                         metric_v: 0 件,  metric_l: 交差した便の同時走行, links: [FR1, FR39] }
  - { id: AC15, criterion: orchestrator の登録 row を持つ席から回答・承認・go の記帳が通り、 同じ席から行に無い権能（便の起動）を試みると deny され（deny 文に欠けた権能と rules 行の id）、 同じ席から便 1 本を名指す停止は通り stop --all は deny され（FR13）、 役割の記録の無い席からは記帳も起動も deny される,        metric_v: 0 件 + 便 1 本を名指す停止 1/1 + stop --all の deny 1/1,  metric_l: 権能の外の記帳,     links: [FR13, FR15, FR16, FR40, FR41, FR45] }
