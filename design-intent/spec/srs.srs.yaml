  - { id: AC31, criterion: fixture の install 帳簿と偽の導入先 2 つ（片方は worktree）で doctor を撃つと、 導入先ごとに 1 行が出て食い違いの語が none / binary / plugin / install のそれぞれで出る。 build 元 commit は版の表示口と同じ値で、 build 元を測れない build では unknown と出て失敗にしない。 1 つの口の更新が偽の上流へ前進のみで揃えて偽の build 器で install の記録を 1 行残し、 揃えられない周は typed に断る, metric_v: 行 2/2 + 食い違い 4/4 + unknown 1/1 + 記録 1/1 + 拒否 1/1, metric_l: 導入先の同期の測定と 1 つの口の更新, links: [FR57, FR61] }
  - { id: AC32, criterion: 偽の tmux で席を立て、 SessionStart の記録に hook 集合の digest A を持たせた後に読み込み元の digest を B へ変えると、 管理 tick が退避の合図を注入し、 退避して止まった後に立て直しが同じ target・同じ口座で走る。 hook 集合が同じで binary だけ変えた周は noop。 復元の DATA に plugin の版の 1 行が出る, metric_v: 注入 1/1 + 立て直し 1/1 + noop 1/1 + DATA 1/1, metric_l: hook 集合の食い違いでの席の作り直し, links: [FR23, FR29, FR38, FR62] }
  - { id: AC33, criterion: fixture の payload を器の描画に渡して得た 1 行を context 計測の pane 経路に読ませると組んだ値（使用率・使用量・窓）が戻り、 値の無い payload では当該 segment が無く 0% の字面も無く、 payload でない入力は空行と rc 0。 口座の登録で設定に器の描画 command が入り、 既存の設定は同じ key だけが置換されて他の key と順序が保たれ、 読めない設定は断って bytes が変わらない。 doctor の口座行と導入先の行が描画の出所を vessel / other / absent / unreadable の 4 語で出す, metric_v: 往復 1/1 + 欠落 1/1 + 空行 1/1 + 設定 1/1 + 置換 1/1 + 拒否 1/1 + 口座行 4/4 + 導入先の行 1/1, metric_l: statusline の描画と口座の設定, links: [FR25, FR29, FR58, FR59, FR61, FR63] }
  - { id: AC34, criterion: 偽の unit の置き場と偽の駆動機構（fixture）で席の tick の unit の導入を撃つと、 席ごとの 2 file が導出と bytes で一致して置かれ、 反映と有効化が順序どおり 1 回ずつ撃たれ、 器の生成物でない同名の file は上書きされず typed に断られ、 間隔の rules 行が無い周は既定値に倒れず断られる。 撤去は無効化の後に 2 file を退役 dir へ移して削除しない。 doctor が登録 row のある席ごとに installed / drift / absent / unreadable を出す, metric_v: file 2/2 + 反映と有効化 2/2 + 拒否 2/2 + 退役 1/1 + 4 語 4/4, metric_l: tick の unit の導入と撤去, links: [FR27, FR29, FR61, FR64] }

  - { id: AC35, criterion: 偽の event log に直命を 5 件（確認候補になる 3 件 = 発令から rules 行の日数を超えたもの・前提の bead が閉じたもの・前提の決定記録が置き換わったもの、 候補でない有効な直命 1 件、 裁定 id 付きで閉じた直命 1 件）足して復元を撃つと、 有効な直命 4 件が逐語で列挙され（閉じた 1 件は列挙されない）、 確認候補が理由の語（経過 / 前提の終端 / 前提の置換）付きで 3 件だけ印され（候補でない 1 件に印は無い）、 器は直命の状態を変えない。 直命の追加では器が時刻を打ち逐語を保ち、 閉じる記録は結果と裁定 id を伴う, metric_v: 列挙 4/4 + 閉じた不在 1/1 + 候補 3/3 + 非候補の印 0/1 + 逐語 1/1 + 時刻 1/1 + 裁定 id 1/1, metric_l: 直命の表と確認候補, links: [FR65] }
  - { id: AC36, criterion: hook の入力の fixture で復元 skill の起動を渡すと復元の DATA が文脈への注入として返り、 退避 skill の起動では現在地の DATA が返り、 session の開始では退避物の状態（found / missing / unreadable の 3 語）の 1 行が返る。 自動圧縮の直前の hook で自席の退避物が無ければ現在地と持ち越し分だけの退避物が書かれて圧縮は止まらず、 在れば何も書かれず、 読めなければ何も書かずに理由の 1 行が返る。 session の終端の理由が席の状態に打刻され、 退避物の無いまま終わった session の件数が doctor の席の行に出る, metric_v: 注入 3/3 + 状態の語 3/3 + 自動退避 3/3 + 打刻 1/1 + doctor 1/1, metric_l: 取得の強制と自動退避, links: [FR23, FR66] }
  - { id: AC37, criterion: 登録 row のある planner の席の指示文に、 雛形が設計 doc を指す pointer 付き 4 行のうち対話面の作法の行 3 本（文の形・信頼度・brief の 5 slot）が在り、 管理席の指示文にはその行が 0 本（走査した行数を母集団として出す）で、 pointer の無い行（規範文）が指示文で 0・復元 skill の本文で 0（どちらも走査した行数を母集団として出す）・rules manifest に対話面の作法の行が 0（rules 行数を母集団として出す）である, metric_v: 行 3/4 + 管理席 0/N + 指示文の規範文 0/N + skill の規範文 0/M + rules 行 0/R, metric_l: 対話面の作法, links: [FR30, FR67] }
requirements:
  - id: FR1
    type: FR
    label: 契約の検査
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC6, AC14] }
    ears:
      pattern: unwanted
      condition: 契約 file（契約表の行から生成した写し・必須 field の集合は生成の型が持つ）に必須 field の欠落・複数行の verify・write-set 0 本が在るとき
      response: 全件を行番号付きで集めて拒否し、 便を作らない
  - id: FR2
    type: FR
    label: 契約の pointer
    priority: must
    vmethod: I
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC2] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 契約は SRS の要件 id と設計 doc を pointer で持ち、 設計 1 本から契約が複数出る形を保つ（適用対象は本 SRS を根拠に起票する契約・v1 由来の既存 bead は対象外）
  - id: FR3
    type: FR
    label: 便の永続
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC4] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 各段は fleet の event log を replay して現在地を読み、 段の終わりに event を 1 件追記する（process の記憶に状態を持たない）
  - id: FR4
    type: FR
    label: runner の起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1] }
    ears:
      pattern: event
      condition: 便が Intake 段にあり spawn が要求されたとき
      response: base を記録し、 worktree を切り、 write-set の allowlist を書いて runner を headless で起動する
  - id: FR5
    type: FR
    label: runner と lens の口
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1, AC2, AC10] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: runner と lens は claude -p（headless・stdin に契約 / diff・stdout に構造化 1 行・permission を毎回明示・口座は環境変数で切替）の 1 形で呼ぶ
  - id: FR6
    type: FR
    label: 完了判定
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC1] }
    ears:
      pattern: event
      condition: runner が終了したとき
      response: rc 0 かつ base からの commit が 1 件以上なら Implemented、 それ以外は Failed と記帳する
  - id: FR7
    type: FR
    label: 入口の flip check
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC3] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 変更した .rs ごとに、 test 差分だけを base に当てて新規・変更 test が 1 本以上 RED になり、 かつ HEAD では GREEN であることを機械で確かめ、 docs-only でない変更に test 差分が無ければ拒む
  - id: FR8
    type: FR
    label: gate の機械検証
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC3, AC20] }
    ears:
      pattern: event
      condition: gate が要求されたとき
      response: 契約の verify 各行を worktree で実走して行ごとの rc を記録し、 1 本でも rc が 0 でなければ FAIL とする
  - id: FR9
    type: FR
    label: lens の verdict
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC3] }
    ears:
      pattern: unwanted
      condition: lens が要るのに lens が無い・diff が予算 cap を超える・stdout が parse できない・verdict が 3 値の外のとき
      response: PASS を名乗らず INCONCLUSIVE とする
  - id: FR10
    type: FR
    label: land の前提
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC3] }
    ears:
      pattern: unwanted
      condition: verdict が PASS でない、 または main の tip が記録した base と一致せず追随できない（base が main の祖先でない、 または worktree が clean でない）とき
      response: land は何もしない（main も event も変えない）
  - id: FR11
    type: FR
    label: land
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1] }
    ears:
      pattern: event
      condition: verdict が PASS で前提が揃ったとき
      response: worktree の tree を squash 1 commit で main に載せ（tree 同一・CAS）、 main で verify を再実走し、 RED なら Failed と記帳して止まる
  - id: FR12
    type: FR
    label: verdict export
    priority: should
    vmethod: T
    rationale_source: N-5
    trace: { backward: [N-5], acceptance: [AC1] }
    ears:
      pattern: event
      condition: land が成立したとき
      response: verdicts.jsonl に schema 版付きで 1 行 append し、 Landed と記帳する（跨版の観測面）
  - id: FR13
    type: FR
    label: stop
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC4] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: stop --all は live な runner を止め、 rc を 0（全部止まった / 対象なし）・1（残った）・2（state が読めない）の 3 値で返す冪等な 1 コマンドである
  - id: FR14
    type: FR
    label: resume
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC4, AC10, AC12] }
    ears:
      pattern: event
      condition: 別 process で resume が要求されたとき
      response: event log の現在地から続きの段だけを通し、 Landed まで到達できる
  - id: FR15
    type: FR
    label: 承認の停止
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC5, AC15] }
    ears:
      pattern: event
      condition: 契約が不可逆操作（消す / 出す / 使う）を名乗る段に達したとき
      response: approval.requested を記帳して Blocked で止まり、 人の入力を待たずに process を終える
  - id: FR16
    type: FR
    label: 承認の再開
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC5, AC15] }
    ears:
      pattern: event
      condition: 人が approve を逐語付きで与えたとき
      response: approval.received（逐語付き）を記帳し、 次の resume で続きを通す
  - id: FR17
    type: FR
    label: rules manifest
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC6, AC17] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 規則の種類は閉じた enum と網羅 match で持ち、 値は tracked な manifest 1 file から起動時に読む
  - id: FR18
    type: FR
    label: rules の検査
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC6, AC17] }
    ears:
      pattern: unwanted
      condition: manifest に未知 kind・id 重複・型不一致・user 由来で裁定 id の無い行が在るとき
      response: 起動前に全件を行番号付きで拒否する（黙って落とさない）
  - id: FR19
    type: FR
    label: marker と hook
    priority: must
    vmethod: T
    rationale_source: N-5
    trace: { backward: [N-5], acceptance: [AC7] }
    ears:
      pattern: state
      condition: marker（.vessel）が自分の NAME を言っている間
      response: hook は SessionStart で名乗りを出す
  - id: FR20
    type: FR
    label: in-loop guard
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC7, AC16] }
    ears:
      pattern: unwanted
      condition: 契約の write-set の外へ Edit / Write しようとしたとき
      response: 編集の時点で deny し、 policy が読めなければ fail-closed で deny する
  - id: FR21
    type: FR
    label: 注入計測の slot
    priority: should
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2], acceptance: [AC7] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: hook は自分の出力 1 行を（who / what / when / bytes / tokens / wall）の schema で記録し、 v3 の計測 store を後付けできる形を保つ
  - id: FR22
    type: FR
    label: 人手 0 の計測
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1, AC2, AC10, AC23] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 到達点の計測では人由来の event を数え、 approval 以外が 0 件であることを機械で示す
  - id: FR23
    type: FR
    label: 開発 session の作業記憶
    priority: should
    vmethod: I
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC8, AC32, AC36] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 退避と復元を器の subcommand として提供し、 作法 9 本（退避物は session id で一意、 消費済みは同一 suffix で表し、 消費は move、 DATA が無い周は brief を出さず、 別 session の退避物は自動消費せず、 重複起動は冪等、 退避物の置き場は state dir の席ごとの dir で repo の作業ツリーには置かず、 repo の作業ツリーに残る退避物は doctor が数え、 同じ session id の未消費の退避物が在る周の再退避は前の file を置換名へ rename して置き換え削除しない）を満たし、 復元の DATA は出所 pointer を持たない行（暫定行）を印付きで列挙して次の cycle に引き継がない
  - id: FR24
    type: FR
    label: 管轄外での沈黙
    priority: must
    vmethod: T
    rationale_source: N-5
    trace: { backward: [N-5], acceptance: [AC7] }
    ears:
      pattern: unwanted
      condition: marker（.vessel）が無い、 または別の NAME を言っているとき
      response: hook は stdout 0 byte・rc 0 で黙り、 その repo を 1 byte も汚さない

  - id: FR25
    type: FR
    label: 開発 session の context 計測
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC9, AC33] }
    ears:
      pattern: event
      condition: 開発 session の context 使用量を問われたとき
      response: context 使用量を出所付きで 1 件返し、 取れない周は rc ≠ 0 で「取れなかった」と言う（0% に化けない）
  - id: FR26
    type: FR
    label: 開発 session の cap guard
    priority: should
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC9] }
    ears:
      pattern: event
      condition: 編集 tool の hook が開発 session で呼ばれたとき
      response: context 使用量を rules 行の上限と比べ、 上限以上なら退避の口以外の編集を deny し理由 1 行を出す。 上限未満なら deny しない。 測れないときは deny せず理由を注入計測の記録の what に残す
  - id: FR27
    type: FR
    label: 管理 tick
    priority: should
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC9, AC34] }
    ears:
      pattern: state
      condition: context 使用量が rules 行の上限未満か測れない周で、 開発 session の口座の使用率が session 用の閾値未満（FR38）で、 開発 session が idle で、 自 session の未 consumed の退避物が無く、 cycle が走っていない間
      response: 管理 tick が打刻の合図 1 行を注入する（合図には席の queue から取った続きの pointer を載せる〔FR43〕・この条件が 1 つでも崩れていれば注入しない）
  - id: FR28
    type: FR
    label: cycle
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC9, AC13] }
    ears:
      pattern: event
      condition: 開発 session が作業記憶の退避を終えたとき
      response: 排他を取って session の作り直しと復元の command を注入する（二重起動 0・退避物が無い session には撃たない）
  - id: FR29
    type: FR
    label: 退避の合図
    priority: should
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC9, AC13, AC32, AC33, AC34] }
    ears:
      pattern: state
      condition: 開発 session の context 使用量が rules 行の上限以上で、 自 session の未 consumed の退避物が無く、 cycle が走っていない間
      response: 管理 tick が idle を待たずに退避の合図 1 行を注入する（使用量が測れない周・退避物が在る周・cycle が走っている周は注入しない）

  - id: FR30
    type: FR
    label: 配送構造
    priority: should
    vmethod: A
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC10, AC37] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 便の配送構造は planner と管理席の 2 役割の席からなり（席数と一意性は FR40）、 口座は便ごとに FR36 が選び、 管理席は契約を pipeline に流す・runner の質問を planner へ中継する・go の後に land する の 3 つを担い、 自分の手で実装するのは pipeline が回せない便だけとする
  - id: FR31
    type: FR
    label: 質問の停止
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC10] }
    ears:
      pattern: event
      condition: runner が契約の不足を typed な質問 record で返して止まったとき
      response: pipeline は便を Questioned の段に倒し、 質問 event を逐語付きで記帳し、 回答 event が無い間は再開しない
  - id: FR32
    type: FR
    label: 質問の再開
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC10] }
    ears:
      pattern: event
      condition: Questioned の便に回答 event（逐語付き）が記帳された状態で resume が要求されたとき
      response: 同じ便を続きの段から通し、 質問と回答の逐語を runner の入力に添える

  - id: FR33
    type: FR
    label: 口座残量の計測
    priority: should
    vmethod: D
    rationale_source: N-2
    trace: { backward: [N-1, N-2], acceptance: [AC11, AC12] }
    ears:
      pattern: event
      condition: 口座残量の計測が要求されたとき
      response: manifest に列挙した口座（退役中の口座を除く・FR58）ごとに、 5 時間窓・7 日窓・モデル別 7 日窓の口座残量と reset 時刻を口座の endpoint から 1 コマンドで読み、 出所（口座・endpoint・時刻）付きの実測値（Measured）として fleet の event log に記録し、 読めない回は理由付きで「測れなかった」を記録して 0 の値に読み替えない
  - id: FR34
    type: FR
    label: 追随
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1] }
    ears:
      pattern: event
      condition: land が要求され、 verdict が PASS で、 worktree が clean で、 main の tip が記録した base より進み、 base が main の祖先であるとき
      response: worktree の branch を main へ rebase して gate をやり直し、 進んだ base と衝突の事実を event に記帳する。 衝突した周は rules 行が持つ上限までは終端にせず、 上限に達した周は Failed で終端する。 rebase で便の変更が既に main に在る（commit が空になる）周は gate をやり直さず記帳して終端する。 main は変えない

  - id: FR35
    type: FR
    label: 上限停止の検知
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC12] }
    ears:
      pattern: event
      condition: 便の runner が上限 record（ADR-0012 の typed な record・口座の上限の合図）で止まったとき
      response: 器はその停止を、 どの口座のどの窓かが分かる typed な event として記帳し、 worktree と便の記録を保ち、 便を Failed にしない
  - id: FR36
    type: FR
    label: 口座選定
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC12, AC13, AC28, AC29] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 口座は、 manifest に宣言した口座（退役中の口座は FR58 で候補から外れ、 便用は席の登録 row を持つ口座を除く）と実測した口座残量（FR33）だけから決定的に選び、 便用（口座残量を使い切る側）と開発 session 用（余裕を残す側）の 2 つの規則を持ち、 規則の値は rules 行 R-C9-1（user 裁定で発効）だけから取る
  - id: FR37
    type: FR
    label: 別口座での途中再開
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC12] }
    ears:
      pattern: event
      condition: FR35 で記帳された便の再開が要求されたとき（この便の再開は FR14 に優先する）
      response: 器は FR36 で別の口座を選び、 同じ worktree と同じ契約（回答済みの質問を添えて・FR32）で runner を起こし直し、 記帳した段から Landed まで続ける。 候補となる口座が無い周は便を Failed にせず、 いずれかの口座の窓が最も早く reset する時刻まで待ってから再開する
  - id: FR38
    type: FR
    label: 開発 session の上限前の退避
    priority: should
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC13, AC32] }
    ears:
      pattern: state
      condition: 開発 session の口座の窓（5 時間・7 日・モデル別 7 日）の使用率が session 用の rules 行の閾値以上である間
      response: 管理 tick は FR29 と同じ除外（退避物が在る周・cycle が走っている周は注入しない）の下で idle を待たずに退避の合図を注入し、 session が退避して止まった後は FR36 で選んだ別の口座で session を立て直して復元の command を注入する（FR28）
  - id: FR39
    type: FR
    label: intake の排他
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC14] }
    ears:
      pattern: unwanted
      condition: 契約が intake に出され、 その write-set が終端でない段の便の write-set と交差するとき
      response: 器は交差する file と相手の便を名指す typed な理由で契約を断り、 便を作らない。 相手の便が終端の段に達するか止められた後は、 同じ契約を受け付ける
  - id: FR40
    type: FR
    label: 席の登録
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC15, AC29] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は開発 session の席ごとの役割を閉じた一覧の値として持ち、 席の識別子（役割, anchor）を鍵に、 席の target・口座 label・起動の雛形を項目として fleet の event log へ記録し、 役割の記録が無い席をどの権能も持たない席として扱う。 1 つの anchor に planner は 1 席・管理席は 1 席とする
  - id: FR41
    type: FR
    label: 権能の所在
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC15] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 役割ごとの権能は rules manifest の行（裁定 id 付き）が持ち、 承認の記帳は rules 行 R-C7-1 が名指す対話面の役割の権能とする
  - id: FR42
    type: FR
    label: 席の指示文の注入
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC17] }
    ears:
      pattern: event
      condition: 開発 session の席で session の文脈が初期化されるとき
      response: 器は、 その席に役割の記録が在ればその役割の manifest 行と役割ごとの雛形から生成した指示文を session の文脈へ直接注入し（入力欄を経由しない）、 役割の記録が無ければ注入しない。 生成した指示文は行が持つ権能をすべて名指し、 雛形の外に手書きの規範文を含まない（両向きの drift は CI が検査する・FR18）
  - id: FR43
    type: FR
    label: 席の継続
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC18] }
    ears:
      pattern: event
      condition: 管理 tick が打刻の合図を注入する周（FR27）に、 その席の queue（席に向けた dispatch・席宛ての質問・裁定済みの次の行動）が空でないとき
      response: 器は続きの pointer（queue の先頭を指す 1 行）を打刻の合図に載せる。 queue の項目がすべて user の 3 クラス承認か裁定の待ちであるときは合図ごと注入しない（正当な idle）
  - id: FR44
    type: FR
    label: 席間の連絡
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC19] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 開発 session の席どうしの連絡は席の入力欄を経由しない経路で届け、 届いたことは端末の描画でなく経路自身の記録で確かめ、 入力欄への注入は器の管理 tick の合図（打刻・退避）と復元の command にだけ使う
  - id: FR45
    type: FR
    label: 権能の執行
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC15, AC16] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 権能で守られた操作はその権能を持つ役割の席からだけ通し、 検査は編集・実行の時点で（in-loop に）行い、 断るときは権能を持つ役割の名を告げる。 契約が typed な印で開いた便の write-set の内側に限り、 管理席の code の編集を通す
  - id: FR46
    type: FR
    label: 縮退
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC20] }
    ears:
      pattern: event
      condition: 封じ込めか受付の枠が使えない host で便が起動されたとき
      response: 器は並列度 1 で進み、 便を断らず、 縮退の事実と理由を record に残す

  - id: FR47
    type: FR
    label: 契約の正本
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4, N-3], acceptance: [AC21] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 契約は tracked な設計 doc の契約表の 1 行（少なくとも要件 id・実装する設計の節・write-set・検証を持つ）だけから取る
  - id: FR48
    type: FR
    label: write-set の閉包
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4, N-3], acceptance: [AC21] }
    ears:
      pattern: unwanted
      condition: intake に出された契約の行が閉じた型（variant を得る列挙・rules 行・完了の値・event の種類）を変えると宣言し、 base でその型を構造として持つ source file の集合を write-set が含まないとき（導出が source を読めない周を含む）
      response: 器は足りない file（読めない周はその source）を名指す typed な理由で契約を断り、 便を作らない
  - id: FR49
    type: FR
    label: 契約の審査
    priority: must
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2, N-1], acceptance: [AC22] }
    ears:
      pattern: event
      condition: 便が intake を通ったとき
      response: 器は runner を起こす前に、 契約とそれが実装する設計と要件を lens に読ませて verdict を採り、 その verdict を便の段として記帳し、 verdict が PASS でない便の runner を起こさない
  - id: FR50
    type: FR
    label: land の終端
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC23] }
    ears:
      pattern: event
      condition: 便が Landed に達したとき
      response: 器は着地した main を remote へ push し、 着地 commit の CI の結果を commit id で照合し、 台帳の便を着地 commit id と CI の結果を持つ 1 行の note 付きで close し（台帳へはそれ以外を書かない）、 終端の各手を typed な event として記帳する。 CI の結果が success でなければ close せず失敗を記帳する
  - id: FR51
    type: FR
    label: 台帳の lint
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC24] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は doctor の 1 項目として台帳の lint を提供し、 読み取り専用の台帳 adapter で台帳を読み、 解決できる設計 pointer（設計 doc の path と契約 id）を持たない open な契約と、 tracked な設計 doc か research への pointer 無しに設計の中身を持つ open な memo を名指す
  - id: FR52
    type: FR
    label: 設計 doc の散文の門
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC25] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: CI は全 tracked 設計 doc を検査し、 規範の印を持つ文が pointer（憲法の条・rules 行 id・要件 id・決定 id・契約 id のいずれか）を持ち数 + 単位を持たないことを確かめ、 違反する文を file と行で名指して非 0 で止める
  - id: FR53
    type: FR
    label: 契約 file の生成
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4, N-3], acceptance: [AC21] }
    ears:
      pattern: event
      condition: 設計 pointer（設計 doc の path と契約 id）を添えて intake が要求され、 その pointer が解決したとき
      response: 器は記録した base の設計 doc からその行を読み、 便の契約 file をその行から生成する
  - id: FR54
    type: FR
    label: 設計 pointer の拒否
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC21] }
    ears:
      pattern: unwanted
      condition: intake に添えた設計 pointer が解決しないとき（設計 doc・契約表の行・実装する設計の節のいずれかが無い）、 または契約 file が直接渡されたとき
      response: 器は断る理由（解決しないもの、 または契約 file の直接の受け渡し）を名指す typed な理由で契約を断り、 便を作らない
  - id: FR55
    type: FR
    label: 契約表の検査
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC26] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: CI は全 tracked 設計 doc の契約表の全行に、 intake と同じ write-set の閉包の導出（FR48）と設計 pointer の解決（FR54）を回し、 違反する行を file と行で名指して非 0 で止める

  - id: FR56
    type: FR
    label: 禁じる語列の command の拒否
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC27] }
    ears:
      pattern: unwanted
      condition: 席または runner の session が撃つ Bash の command が manifest の禁じる語列のいずれかに当たるとき
      response: 器は実行の前に deny し、 断る理由に規則の出所と当たった並びを告げ、 intake は契約と対象 repo の宣言 file の verify 各行に同じ判定を掛け、 当たる行を行番号付きで断り便を作らない

  - id: FR57
    type: FR
    label: host の面
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC28, AC31] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は host 固有の宣言値（口座 label・席に積む plugin dir・起動引数）を state dir の host の面 1 file だけから読み、 tracked の manifest と同じ読み手と同じ拒否の形で検査し、 rules 行を持つ file・両面で重複する口座 label・schema 外の項目を行番号付きで typed に拒み、 file が無い host では 0 宣言として続き、 在るが読めない host では typed に止まる

  - id: FR58
    type: FR
    label: 口座の登録と退役
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC28, AC30, AC33] }
    ears:
      pattern: event
      condition: 口座の登録・退役・復帰が要求されたとき
      response: 登録では器が口座の設定 dir を state dir の下に作り、 席の前提の設定だけを書き、 host の面に宣言を 1 行足し、 login 用の起動 command を user へ渡し（credential は読まず書かない・既存の dir と宣言済みの口座 label は typed に断る）、 退役と復帰では設定 dir を可逆に動かして event を 1 件記録し、 席の登録 row（FR40）が持つ口座の退役は typed に断り、 退役の後はその口座を計測（FR33）と選定（FR36）の候補から外す（復帰で戻す）

  - id: FR59
    type: FR
    label: 席の起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC29, AC30, AC33] }
    ears:
      pattern: event
      condition: 器の口から席の起動が要求されたとき
      response: 器は席の役割を必須で受け、 口座を引数か session 用の口座選定（FR36）で決め、 起動行を手書きの起動の雛形を読まずに導出し（起動行の構成は決定記録が正本）、 席の登録（FR40）を起動の前に書き、 立て直し（FR38）と同じ経路で target の窓の shell へ起動行を差し込み、 窓が無ければ作り tmux の session は作らず、 tmux の session が無い・入力欄に文字が在る・口座の候補が無い・口座が退役中のいずれかでは typed に断り key を 1 つも送らない

  - id: FR60
    type: FR
    label: 役割なしの起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC30] }
    ears:
      pattern: event
      condition: 器の口から役割なしの対話 session の起動が要求されたとき
      response: 器は口座 label を必須で受け（役割は受けず、 席の登録（FR40）を書かず、 権能を与えない）、 口座の設定 dir を session の設定の出所として起動行に載せ、 cwd を anchor（省略時は現在の repo）に置き、 再開する session の id が在れば同じ口座でその session を再開する起動行を席の起動（FR59）と同じ導出で組み、 target の窓が与えられた周は FR59 と同じ経路で差し込み、 与えられない周は起動行を stdout に 1 行出して自分では起動せず、 口座が宣言に無い・退役中・設定 dir が無いのいずれかでは typed に断り key を 1 つも送らない

  - id: FR61
    type: FR
    label: 導入先の同期
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC31, AC33, AC34] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は doctor の 1 項目として、 この host の導入先（install 帳簿が指す repo と worktree・席の登録 row の anchor）ごとに、 呼ばれる binary が自己申告する build 元 commit（測れない周は unknown）・plugin の読み込み元と hook 集合の digest・install 帳簿の記録・共有 cache の実体・scribe2 repo の HEAD を実測して 1 行に並べ、 食い違いを typed な語（none / binary / plugin / install）で名指し、 推測で埋めず、 自分の checkout を上流の既定 branch へ前進のみで揃え（揃えられない周は typed に断る）そこから binary を build して呼ばれる場所へ入れ、 その install を記録（sha・時刻・host）に残す 1 つの口を提供する

  - id: FR62
    type: FR
    label: hook 集合の食い違い
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC32] }
    ears:
      pattern: state
      condition: 席が起動時に受けた hook 集合の digest と、 現在の plugin の読み込み元の hook 集合の digest（導入先の同期（FR61）の測定値）が違う間
      response: 管理 tick は退避の合図（FR29）と同じ除外の下でその席に退避の合図を注入し、 席が退避して止まった後は立て直し（FR38）と同じ経路で同じ target に同じ口座で席を作り直し、 復元の DATA（FR23）に plugin の版（hook 集合の digest・build 元 commit・食い違いの語）を 1 行載せる

  - id: FR63
    type: FR
    label: statusline の描画
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC33] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は開発 session の画面の 1 行（statusline）を器の subcommand が Claude Code の payload だけから組む形で描き（file・env・子 process を読まず、 無い値の segment は描かず、 payload でない入力は空行で claude を止めない）、 その行の先頭の形を context 計測（FR25）の読み手の逆像として同じ 1 つの規則で持ち、 口座の登録（FR58）で作る口座の設定に器の描画 command を書き、 既存の口座は器の口で同じ key だけを置換し、 doctor の口座行と導入先の行（FR61）が描画の出所を typed な語（vessel / other / absent / unreadable）で名指す

  - id: FR64
    type: FR
    label: 管理 tick の駆動
    priority: should
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC34] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は席の管理 tick（FR27）を周期で撃つ tick の unit の導入と撤去を 1 つの口として提供する。 導入では席の target・状態の置き場・作業記憶の置き場・binary・unit の置き場を引数で受け（env・home・自分の実行 file の場所を読まない）、 席ごとの unit を 1 関数で導出して中途の file を残さず置き、 間隔を rules 行から取り（読めない周は既定値に倒さず typed に断る）、 器の生成物でない同名の file は上書きせず typed に断り、 置いた後に host の駆動機構へ反映して有効化する。 撤去では無効化の後に unit を退役 dir へ可逆に移して削除しない。 doctor は登録 row のある席ごとに unit の有無と一致を typed な語（installed / drift / absent / unreadable）で名指す

  - id: FR65
    type: FR
    label: 直命の表
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC35] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は planner の席で user が言った発言（直命）を器の event log に 1 件ずつ typed に持ち（発令時刻は器が打ち、 逐語は書き換えず、 前提の pointer と状態〔有効 / 完了 / 撤回 / 失効〕を運ぶ）、 復元の DATA に有効な直命を逐語で列挙し、 発令から rules 行の日数を超えた直命・前提の bead が閉じた直命・前提の決定記録が置き換わった直命を確認候補として理由の語付きで印し、 直命を閉じる記録は結果（完了 / 撤回 / 失効）と裁定 id を伴い、 直命が続くかの判定は器が行わず対話面の user が行う

  - id: FR66
    type: FR
    label: 取得の強制と自動退避
    priority: should
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC36] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は hook を 4 つ備える。 復元 skill の起動に反応して復元の DATA を、 退避 skill の起動に反応して現在地の DATA（anchor の先端・走行中の便・席の状態・前回の退避からの着地）を開発 session の文脈へ注入する hook（skill は止めない）、 session の開始で自席の退避物の状態（found / missing / unreadable の 3 語）を 1 行注入する hook、 自動圧縮の直前に自席の退避物が無ければ現在地と持ち越し分だけの退避物を自動で書いて圧縮は止めない hook、 session の終端の理由を席の状態に打刻する hook である。 doctor は退避物の無いまま終わった session の件数を席ごとに名指す

  - id: FR67
    type: FR
    label: 対話面の作法
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC37] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は planner の席の指示文に user に向けて出す文の形（信頼度を上位に置く 1 体系の作法・本文は設計 doc 1 本が正本）を pointer 付きの行で運び（指示文・skill・rules 行には規範文を置かない）、 planner の席でない席には適用しない

nfr:
  - { id: NFR1, type: NFR, label: lens 予算,   category: 性能, target: 1 lens は 0.15M token 以内（目標値）,                                measure: lens 起動時の diff byte と cap の照合を verdict に記録,        vmethod: T, trace: { backward: [N-2], acceptance: [AC3] }, hero: { cat: 予算, big: "0.15", unit: M token, qual: lens 1 本あたりの上限 } }
  - { id: NFR2, type: NFR, label: 契約の大きさ, category: 大きさ, target: 1 契約の diff は 300 行程度・見積は 550 行以内,                      measure: PR の diff 行数と契約の見積を記録して照合,                   vmethod: A, trace: { backward: [N-4], acceptance: [AC2] }, hero: { cat: 小ささ, big: "300", unit: 行, qual: 1 契約の diff の目安 } }
  - { id: NFR3, type: NFR, label: 依存,        category: 依存, target: 実行時の直接依存 0 本・std だけで build（allowlist の外は歯が落とす）,   measure: cargo xtask check の deps-empty と cargo deny を CI で毎回,     vmethod: T, trace: { backward: [N-2], acceptance: [AC6] }, hero: { cat: 依存, big: "0", unit: 本, qual: 実行時の直接依存 } }
  - { id: NFR4, type: NFR, label: fail-closed, category: 安全, target: 不正入力を黙って落とす件数 0・読めない store は rc 2,                     measure: fixture 実走（壊した行・未知 kind）で全件 loud を確認,           vmethod: T, trace: { backward: [N-3], acceptance: [AC6] }, hero: { cat: 安全, big: "0", unit: 件, qual: 黙って落とす入力 } }
  - { id: NFR5, type: NFR, label: hook の予算,  category: 応答, target: hook は binary 1 本の 1 回呼出しで 2.0 秒以内・重い I/O を持たない,      measure: hook の wall time を注入計測の slot に記録,                   vmethod: T, trace: { backward: [N-2], acceptance: [AC7] }, hero: { cat: 速さ, big: "2.0", unit: 秒, qual: hook 1 回の上限 } }
  - { id: NFR6, type: NFR, label: host の資源,  category: 安全, target: 封じ込めの外で走る器の子 process 0 本・変異検査の並列度は受付の枠から, measure: 便ごとに封じ込めの有無・並列度・縮退の理由が record に残ることを fixture で確認, vmethod: T, trace: { backward: [N-1, N-2], acceptance: [AC20] }, hero: { cat: 資源, big: "0", unit: 本, qual: 封じ込めの外で走る子 process } }

constraints:
  - { id: CON1, label: 憲法,     text: 憲法（Always 16 / Ask-first 4 / Never 4）を本書の上位に置き、 矛盾する要件を書かない,            regulation: 憲法 v0.4.6 }
  - { id: CON2, label: 公開,     text: 本 repo は PUBLIC。 絶対 path・host 名・口座名・user 逐語を tracked file に書かない,             regulation: 憲法 A1（出す） }
  - { id: CON3, label: 歯,       text: test は Rust の 1 framework だけで、 bash / bats の歯を書かない,                                 regulation: 憲法 C12 }
  - { id: CON4, label: 作法,     text: 前の器（v1）の役割席・gate 席・QA 席・契約押印・tier ラベルを持ち込まない,                       regulation: ADR-0003 }
  - { id: CON5, label: 口,       text: binary は不可逆操作（force push・削除・公開・課金）の口を持たない,                               regulation: 憲法 A1 / N1 }
  - { id: CON6, label: headless, text: headless の runner / lens は permission を毎回明示・rate limit は stream-json で検知・context の上限は契約の大きさで受ける（開発 session の context は cap guard が受ける）,   regulation: "" }

glossary:
  - { term: 契約,           en: contract,               plain_short: bead 1 本の約束,          def: 何を作り・何ができたら終わりかを表す 1 単位。 正本は設計 doc の契約表 1 行で、 器が便の契約 file を生成する。 台帳（beads）の 1 issue に対応する。 }
  - { term: runner,         en: runner,                 plain_short: 実装役の Claude,          def: 契約 1 本を worktree で実装する headless の Claude process。 席ではなく使い捨て。 }
  - { term: lens,           en: lens,                   plain_short: 審査役の Claude,          def: diff を読んで PASS / FAIL / INCONCLUSIVE を返す headless の Claude process。 }
  - { term: gate,           en: gate,                   plain_short: 機械検証と審査の段,       def: 契約の verify を実走し lens 1 本の verdict を採る段。 PASS でなければ land しない。 }
  - { term: land,           en: land,                   plain_short: main への着地,            def: worktree の成果を squash 1 commit で main に載せ、 main で歯を再実走すること。 }
  - { term: fleet,          en: fleet,                  plain_short: 便と席の状態の全体,       def: 正定義は複数 host にまたがる席・口座・lease・退役の全体（憲法 C3）。 MVP では便と席の現在地の全体を指し、 実体は event log 1 file。 }
  - { term: event log,      en: event log,              plain_short: 追記だけの記録,           def: 1 行 1 出来事を追記する file。 現在地はこれを replay して導く。 }
  - { term: manifest,       en: rules manifest,         plain_short: 規則の値の置き場,         def: 規則の値（閾値・有効 / 無効・裁定 id）を持つ tracked な TOML 1 file。 憲法 C1 の「値は manifest」の実体。 }
  - { term: verdict,        en: verdict,                plain_short: 審査の結果,               def: gate が返す 3 値（PASS / FAIL / INCONCLUSIVE）。 構造化 field が一次 truth。 }
  - { term: 3 クラス,       en: three classes,          plain_short: 人に聞く操作,             def: 消す / 出す / 使う の 3 分類。 これに当たる操作だけ人の承認を要する。 }
  - { term: write-set,      en: write-set,              plain_short: 触ってよい file の列,     def: 契約が宣言する、 編集してよい file の集合。 外への編集は編集の時点で止める。 }
  - { term: ".vessel",      en: vessel marker,          plain_short: 器の所属の目印,           def: repo root の固定名 file。 中身が name と version を言い、 どの器が仕えるかを決める。 }
  - { term: flip check,     en: flip check,             plain_short: test が先に落ちる確認,    def: 変更の test 差分だけを base に当てて新規・変更 test が RED になり、 HEAD では GREEN であることを機械で確かめる検査（憲法 C12.2）。 docs-only の変更は対象外（C12.3）。 }
  - { term: headless,       en: headless,               plain_short: 画面なしの実行,           def: 対話画面を持たず、 入力を受けて 1 回で答えを返す Claude の実行形（claude -p）。 }
  - { term: toy repo,       en: toy repo,               plain_short: 実験用の小さな repo,      def: 到達点を測るために一時 dir に作る、 外部依存の無い小さな git repo。 }
  - { term: 設計 doc,       en: design doc,             plain_short: 設計 1 本の文書,          def: 要望を SRS の要件に結び、 契約が複数出る元になる tracked markdown。 }
  - { term: 要件カタログ,   en: requirements catalog,   plain_short: 要件の一覧表,             def: 要件 doc の v2 行を scrub して写した一覧（requirements-catalog.html）。 FR との対応は同 page の §移行表 が持つ。 }
  - { term: 承認 event,     en: approval event,         plain_short: 承認の記帳,               def: approval.requested / approval.received の 2 種。 逐語を伴い fleet に残る。 }
  - { term: hook,           en: hook,                   plain_short: 編集の手前で動く番人,     def: Claude Code が tool を呼ぶ直前・直後に自動で走る短い処理。 器は編集を止める側（in-loop guard）と名乗りを出す側に使う。 }
  - { term: diff,           en: diff,                   plain_short: 変更の差分,               def: 変更前と後の違いだけを取り出したもの。 lens はこれを読んで審査する。 }
  - { term: worktree,       en: worktree,               plain_short: 便ごとの別の作業場所,     def: 同じ repo の別の branch を別 dir に取り出した作業場所。 runner は 1 便ごとに 1 つ切る。 }
  - { term: rc,             en: return code,            plain_short: 終了を知らせる数字,       def: program が終わるときに返す数字。 0 = 成功、 それ以外 = 失敗の種類。 }
  - { term: base,           en: base,                   plain_short: 変更の出発点,             def: 便を始めた時点の main の commit。 追随（FR34）で進みうる（記録された最新の base が基準）。 flip check と land はこれを基準に測る。 }
  - { term: INCONCLUSIVE,   en: inconclusive,           plain_short: 判定できなかった,         def: verdict の 3 値の 1 つ。 合格でも不合格でもなく「判断できない」で止まり、 land されない。 }
  - { term: CI,             en: continuous integration, plain_short: PR ごとの自動検査,        def: PR を出すたびに自動で走る検査（test・lint・xtask）。 緑でなければ merge しない。 }
  - { term: marker,         en: marker,                 plain_short: 所属の目印 file,          def: repo root に置く .vessel のこと。 中身が name と version を言い、 hook はこれを見て仕えるかを決める。 }
  - { term: commit,         en: commit,                 plain_short: 変更の 1 区切りの記録,    def: git に残す変更の 1 単位。 runner の完了判定は base からの commit が 1 件以上あるかで測る。 }
  - { term: 直命の表,       en: directive log,          plain_short: user の発言の typed な記録, def: 直命を器が event log に 1 件ずつ持つ記録。 発令時刻は器が打ち、 逐語・前提の pointer・状態を運ぶ。 復元の DATA が有効な直命を列挙し、 理由の語（経過 / 前提の終端 / 前提の置換）付きで確認候補を印す。 閉じる記録は結果と裁定 id を伴う（FR65）。 }
  - { term: 対話面の作法,   en: dialogue surface rules, plain_short: user への言い方の決まり,   def: planner の席が user に向けて出す文の形の規則。 信頼度を上位に置く 1 体系で、 則の本文も数も設計 doc 1 本が正本。 雛形が pointer 付きの行で指し、 生成された指示文が運ぶ（FR67）。 }
  - { term: 自動圧縮,       en: auto compaction,        plain_short: 文脈が満杯で自動で要約されること, def: 開発 session の文脈が上限に達したときに harness が自動で行う要約。 直前の hook で器が現在地と持ち越し分だけの退避物を書く（FR66）。 }
  - { term: 歯,             en: test,                   plain_short: 落ちるべきときに落ちる test, def: 器を守る自動 test の総称（Rust の 1 framework・憲法 C12）。 「歯が落とす」= test が失敗して変更を止めること。 }
  - { term: RED,            en: red,                    plain_short: test が落ちる状態,        def: test が失敗する状態。 対は GREEN（全部通る）。 flip check は「base で RED・HEAD で GREEN」を確かめる。 }
  - { term: PR,             en: pull request,           plain_short: 取り込みの申請,           def: 変更を main に取り込むための申請。 CI が緑になってから squash merge する。 }
  - { term: docs-only,      en: docs-only,              plain_short: 文書だけの変更,           def: 変更が文書だけの PR。 flip check の test 差分の要件から除外される（憲法 C12.3）。 }
  - { term: 開発 session,   en: development session,    plain_short: 設計・契約・review を行う AI, def: 設計・契約・実装・review を行う AI の session（Claude Code）。 planner や管理席のように session をまたいで対話を続け、 runner と違い使い捨てではない。 }
  - { term: cap guard,      en: cap guard,              plain_short: 満杯手前で編集を止める段,   def: 開発 session の context 使用量が rules 行の上限に達したとき、 退避以外の編集を止める hook の段。 }
  - { term: 管理 tick,      en: tick,                   plain_short: 開発 session を周期で見張る仕組み,     def: 開発 session が黙っていないかを周期で見て、 条件が揃ったときだけ打刻の合図か退避の合図を 1 行注入する仕組み。 }
  - { term: 打刻の合図,     en: pointer,                plain_short: 打刻を促す 1 行,          def: 管理 tick が idle の開発 session に注入する 1 行。 打刻を促し、 席の queue が空でなければ続きの pointer（FR43）を載せる。 }
  - { term: 退避の合図,     en: externalize pointer,    plain_short: 退避を促す 1 行,          def: context 使用量が上限以上の開発 session に管理 tick が注入する 1 行。 idle を待たず、 作業記憶の退避を促す。 }
  - { term: cycle,          en: cycle,                  plain_short: 退避して作り直す一周,     def: 作業記憶を退避し、 session を作り直し、 退避物から復元する一周。 退避物が無い session では起こさない。 }
  - { term: 作業記憶,       en: working memory,         plain_short: session をまたぐと消える一時メモ, def: 開発 session が一連の作業の間だけ持つ状態。 session の作り直しで消えるので、 cycle の前に退避物へ書き出す。 }
  - { term: 退避物,         en: externalized memory,    plain_short: 作業記憶を書き出した file, def: cycle の前に作業記憶を書き出した file。 session id で一意で、 消費済みは同じ suffix で表す。 }
  - { term: planner,        en: planner,                plain_short: 契約と裁定を持つ席,     def: 席の役割の 1 つ。 契約・裁定・merge の go を担い、 runner の質問に契約の修正か回答で応える。 対話面の identity は rules 行 R-C7-1 が持つ。 }
  - { term: 管理席,         en: admin seat,             plain_short: 便を流す係の席,         def: 役割 管理席 を持つ席。 既定の配送構造では契約を pipeline に流し、 runner の質問を planner へ中継し、 go の後に land する。 自分の手で実装するのは pipeline が回せない便だけ。 }
  - { term: 質問 record,    en: question record,        plain_short: 実装役が返す質問の合図, def: runner が契約の不足を返して止まるときの typed な合図。 形式は ADR-0016 §2.2 が正本。 }
  - { term: Questioned,     en: questioned,             plain_short: 質問中の段,               def: 便の段の 1 つ。 runner の質問 record を受けて回答 event を待っている状態。 }
  - { term: Blocked,        en: blocked,                plain_short: 承認待ちの段,             def: 便の段の 1 つ。 3 クラスを名乗る契約が spawn の手前で承認 event を待っている状態。 }
  - { term: 口座残量,       en: account allowance,      plain_short: 口座の残りと reset 時刻,   def: 1 口座 1 時刻で読んだ、 5 時間窓・7 日窓・モデル別 7 日窓の残りと各 reset 時刻の組（FR33）。 runner が受ける上限 record（検出の合図）とは出所が違う。 }
  - { term: 追随,           en: follow,                 plain_short: main に追いつくこと,      def: land の前に、 便の base より進んだ main へ worktree の branch を rebase して gate をやり直すこと（規範は FR34・衝突の周の解き方は ADR-0019）。 land の要求 1 回につき 1 度で、 再び main が進んだ周は次の要求で追随する。 main は動かさない。 }
  - { term: 衝突,           en: conflict,               plain_short: 追随の rebase でぶつかること, def: 追随の rebase で、 先着の変更と同じ箇所が重なり器が自動では合わせられないこと（FR34 が記帳する）。 契約同士の write-set の交差（ADR-0019）とは別の概念。 }
  - { term: 暫定行,         en: provisional line,       plain_short: 出所の無い命令行,         def: 作業記憶の「命令・制約」行のうち、 出所 pointer（憲法条・ADR・rules 行・裁定 id・user 裁定の時刻）を持たない行（FR23 / AC8）。 }
  - { term: 上限停止,       en: limit stop,             plain_short: 口座の上限で止まること,    def: 便や開発 session が口座の残量の上限に当たって止まること。 便では FR35 の event、 session では退避と立て直しの契機。 }
  - { term: 口座選定,       en: account selection,      plain_short: どの口座を使うか決める,     def: manifest の口座（退役中を除く・FR58）と実測の残量だけから口座を決定的に選ぶこと（FR36）。 便用と session 用の 2 規則を持つ。 }
  - { term: 役割,           en: role,                   plain_short: 席の種類,                 def: 開発 session の席の種類。 種類は配送構造（FR30）が定め、 席の登録 row が持つ（FR40）。 }
  - { term: 権能,           en: capability,             plain_short: 役割に許された操作,        def: 役割ごとに許された操作の閉じた一覧。 rules 行が持ち（FR41）、 編集・実行の時点で執行される（FR45）。 }
  - { term: 席の登録,       en: seat registration,      plain_short: 席と役割の記録,            def: 席の役割と anchor を鍵に、 target・口座 label・起動の雛形を項目として fleet の event log に記録すること（FR40）。 記録の無い席は権能を持たない。 }
  - { term: 受付の枠,       en: admission slot,         plain_short: 変異検査の並列の枠,        def: host 単位の受付が便の変異検査に配る並列の枠（NFR6）。 枠が無い host では縮退する（FR46）。 }
  - { term: 封じ込め,       en: confinement,            plain_short: memory 上限付きの箱,       def: 器が起こす子 process を memory の上限付きの箱の中で走らせること（NFR6）。 }
  - { term: 上限 record,      en: rate-limit record,      plain_short: 上限に当たった印,         def: claude が口座の上限を専用の record で伝える合図。 便の停止判定はこの record だけを入力にする（FR35・ADR-0012）。 }
  - { term: anchor,         en: anchor,                 plain_short: 対象 repo の本体,             def: 対象 repo の main checkout。 席と便の鍵の一部で、 1 つの anchor に planner 1 席・管理席 1 席（FR40）。 }
  - { term: 席の指示文,   en: role brief,             plain_short: 席に差し込む指示,         def: 役割ごとの雛形と権能の rules 行から器が生成し、 session の文脈が初期化されるたびに注入する文（FR42）。 手書きの規範文は持たない。 }
  - { term: 席の queue,     en: seat queue,             plain_short: 席が抱える次の仕事,       def: 席に向けた dispatch・席宛ての質問・裁定済みの次の行動の集合（FR43）。 承認と裁定の待ちだけなら正当な idle。 }
  - { term: 席間の連絡,     en: inter-seat message,     plain_short: 席から席へのやり取り,       def: 開発 session の席どうしの message を、 入力欄を経由しない経路で届け、 経路の記録で着地を確かめること（FR44）。 }
  - { term: 設計 pointer,   en: design pointer,         plain_short: どの設計 doc のどの契約か, def: 設計 doc の path と契約 id の対。 intake の入力（FR53）で、 台帳の bead の受入条件が持つ 1 行でもある（FR2）。 }
  - { term: 台帳 adapter,   en: ledger adapter,         plain_short: 台帳への唯一の口,         def: 器が台帳を読む口（読み取り専用）と close を書く口。 台帳へ触る module はこれ 1 つ（FR50 / FR51）。 }
  - { term: 禁じる語列,     en: forbidden token sequence, plain_short: 撃ってはいけない語の並び, def: command のうち撃ってはいけない語の並び。 値は manifest の rules 行だけが持ち（並びの例は行を見る）、 器が実行の前に止め、 intake が verify 行に同じ判定を掛ける（FR56）。 }
  - { term: host の面,       en: host manifest,          plain_short: host ごとの宣言の置き場,   def: manifest の host の面。 state dir の 1 file が host 固有の宣言値を持ち、 tracked の manifest と同じ読み手で読まれる。 rules 行は置けない（FR57・ADR-0026）。 }
  - { term: 口座の登録,     en: account registration,   plain_short: 口座を器に足すこと,       def: 器の subcommand が口座の設定 dir・席の前提の設定・host の面の宣言を揃え、 login 用の起動 command を user へ渡すこと（FR58）。 login は user の手番で、 器は credential に触れない。 退役と復帰も同じ subcommand が担う。 }
  - { term: 席の起動,       en: seat launch,            plain_short: 器の subcommand で席を起こすこと, def: 役割を必須に受け、 口座を決め、 起動行を導出し、 席の登録を先に書いて target の窓の shell へ差し込むこと（FR59）。 立て直しと同じ経路で、 器の subcommand 以外の起動経路を使わない。 }
