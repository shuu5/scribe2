    label: 開発 session の cap guard（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC8] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は編集 tool の hook で context 使用量を上限と比べて編集を止める段（cap guard）と、 その上限の rules 行を持たない（ADR-0045 §2 (2) で廃止）。 不在は不在を測る歯が確かめる
  - id: FR27
    type: FR
    label: 管理 tick（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC18] }
    ears:
