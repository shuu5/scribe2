  - id: FR77
    type: FR
    label: regate（裁定つきの 1 段戻し）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC47, AC38] }
    ears:
      pattern: event
      condition: 便に裁定の逐語を添えて regate（gate の判定が FAIL の Gated の便を Implemented へ 1 段戻す器の口）が要求されたとき
      response: 器は、 段が Gated ∧ 判定が FAIL ∧ 所有者の印が無いか印の process が退役 ∧ 逐語が非空、 の 4 つを全部満たす周だけ、 便の記録に段 Implemented と裁定の逐語を持つ記帳を 1 件書いて戻し（worktree・commit・判定の記録には触れない）、 戻った便は同じ worktree で再開の候補になる（FR68 の regate の種目）。 1 つでも外れる周と、 判定か所有者の印を読めない周は、 何も書かずに理由 1 行で断る。 戻した直後は段が Implemented なので、 gate が再び Gated を記帳するまで次の regate は段の条件で断られる（1 つの FAIL につき戻すのは 1 回）。 器は FAIL の理由（契約の赤か・器の欠陥か・環境か）を自分では分類せず、 裁定なしに自動では戻さない
  - id: FR78
    type: FR
    label: heartbeat の決め方と管理 tick の健全
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC48, AC64] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: "器は、 管理 tick（FR27）が黙った席へ送る打刻の合図を heartbeat と呼び、 heartbeat を席ごとに決める口（seat heartbeat on|off|default|status）を持つ。 on は明示 on の記録を、 off は明示 off の記録を、 それぞれ席の状態の dir に 1 つ（1 行・時刻）置いて他方を消し、 default は両方を消す（可逆・ADR-0092）。 明示 off の記録は ADR-0070 の停止の記録と同じ置き場と形で、 既に在る停止の記録は明示 off と読む。 heartbeat の実効の値は次の順で決まり、 決まり方を閉じた 3 語で名乗る — (1) 明示の記録が 1 つだけ在る周はその値（explicit）で、 明示の記録が 2 つとも在る周と在るのに読めない周は off（explicit）、 (2) 明示の記録が無く、 席の置き場が属する群の表の行（群か park の区画）が任意の key heartbeat（on か off）を持つ周はその値（group）、 (3) それ以外は種類の既定で、 群の置き場の席は on・park の区画の置き場の席は off・群の表のどの行にも属さない席は on（default）。 口の default は明示の記録を消す操作で、 決まり方の default は (3) で決まったことを指す。 群の表の行の key heartbeat が on と off の外の値を持つ host の面は FR57 の読みで断る（fail-closed）。 実効の値が off の席には管理 tick は合図を送らず判定行に理由 heartbeat-off を出し、 死んだ席の起こし直し（FR59）・移動の周の退避・群の移動の判定（FR38）・park の移り先の判定（FR95）はそのまま撃つ（管理 tick は止めない）。 管理 tick は周ごとに席の状態の dir へ最後の周の打刻（時刻・判定・理由の 1 行・rc 1 の周も）を書き、 seat tick status は席ごとに最後の周の時刻・経過・健全（経過が周期の rules 行の 2 倍以内）・heartbeat の実効の値・決まり方・梯子の段・次の合図の 7 項目を、 seat heartbeat status は実効の値と決まり方と最後の周の打刻の 3 項目を、 doctor の席の行は heartbeat の実効の値と管理 tick の健全の 2 項目を出す。 健全かを判じるのは読み手で、 管理 tick は判じない。 外の読み手（別 project の画面など）は heartbeat の実効の値を器の口の出力から読み（記録の file の有無は実効の値でない）、 on / off / default は器の口を撃つ（明示の記録の書き手は器の口 1 本で、 管理 tick は書かない）。 最後の周の打刻は event log に書かない（ADR-0070）"

  - id: FR79
    type: FR
    label: 裁定の指し示し
    priority: should
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC49] }
    ears:
      pattern: event
      condition: 器の口（seat deliver）が撃たれたとき
      response: 器は、 宛先の席に登録 row（FR40）が在り、 撃たれた時点で席の状態の打刻の最終行が idle で入力欄が空いているときにだけ、 渡された裁定面の記帳 id 1 つ（ASCII の英数字と 4 つの記号（ピリオド・ハイフン・下線・コロン）だけの 1 語・長さの上限は器の定数）を指し示しの雛形に入れた 1 行（裁定が届いた旨の指し示し・裁定の逐語と続きの指示は持たない）を、 管理 tick（FR27）と同じ入力欄の門を通して 1 回差し込み、 結果（送れた・断った理由）を 1 行で返す。 空の id・文字種の外（空白・制御文字・4 つの記号の外の ASCII 記号・ASCII の外の文字を含む）の id・長さの上限を越える id・登録 row の無い宛先・打刻の最終行が idle でない席（考え中・打刻が無い・読めない）・入力欄に文字が在る席は 1 key も送らず typed な理由の語で断る。 送る行に入る外からの値は記帳 id 1 つだけで、 口のほかの引数（置き場・宛先・道具の差し替え）は送る行に入らない（席間の連絡の経路にしない・FR44）。 器は撃ち手・裁定面の書き込みの有無・裁定の中身を確かめない（撃つのは裁定面が自分の置き場に裁定を書いた後・中身は消費側が自分の置き場から読む・ADR-0077）
  - id: FR80
    type: FR
    label: 公開の字面の走査
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC50, AC23, AC63] }
    ears:
      pattern: unwanted
      condition: 口座の設定を読む session が撃つ Bash の公開の segment のうち、 publish の種類の rules 行が無いとき、 または rules 行の enabled が true の周に、 repo の全履歴を走査なしに出す command（repo の可視性を public へ変える・public の repo を作る）であるか、 公開先の repo（push の行き先か gh の対象）か出ていく字面が解けない（読めない字面を含み、 owner/name を導けないことは含まない）か、 判定がどの段でも締め切り（NFR5）に間に合わないか、 host の面を読めない（FR57）か、 公開先の repo が private と実測できず隣の private repo が 1 つ以上在り、 出ていく字面が隣の private repo の識別子の 4 形（repo の名・object id・tracked path・台帳 id）のどれかを 1 つでも含むか読む上限（NFR5）を越えるとき
      response: 器の host-guard は実行の前に deny し、 断る理由として rules 行が無いことか、 host の面を読めないこと（FR57・行番号）か、 全履歴を出す command の種別か、 解けない形か、 越えた上限の名か、 当たった識別子の形と語と repo の先頭 5 件と件数を告げ、 代わりの経路を理由ごとに示す（rules 行は裁定を添えて置く・host の面は行番号の行を直す・全履歴を出す command は user が行う・解けない形は解ける形で書き直す・上限は分けて出す・締め切りは撃ち直す・識別子は消して「隣の project」と件数に言い換えて出し直す）。 判定の順は、 rules 行（無い周は fail-closed で断り、 enabled が false の周は publish の種類を撃たずに通す）→ host の面の読み（読めない周は fail-closed で断る・FR57）→ 全履歴を出す command（器が持つ閉じた形の一覧〔可視性を public へ変える gh repo edit と gh api の書き・public の repo を作る gh repo create〕に当たる command を、 公開先の repo の可視性と隣の private repo の数に依らず GitHub に問わずに断る。 repo を編集する gh api のうち可視性の欄を解けない書きは解けない形とする）→ 解き（解けない周は隣の private repo が 0 の host でも断る）→ 可視性 → 走査で、 走査せずに通すのは、 enabled が false の周のほか、 解けた公開の segment のうち公開先の repo が private と実測できた周か、 隣の private repo が 0 の周（群の表の行を持たない host を含む）だけである。 群の表の行に公開先の repo の外の anchor が無い host は GitHub に可視性を問わない。 可視性は GitHub に問い（送るのは公開先の repo と、 群の表の行（群と park の区画）の anchor のうち実体が在り公開先の repo と別のものの owner/name〔導き方は glossary の公開先の repo〕と、 remote の先端の問いだけ・A1 の解釈は ADR-0078）、 読めない可視性と owner/name を導けない repo の可視性は、 公開先の repo なら public・群の表の行の anchor なら private と読む。 識別子の 4 形（照合の単位は glossary）の一覧は publish の種類の rules 行が持ち（行の値は形の記号の閉じた列だけ・除外の要素を持つ行の断りは FR57）、 無害と裁定した字句は公開の除外の表（host の面）が字句のまま持つ（行は裁定 id を持ち、 欄が無いか空の行の断りは FR57・行を求める台帳の問いは effect を operation で立て、 document で立てた問いは未反映の裁定〔FR84〕に数えられて待たせる側に倒れる・ADR-0093）。 公開の segment でない周、 publish の種類は git と gh を撃たない

  - id: FR81
    type: FR
    label: "起票の門の 4 つの断り"
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC51, AC59, AC61] }
    ears:
      pattern: unwanted
      condition: "器の plugin を積む席の session が、 自分の道具の呼び出しとして台帳の書き（bd / bdw の command の字面）で次の (a)〜(d) のどれかを撃とうとするとき（席が起こした子 process の書き〔Bash から起こした常駐の server など〕は道具の呼び出しでないので門の外）＝(a) label intake:question を持つ bead の create のうち、 本文が 4 つの行（概要・技術・理由・推奨で始まる行）のどれかを欠くか、 metadata の effect を欠くか、 effect の値が閉じた 2 値（document＝答えを文書へ写すべき問い・operation＝答えが操作で済む問い）の外である書き、 metadata の asked（FR89）を欠くか値が閉じた 2 値（seat・user）の外である書き、 label intake:memo を併せ持つ書き、 または親の bead を名指しながら親の label を継がない指定を持たない書き、 (b) notes に裁定の行（裁定 id の欄を持つ行・FR82）を足す書き、 (c) 引き金の行（FR87）を持たない memo の create と、 昇格条件の節を引き金の行の無い本文へ書き換える update、 (d) 台帳の repo（cwd から上へ辿って最初に .beads を持つ dir）の HEAD の vessel 宣言が任意 key close-check を true で持つ repo か、 宣言が在って読めない repo での、 bead の close のうち close の理由が close の理由の文法（FR91）の外である書き（理由の無い close を含む）と、 着地の形（FR91）の close の理由を持つ書き（その repo では着地の形は land の終端〔FR50・FR96〕だけが書く）（git を撃てない周は宣言が無いのと同じに読み、 .beads を持つ祖先が無い周は (d) に当たらず、 宣言が在って読めない repo でも (d) に当たるのは上の 2 形の書きだけで、 (a)〜(c) は全部の repo の書きに当たる）"
      response: "器の起票の門は実行の前に deny し、 断る理由に形ごとの中身（(a) は欠けた欄・外れた値・併せ持つ label・継ぐ親の label、 (b) は裁定の行を書くのは器の口〔seat ruling bind と裁定面の答えの口・FR82〕だけであること、 (c) は引き金の 5 形、 (d) は close の理由の文法か、 着地の形を書くのは land の終端だけであること、 宣言が在って読めない repo では読めない旨と当たった形）を告げ、 台帳を変えない。 器が問いとして読む記録は label intake:question の bead だけで、 この label を持たない bead の create には (a) の検査を掛けない"
  - id: FR82
    type: FR
    label: 発話の記帳と裁定の結び
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC52, AC58, AC59] }
    ears:
      pattern: event
      condition: "user が、 marker が器の NAME を言う repo（FR19 / FR24）で器の plugin を積む対話の session（runner と lens を除く）へ prompt を打ったとき、 器の口 seat ruling bind（問いの bead の id と発話の ts を受ける）が撃たれたとき、 または裁定面の答えの口（問いの bead の id を受け、 逐語を command の字面の外で受ける）が撃たれたとき、 または席の道具の呼び出しが答えの口の command を撃とうとするとき"
      response: "prompt が打たれたときは、 器は、 prompt が model に読まれる前に、 打たれた prompt を、 開いた台帳の問いの有無に依らず、 逐語のまま発話 event（actor が human・発話を指す値は発話の ts〔器が発話ごとに一意に振り、 同じ秒の発話は秒より下の桁で分ける〕・session と発話の経路〔対話の session〕を持つ）として fleet の event log に 1 件記帳し、 器が入力欄へ差し込んだ行（FR44 の閉じた一覧の全種・管理 tick の打刻の合図を含む）と別の session から届いた message の包みは記帳しない。 bind が撃たれたときは、 名指した発話 event が在って名指した問いへまだ結ばれておらず（1 つの発話は複数の問いへ結べる）、 名指した bead が開いた台帳の問いである周だけ（問いは発話の後に起こしたものでもよい）、 器が裁定 id（<問い id>:<YYYYMMDDTHHMMZ>-<n>・bind が発行する id の n は 1 で、 形の -<n> は消費側の台帳の行の形と揃えるために持つ）を発行し、 問いの notes に裁定の行（裁定 id・問い・発話の ts・発話の経路・逐語の順の 5 欄を持つ 1 行・逐語は発話 event から写して最後の欄に置く・4 欄の既存の行は発話の経路を対話の session と読む）を書き、 問いを裁定の形（FR91）の close の理由で close し、 裁定 event（問いの asked・問いの起票の時刻・発話の ts・発話の経路を持つ・FR89）を記帳する。 発話が無い・発話がその問いへ結び済み・問いが閉じている・bead が台帳の問いでない周は何も書かずに理由を名指して断る。 裁定面の答えの口が撃たれたときは、 逐語が空白だけの周と、 問いが閉じているか bead が台帳の問いでない周は、 発話 event も含めて何も書かずに理由を名指して断り、 通る周は逐語を発話の経路が裁定面の発話 event として記帳し、 同じ周に bind と同じ書き（裁定 id の発行・裁定の行・close・裁定 event）を行って、 裁定 id を 1 行で返す。 答えの口は承認 event（FR16）を記帳しない（承認は便の承認の口だけが受ける・憲法 C7・ADR-0087）。 席の道具の呼び出しが答えの口の command を撃とうとするときは、 器の hook の入口が実行の前に断る（席が起こした子 process の撃ちは門の外）。 席が notes に裁定の行を書く書きは FR81 が断り、 器は、 席の道具の呼び出しが逐語を渡して裁定 event を記帳する口を持たない（ADR-0087）"
  - id: FR83
    type: FR
    label: 裁定 id の実在
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC53] }
    ears:
      pattern: unwanted
      condition: "main（着地では便の base）の vessel 宣言が任意 key ruling-check を true で持つ repo で、 受付に出た契約の設計の節か契約表の行、 または着地の差分が足す字面が、 解けない裁定 id か、 opt-in の線（ruling-check が main の履歴で初めて true になった commit）の後に足された時刻の形（user <UTC の時刻>）の引用（引用に数える字面は閉じた規則が決める）を持つとき、 または着地の差分が足すか変える判断の欄（rules 行の ruling 欄・ADR の approval の裁定の欄・設計の節の裁定の欄）が引用に数える問い id の形（FR82）の裁定 id を 1 つも持たないとき、 または着地の差分が引用に数える問い id の形の裁定 id を足さずに ruling-check を true から外すとき"
      response: "器は、 受付では契約を便にせず typed な理由で断り、 着地では FR10 の留め（main に載せず Gated に留め、 理由の event は FR10 の形で記帳する）に掛け、 どちらも当たった裁定 id か欄を名指す。 引用は、 追跡された file の字面から裁定 id の閉じた 3 形（問い id の形・batch: で始まる形・policy: で始まる形）と時刻の形を拾う閉じた規則で数える（字面を数えるだけで文書の意味は読まず、 FR83 と FR84 は同じ閉じた規則で引用を数える）。 問い id の形は、 問いの部分が repo の台帳の id の接頭辞（台帳が issue の id に付ける prefix）で始まるものだけを引用に数え、 ほかの接頭辞の問い id の形の字面は引用でない（数えも断りもせず、 一覧に載せる要も無い）。 batch: と policy: の形と opt-in の線の後に足された時刻の形は、 vessel 宣言の任意 key ruling-fixtures（字面の閉じた一覧）に同じ字面が在るものを引用に数えない（一致は字面の完全一致だけで wildcard などの型を持たず、 backtick や code の囲みなどの書式はどの字面も引用から外さず、 一覧に無い字面は引用に数える）。 解けるとは、 問い id の形はその id が閉じた台帳の問いの notes の裁定の行の裁定 id の欄と一致すること、 batch: と policy: の形は器を導入した別の repo（消費側）の台帳が自分の経路で書く裁定の行の裁定 id の欄か束の欄と一致することとする。 判断の欄が台帳の bead の id だけを引く形は、 その bead が在っても裁定 id に数えない。 opt-in の線より前から在る時刻の形の引用と、 差分に無い判断の欄は断らずに数え、 doctor の 1 行に main の追跡された file の中の解けない引用と線の前の時刻の形の引用の件数と id を出す"
  - id: FR84
    type: FR
    label: 未反映の裁定
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC54] }
    ears:
      pattern: state
      condition: "effect が document の閉じた台帳の問いの裁定 id のうち、 main の追跡された file が 1 つも引かない id（未反映の裁定）が在る間"
      response: "器は dispatch の周ごとに未反映の裁定の id の列を置き場の file に書き（0 件の周も空の列を書く・引用は FR83 と同じ閉じた規則で数え、 vessel 宣言の ruling-check に依らない）、 doctor の 1 行に件数と id を、 管理 tick（FR27）の打刻の合図の alarm に語 unreflected を出し、 その裁定 id を acceptance か notes で引く契約と、 その問いに blocks される契約を、 起動の列（FR68）で理由 unreflected-ruling:<id> を持たせて待たせ、 着地の周はその契約の便を FR10 の留めに掛ける。 それ以外の契約と便と、 裁定を文書へ写す変更のうち器の便でない変更は止めない。 未反映は main の追跡された file の字面だけで判じ、 裁定からの経過時間を判定に使わず、 effect が operation の裁定は数えない。 未反映の裁定が 0 件になった周は置き場の file の列が空になり、 doctor の行と alarm の語 unreflected が消える"
  - id: FR85
    type: FR
    label: 床の検査
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC55] }
    ears:
      pattern: event
      condition: "vessel 宣言が任意 key floor-check（1 行の command）を持つ repo で、 dispatch の周（FR68 の契機の周）が回ったとき"
      response: "撃つ側では、 器は main の先端の sha の rc の結果が置き場に無い周だけ、 その sha の木で floor-check の 1 行を 1 回撃ち、 rc 0 だけを合格と読む。 行は 1 行の形の検査・禁じる語列の判定（FR56）・shell の記号の断りを通ったものだけを、 shell を通さず argv 1 本として、 頭の語を PATH で解いて（runner の allowlist に縛られず）封じ込め（NFR6）の内側で撃ち、 検査に当たる行は撃たずに断ってその周を撃てない周と読む。 rc の結果（rc と要約の 1 行）は sha ごとに置き場へ残して同じ sha では撃ち直さず（main が進んだ周に撃ち直す）、 撃てない周と時間の上限（rules 行 floor.timeout_s・値は user 裁定 id 付き）を越えた周は、 その周を不合格と読んで結果を sha に残さず、 次の周に撃ち直す。 待たせる側では、 その周の判定か main の先端の sha に残った結果が不合格である間、 周ごとに起動の列（FR68）の契約のうち、 orchestrator の介入 first の印を持つ契約はどれも床の検査の理由では待たせず（main を直す便の経路。 器は印を持つ契約が直す便かを判じない・他の待ちの条件は変わらない）、 それ以外の全部の契約を閉じた理由の語（floor:<rc>・floor:unfireable・floor:timeout）で待たせ、 doctor の 1 行に結果を、 管理 tick（FR27）の打刻の合図の alarm に語 floor を出す。 列は timer を持たないので、 main が直った後の撃ち直しは次の契機の周（first の印で起きた便の終端の周を含む）に起き、 管理 tick の alarm の floor が orchestrator の席を起こし、 席の手動の 1 周がその契機になる"
  - id: FR86
    type: FR
    label: 選択式の問いの遮断
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC56] }
    ears:
      pattern: unwanted
      condition: "器の plugin を積む session が、 marker が器の NAME を言う repo（FR19 / FR24）で選択式の問いの道具（AskUserQuestion）を撃とうとするとき"
      response: "器の plugin の hook の入口は AskUserQuestion を実行の前に deny し、 断る理由に問いの経路（平文の返答で問うこと・user の裁定を要る問いは台帳の問い〔FR81〕として立てること）と、 vessel 宣言が任意 key question-route を持つ repo ではその 1 行を告げる。 deny は登録 row の有無・役割・user が自分で開いた session か・skill の文が選択式の問いを求めるか（skill を起動した直後の周を含む）に依らず、 切る rules 行も例外の印も持たない。 ほかの道具の判定はこの deny に依らない"
  - id: FR87
    type: FR
    label: memo の引き金と審査
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-2], acceptance: [AC57, AC61] }
    ears:
      pattern: event
      condition: "dispatch の周（FR68 の契機の周）が回ったとき"
      response: "器は、 周ごとに open な memo のうち昇格の行が全部の memo を除く全部（昇格の行が一部の memo は含む・FR91）について、 昇格条件の節の引き金の行を閉じた 5 形（再発＝notes の再発の行が値の数以上・同梱＝閉じていない契約の行の write-set が値の path を持つ・依存＝値の bead が closed・期日＝値の UTC の年月日と時分を過ぎた・着地＝値の契約表の行が着地した。 行の字面の文法は設計 doc が持つ）で判じ、 1 つでも満ちた memo を引き金の満ちた memo とする（知らせと lint が数えるのは、 引き金の満ちた memo に限らず、 局面が memo-actionable の memo の全部・FR91）。 引き金の満ちない memo のうち、 局面が memo-actionable（FR91）の memo を除き、 前の判定から rules 行 memo.triage_interval_h（時間・値は user 裁定 id 付き）が過ぎたものを、 起こす便が 0 の周に限り、 rules 行 memo.triage_per_round（本数・値は user 裁定 id 付き）の本数まで、 読むだけの memo の審査の lens（口座は FR36 の便用の規則で選び、 封じ込めは NFR6）に掛け、 判定（昇格〔promote〕/ close / keep・証拠・昇格なら設計のスケッチ）を置き場の file に、 event を 1 行残す（器は判定で memo を close せず台帳に書かない）。 周は timer を持たないので、 審査も FR68 の契機の周にだけ回る。 pipe dispatch ls に memo の行（引き金の成否・lens の判定・年齢・前の判定の時刻）を出し、 起こす便が 0 の周の便の終端の周の通知（FR44）で open な memo の数・処置の待ちの memo（局面の出力の memo-actionable・FR91）の数・次の 1 本とその判定を名指し（通知の字面は dispatcher の設計 doc が持つ）、 処置（昇格〔memo に設計 pointer を書く形か、 契約を分けて昇格の行を足す形・FR91〕・close〔close の理由の文法・FR91〕・引き金の書き直し・keep の記帳）で memo の局面が memo-actionable を出るまで周ごとに知らせ直す。 処置の待ちの memo は台帳の lint（FR51）が数え、 引き金の行を持たない memo の書きは FR81 が断る"
  - id: FR88
    type: FR
    label: "発話の仕分け"
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC58] }
    ears:
      pattern: event
      condition: "器が発話 event（FR82）を記帳する対話の session（runner と lens を除く）でその session の turn が終わろうとするとき、 仕分けの口（発話の ts と、 要望なら開いた memo の id を受ける）か ts を名指して発話 1 件を読む口が撃たれたとき、 または doctor が回ったとき"
      response: "器は、 発話を閉じた 3 つの仕分け（要望＝仕分けの口が名指した開いた memo〔label intake:memo〕へ発端として結ぶ・答え＝bind か裁定面の答えの口〔FR82〕で台帳の問いへ結ぶ・会話＝台帳を変えずに仕分け済みにする〔3 クラスの承認・runner への回答・go に使った発話も会話とし、 承認 event と回答 event には結ばない〕）のどれかで仕分け済みにし、 要望と会話の仕分けは仕分けの event を 1 件記帳するだけで台帳を書かない（発端の結びの正本は仕分けの event）。 1 つの発話は複数の memo と複数の問いへ仕分けてよく、 会話は要望か答えの仕分けを持つ発話には付けずに理由を名指して断り、 会話の後に要望か答えを足した発話は会話の仕分けを外す。 仕分けの口は、 発話 event が無い・名指した memo が開いた memo でない周も何も書かずに理由を名指して断る。 仕分け済みかの判定は、 turn の終わりの判定と局面の出力（FR90）で、 同じ入力に対して同じ結果になる。 その session の turn が終わろうとする周に、 その session の未仕分けの発話のうち turn の終わりの止めでまだ告げていないものが 1 つ以上在れば、 器は turn の終わりを 1 度だけ止め、 その session の未仕分けの発話の ts を全部並べて仕分けの口を告げ（逐語を運ばない）、 止めた周は、 登録された席の session なら状態の打刻を idle にしない。 告げ済みの未仕分けの発話だけが在る周は止めない。 turn の終わりの判定は台帳を読まず、 event log の大きさに依らない読み（NFR5）で決め、 判定の入力を読めない周は止めずに（fail-open）読めないことを event に記帳する。 ts を名指して読む口は発話 1 件の逐語を席へ返し、 doctor の 1 行は、 未仕分けの発話の件数と最古の ts と、 要望と会話で仕分けた件数を出す"
  - id: FR89
    type: FR
    label: "席の問いの台帳化"
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC59] }
    ears:
      pattern: event
      condition: "bind か裁定面の答えの口（FR82）が台帳の問いと発話を結ぶとき、 または doctor が回ったとき"
      response: "結ぶ周は、 器は裁定 event に FR82 の欄を記帳する。 asked を持たない台帳の問いの結びは、 doctor の行で asked 無しとして別に数える。 asked は閉じた 2 値で、 seat は席が user の判断を求めた問い、 user は user の先立つ指示や方針を受けるために席が起こした問いを言う。 doctor の 1 行は、 問いの起票が発話より後の結び（asked が seat なら、 席が対話の session だけで問うてから問いを起こした形）を asked の値ごとの件数と裁定 id で出す。 問いの create の asked の欠けと値の外は起票の門（FR81 (a)）が断る"
  - id: FR90
    type: FR
    label: "局面の出力"
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC60, AC61, AC62] }
    ears:
      pattern: event
      condition: "dispatch の周（FR68 の契機の周）が回ったとき、 器が台帳を書いた直後（bind・裁定面の答えの口・land の終端の close〔FR50・FR96〕・memo の自動の close〔FR93〕）、 全部を書き直す口が撃たれたとき、 管理 tick の周、 発話 event か仕分けの event の記帳の直後、 便を運ぶ器の process が便の段を記帳した直後、 起票の門が席の道具の呼び出しの台帳の書きを通したとき、 または器の hook の入口が器の便でない merge の command を通したとき（FR92）"
      response: "器は、 部品（発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・器の便でない着地の commit）ごとに、 局面（閉じた語）・手番（user・seat・vessel・runner・ci・none の閉じた 6 値）・局面に入った時刻・理由（起動の列の待ちの理由・受付の断りの名・便の段と終端の語をそのまま使う）・結び（発端・子の問い・昇格した契約・便・着地の commit・仕分け済みの発話の行き先）を導いて、 state dir ごとに 1 つの局面の出力に書く。 出力は版・入力の印（台帳と event log と main の印）・古さの印を持つ。 局面の語の一覧と優先の順・局面と理由から手番への対応・misfit の理由の語の一覧の正本は設計 doc の 1 節で（memo の局面の語と順は FR91）、 便の段の全ての値は便の部品の局面へ漏れなく写り、 どの局面にも当たらない部品と、 FR91・FR92 が misfit と定める部品は、 局面 misfit とその一覧の理由の語で出す。 memo の引き金が満ちたかは FR87 と同じ判定で決める。 出力は、 要件の部品を除き、 手番が seat の部品のうち局面ごとの年齢の閾値（rules 行 lifecycle.age_h・値は user 裁定 id 付き）を越えたもの（席の手番の閾値越え）の件数と最古の 1 件を持つ。 dispatch の周・器が台帳を書いた直後・全部を書き直す口の周と、 台帳の印か main の印（sha）が出力の入力の印と違い、 前の全部の書き直しの時刻からも管理 tick の撃った記録の最新の時刻からも書き直しの下限（rules 行 lifecycle.full_min_s・値は user 裁定 id 付き）以上経った管理 tick の周は全部を書き直す。 管理 tick のこの比べは印の値の等しさだけで台帳も git も撃たず、 event log の印は比べず、 管理 tick は撃った試みごとに時刻と書き直しの返りの語を撃った記録（state dir の 1 行）に残す（書き手の lock を他の process が持つ周は待たずに返り、 返りの語 busy を残して出力を変えない）。 出力が無いか読めない周・台帳か main の印を読めない周・rules 行 lifecycle.full_min_s の無い manifest の周は、 管理 tick は全部の書き直しを撃たず、 撃った記録も古さの印も残さない（ADR-0108）。 全部の書き直しの入力は台帳の全部・event log・main の契約表の置き場（既定と、 main の先端の vessel 宣言の contract-tables が足す分・FR47・ADR-0109）の契約表と SRS・main の commit の trailer・main の先端の vessel 宣言で、 close した部品を出力に載せる窓（rules 行 lifecycle.closed_window_h・値は user 裁定 id 付き）は表示にだけ掛け、 局面が終わりでない閉じた部品（未反映の裁定を持つ閉じた台帳の問いなど）には掛けない。 閉じと着地の commit に由来する misfit は、 切り替えの線（線を記帳していない state dir で器が最初に全部を書き直した時刻・state dir ごとに 1 度だけ記帳し、 後の書き直しは版に依らず動かさない）より後の記録だけに掛け、 線の前の記録は misfit に数えない（それ以外の misfit は線に依らない・着地の commit は、 線を記帳した全部の書き直しが読んだ main の印より後に main へ入ったものを線の後とする）。 閉じに由来する misfit は、 さらに main の先端の vessel 宣言が close-check を true で持つ repo の閉じのうち、 close-check の線（全部の書き直しが main の先端の宣言で close-check を初めて true と読んだ時刻・state dir ごとに 1 度だけ記帳し、 後の書き直しは動かさない・切り替えの線より前にはならない）より後の閉じだけに掛け、 main の先端の宣言が close-check を true で持たない周はその repo の閉じを数えず、 先端の宣言が在って読めない周は入力を読めない周と同じに扱う。 全部を書き直さない管理 tick の周と発話 event か仕分けの event の記帳の直後と便を運ぶ器の process が便の段を記帳した直後は、 台帳も git も撃たずに、 event log の大きさに依らない読みで、 event log と時刻で決まる部分（発話・仕分けで結んだ発端・便の局面・年齢と席の手番の閾値越え・前の全部の書き直しが残した期日の引き金の満ち）だけを書き直す。 起票の門が席の道具の呼び出しの台帳の書きを通したときと、 器の hook の入口が器の便でない merge の command を通したときは、 書き直さずに出力に古さの印（付けた時点の入力の印を持つ）を付け、 印を付けた後に始まり、 印の種類に対応する入力の印（起票の門の印は台帳の印・merge の印は main の印）が印の持つ値より新しい全部の書き直しだけが印を消す（部分の書き直しは消さない・書きが落ちた周の印は次にその入力が動くまで残る）。 今の出力より古い入力の書きは残らず、 入力を読めない周は書き直さずに出力に古さの印を付けて理由を記帳し、 その印は入力の印を持たず、 読み手はこの印が在る間は出力を古いと示し、 印の後に始まり全部の入力を読めた全部の書き直しが印を消す。 古さの印の種類は閉じた 3 つ（起票の門・merge の門・読めない周）で、 出力は種類ごとに印を 1 つまで持ち、 同じ種類の後の印が前の印を置き換える。 発話の部品は ts・session・行き先だけを持ち、 逐語を持たない。 器は全部を書き直す口を持つ"
  - id: FR91
    type: FR
    label: "memo の局面と処置"
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-2], acceptance: [AC61, AC57, AC65] }
    ears:
      pattern: ubiquitous
      condition: "常時"
      response: "器は、 開いた memo を閉じた 4 つの局面のどれかに置く（宣言順に memo-promoting＝discovered-from で辿れる開いた契約が在るか、 FR93 の close の条件を満たして close を待つ・memo-asking＝子の開いた台帳の問いが在る・memo-actionable＝処置の待ち〔引き金が満ちて keep の記帳（FR87）の無いか、 処置の無い昇格か close の審査の判定〔FR87〕が在るか、 昇格の行を持ち、 辿れる開いた契約が無く、 FR93 の close の条件を満たさない〔辿れる契約が 0 本を含む〕〕・memo-waiting＝読める引き金が在って満ちない〔keep の判定を持つ memo と、 満ちた引き金に keep の記帳が付いた memo を含む〕）。 読める引き金の行を 1 つも持たず memo-promoting にも memo-asking にも当たらない memo（memo-actionable より先に判じる）と、 どの局面にも当たらない memo は、 局面の出力（FR90）で misfit とする。 昇格は 2 形（memo の bead に設計 pointer を書いて契約にする形・memo を残して契約を分け、 notes に閉じた文法の昇格の行〔全部か一部と契約 id の列・全部の行はその memo から分けた契約の全部を並べる〕を足し、 分けた契約から discovered-from を張る形）とし、 昇格の行が複数在る memo は最後の行で判じる。 close の理由の文法は種類ごとの閉じた形の和（字面の正本は ADR-0089、 着地の形の理由の尾は ADR-0094）とし、 契約は着地・重複・後継・取り下げの形、 台帳の問いと decision の型の bead は裁定の形、 memo は昇格済み・まとめた・見送りの形、 epic は完了と取り下げの形を持つ。 和の外の理由の close と、 land の終端の外の着地の形の close の断りは FR81 (d) が持ち、 bead の種類と理由の形の食い違いの閉じ・理由の裁定 id か bead id が解けない（裁定 id は FR83 と同じ解け方）閉じ・理由の裁定 id が自分の notes の裁定の行にも裁定 event にも無い台帳の問いの閉じ・見送りの理由の裁定 id が memo の子の台帳の問いの裁定でない閉じ・まとめ先が開いた memo でない「まとめた」の閉じ・閉じた時点の台帳で FR93 の close の条件（処置の無い判定の条件を除く）を満たさないか、 理由の契約 id の列が最後の昇格の行の列と違う昇格済みの閉じは、 局面の出力（FR90）が misfit で数える（閉じの misfit を数える repo と境は FR90）"
  - id: FR92
    type: FR
    label: "器の便でない着地の発端"
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC62, AC74] }
    ears:
      pattern: unwanted
      condition: "席の道具の呼び出しが PR を main へ入れる merge の command（help を出すだけの command を除く・FR101 と同じ読み）を撃とうとし、 その command が発端の trailer（値に台帳の bead の id を空白で区切って 1 本以上並べる commit の本文の行・名は ADR-0088）か器の便の trailer を持つ commit の本文を渡さないとき、 または main の先端に入った器の便でない commit が発端の trailer を持たないとき"
      response: "器の hook の入口は merge の command を実行の前に deny して欠けを名指し、 CI の main の検査は発端の trailer の無い器の便でない commit を名指して非 0 で止める。 trailer の判定はどちらも本文の形だけを確かめ（CI は台帳に届かない）、 台帳に無い発端（並べた id の 1 本でも台帳に無いもの）は局面の出力（FR90）が器の便でない着地の commit の部品の misfit で数える。 器の便の trailer が名指す便が event log に無い commit と、 切り替えの線より後の、 発端の trailer も器の便の trailer も持たない器の便でない commit も、 器の便でない着地の commit の部品として misfit で数える（どれも切り替えの線より後の commit だけ・FR90）"
  - id: FR93
    type: FR
    label: "memo の自動の close"
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-2], acceptance: [AC61, AC65] }
    ears:
      pattern: event
      condition: "land の終端（FR50・FR96）が契約を close したとき、 または dispatch の周（FR68 の契機の周）が回ったとき"
      response: "器は、 close の条件（最後の昇格の行が全部で、 その行の契約 id の列と discovered-from で辿れる契約の列が一致して 1 本以上在り、 その全部が着地の形〔FR91〕で閉じ、 子の開いた台帳の問いと処置の無い昇格か close の審査の判定を持たない）を満たす開いた memo を、 昇格済みの形（契約 id の列を持つ・FR91）の close の理由で close し、 満たさない memo は close しない（局面は FR91）。 台帳を読めない周は close せず、 次の契機の周に判じ直す"
  - id: FR94
    type: FR
    label: "局面の出力の読み手"
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC60] }
    ears:
      pattern: ubiquitous
      condition: "常時"
      response: "器の次の読み手（便の終端の周の通知〔FR44〕が便の段に添える 1 語〔局面の出力の便の部品の理由の語〕・doctor の未仕分けの発話の行〔FR88〕と処置の待ちの memo の行〔FR51〕と席の手番の閾値越えの行・管理 tick の alarm の語 unsorted・owned・unreadable・単独の stale〔FR27〕・直近の流れの事実行〔FR42〕・memo の判定の通知の処置の待ちの memo の数〔FR87〕）は、 局面の出力（FR90）と同じ判定の結果を使って自前の判定を持たず、 書きかけの出力を見ず、 出力が持つ入力の印と古さの印を自分が読める今の印と比べて古さを判じ（読み手ごとに比べる印の組は設計 doc の 1 節が持つ）、 古い出力を古いと示し、 出力が無いか読めない周は読めないことを示す。 doctor の席の手番の閾値越えの行は、 出力が持つその件数と最古の 1 件を出す。 器は局面の出力と同じ中身を text で出す口を持つ"
  - id: FR95
    type: FR
    label: "park の区画"
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC63] }
    ears:
      pattern: ubiquitous
      condition: "常時"
      response: "器は、 群の表の名 Tier9 の行が宣言する置き場（park の区画・FR38）を、 口座を占めない置き場として扱う（ADR-0091）。 park の区画は群の今の口座の記録・種・群の予約・群の移動の判定・移動を頼む記録を持たず、 park の区画の行が並べた口座と、 park の区画の置き場の席の row の口座は、 便用と session 用の口座選定（FR36）と群の移り先と群の予約（FR38）のどれからも除かれない。 park の区画の置き場の席の口座は、 起動の周（FR59）は口座の引数（行が並べた口座の外でもその口座）か、 引数が無ければ park の区画の行が並べた口座だけを候補にした session 用の口座選定（FR36・候補が無い周は FR69 の語で断る）で決まる。 管理 tick（FR27）の周は park の移り先の判定を撃つ。 この判定は、 row の口座の計測（FR33）の記録の最新値が session 用の閾値の rules 行（FR36）のいずれか以上の周だけ、 行が並べた口座から row の口座を除いた session 用の口座選定の口座を返し、 row の口座の記録が無いか鮮度の外の周と候補が無い周は返さない（候補も記録の最新値だけで選び、 鮮度の外の候補は数えない）。 判定が口座を返した周だけ、 席は群の移動と同じ退避の合図と、 窓が shell に戻った周の起こし直し（FR59・直前の会話 id を運ぶ）でその口座へ移り、 返さない周は移らず、 候補が無い周は判定行に理由 park-no-candidate を出す。 row の口座が同じ間は、 移り先が周ごとに変わっても、 退避の合図を窓が shell に戻るまでの周に重ねて送らない。 窓が shell に戻った park の区画の席の起こし直しの口座は、 判定が返せばその口座、 返さなければ row の口座である。 起こし直しは同じ判定の結果を使う。 park の区画の手は計測（FR33）を起こさず、 host の lock を取らず（群の移動を待たせない）、 群の今の口座の記録も承認 event も書かない（移り先は席の起動と同じ session 用の口座選定で決まり、 行が並べた口座の宣言を A1 の「使う」の常設の承認と読み、 移った事実は判定行と、 起こし直し（FR59）が event log に記帳する席の登録に残る・ADR-0091）。 席自身の hook は park の区画の席でも、 row の口座の使用率が群の逼迫の閾値の rules 行 3 本（FR38）のいずれか以上の周に指示文の 1 行で告げるが、 移動を頼む記録は置かない。 doctor の park の区画の行は kind=park を持ち（群の行は kind を持たない）、 今の口座・next・断りの欄（ADR-0074）を - で出す"
  - id: FR96
    type: FR
    label: "PR で着地した便の close"
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC15, AC65] }
    ears:
      pattern: event
      condition: "PR で着地した便（--pr-cmd の形で Landed に達し、 main を動かさず自 repo への PR を作った便）の worktree を、 PR の merge の後に畳む器の口（pipe retire・撃ち手の権能は FR41）が撃たれたとき"
      response: "器は、 worktree が在って clean であることを git と forge に問う前に確かめ、 vessel 宣言の任意 key remote が名指す remote について、 その PR の merge の commit が remote の main の先端の祖先であることと、 remote の main の先端の commit の CI の結果を照合し、 success の周だけ台帳の便を着地の形の close の理由（FR91・着地 commit id は merge の commit id・理由の尾に CI の結果と、 merge の commit が remote の main の先端でない周は先端の commit id を持つ）で close してから worktree を畳み（ADR-0094）、 close した周に memo の自動の close（FR93）を撃つ。 契約が着地の形で閉じ済みの便への撃ちは照合も close も撃たずに畳むだけとする。 通らない周は close も畳みも event と台帳の書きもせず、 理由の閉じた語を 1 行出して rc 1 で終わり、 同じ口で撃ち直せる — worktree が無いか clean でないか move が落ちて畳めない周は worktree-unready（close 済みの周も含む）、 PR が merge されていない周は not-merged、 merge の commit が remote の main の先端の祖先でない周は not-ancestor、 先端の CI の結果が success でない周（結果がまだ無い周を含む）は ci-not-success、 照合に要る git か forge の問いを撃てない周と vessel 宣言が key remote を持たないか読めない周は unmeasured、 照合が通って close が台帳に届かない周は unwritten（畳まない）。 口に畳むだけの指定（--fold-only）を付けた周は、 照合も close もせずに worktree を可逆な move で畳み、 契約は開いたまま残す（merge されずに閉じた PR の便と、 key remote を持たない repo の PR の便と、 宣言と別の remote へ PR を出した便の出口。 畳んだ後は同じ口で着地の形の close に届かない）"

  - id: FR97
    type: FR
    label: 口座の墓標の判定
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC18, AC41, AC66] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: "器は口座の墓標（口座の credential の file に現れる、 再 login でしか戻らない印）を、 口座の設定 dir の credential の file を読む 1 本の関数で判じ（墓標の読みは、 計測〔FR33〕が credential の file を読んで墓標の回を測れなかった回として記す読みと同じ 1 本）、 判じるときに計測を起こさず、 token の値をどの出力にも記録にも出さない。 器が credential の file を読むのは計測（FR33）とこの判定だけで、 器は credential の file を書かない。 判定の語は閉じた 3 つで、 present（file が在り墓標と読めない。 期限切れの file・読めない file・墓標でなく token の無い file を含む）・missing（file が無いか、 同じ名の物が file でない）・dead（墓標）とする。 同じ 1 本を、 doctor と口座の一覧（account ls）の口座の行の credential=・管理 tick の合図を送らない句と起こす前の群の移動の判定（FR27）・移動の契機と墓標の口座を測らない句と移り先の候補から外す句（FR38）が読み、 doctor の群の行は墓標の語を持たない（群の今の口座の墓標は current= と口座の行の credential= で引く）。 期限の時刻を根拠にした判定と警報は持たず、 器は再 login を代行しない（ADR-0098）"

  - id: FR98
    type: FR
    label: 終わりの門
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC72] }
    ears:
      pattern: event
      condition: "runner の turn が rc 0 かつ base からの commit 1 件以上で終わったとき"
      response: "器は Implemented と記帳する前に、 gate と同じ段の列（gate の write-set を照らす段・共通 verify・契約の verify の各行）を gate と同じ撃つ関数・封じ込め・並列の枠で便の worktree に撃ち（終わりの門）、 行ごとの rc を便の記録に残す。 全行の rc が 0 なら Implemented と記帳する。 rc が 0 でない行が在り、 測れなかった行が無く、 同じ便の門の赤の周の数が rules 行 runner.end_gate_rounds（値は user 裁定 id 付き）に届いていない周は、 段を Spawned のまま門の赤を記帳し、 同じ worktree・同じ base・同じ契約で runner を起こし直し、 stdin の契約の後ろに rc が 0 でない行ごとの行の字・rc・診断の末尾の抜粋（行ごとと合計に上限）を持つ節を足す。 周を使い切った周と、 測れなかった行が在る周は、 Implemented と記帳し、 記録に赤か測れなかったかを名乗る。 門を撃つ間は、 同じ便に runner を起こす口（手の再開を含む）を断る。 gate は終わりの門の結果を持ち越さずに全行を撃ち（FR8）、 周の数は便の event から数えて process の記憶に持たない（FR3）"
  - id: FR99
    type: FR
    label: lens の permission の値の記録
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC70] }
    ears:
      pattern: unwanted
      condition: "lens の起動に dontAsk でない permission の値が渡されたとき"
      response: "器は lens を dontAsk で起こし（FR5）、 契約の file と同じ dir に、 渡された値を名指す 1 行の記録（名と字の形は ADR-0102）を残す。 dontAsk の値の周と値の無い周は記録を残さず、 前の周の記録を消す"
  - id: FR100
    type: FR
    label: 行の審査
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC73, AC22, AC76, AC82, AC83, AC81] }
    ears:
      pattern: event
      condition: "行の審査が設計の PR の head の commit を名指して要求されたとき"
      response: "器は、 その commit と origin/main の先端の merge-base の間で行の digest が変わった契約表の行のうち、 設計 pointer がその行を指す bead が 1 本も無いか 1 本でも closed でない行ごとに、 受付と同じ機械の検査（FR1・FR48・FR54・FR105・FR109 の判定を記帳せずに撃つ形）と、 契約の審査（FR49）と同じ lens を、 head の commit を detach した審査の木を cwd にして読みの道具で 1 回撃ち、 判定を判定の鍵ごとに state dir の記録に残し、 head ごとの結果を閉じた 4 語（pass・fail・pending・stale）で、 行の審査の merge-base と判定した契約表の file の列とともに残す。 判定の鍵は、 行の digest・材料の鍵・code の木の鍵（対象 repo の code の file の木から決まる鍵）・basis（actual・forecast・partial）・祖先ごとの状態・lens の子が自ら出す lens の版の全部とし、 同じ鍵の記録を既に持つ行（理由の型が unparsed の記録を除く）は撃ち直さない。 機械の検査が確定の断りを返した行は lens を撃たずに FAIL とする。 未着地の祖先を持つ行は、 祖先の行と実装する節の本文を材料に足した予想の審査（forecast）とし、 祖先の新しい file を空で置かない。 bead の無い行は doc を跨ぐ祖先を測れないので partial とする。 結果は、 全行が PASS か、 INCONCLUSIVE の行が全部 forecast か partial で理由の型が unparsed でないなら pass、 FAIL の行か actual の INCONCLUSIVE の行か unparsed の行が 1 本でも在れば fail、 撃ち中の印の持ち主が生きている間は pending、 持ち主が死んで撃ち終えていなければ stale とする。 口は全部の行を撃ち終えるまで前面で走り、 結果を標準出力に返し、 席の入力欄へ差し込まない（行の審査の知らせは FR44 の閉じた列に無い）"
  - id: FR101
    type: FR
    label: merge の門の行の審査の判定
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC74, AC62] }
    ears:
      pattern: unwanted
      condition: "席の道具の呼び出しが PR を main へ入れる merge の command（help を出すだけの command を除く）を撃とうとし、 (i) anchor の HEAD の commit か local に在る PR の head の commit の vessel 宣言が任意 key row-review を true で持つ repo で、 その command が PR の head の commit を 40 桁の 16 進の sha で固定しないか、 その sha の行の審査（FR100）の結果が無い・読めない・pass でないか、 結果が名指す契約表の file が行の審査の merge-base と今の origin/main の間で変わったとき、 (ii) どちらかの commit の vessel 宣言が在るのに読めないとき、 または (iii) anchor の HEAD の vessel 宣言が row-review を true で持つ repo で、 PR の head の commit を local に持たないとき"
      response: "器の hook の入口は、 merge の門の 2 つ目の判定（1 つ目は FR92 の trailer の判定）として merge の command を実行の前に deny し、 (i) では判定の順の閉じた 6 語（no-head-pin・row-review-missing〔結果が無い・読めない〕・row-review-pending・row-review-stale・row-review-failed・row-review-moved）のうち最初に当たる語を、 (ii) と (iii) では読めない理由を名指し、 次に撃つ口（(ii) と (iii) では git fetch origin）を名指す。 (ii) に当たらず、 anchor の HEAD の宣言も local に在る PR の head の commit の宣言も key row-review を true で持たない repo の merge の門は FR92 の判定だけを持つ。 2 つ目の判定が読むのは、 2 つの commit の vessel 宣言（git で commit から読み、 作業ツリーは読まない）と state dir の結果の 1 file と契約表の file の差の有無だけで、 台帳と event log は読まない"
  - id: FR102
    type: FR
    label: 行の予約
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC75] }
    ears:
      pattern: state
      condition: "台帳の open な契約 B（起動の列の入力の条件〔依存・pointer〕も、 起動の列の外か列に戻ったかも問わない）が memo の label も台帳の問いの label（FR81）も持たず、 B の直前の便が Landed でない終端（契約の審査が PASS でない・gate の verdict が FAIL・Failed・Stopped）に着き、 その後に同じ bead の便が起きておらず、 最新の介入の印が hold でなく、 その終端から rules 行 pipe.reserve_h の時間（値は user 裁定 id 付き・値 0 は期限なし）が過ぎていない間"
      response: "器の dispatcher は、 B の直前の便の契約の write-set を B の行の予約とし、 FR68 の順序の 1 関数で並べた時に B より後ろの候補のうち write-set が B の行の予約と交差する（FR39 と同じ判定）候補を、 行の予約の待ち（reserved）の理由で待たせる。 B が台帳の blocks で待つ祖先（推移）の候補は待たせない。 rules 行が読めない周は期限なしとして読み、 読めないことを列挙に出す。 行の予約は B の新しい便の起動・B の close・B の memo か問いの label・B への hold の印・期限のどれかで解け、 器は記帳せず既存の記録から周ごとに導く"
  - id: FR103
    type: FR
    label: 兄弟の待ち
    priority: must
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2, N-1], acceptance: [AC76] }
    ears:
      pattern: state
      condition: "台帳の open な契約 B の直前の便が、 契約の審査の FAIL か INCONCLUSIVE（理由の型が unparsed でない）か gate の FAIL で終端している間"
      response: "器の dispatcher は、 B と同じ契約表の置き場の file の行のうち、 B と同じ節を実装する契約と、 B の行の digest（B の直前の便の記録から求める）を載せた行の審査（FR100）の記録に載る契約を、 介入 first の印を持つ契約と B が台帳の blocks で待つ祖先（推移）の契約を除いて、 兄弟の待ち（sibling）の理由で待たせる。 兄弟の待ちは、 B の今の行の digest が B の直前の便の記録と違う周・B への release か hold の印・兄弟自身の今の行の digest の行の審査の記録で、 判定が PASS か、 forecast か partial で unparsed でない INCONCLUSIVE のものが B の終端より後に書かれた周・B の close・期限（rules 行 pipe.reserve_h を共用）のどれかで解け、 器は記帳せず既存の記録から周ごとに導く"
  - id: FR104
    type: FR
    label: done の項目ごとの歯の欄を求める行
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-4], acceptance: [AC77] }
    ears:
      pattern: unwanted
      condition: "vessel 宣言が任意 key teeth-check を true で持つ repo で、 契約表の検査に比べる base の commit が渡され、 その commit の同じ契約表の置き場の file に同じ id の行が無いか done の字が base と違う契約表の行（done の欄を持たない行を除く）が、 done の項目を 1 つも持たないか、 done の項目ごとの歯を名指す任意の欄を持たないとき"
      response: "契約表の検査は、 その行を file と行と理由（done-unnumbered か done-teeth-missing）で名指して非 0 で終わる。 比べるのは表の行の done の字（表の読みの後の値）で、 done 以外の欄と設計の節の散文だけを変えた行は名指さない"
  - id: FR105
    type: FR
    label: done の項目ごとの歯の欄の照らし
    priority: must
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2, N-3], acceptance: [AC77, AC26] }
    ears:
      pattern: unwanted
      condition: "契約表の行が done の項目ごとの歯を名指す任意の欄を持ち、 欄が次のどれかに外れるとき — (a) 要素が「番号:歯」の形で読め、 歯は名・= を前に置いた既存の歯・@ と番号で指す verify 行・! を前に置いた器の仕組みの名の 4 形のどれか (b) 番号の集合が done の項目の 1〜K とちょうど等しい（K が 0 の行は欄を持てない） (c) @ と番号で指す verify 行が行の verify 行の本数の内に在る (d) 名と既存の歯が、 名を解く読み手の在る形の verify 行の 1 本に選ばれる (e) base を持つ判定（base を渡した契約表の検査の変わった行・受付・受付と同じ判定を便を作らずに撃つ器の口）では、 既存の歯が base の、 その歯を選ぶ verify 行が選ぶ test の範囲にちょうど 1 つ在り、 base に在る名の歯は 1 か所に定まる (f) 器の仕組みの名が閉じた 4 語（write-set・place-only・new-file・closure）の内に在り、 測る物（place-only は = の項目・new-file は + か ~ の項目・closure は便の worktree で契約表の検査を撃つ verify 行）を行が持つ"
      response: "器は契約表の検査と受付と、 受付と同じ判定を便を作らずに撃つ器の口の同じ 1 つの判定で、 外れた要素と理由を全件・行番号つきで名指し、 受付は便を作らない"
  - id: FR106
    type: FR
    label: gate の歯の照らし
    priority: must
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2], acceptance: [AC78] }
    ears:
      pattern: event
      condition: "契約 file が done の項目ごとの歯を名指す任意の欄を持つ便の gate が要求されたとき"
      response: "器は gate の write-set を照らす段で、 名の形の歯（= も @ も ! も前に置かない歯）が便の worktree の HEAD の、 その歯を選ぶ verify 行が選ぶ test の範囲にちょうど 1 つ在り、 base に無いか本文が base と違うことと、 既存の歯が同じ範囲にちょうど 1 つ在ること（FR105 の (e) と同じ述語）を測り、 外れた歯を名指して段を落とす（FAIL・落とす段と理由の型はその段の既存のもの）。 @ と番号で指す verify 行はこの段で測らない（FR8 の実走が測る）"
  - id: FR107
    type: FR
    label: code の索引
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-2], acceptance: [AC80, AC82] }
    ears:
      pattern: event
      condition: "vessel 宣言が code の索引を作る外の道具の command の任意 key（言語に依らない code の索引の形式〔SCIP〕の file を出す command の key と、 名の使われ方の種類の一致を 1 行 1 件で出す command の key）のどちらかを名乗る repo で、 行の審査（FR100）・受付と起動の列（閉じた型を変えると宣言した契約〔FR48〕か code の事実を名乗る欄を持つ行〔FR109〕を扱う周に限る）・表を出す器の口のどれかが commit の code の索引を要したとき"
      response: "器は、 宣言が 2 つの key の片方だけなら索引の宣言の読みで断って索引を持たない（vessel 宣言のほかの key の読みと FR101 の宣言の読みには数えない）。 両方を名乗るなら、 その commit の code の木と宣言から決まる鍵の索引が state dir に在ればそれを読み、 無ければその commit を detach した木で宣言の command を封じ込めの中で host の memory の枠を取って撃ち（時間の上限は rules 行 index.timeout_s・値は user 裁定 id 付き）、 出力を器自身の読み手で読んで 1 行 1 場所の表にして state dir に置き、 作れなかった周は失敗の語を記録に残して表を置かない。 同じ鍵の索引を作り中の持ち主が生きている間は、 行の審査と表を出す器の口はその終わりを待ち、 受付と起動の列は待たずに下の作り中の扱いをとる。 state dir の索引の合計が rules 行 index.cap_mb（値は user 裁定 id 付き）を越える周は、 作り中の鍵と anchor の HEAD の鍵を除いて古い順に上限まで消す。 索引は作り直せる値で、 無い・読めない・形の違う索引は無いと読み、 真実の置き場にしない。 base の索引を作り中の周は、 閉じた型を宣言し code の事実の欄を持たない契約を、 起動の列は受付の理由（作り中の名）で待たせ、 手の受付（起動の列を経ずに撃たれた受付）は同じ名で断って便を作らない（欄を持つ行の扱いは FR109）。 索引を作れない周は、 閉包を code の索引の分を除く字面の閉包（FR55）にとどめ、 受付の 1 行に索引が無いことを 1 語で残す（欄を持つ行の扱いは FR109）"
  - id: FR108
    type: FR
    label: 行ごとの使われ方の表
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC81] }
    ears:
      pattern: event
      condition: "契約の審査（FR49）か行の審査（FR100）の材料を組むとき、 または表を出す器の口が行か名を名指して撃たれたとき"
      response: "器は、 その行か名指された名ごとに表を組む。 行を名指した周は、 行が変えると宣言した閉じた型と、 行が実装する節が名指す型と関数を項目にし、 名だけを名指した周はその名を項目にする。 表は項目ごとに、 参照・呼び手・構築・match・名を参照する歯・可視性の連鎖・その項目を宣言に持つほかの行の 7 つを、 名が現れる場所と件数と write-set の外の印とともに、 項目の名が tracked file に現れる件数と、 索引が読まない file に現れる件数（母集団）を並べる。 材料を組む周は表を材料の dir に同じ字で置き、 口の周は標準出力に出す。 契約の審査の材料は在る索引を読むだけで索引を作らせない（FR107 を撃たない）。 code の索引が無い周は無いことを 1 行で名指す"
  - id: FR109
    type: FR
    label: 名乗った code の事実の測り直し
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-2], acceptance: [AC83] }
    ears:
      pattern: unwanted
      condition: "契約表の行が code の事実を数で名乗る任意の欄を持ち、 行の審査の head・受付の base・起動の列の HEAD のどれかの commit の code の索引で測った値が名乗りと違うか、 その索引を作り中か作れないか、 vessel 宣言が索引の 2 つの key を揃えて名乗らない repo のとき"
      response: "器は、 値が違う周は名乗り・名乗りの値・実測の値・増えた場所と消えた場所・母集団を名指し、 行の審査はその行を FAIL にし、 受付は契約を断って便を作らず、 起動の列はその契約を受付の理由で待たせる。 索引を作り中の周（受付と起動の列だけが出会う・行の審査は終わりを待つ〔FR107〕）と作れない周は、 名乗りと測れない理由を名指し、 行の審査はそれを確定の断りに数えず（行の判定は lens に委ね、 記録に理由を残す）、 受付は契約を断って便を作らず、 起動の列はその契約を受付の理由で待たせる（名乗った事実を測らずに起動しない）。 索引の 2 つの key を揃えて名乗らない repo（名乗らない repo と片方だけ名乗る repo）では永久に測れないので、 行の審査はその行を FAIL にし、 受付は断り、 起動の列は受付の理由で待たせる。 欄を持たない行はこの判定の外で、 契約表の検査はこの判定を撃たず、 欄の要素の形（FR47）だけを照らす"
  - id: FR110
    type: FR
    label: 上限の許可の記帳
    priority: must
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2, N-1], acceptance: [AC84] }
    ears:
      pattern: event
      condition: "席が器の上限の許可の口に bead・rules 行・値・期限・裁定 id を渡して許可の記帳を撃ったとき、 または bead と rules 行に取り消しを渡して撃ったとき"
      response: "許可の記帳の周は、 器が次の 10 の照合を上から順に照らし、 全部通る周だけ上限の許可の event（actor は machine）を event log に 1 件書いて 1 行を返す: 行が rules 行 pipe.permit_rows（値は user 裁定 id 付き）の名指す行に在る（rule-not-listed）・値が manifest の値より大きい有限の整数（not-raise）・裁定 id が問い id の形でその裁定 event が在る（no-ruling）・裁定 event が引く発話 event が在り actor が human（no-utterance）・発話の経路が対話の session で、 発話 event の session が対象 repo の orchestrator の席の会話 id（claude の session の id・状態の打刻の file の最後の行）と同じ（not-surface・打刻の file が無いか空でない行を持たない周と、 file の最後の行の会話 id が空か会話 id の形でない周も断る）・発話が問いの起票より後（before-question）・期限が今より後で発話の時刻から rules 行 pipe.permit_max_h（値は user 裁定 id 付き）の時間の内側（bad-until）・同じ裁定 id か同じ発話を引く許可がまだ無い（reused）・問いの本文が bead と行 id と値を字のまま持つ（not-stated）・bead の便がまだ着地していない（landed）。 許可の記帳の周は、 器は照らす前に event log・manifest・台帳・対象 repo の orchestrator の席の状態の打刻を読み、 どれかを読めない（file は在るが開けないか、 打刻の file の最後の行が打刻の形〔会話 id の欄の値を除いた行の形〕でない〔前の行へは戻らない〕か、 ほかの置き場の行の形が壊れているか、 manifest の読みが断る〔FR17〕）周は照合の順に関わらず何も書かずに読めない旨を名指して rc 2 で止まり（NFR4）、 照合のどれかが外れる周は何も書かずに、 最初に外れた照合の理由の語を名指して rc 1 で断る。 rules 行 pipe.permit_rows が名指せるのは、 FR111 が許可の読み手を持つ行（予算 cap の rules 行）だけで（ほかの行〔許可の読み手の無い 1 つの便か bead の消費の行・host と群で分け合う上限・構造の上限〔憲法 C4・C13〕・上限でない行〕を名指す値は FR17 の読みが断る）、 上限を外す（上限なし）許可は持たない。 取り消しの周は、 器は裁定 id を要らず、 読むのは event log と manifest だけで、 照合は rule-not-listed だけを照らし（外れる周は何も書かずに rc 1 で断る）、 通る周は同じ bead と行の許可を今の時刻で切る event を 1 件書き（効いている許可が無い周も書く）、 event log か manifest を読めない周は何も書かずに rc 2 で止まる（NFR4）"
  - id: FR111
    type: FR
    label: 上限の許可の効き
    priority: must
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2], acceptance: [AC85] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: "器は、 bead に効いている上限の許可（期限の前で、 bead の便が未着地で、 同じ bead と行の最新の記帳がその許可自身〔後に取り消しも新しい許可も無い〕で、 値が今の manifest の値より大きい許可）が在る周だけ、 その bead の便の gate の予算の照合と、 その gate が起こす lens に許可の値を cap として読ませ、 それ以外の周と、 その gate の照合と lens の外の読み手のすべて（ほかの bead の便・契約の審査〔FR49〕と行の審査〔FR100〕と memo の審査〔FR87〕の lens・host 全体の読み・CI の門を含む）には manifest の値を読ませる（手動の 1 周〔pipe dispatch〕に --rules で渡した写しで起きた便の読みは FR112 の断りの外で、 扱いは後継の決定が持つ・ADR-0106）。 manifest の値の宣言（FR17）は変えず、 許可の値は裁定に基づく実行時の記録として読む（ADR-0106）。 許可の値を読んだ gate の周は、 段の event と verdict の記録に行と値と裁定 id を書く。 pipe show は bead の許可を状態の閉じた語で 1 行ずつ出し、 先に当たる語を選ぶ（landed〔bead の便が着地〕・revoked〔同じ bead と行の次の記帳が取り消し〕・superseded〔次の記帳が新しい許可〕・expired〔期限の後〕・overtaken〔値が今の manifest の値以下〕・active〔効いている〕の順）。 pipe dispatch ls は効いている許可を 1 行ずつ出す。 event log を読めない周は、 許可の値へ倒さずに gate が rc 2 で止まり、 verdict を書かない（NFR4）"
  - id: FR112
    type: FR
    label: hook の subcommand と event log の書きと規則の差し替えの遮断
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC86] }
    ears:
      pattern: unwanted
      condition: "席の道具の呼び出しが、 器の hook の subcommand を撃つ形か、 state dir の event log の file を書く形（Edit・Write・shell の書き込みの向け先）か、 pipe gate・pipe land・pipe resume に --rules を渡す形のとき"
      response: "器の hook の入口は実行の前にその呼び出しを断り、 形ごとの理由の語を名指す（席が起こした子 process の撃ちと書きは門の外・FR82 と同じ）。 権能の guard（FR45）が先に断る呼び出し（権能〔merge〕を持たない席の pipe land・権能〔launch〕を持たない席の pipe resume など）はその断りを出す。 event log を読むだけの command と、 --rules を持たない pipe gate・pipe land・pipe resume と、 手動の 1 周（pipe dispatch）に渡す --rules はこの断りに当たらない（手動の 1 周の --rules の扱いは後継の決定が持つ・ADR-0106）"
nfr:
  - { id: NFR1, type: NFR, label: lens 予算,   category: 性能, target: 1 lens は 0.15M token 以内（既定の目標値。 予算 cap の rules 行への上限の許可〔FR111〕が効く gate の lens の周はこの目標の外で、 lens に渡す diff の上限が許可の値）,                                measure: lens 起動時の diff byte と効いている予算 cap の照合を verdict に記録（上限の許可〔FR111〕が効いた周はその値と裁定 id も）,        vmethod: T, trace: { backward: [N-2], acceptance: [AC3, AC85] }, hero: { cat: 予算, big: "0.15", unit: M token, qual: lens 1 本あたりの既定の上限 } }
  - { id: NFR2, type: NFR, label: 契約の大きさ, category: 大きさ, target: 1 契約の diff は 300 行程度・見積は 550 行以内,                      measure: PR の diff 行数と契約の見積を記録して照合,                   vmethod: A, trace: { backward: [N-4], acceptance: [AC2] }, hero: { cat: 小ささ, big: "300", unit: 行, qual: 1 契約の diff の目安 } }
  - { id: NFR3, type: NFR, label: 依存,        category: 依存, target: 実行時の直接依存 0 本・std だけで build（allowlist の外は歯が落とす）,   measure: cargo xtask check の deps-empty と cargo deny を CI で毎回,     vmethod: T, trace: { backward: [N-2], acceptance: [AC6] }, hero: { cat: 依存, big: "0", unit: 本, qual: 実行時の直接依存 } }
  - { id: NFR4, type: NFR, label: fail-closed, category: 安全, target: 不正入力を黙って落とす件数 0・読めない store は rc 2,                     measure: fixture 実走（壊した行・未知 kind）で全件 loud を確認,           vmethod: T, trace: { backward: [N-3], acceptance: [AC6, AC44, AC45, AC46, AC50, AC84, AC85] }, hero: { cat: 安全, big: "0", unit: 件, qual: 黙って落とす入力 } }
  - { id: NFR5, type: NFR, label: hook の予算,  category: 応答, target: 道具 1 回の呼出しにつき hook は binary 1 本の呼出し 2 回以内（hook の入口と host-guard の口）・各 2.0 秒以内・重い I/O を持たない。 turn の終わりの判定の hook と発話の記帳の hook の呼出しも各 2.0 秒以内で、 event log の大きさに依らない読みだけを持つ（FR88・FR90）。 host-guard の呼出しは git の問い合わせ 1 回まで。 ただし公開の segment（FR80）の周の host-guard の呼出しだけは、 2.0 秒と git 1 回と重い I/O を持たないことに代えて、 git と gh の問い合わせ（GitHub への問いを含む）を数で縛らず、 出ていく字面を 8 MB まで読み、 全体を締め切り 6 秒で縛る（越えた周の扱いは FR80）。 FR11 と FR50 の着地の段の走査も同じ読む上限と締め切りで縛る, measure: hook の wall time と host-guard が断る周の wall time を注入計測の slot に記録し、 host-guard が通す周の時間の上限と git の子 process の回数と公開の segment の周の締め切りは歯が測る。 turn の終わりの判定の hook と発話の記帳の hook の読む byte が event log の大きさで変わらないことも歯が測る（AC58・AC60）, vmethod: T, trace: { backward: [N-2], acceptance: [AC7, AC44, AC50, AC23, AC58, AC60] }, hero: { cat: 速さ, big: "2.0", unit: 秒, qual: hook の呼出し 1 回の上限（公開の segment を除く） } }
  - { id: NFR6, type: NFR, label: host の資源,  category: 安全, target: 封じ込めの外で走る器の子 process 0 本・検証の行の並列度は並列の枠から, measure: 便ごとに封じ込めの有無・並列度・縮退の理由が record に残ることを fixture で確認, vmethod: T, trace: { backward: [N-1, N-2], acceptance: [AC20, AC80, AC72] }, hero: { cat: 資源, big: "0", unit: 本, qual: 封じ込めの外で走る子 process } }

constraints:
  - { id: CON1, label: 憲法,     text: 憲法（Always 17 / Ask-first 4 / Never 4）を本書の上位に置き、 矛盾する要件を書かない,            regulation: 憲法 v0.5.0 }
  - { id: CON2, label: 公開,     text: 本 repo は PUBLIC。 絶対 path・host 名・口座名・user 逐語を tracked file に書かない,             regulation: 憲法 A1（出す） }
  - { id: CON3, label: 歯,       text: test は Rust の 1 framework だけで、 bash / bats の歯を書かない,                                 regulation: 憲法 C12 }
  - { id: CON4, label: 作法,     text: 前の器（v1）の役割席・gate 席・QA 席・契約押印・tier ラベルを持ち込まない,                       regulation: ADR-0003 }
  - { id: CON5, label: 口,       text: binary は不可逆操作（force push・削除・公開・課金）の口を持たない,                               regulation: 憲法 A1 / N1 }
  - { id: CON6, label: headless, text: headless の runner / lens は permission を毎回明示・rate limit は stream-json で検知・context の上限は契約の大きさで受ける（開発 session の context は /compact で扱う）,   regulation: "" }

glossary:
  - { term: 契約,           en: contract,               plain_short: bead 1 本の約束,          def: 何を作り・何ができたら終わりかを表す 1 単位。 正本は契約表の置き場の契約表 1 行で、 器が便の契約 file を生成する。 台帳（beads）の 1 issue に対応する。 }
  - { term: runner,         en: runner,                 plain_short: 実装役の Claude,          def: 契約 1 本を worktree で実装する headless の Claude process。 席ではなく使い捨て。 }
  - { term: lens,           en: lens,                   plain_short: 審査役の Claude,          def: diff を読んで PASS / FAIL / INCONCLUSIVE を返す headless の Claude process。 }
  - { term: dispatcher,     en: dispatcher,             plain_short: 便を自動で起こす器の口,   def: 便を自動で起こし、 gate を通った便を land して merge する器の口（契機と条件は FR68・終端は FR50・ADR-0034・ADR-0045）。 席ではない。 }
  - { term: 起動の列,       en: dispatch queue,         plain_short: 起動を待つ契約の並び,     def: dispatcher が台帳から導く、 起動を待つ契約の並び（入る条件・順序・待ちの理由は FR68 が定める）。 land の順序（FR50）とは別の実体。 }
  - { term: 受付, en: contract intake, plain_short: "契約を便にする前の検査の段", def: "契約 file を便にする前に器が撃つ検査の段。 必須 field・verify の形・allowlist・write-set の余地と閉包（FR48）・設計 pointer（FR54）・done の項目ごとの歯の欄（FR105）・code の事実の欄（FR109）・host の memory の枠・同時走行の最大値（FR68）を通った契約だけが便になる（交差の排他は FR39）。 vessel 宣言が ruling-check を true で持つ repo では裁定 id の実在（FR83）も確かめる。 並列の枠（NFR6）とは別。" }
  - { term: priority,       en: contract priority,      plain_short: 台帳が持つ契約の優先度,    def: 台帳の bead が持つ契約の優先度（P0〜P4）。 起動の列の順序の 2 番目の鍵（FR68）。 要件の priority 欄（必須 / 推奨）とは別。 }
  - { term: Reviewed,       en: reviewed stage,         plain_short: 審査の判定を持つ便の段,    def: 便の段の 1 つ。 契約の審査（FR49）の verdict を持ち、 PASS でない便は runner を起こさず FAIL で終端する。 }
  - { term: 介入, en: orchestrator intervention, plain_short: "orchestrator が順番を動かす印", def: "first（最優先へ）・hold（止める）・release（戻す）の 3 つの typed な印。 user の直命の対として記録され、 台帳の priority は書き換えず、 起動の列の記録として残る（FR68）。 first を持つ契約は床の検査の不合格の間も待たない（FR85）。" }
  - { term: gate,           en: gate,                   plain_short: 機械検証と審査の段,       def: 共通 verify と契約の verify を実走し lens 1 本の verdict を採る段。 PASS でなければ land しない。 }
  - { term: land,           en: land,                   plain_short: main への着地,            def: worktree の成果を squash 1 commit で main に載せ、 main で歯を再実走すること（--pr-cmd の形の便は main に載せず自 repo への PR を作って Landed に達する・FR96）。 }
  - { term: fleet,          en: fleet,                  plain_short: 便と席の状態の全体,       def: 正定義は複数 host にまたがる席・口座・lease・退役の全体（憲法 C3）。 MVP では便と席の現在地の全体を指し、 実体は event log 1 file。 }
  - { term: event log,      en: event log,              plain_short: 追記だけの記録,           def: 1 行 1 出来事を追記する file。 現在地はこれを replay して導く。 }
  - { term: manifest,       en: rules manifest,         plain_short: 規則の値の置き場,         def: 規則の値（閾値・有効 / 無効・裁定 id）を持つ tracked な TOML 1 file。 憲法 C1 の「値は manifest」の実体。 }
  - { term: verdict,        en: verdict,                plain_short: 審査の結果,               def: gate が返す 3 値（PASS / FAIL / INCONCLUSIVE）。 構造化 field が一次 truth。 }
  - { term: 3 クラス,       en: three classes,          plain_short: 人に聞く操作,             def: 消す / 出す / 使う の 3 分類。 これに当たる操作だけ人の承認を要する。 }
  - { term: write-set,      en: write-set,              plain_short: 触ってよい file の列,     def: 契約が宣言する、 編集してよい file の集合。 外への編集は編集の時点で止める。 置き場だけと印を付けた項目（=）は列に載るが中身を変えない（FR20・FR8）。 }
  - { term: ".vessel",      en: vessel marker,          plain_short: 器の所属の目印,           def: repo root の固定名 file。 中身が name と version を言い、 どの器が仕えるかを決める。 }
  - { term: flip check,     en: flip check,             plain_short: test が先に落ちる確認,    def: 変更の test 差分だけを base に当てて新規・変更 test が RED になり、 HEAD では GREEN であることを機械で確かめる検査（憲法 C12.2）。 docs-only の変更は対象外（C12.3）。 }
  - { term: headless,       en: headless,               plain_short: 画面なしの実行,           def: 対話画面を持たず、 入力を受けて 1 回で答えを返す Claude の実行形（claude -p）。 }
  - { term: toy repo,       en: toy repo,               plain_short: 実験用の小さな repo,      def: 到達点を測るために一時 dir に作る、 外部依存の無い小さな git repo。 }
  - { term: 設計 doc,       en: design doc,             plain_short: 設計 1 本の文書,          def: 要望を SRS の要件に結び、 契約が複数出る元になる tracked markdown。 契約表の区間を 0 か 1 つ持てる。 契約表は既定では docs/design/ の直下の設計 doc に置き、 vessel 宣言の contract-tables で名乗れば、 ほかの dir の markdown や表だけを持つ tracked な toml にも置ける（契約表の置き場）。 }
  - { term: 要件カタログ,   en: requirements catalog,   plain_short: 要件の一覧表,             def: 要件 doc の v2 行を scrub して写した一覧（requirements-catalog.html）。 FR との対応は同 page の §移行表 が持つ。 }
  - { term: 承認 event,     en: approval event,         plain_short: 承認の記帳,               def: approval.requested / approval.received の 2 種。 逐語を伴い fleet に残る。 }
  - { term: hook,           en: hook,                   plain_short: 編集の手前で動く番人,     def: Claude Code が tool を呼ぶ直前・直後に自動で走る短い処理。 器は編集を止める側（in-loop guard）と名乗りを出す側に使う。 }
  - { term: diff,           en: diff,                   plain_short: 変更の差分,               def: 変更前と後の違いだけを取り出したもの。 lens はこれを読んで審査する。 }
  - { term: worktree,       en: worktree,               plain_short: 便ごとの別の作業場所,     def: 同じ repo の別の branch を別 dir に取り出した作業場所。 runner は 1 便ごとに 1 つ切る。 }
  - { term: base,           en: base,                   plain_short: 変更の出発点,             def: 便を始めた時点の main の commit。 追随（FR34）で進みうる（記録された最新の base が基準）。 flip check と land はこれを基準に測る。 }
  - { term: INCONCLUSIVE,   en: inconclusive,           plain_short: 判定できなかった,         def: verdict の 3 値の 1 つ。 合格でも不合格でもなく「判断できない」で止まり、 land されない。 }
  - { term: CI,             en: continuous integration, plain_short: PR ごとの自動検査,        def: PR を出すたびに自動で走る検査（test・lint・xtask）。 緑でなければ merge しない。 }
  - { term: marker,         en: marker,                 plain_short: 所属の目印 file,          def: repo root に置く .vessel のこと。 中身が name と version を言い、 hook はこれを見て仕えるかを決める。 }
  - { term: commit,         en: commit,                 plain_short: 変更の 1 区切りの記録,    def: git に残す変更の 1 単位。 runner の完了判定は base からの commit が 1 件以上あるかで測る。 }
  - { term: 対話面の作法,   en: dialogue surface rules, plain_short: user への言い方の決まり,   def: orchestrator の席が user に向けて出す文の形の規則。 信頼度を上位に置く 1 体系で、 則の本文も数も設計 doc 1 本が正本。 雛形が pointer 付きの行で指し、 生成された指示文が運ぶ（FR67）。 }
  - { term: 歯,             en: test,                   plain_short: 落ちるべきときに落ちる test, def: 器を守る自動 test の総称（Rust の 1 framework・憲法 C12）。 「歯が落とす」= test が失敗して変更を止めること。 }
  - { term: RED,            en: red,                    plain_short: test が落ちる状態,        def: test が失敗する状態。 対は GREEN（全部通る）。 flip check は「base で RED・HEAD で GREEN」を確かめる。 }
  - { term: PR,             en: pull request,           plain_short: 取り込みの申請,           def: 変更を main に取り込むための申請。 CI が緑になってから squash merge する。 }
  - { term: docs-only,      en: docs-only,              plain_short: 文書だけの変更,           def: 変更が文書だけの PR。 flip check の test 差分の要件から除外される（憲法 C12.3）。 }
  - { term: 開発 session,   en: development session,    plain_short: 設計・契約・review を行う AI, def: 設計・契約・review を行う AI の session（Claude Code）。 orchestrator の席のように session をまたいで対話を続け、 runner と違い使い捨てではない。 文脈が溢れたら /compact で圧縮し、 session を跨ぐ記憶は台帳が持つ。 }
  - { term: orchestrator,   en: orchestrator,           plain_short: 人と話す唯一の席,       def: 席の唯一の役割。 user と話して承認と裁定を受け取り、 契約・設計・落ちる歯を書く席（仕事の範囲は FR30・権能は FR41・ADR-0045）。 }
  - { term: 質問 record,    en: question record,        plain_short: 実装役が返す質問の合図, def: runner が契約の不足を返して止まるときの typed な合図。 形式は ADR-0016 §2.2 が正本。 }
  - { term: Questioned,     en: questioned,             plain_short: 質問中の段,               def: 便の段の 1 つ。 runner の質問 record を受けて回答 event を待っている状態。 }
  - { term: Blocked,        en: blocked,                plain_short: 承認待ちの段,             def: 便の段の 1 つ。 3 クラスを名乗る契約が spawn の手前で承認 event を待っている状態。 }
  - { term: 口座残量,       en: account allowance,      plain_short: 口座の残りと reset 時刻,   def: 1 口座 1 時刻で読んだ、 5 時間窓・7 日窓・モデル別 7 日窓の残りと各 reset 時刻の組（FR33）。 runner が受ける上限 record（検出の合図）とは出所が違う。 }
  - { term: 追随,           en: follow,                 plain_short: main に追いつくこと,      def: land の前に、 便の base より進んだ main へ worktree の branch を rebase して gate をやり直すこと（規範は FR34・衝突の周の解き方は ADR-0019）。 land の要求 1 回につき 1 度で、 再び main が進んだ周は次の要求で追随する。 main は動かさない。 }
  - { term: 衝突,           en: conflict,               plain_short: 追随の rebase でぶつかること, def: 追随の rebase で、 先着の変更と同じ箇所が重なり器が自動では合わせられないこと（FR34 が記帳する）。 契約同士の write-set の交差（ADR-0019）とは別の概念。 }
  - { term: 上限停止,       en: limit stop,             plain_short: 口座の上限で止まること,    def: 便が口座の残量の上限に当たって止まること。 FR35 の event が記帳し、 別口座での再開は FR37。 }
  - { term: 口座選定,       en: account selection,      plain_short: どの口座を使うか決める,     def: manifest の口座（退役中を除く・FR58）と実測の残量だけから口座を決定的に選ぶこと（FR36）。 便用と session 用の 2 規則を持つ。 }
  - { term: 役割, en: role, plain_short: "席の種類", def: "開発 session の席の種類（orchestrator の 1 つ・FR30 / FR40）。 役割ごとの口座の宣言は器が持たず、 席の口座は群の今の口座か口座の引数か session 用の口座選定で決まる（FR59・ADR-0049）。" }
  - { term: 権能,           en: capability,             plain_short: 役割に許された操作,        def: 役割ごとに許された操作の閉じた一覧。 rules 行が持ち（FR41）、 編集・実行の時点で執行される（FR45）。 }
  - { term: path 種別,      en: path kind,              plain_short: 編集先の file の分類,      def: 編集先の file を分ける閉じた分類。 種別ごとに要る権能が 1 つ対応し、 編集の時点で照合される（FR41 / FR45）。 種別に属する path の集合の出所は ADR-0047 が正本。 }
  - { term: 席の登録,       en: seat registration,      plain_short: 席と役割の記録,            def: 席の役割と anchor を鍵に、 target・口座 label・起動の雛形を項目として fleet の event log に記録すること（FR40）。 記録の無い席は権能を持たない。 }
  - { term: 並列の枠,       en: parallel slot, plain_short: 検証の並列の枠, def: host 単位で便の検証の行（変異検査と、 gate と終わりの門の共通 verify・契約の verify の行）に配る並列の枠（NFR6）。 枠が無い host では縮退する（FR46）。 }
  - { term: 封じ込め,       en: confinement,            plain_short: memory 上限付きの箱,       def: 器が起こす子 process を memory の上限付きの箱の中で走らせること（NFR6）。 }
  - { term: 上限 record,      en: rate-limit record,      plain_short: 上限に当たった印,         def: claude が口座の上限を専用の record で伝える合図。 便の停止判定はこの record だけを入力にする（FR35・ADR-0012）。 }
  - { term: anchor,         en: anchor,                 plain_short: 対象 repo の本体,             def: 対象 repo の main checkout。 席と便の鍵の一部で、 1 つの anchor に orchestrator 1 席（FR40）。 }
  - { term: 席の指示文,   en: role brief,             plain_short: 席に差し込む指示,         def: 役割ごとの雛形と権能の rules 行から器が生成し、 session の文脈が初期化されるたびに注入する文（FR42）。 手書きの規範文は持たない。 }
  - { term: 設計 pointer,   en: design pointer,         plain_short: どの契約表のどの契約か, def: 契約表の file の path と行の id の対で、 その file が契約表の置き場に在るときだけ解決する（FR54）。 intake の入力（FR53）で、 台帳の bead の受入条件が持つ 1 行でもある（FR2）。 }
  - { term: 表の置き場, en: contract table place, plain_short: 契約表を置ける file の一覧, def: "契約表の置き場。 契約表を置いてよい tracked file の集合（表を持たない file も含む）で、 既定は設計 doc の dir（docs/design/）の直下の markdown。 vessel 宣言の任意 key contract-tables が dir（その直下の、 拡張子が .md か .toml の file）か file を足す（置き換えない・FR47）。 器の中で契約表を数える読み手と受付は全部、 この集合を 1 つの列挙で読み（読み手の一覧は ADR-0109）、 宣言を読めない周は既定に倒さない。 素の置き場は多くが state dir の意味で、 write-set の置き場だけの印（=）とも別。" }
  - { term: 台帳 adapter,   en: ledger adapter,         plain_short: 台帳への唯一の口,         def: 器が台帳を読む口（読み取り専用）と、 器の台帳の書き（close と裁定の行・FR50・FR96・FR82・FR93）の口。 器の台帳への読み書きはこの口だけを通る（FR50 / FR51）。 }
  - { term: 禁じる語列,     en: forbidden token sequence, plain_short: 撃ってはいけない語の並び, def: command のうち撃ってはいけない語の並び。 値は manifest の rules 行だけが持ち（並びの例は行を見る）、 器が実行の前に止め、 intake が verify 行に同じ判定を掛ける（FR56）。 }
  - { term: host-guard,     en: host guard,             plain_short: 戻せない操作を止める見張り, def: 不可逆な操作を実行の直前に止める器の subcommand（見張りの種類の閉じた一覧は ADR-0078〔ADR-0056 の 5 つの末尾に publish の種類を足した 6 つ〕。 SRS が要件を持つのは禁じる語列・見張り自身の設定・rm・台帳の破壊と素 write・公開の字面の走査の 5 つ＝FR56 / FR72 / FR74 / FR76 / FR80・git の履歴破壊と tmux server の破壊の 2 種は FR56 の禁じる語列）。 口座の settings.json の hook 行（配線は FR75・健康診断は FR73）から呼ばれ、 口座の設定を読む全 session に marker の有無に依らず効く。 器が起こす session（runner・lens・usage の更新）には届かない。 }
  - { term: 起票の門, en: ledger write gate, plain_short: "台帳の書き込みを止める門", def: "器の plugin を積む席の hook の入口が bd / bdw の command に掛ける門。 台帳 write の 4 形（素 write＝notes の置換・記憶の subcommand・親を欠く create・台帳の script を経ない書き込み）を rules 行 ledger.denied_writes の値で断る（ADR-0056 CTX2）。 ほかに、 形の欠けた台帳の問いの create・notes に足す裁定の行・引き金の行を持たない memo の書き・close の理由の文法の外の close と席が着地の形の理由で閉じる close の 4 つの断り（FR81・close の断りの射程は FR81 (d)）も持ち、 この 4 つの断りは器の plugin の門だけが持つ（host-guard は掛けない）。 host-guard の台帳の種類（FR76）は台帳 write の 4 形の判定を口座の設定を読む session に掛ける。" }
  - { term: 口座の設定を読む session, en: settings-reading session, plain_short: 口座の設定で起きる session, def: 口座の設定 dir の settings.json を読んで起きる session の全体（対話の席・口座の設定 dir を指定した起動・器を積まない session）。 host-guard の配線（FR75）が効く範囲と一致し、 器が起こす session（runner・lens・usage の更新）は含まず、 口座の設定 dir を指定しない起動は配線先に入れない（既定の設定 dir が口座の実体を指す host では届くが、 それは配線の約束ではない・FR56 / FR72 / FR74 / FR76 / FR80・ADR-0056）。 }
  - { term: 公開の segment, en: publish segment, plain_short: 外へ出す命令の部分, def: Bash の command を segment に分けたうち、 git の push と gh の公開の動詞（本文を出す動詞〔pr・issue・release・gist・label と api の書き〕と repo の作成・編集）の部分（FR80）。 host-guard の publish の種類はここだけを読む。 3 クラスの「出す」とは別で、 自 repo への push と PR の作成も含む。 }
  - { term: 公開先の repo, en: publish target repo, plain_short: 出す先の repo, def: 公開の segment が字面を出す先の repo（git の push の行き先・gh の対象の repo・FR80）。 owner/name は、 git が実際に押す URL（pushurl と insteadOf を当てた後）か gh が解いた repo の、 host が gh の既定の host である URL の path の末尾 2 成分として導き、 群の表の行（群と park の区画）の anchor の owner/name も同じ規則で導く（導けない repo の可視性は読めない可視性）。 同じ repo かは owner/name の一致で判じる。 席の target（tmux の窓）とは別。 }
  - { term: 出ていく字面, en: outgoing text, plain_short: 外へ出る文字, def: 公開の segment が外へ出す文字（出ていく commit の message・author と committer の名・patch の追加行と path・押す annotated tag の本文・押す ref の名・gh の本文の flag の値と本文の file・FR80）。 }
  - { term: 隣の private repo, en: neighbor private repo, plain_short: 群の表に並ぶ非公開の repo, def: host の面の群の表の行（群と park の区画）が持つ anchor（FR38・FR95）のうち、 実体が在り、 公開先の repo と別の repo で、 public と実測できないもの（可視性を読めない repo を含む・群の表の行を持たない host では 0・FR80）。 }
  - { term: 識別子の 4 形, en: identifier forms, plain_short: 隣を指す 4 つの形, def: 隣の private repo を指す閉じた 4 つ（FR80・publish の種類の rules 行の値）— repo の名（出ていく字面と名をともに ASCII の英数字と _ の外の字（- と . と / を含む）で区切った成分の並びで、 大文字と小文字を区別せずに照合し、 一般語の名も除かず、 公開の除外の表の字句を名と同じ区切りで切った成分の並びと大文字と小文字を区別せずに一致する区間の中の当たりだけを数えない）・object id（7 桁以上の 16 進の語で、 隣の object db の object の id かその接頭辞であり、 公開先の repo の remote の先端から辿れないもの）・tracked path（/ を含む語が、 隣の tracked な path を / の境界で切った末尾と一致し、 公開先の repo の remote の先端の tracked な path に無いもの）・台帳 id（隣の台帳に在る issue の id・裁定面の記帳 id とは別）。 起票の門の台帳 write の 4 形とは別。 }
  - { term: 候補の木, en: candidate tree, plain_short: 並べて一度に試す作業場, def: main の先端に、 gate を通った便の並びの先頭から数本を順に rebase して作る 1 つの worktree。 gate はこの木に撃ち、 緑なら並べた順に着地する（FR50 の push の先端は最後に着地した commit）。 }
  - { term: host の面,       en: host manifest,          plain_short: host ごとの宣言の置き場,   def: manifest の host の面。 state dir の 1 file が host 固有の宣言値を持ち、 tracked の manifest と同じ読み手で読まれる。 rules 行は置けない（FR57・ADR-0026）。 }
  - { term: 口座の登録,     en: account registration,   plain_short: 口座を器に足すこと,       def: 器の subcommand が口座の設定 dir・席の前提の設定・host の面の宣言を揃え、 login 用の起動 command を user へ渡すこと（FR58）。 login は user の手番で、 登録の口は credential を読まず書かない（器が credential の file を読むのは計測〔FR33〕と口座の墓標の判定〔FR97〕だけ）。 退役と復帰も同じ subcommand が担う。 }
  - { term: 口座の墓標, en: credential tombstone, plain_short: 再 login が要る印, def: "口座の credential の file に現れる、 再 login でしか戻らない印（判じる条件は ADR-0098・判定と語は FR97）。 墓標を置くのは器の外で、 器は置かない。 期限切れの file は墓標でない。 判定の語 dead は、 claude が落ちて窓が shell に戻った席（FR59）とは別の話である。" }
  - { term: 席の起動,       en: seat launch,            plain_short: 器の subcommand で席を起こすこと, def: 役割を必須に受け、 口座を決め、 起動行を導出し、 席の登録を先に書いて target の窓の shell へ差し込むこと（FR59）。 器の subcommand 以外の起動経路を使わない。 }
  - { term: 同時走行の最大値, en: live run cap,           plain_short: 同時に走らせる便の最大本数, def: host で同時に走らせる便（終端でない段の便）の最大本数。 値は rules 行 pipe.max_live だけが持ち（user 裁定 id 付き）、 受付が終端でない便を数えて最大値以上の周は typed に断り、 その契約は起動の列に留まる（FR68）。 走っている便は止めない。 }
  - { term: host の根, en: host root, plain_short: "同じ host の全 project が共有する置き場", def: "state dir の親の下に在る host 用の dir。 同じ host の全 project が共有し、 host 単位の受付の札と、 群の置き場（群の今の口座の記録・移動を頼む記録・群の段の lock と履歴・ADR-0049）がここに在る。 host の面（project ごとの state dir の 1 file）とは別。" }
  - { term: 実効の口座, en: effective role account, plain_short: "その役割の席が使う口座", def: "役割の席が使うと器が役割ごとに解く口座（ADR-0041）。 器は持たず、 群の今の口座に置き換わった（ADR-0049）。 席の口座は群の今の口座か口座の引数か session 用の口座選定（FR36）で決まる（FR59）。" }
  - { term: 実効の記録, en: effective role record, plain_short: "使う口座の記録", def: "器が host の根に役割ごとに高々 1 件書く、 役割の実効の口座の記録（ADR-0041）。 器は持たず、 群の今の口座の記録（ADR-0049）に置き換わった。" }
  - { term: 妥協の起動, en: compromise launch, plain_short: "余裕が無くても席を立てること", def: "閾値未満の口座の候補が無い周に、 上限に当たっていない測れた口座のうち閾値以上の口座、 それも無ければ他の役割の口座との同居も入れた口座で席を起こすこと（ADR-0041 の 2 段）。 器は持たず、 席の起動は理由の語で断る（FR69・ADR-0086）。 群の移動も妥協しない（FR38・ADR-0049）。" }
  - { term: 群の今の口座, en: group effective account, plain_short: "かたまりがいま使う口座", def: "群の席が実際に使う口座。 器が host の根に群ごとに高々 1 件の記録で持ち（ADR-0049）、 記録が無い周は種（宣言順で前の群の種でない最初の候補・ADR-0069）になる。 書き換えは群の移動（FR38）だけが行う。" }
  - { term: 群の逼迫, en: group pressure, plain_short: 口座の残りが線を越えた状態, def: 群の今の口座か群の席が居る口座の使用率が、 5 時間窓・7 日窓・モデル別窓のいずれかで閾値の rules 行の値以上である状態（ADR-0055）。 便の終端の周・席自身の hook・管理 tick の判定の周が測り、 時計では測らない。 }
  - { term: heartbeat, en: heartbeat, plain_short: "黙った席へ送る合図", def: "管理 tick が黙った席の入力欄へ注入する、 続きを促す 1 行（打刻の合図）の呼び名（ADR-0070）。 末尾に alarm の閉じた語（unreflected・floor・unsorted・owned・unreadable・stale）と、 局面の出力が古さの印を持つ周に unsorted と owned へ添える語 stale を持ちうる（FR27）。 実効の値は、 明示の記録 → 群か park の区画の行の key → 種類の既定（群は on・park の区画は off・どちらにも属さない席は on）の順で決まり、 席ごとに on・off の明示の記録を置き default で消せる（FR78・ADR-0092）。 前の器に在った、 席が自分で打つ生存の判子の口と file はこの語で呼ばない。" }
  - { term: backoff,        en: backoff,                plain_short: 間隔を梯子で伸ばして打ち切る, def: 同じ相手に同じ働きかけを繰り返すとき、 反応が無ければ次までの間隔を段ごとに伸ばし、 列が尽きたら打ち切る形。 管理 tick の打刻の合図の待ちの列は梯子の列（規範は FR27）。 }
  - { term: 梯子の列,         en: signal ladder,          plain_short: 合図の待ちを並べた列,   def: 管理 tick の打刻の合図の待ちを段ごとに並べた、 空でない昇順の秒の列（rules 行 1 本・ADR-0068）。 段の待ち・打ち切り・先頭への戻りの規範は FR27。 }
  - { term: 黙りの初段,       en: silence threshold,      plain_short: 黙ったと判じる長さ,     def: 管理 tick が席を「黙っている」と判じる、 最後の打刻からの経過の閾値（rules 行 1 本・既定 30 分）。 梯子の列の先頭とは別の値（規範は FR27）。 }
  - { term: 変化の digest,  en: change digest,          plain_short: 席が動いたかを比べる値,   def: 席に変化があったかを比べるための値 = 席の状態の打刻の最終行の時刻の 1 値。 読める形で梯子の記録に残し、 fleet の event log・context・台帳・pane の字面は入れない（ADR-0058）。 }
  - { term: park の区画, en: park lot, plain_short: "口座を占めない休ませ場所", def: "群の表の、 名 Tier9 の行が宣言する置き場のまとまり（FR95・ADR-0091）。 群ではなく、 群の今の口座・種・群の予約・群の移動の判定・移動を頼む記録を持たず、 口座選定・群の移り先・群の予約のどれからも口座を除かない。 席は口座の引数か、 行が並べた口座からの session 用の選定の口座に居て、 park の移り先の判定が口座を返した周だけ移る。 heartbeat の既定は off（FR78）。" }
  - { term: 群の表, en: group table, plain_short: "かたまりを宣言する表", def: "host の面が持つ置き場のかたまりの宣言の表（FR38）。 行の名は Tier1〜Tier9 に限り、 Tier1〜Tier8 の行は群（口座を占め、 群の今の口座を持つ）を、 Tier9 の行は park の区画（口座を占めない・FR95）を宣言する。 本書で修飾の無い「群」は Tier1〜Tier8 の行の群だけを指す。" }
  - { term: park の移り先の判定, en: park move target, plain_short: "区画の席の移り先の決め方", def: "park の区画の席の移り先の口座を返す判定（FR95）。 row の口座の計測の記録の最新値が session 用の閾値（FR36）のいずれか以上の周だけ口座を返す。 条件の全部は FR95 が持つ。 群の移動の判定（FR38）とは別。" }
  - { term: row の口座, en: row account, plain_short: "席の登録の口座", def: "席の登録 row が持つ口座（FR40）。 群の表のどの行にも属さない席の起こし直しの口座で、 park の区画の席では park の移り先の判定が口座を返さない周の起こし直しの口座（FR95）。 群の席は群の今の口座に居る。" }
  - { term: session 用の閾値, en: session selection threshold, plain_short: "候補にできる使用率の上限", def: "session 用の口座選定が候補にする口座の使用率の上限の rules 行（FR36・今の行は R-C9-1 の 1 本）。 この値未満の口座だけが候補になり、 park の区画の席が移る線もこの行のいずれか以上（FR95）。 群の逼迫の閾値（FR38）とは別。" }
  - { term: 公開の除外の表, en: publish exclusion table, plain_short: "数えない字句の表", def: "host の面が持つ、 隣の private repo の名の当たりを数えない無害な字句の表（FR80・ADR-0093）。 字句のまま持ち、 行は裁定 id を持つ（欄の断りは FR57）。 口座選定の除外（FR36）とは別。" }
  - { term: 群の予約, en: group reservation, plain_short: "かたまりが次に移る口座", def: "群ごとに周ごと導出する、 その群が次に移る口座（FR38・ADR-0069）。 群を宣言順に見て、 どの群の今の口座でもなく先の群の予約でもない、 並べた候補の先頭。 記録せず、 他の群の移動と予約を排他し、 便の起動は排他しない。 予約を持つのは群の今の口座の実測が閾値以上の群か群の今の口座が口座の墓標の群で、 墓標の口座は予約されない（ADR-0074・ADR-0098）。 doctor の群の行の next= の値。" }
  - { term: 残量の鍵, en: headroom key, plain_short: "残りの量で候補を並べる決まり", def: "群の移り先の候補を並べる比較の値の組（FR38・ADR-0069）。 7 日窓と役割の model の 7 日窓の残量（100 − 使用率）の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順。 役割の model の行が無い口座は最後。 5 時間窓は門にだけ効く。 便用の口座選定の並べ順（reset が早い順）とは別。" }
  - { term: 裁定の指し示し, en: ruling pointer, plain_short: "裁定が届いた知らせ", def: "器の口（seat deliver）が、 裁定面の記帳 id 1 つだけを入れた指し示しの雛形の 1 行を待ちの席へ差し込むこと（FR79・ADR-0077）。 裁定の逐語と続きの指示は持たず、 送る行に入る外からの値は記帳 id だけ。 記帳 id は裁定面が自分の置き場で裁定に付けた識別子で、 器の裁定 id（FR82）とは別。" }
  - { term: 裁定面, en: ruling surface, plain_short: "裁定を書く画面", def: "消費側の project が持つ、 user が裁定を書き込む画面と server（器の外の置き場）。 器が承認を受ける対話面とは別で、 器はこの面を持たず、 面が自分の置き場に裁定を書いた後に裁定の指し示しの口（FR79）を撃つ。 この repo の台帳の問いへの答えは、 面が器の答えの口（FR82）を撃って裁定の行と裁定 event にする（承認 event にはしない）。" }
  - { term: 台帳の問い, en: ledger question, plain_short: "台帳に立てる問い", def: "席から user への問いを記録する台帳の bead（label intake:question）。 本文に概要・技術・理由・推奨の 4 つの行を、 metadata に effect（答えを文書へ写すべきかの閉じた 2 値 document / operation）と asked（問いのきっかけの閉じた 2 値 seat / user・値の意味は FR89）を持ち、 形は器の plugin を積む席の session の起票の門が検査する（FR81）。 器が問いとして読むのはこの label の bead だけで、 契約にも memo にも数えず起動の列にも入れない（FR51 / FR68）。 答えは対話の session か裁定面の発話 event と結んで裁定の行になる（FR82）。 runner の質問 record とは別。" }
  - { term: 発話 event, en: utterance event, plain_short: "人が打った字の記録", def: "user が、 器を導入した repo の対話の session へ打った prompt を、 model に読まれる前に逐語のまま残す event（actor は human・発話を指す値は ts・session と発話の経路〔対話の session か裁定面〕を持つ・FR82）。 器が入力欄へ差し込んだ行と別の session からの message の包みは残さず、 裁定面の答えの口の逐語は発話の経路を裁定面として残す。 使い道と逐語を運ばない先は FR65 が持ち（1 つの発話は複数の問いへ結べる）、 人由来の event の数えには入れない。 直命の表（FR65）とは別で、 席の指示文にも復元にも運ばない。" }
  - { term: 裁定 id, en: ruling id, plain_short: "裁定を指す番号", def: "user の裁定を一意に指す id。 閉じた 3 形（器の口（seat ruling bind と裁定面の答えの口）が発行する問い id の形〔<問い id>:<UTC の年月日と時分>-<n>・形の正本は FR82〕と、 消費側の台帳が自分の経路で書く batch: と policy: で始まる形）を持ち、 台帳の問いの notes の裁定の行が持つ（FR82）。 追跡された file の引用はこの 3 形と時刻の形（user <UTC の時刻>）で数え（問い id の形は問いの部分が repo の台帳の接頭辞で始まるものだけ・batch: と policy: の形と線の後の時刻の形は vessel 宣言の ruling-fixtures の一覧に同じ字面が在れば数えない）、 batch: と policy: の形は台帳の裁定の行の裁定 id の欄か束の欄（消費側の台帳の行が持ちうる欄で、 器の bind が書く行は持たない）に解け、 opt-in の線より前の時刻の形は数えるだけにする（FR83）。 裁定面の記帳 id とは別。" }
  - { term: 未反映の裁定, en: unreflected ruling, plain_short: "文書が引いていない裁定", def: "effect が document の閉じた台帳の問いの裁定 id のうち、 main の追跡された file が 1 つも引かないもの（FR84）。 経過時間では判じず、 effect が operation の裁定は数えない。 その裁定を引く契約と問いに blocks される契約だけを待たせ、 着地ではその便を Gated に留める（FR10）。" }
  - { term: 床の検査, en: floor check, plain_short: "main の最低限の検査", def: "main がこれだけは通るべきと repo が決めた最低限の検査の 1 行（vessel 宣言の任意 key floor-check）を、 dispatch の周に main の先端の commit ごとに 1 回撃つ検査（FR85）。 終了コード（rc）0 だけが合格で、 不合格の間は、 介入 first の印を持つ契約（直す便かは判じない）のほかは起動の列の全部の契約が待つ。 便ごとの gate とは別。" }
  - { term: vessel 宣言, en: vessel declaration, plain_short: "repo が器に名乗る file", def: "repo が器に、 許す command・共通 verify・任意の確かめなどを名乗る設定 file（marker の隣に置く tracked な .vessel.toml）。 受付が manifest の上限と突き合わせる（ADR-0010）。 任意 key の remote（押す先・持たない repo の、 main に着地した便は走査も push も CI の照合もせずに閉じ〔宣言を読めない周は閉じない〕・FR50、 PR で着地した便の照合先・FR96）・ruling-check と ruling-fixtures（引用に数えない見本の字面の閉じた一覧・FR83）・floor-check（FR85）・question-route（FR86）・close-check（起票の門の close の断り〔FR81 (d)〕と閉じの misfit の数え〔FR90〕に加わる真偽の key）・row-review（行の審査の merge の門・FR101）・teeth-check（欄を求める検査・FR104）・code の索引の command の 2 key（FR107）・contract-tables（契約表の置き場に足す dir か file の列・FR47 / FR55）を持てる。 ruling-check を持たない repo では器は裁定 id の引用を数えも断りもせず doctor の行がその旨を出し（未反映の裁定の数え〔FR84〕は key に依らない）、 floor-check を持たない repo では床の検査を撃たず列も待たせない。 close-check が false か無い repo と宣言 file の無い repo では、 起票の門は close の理由を見ない（git を撃てない周は宣言 file の無い周と同じに読み、 宣言が在って読めない repo では見る・射程は FR81 (d)）。 marker（.vessel）とは別の file。" }
  - { term: 引き金, en: trigger line, plain_short: "契約へ上げる条件の行", def: "memo の昇格条件の節に置く、 機械が判じる 1 行。 形は閉じた 5 つ（再発・同梱・依存・期日・着地）で、 1 つでも満ちた memo は引き金の満ちた memo になる（FR87）。 引き金の行を持たない memo の create と、 昇格条件の節を引き金の行の無い本文へ書き換える update は起票の門が断る（FR81）。 行の字面の文法は設計 doc が持つ。" }
  - { term: 裁定 event, en: ruling event, plain_short: "裁定を結んだ記録", def: "器の口 seat ruling bind か裁定面の答えの口が問いと発話を結んだときに 1 件記帳する event（欄は FR82）。 到達点の計測では承認の側に数える（FR22）。 席の道具の呼び出しが逐語を渡して記帳する口は無い。" }
  - { term: memo, en: memo, plain_short: "契約の前の覚え書き", def: "台帳の bead のうち label intake:memo を持ち、 受入条件の設計 pointer を持たない覚え書き（契約にする前の段）。 本文に決まった 4 つの節を持ち、 起動の列に入らず（FR68）、 昇格条件の節に引き金の行を持つ（FR87）。 設計の中身を持つなら tracked な設計 doc への pointer を要る（FR51）。 開いた memo は閉じた 4 つの局面のどれかにいて、 close の理由は昇格済み・まとめた・見送りの 3 つの形に限る（FR91）。" }
  - { term: 昇格, en: promotion, plain_short: "memo を契約へ上げること", def: "memo を契約へ上げる処置（判定の値は promote）。 memo に設計 pointer を書いて契約にする形と、 memo を残して契約を分け notes に昇格の行（全部か一部）を足す形の 2 つ（FR91）。 器は自分では行わず、 処置の待ちの memo（FR91）を知らせる（FR87）。" }
  - { term: 案件, en: case, plain_short: "根から辿れる束", def: "根の部品 1 つ（memo か台帳の問い）と、 そこから結び（FR90）で辿れる部品と結びの束。 台帳の bead 1 本（issue）とは別の語で、 1 つの発話は複数の案件の根へ仕分けられる。" }
  - { term: 局面, en: lifecycle position, plain_short: "一生のいまの位置", def: "部品が一生のどこにいるかを表す閉じた語（FR90）。 便の段とは別の語で、 便の段の値は便の部品の局面へ写る（FR90）。 どの局面にも当たらない部品と FR91・FR92 が定める部品は misfit。 語の一覧と優先の順は設計 doc が持ち、 memo の局面の語と順は FR91 が持つ。" }
  - { term: 手番, en: next mover, plain_short: "次に動く者の番", def: "局面ごとに、 次に動く番が誰にあるかを表す閉じた 6 値（user・seat・vessel・runner・ci・none・FR90）。 要件の部品を除き、 手番が seat のまま年齢の閾値を越えた部品（席の手番の閾値越え・FR90）は、 管理 tick が alarm の語 owned で知らせる。" }
  - { term: 発端, en: origin, plain_short: "どこから来たか", def: "部品を生んだ上流。 memo なら生んだ発話で、 その結びの正本は仕分けの event（FR88）。 器の便でない着地の commit なら、 発端の trailer が名指す台帳の bead（FR92）。" }
  - { term: 仕分け, en: sorting, plain_short: "発話の行き先を決めること", def: "user の発話の行き先を決める閉じた 3 つの形（要望＝開いた memo へ発端として結ぶ・答え＝台帳の問いへ結んで裁定にする・会話＝台帳を変えずに仕分け済みにする・FR88）。" }
  - { term: 部品, en: part, plain_short: "一生を追う単位", def: "局面の出力（FR90）が局面と手番を導く単位で、 閉じた 9 種（発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・器の便でない着地の commit）。" }
  - { term: 答えの口, en: answer mouth, plain_short: "画面の答えを受ける口", def: "裁定面が台帳の問いへの答えを器に渡す器の口（FR82）。 逐語を command の字面の外で受け、 発話 event・裁定の行・問いの close・裁定 event を書いて裁定 id を返す。 承認 event は書かず、 席の道具の呼び出しからの撃ちは器の hook の入口が断る。" }
  - { term: misfit, en: misfit, plain_short: "どこにも当たらない印", def: "局面の出力（FR90）で、 どの局面にも当たらない部品と、 FR91・FR92 が定める形（読める引き金の無い memo・閉じの誤り・台帳に無い発端など）の部品に付ける局面の値。 理由の語の一覧は設計 doc が持つ。" }
  - { term: 古さの印, en: stale mark, plain_short: "出力が古いという目印", def: "局面の出力（FR90）に付く印で、 種類は閉じた 3 つ（起票の門・merge の門・読めない周）。 門の印は、 起票の門が席の道具の呼び出しの台帳の書きを通したときと、 器の hook の入口が器の便でない merge を通したときに、 付けた時点の入力の印を持って付き、 印の種類に対応する入力がそれより新しい全部の書き直しが消す。 読めない周の印は、 入力を読めない周に入力の印を持たずに付き、 印の後に始まり全部の入力を読めた全部の書き直しが消す。 種類ごとに 1 つまでで、 同じ種類の後の印が前の印を置き換える。 読み手はこの印を見て古い出力を古いと示す（FR94）。" }
  - { term: 入力の印, en: input mark, plain_short: "読んだ入力の版の目印", def: "局面の出力（FR90）が持つ、 書き直しが読んだ台帳・event log・main の状態の印。 読み手は自分が読める今の印と比べて出力の古さを判じる（FR94）。" }
  - { term: 発話の経路, en: utterance channel, plain_short: "字が来た道", def: "発話 event（FR82）が持つ閉じた 2 値（対話の session・裁定面）。 裁定の行の欄と裁定 event の数え（FR22）に使い、 4 欄の既存の裁定の行は対話の session と読む。" }
  - { term: 読みの道具, en: read-only tools, plain_short: "読むだけの道具", def: "器が lens の claude に渡す道具の閉じた列 Read・Grep・Glob（ADR-0102）。 書きの道具と shell を持たず、 許可の問いを誰にも出さない mode（dontAsk）で起きる（FR5）。" }
  - { term: 審査の木, en: review tree, plain_short: "審査用の作業木", def: "契約の審査（FR49）と行の審査（FR100）の lens の cwd になる一時の worktree。 契約の審査では器が材料を組む前に読んだ対象 repo の HEAD の commit を便の記録の dir の直下（材料の dir の外）に、 行の審査では設計の PR の head の commit を detach し、 判定の後に外す（着地の列の候補の木とは別）。" }
  - { term: 共通 verify の節, en: common verify section, plain_short: "runner への検査の行", def: "器が runner の stdin の契約の直後に足す節で、 便の写しの共通 verify の各行を gate と同じ 4 つの穴の埋め方で埋めて並べる（FR4）。" }
  - { term: 終わりの門, en: end gate, plain_short: "終わった直後の検査", def: "runner の turn が rc 0 かつ base からの commit 1 件以上で終わった直後に、 器が gate と同じ段の列を gate と同じ撃つ関数で便の worktree に撃つ機械の検査（FR98）。 rc が 0 でない行が在り測れなかった行が無ければ、 rules 行の上限の周まで同じ worktree で runner を起こし直す（FR98）。" }
  - { term: 行の審査, en: row review, plain_short: "merge 前の審査", def: "契約表の行を足す・変える設計の PR の head で、 行の digest が変わり、 指す bead が無いか 1 本でも閉じていない行ごとに器が撃つ、 受付と同じ機械の検査と契約の審査の lens（FR100）。 判定は判定の鍵ごとに記録する。 結果の語 stale（撃ち中の印の持ち主が死んで撃ち終えていない）は古さの印とは別。" }
  - { term: 行の digest, en: row digest, plain_short: "行の中身の指紋", def: "行の欄から受付と同じ生成で作った契約の字の hash と、 行が実装する設計の節の本文の hash の対（契約の審査〔FR49〕の中身の同一性と同じ 2 つ）。" }
  - { term: 材料の鍵, en: materials key, plain_short: "審査材料の指紋", def: "審査の材料の dir の全 file の名と本文から決まる 1 つの digest。 lens の cmd の字は判定の鍵にも入れない（FR49）。" }
  - { term: 判定の鍵, en: verdict key, plain_short: "審査を写す鍵", def: "行の digest・材料の鍵・code の木の鍵・basis・祖先ごとの状態・lens の版を並べた字の digest。 同じ鍵の行は撃ち直さず（unparsed の記録を除く）、 契約の審査の段は同じ鍵の実物の PASS だけを写す（FR100・FR49）。" }
  - { term: 行の予約, en: row reservation, plain_short: "落ちた行の取り置き", def: "直前の便が着地でない終端に着いた open な契約が、 次の便の起動・close・hold・期限などで解けるまで持つ write-set の取り置き（FR102）。 後ろの候補の交差を reserved の理由で待たせる。 次に移る口座の群の予約とは別の話である。" }
  - { term: 兄弟の待ち, en: sibling wait, plain_short: "兄弟の行の待ち", def: "契約の審査の FAIL か INCONCLUSIVE（unparsed を除く）か gate の FAIL で終端した契約と同じ節の契約か、 その行の digest を載せた行の審査の記録に載る契約を、 直しが入るなどで解けるまで待たせる起動の列の待ちの理由 sibling（FR103）。" }
  - { term: done の項目, en: done item, plain_short: "番号つきの約束", def: "done（契約の「何ができたら終わりか」の欄）の字を (1) から 1 ずつ増える半角の番号の印で区切った約束の 1 つ。 項目ごとの歯は契約表の行の任意の欄が名指す（FR104・FR105）。" }
  - { term: code の索引, en: code index, plain_short: "名の場所の索引", def: "vessel 宣言が名乗る外の道具が commit の木から作った、 名が現れる場所とその使われ方の種類の表（FR107）。 器が自分の読み手で読み、 state dir に置き、 作り直せる値として扱う。 FR108 の行ごとの表とは別。" }
  - { term: 上限の許可, en: limit permit, plain_short: "作業 1 つだけの上限上げ", def: "rules 行 pipe.permit_rows が名指す、 許可の読み手を持つ rules 行（予算 cap の行）1 本を、 bead 1 つに限って manifest の値より大きい有限の値へ上げる記録（FR110・FR111）。 manifest の値は変えず、 event log の 1 件として持ち、 対話の session の経路の発話に結んだ裁定 id を要り、 期限・bead の着地・取り消し・同じ bead と行の新しい記帳で切れ、 値が manifest の値以下になった周も効かない。 その bead の便の gate の予算の照合と、 その gate が起こす lens だけが読む。" }
