  - id: FR29
    type: FR
    label: 退避の合図（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC8] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は context 使用量を理由に開発 session へ退避の合図を注入しない（ADR-0045 §2 (2) で廃止）。 不在は不在を測る歯が確かめる

  - id: FR30
    type: FR
    label: 配送構造
    priority: should
    vmethod: A
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC10] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 便の配送構造は orchestrator の 1 役割の席（席数と一意性は FR40）と器の dispatcher からなり、 口座は便ごとに FR36 が選び、 便の起動・着地・merge は席でなく器の dispatcher が行い（起動の条件・順序・契機は FR68・着地の終端は FR50）、 orchestrator は契約と priority と typed な介入（first / hold / release）と runner の質問への回答か契約の改訂だけを書き、 実装を自分では行わない（落ちる歯〔tests/ の編集〕は書く・FR41）
  - id: FR31
    type: FR
    label: 質問の停止
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC10] }
    ears:
      pattern: event
      condition: runner が契約の不足を typed な質問 record で返して止まったとき
      response: pipeline は便を Questioned の段に倒し、 質問 event を逐語付きで記帳し、 回答 event が無い間は再開しない
  - id: FR32
    type: FR
    label: 質問の再開
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC10] }
    ears:
      pattern: event
      condition: Questioned の便に回答 event（逐語付き）が記帳された状態で resume が要求されたとき
      response: 同じ便を続きの段から通し、 質問と回答の逐語を runner の入力に添える

  - id: FR33
    type: FR
    label: 口座残量の計測
    priority: should
    vmethod: D
    rationale_source: N-2
    trace: { backward: [N-1, N-2], acceptance: [AC11, AC12] }
    ears:
      pattern: event
      condition: 口座残量の計測が要求されたとき
      response: manifest に列挙した口座（退役中の口座を除く・FR58）ごとに、 5 時間窓・7 日窓・モデル別 7 日窓の口座残量と reset 時刻を口座の endpoint から 1 コマンドで読み、 出所（口座・endpoint・時刻）付きの実測値（Measured）として fleet の event log に記録し、 読めない回は理由付きで「測れなかった」を記録して 0 の値に読み替えない
  - id: FR34
    type: FR
    label: 追随
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1] }
    ears:
      pattern: event
      condition: land が要求され、 verdict が PASS で、 worktree が clean で、 main の tip が記録した base より進み、 base が main の祖先であるとき
      response: worktree の branch を main へ rebase して gate をやり直し、 進んだ base と衝突の事実を event に記帳する。 衝突した周は rules 行が持つ上限までは終端にせず、 上限に達した周は Failed で終端する。 rebase で便の変更が既に main に在る（commit が空になる）周は gate をやり直さず記帳して終端する。 main は変えない

  - id: FR35
    type: FR
    label: 上限停止の検知
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC12] }
    ears:
      pattern: event
      condition: 便の runner が上限 record（ADR-0012 の typed な record・口座の上限の合図）で止まったとき
      response: 器はその停止を、 どの口座のどの窓かが分かる typed な event として記帳し、 worktree と便の記録を保ち、 便を Failed にしない
  - id: FR36
    type: FR
    label: 口座選定
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC12, AC13, AC28, AC29] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 口座は、 manifest に宣言した口座（退役中の口座は FR58 で候補から外れ、 便用は席の登録 row を持つ口座と役割の口座（宣言値）と役割の実効の口座を次の選定から除き、 走行中の便は止めない）と実測した口座残量（FR33）だけから決定的に選び、 便用（7 日窓の reset の早い口座から使い切る側）と開発 session 用（席の登録 row の口座は除かず〔席は orchestrator の 1 役割で、 同じ実効の口座に揃う・FR59〕、 逼迫度が最小の口座を選び余裕を残す側）の 2 つの規則を持ち、 規則の値は session 用の閾値の rules 行（R-C9-1 とその窓別の行・user 裁定で発効）だけから取る
  - id: FR37
    type: FR
    label: 別口座での途中再開
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC12, AC39] }
    ears:
      pattern: event
      condition: FR35 で記帳された便、 または Spawned の段の便の再開が要求されたとき（この便の再開は FR14 に優先する）
      response: 器は runner の process が生きているかを測り（生きている便は typed に断り、 runner を 2 本にしない）、 FR36 で口座を選び（上限で止まった便は別の口座）、 同じ worktree と同じ契約（回答済みの質問と、 前の runner が残した未 commit の変更の一覧を添えて・FR32）で runner を起こし直し、 記帳した段から Landed まで続ける。 候補となる口座が無い周は便を Failed にせず、 いずれかの口座の窓が最も早く reset する時刻まで待ってから再開する
  - id: FR38
    type: FR
    label: 開発 session の上限前の退避（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC18] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は口座の窓の使用率を理由に開発 session へ退避の合図や妥協の通知を注入せず、 強制サイクルの印を書かず、 席を立て直さず、 窓ごとの強制の rules 行を持たない（ADR-0045 §2 (2) で廃止）。 口座が上限に当たった orchestrator の席の再起動は user が席の起動（FR59）を撃ち、 役割の実効の口座の解決は FR59 が持つ。 不在は不在を測る歯が確かめる
  - id: FR39
    type: FR
    label: intake の排他
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC14] }
    ears:
      pattern: unwanted
      condition: 契約が intake に出され、 その write-set が終端でない段の便の write-set と交差するとき
      response: 器は交差する file と相手の便を名指す typed な理由で契約を断り、 便を作らない。 相手の便が終端の段に達するか止められた後は、 同じ契約を受け付ける。 契約を断る理由の閉じた一覧と終端でない段の便の判定は、 同時走行の最大値の断り（FR68）と共有する
  - id: FR40
    type: FR
    label: 席の登録
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC15, AC19, AC29] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は開発 session の席の役割を閉じた一覧の値（orchestrator の 1 つ）として持ち、 席の識別子（役割, anchor）を鍵に、 席の target・口座 label（役割の実効の口座〔FR59 の解決〕の写し）・起動の雛形を項目として fleet の event log へ記録し、 役割の記録が無い席をどの権能も持たない席として扱う。 1 つの anchor に orchestrator は 1 席とする
  - id: FR41
    type: FR
    label: 権能の所在
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC15] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 役割ごとの権能は rules manifest の行 role.orchestrator（裁定 id 付き）が持ち、 承認の記帳は rules 行 R-C7-1 が名指す orchestrator の席の権能とし、 便の起動・着地・merge は行に無く器の dispatcher だけが行い（FR68）、 席の src の編集は行に無く、 落ちる歯の編集（tests/ の path 種別）だけを行が与える
  - id: FR42
    type: FR
    label: 席の指示文の注入
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC17] }
    ears:
      pattern: event
      condition: 開発 session の席で session が開始されるとき（/compact の後を含む）、 または圧縮（/compact と自動圧縮）が始まる直前
      response: session の開始では、 器は、 その席に役割の記録が在ればその役割の manifest 行と役割ごとの雛形から生成した短い指示文（席の同一性・憲法の効く部分の pointer・役割の特性・台帳の現在地の 4 群からなり、 行の構成と行数の上限は ADR-0045 が正本）を session の開始で文脈へ注入し（入力欄を経由しない）、 役割の記録が無ければ注入せず、 runner には憲法の散文を 1 行も注入しない。 生成した指示文は行が持つ権能をすべて名指し、 C 条文の規範文を持たず、 雛形の外に手書きの規範文を含まない（両向きの drift は CI が検査する・FR18）。 役割の記録が在る席の session の開始では、 器は指示文の後ろに、 台帳と git から機械で導いた直近の流れの事実行（仕掛かり中の契約・直近に更新された契約・直近の commit・未 commit の変更。 規範文を持たず指示文の行数に数えない）を出し、 圧縮の後の開始で圧縮の直前の 1 枠が在れば、 その 1 枠を 1 回だけ出して消す。 圧縮が始まる直前では、 器は役割の記録が在る席の直前の発言を逐語で圧縮の直前の 1 枠（state dir の席ごとの置き場・repo の外）に書き、 圧縮を止めない（役割の記録が無い席では書かない）
  - id: FR43
    type: FR
    label: 席の継続（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC18] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は席の queue から続きの pointer を注入しない（ADR-0045 §2 (2) で廃止）。 席が抱える次の仕事は台帳の現在値が持ち、 止まった席の続きは user が対話面で促す。 不在は不在を測る歯が確かめる
  - id: FR44
    type: FR
    label: 席間の連絡（廃止）
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC19] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 1 つの anchor の席は orchestrator の 1 席（FR40）であり、 器は席間の連絡の経路と入力欄への合図の注入を持たない（ADR-0045 §2 (2) で廃止）。 入力欄への差し込みは席の起動（FR59）の起動行にだけ使う。 不在は不在を測る歯が確かめる
  - id: FR45
    type: FR
    label: 権能の執行
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC15, AC16] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 権能で守られた操作はその権能を持つ役割の席からだけ通し、 検査は編集・実行の時点で（in-loop に）行い、 断るときは欠けた権能と権能を持つ rules 行の id を告げる。 席の src の編集は、 契約が typed な印で開いた便の write-set の内側に限り通す
  - id: FR46
    type: FR
    label: 縮退
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC20] }
    ears:
      pattern: event
      condition: 封じ込めか並列の枠が使えない host で便が起動されたとき
      response: 器は並列度 1 で進み、 便を断らず、 縮退の事実と理由を record に残す

  - id: FR47
    type: FR
    label: 契約の正本
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4, N-3], acceptance: [AC21] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 契約は tracked な設計 doc の契約表の 1 行（少なくとも要件 id・実装する設計の節・write-set・検証を持つ）だけから取る
  - id: FR48
    type: FR
    label: write-set の閉包
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4, N-3], acceptance: [AC21] }
    ears:
      pattern: unwanted
      condition: intake に出された契約の行が閉じた型（variant を得る列挙・rules 行・完了の値・event の種類）を変えると宣言し、 base でその型を構造として持つ source file の集合を write-set が含まないとき（導出が source を読めない周を含む）
      response: 器は足りない file（読めない周はその source）を名指す typed な理由で契約を断り、 便を作らない
  - id: FR49
    type: FR
    label: 契約の審査
    priority: must
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2, N-1], acceptance: [AC22] }
    ears:
      pattern: event
      condition: 便が intake を通ったとき（設計 doc の契約表の行から契約 file が生成された直後）
      response: 器はその直後に、 契約とそれが実装する設計と要件を lens に読ませて verdict を採り、 その verdict を契約の中身（sha）付きで、 lens に渡した設計の節の本文の写しとともに便の記録に残し、 PASS でない便は runner を起こさず Reviewed の段で FAIL として終端する。 契約の中身の同一性は、 契約の字と、 便の記録に残る設計の節の本文の写しの両方で判定し（写しを持たない便は契約の字だけで判定する）、 同じ中身で審査 FAIL の便が在る契約が列に入らないことは FR68 が定める
  - id: FR50
    type: FR
    label: land の終端
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC23] }
    ears:
      pattern: event
      condition: 便が Landed に達したとき
      response: 器は着地した main を remote へ push し、 着地 commit の CI の結果を commit id で照合し、 台帳の便を着地 commit id と CI の結果を持つ 1 行の note 付きで close し（台帳へはそれ以外を書かない）、 終端の各手を typed な event として記帳する。 CI の結果が success でなければ close せず失敗を記帳する
  - id: FR51
    type: FR
    label: 台帳の lint
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC24] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は doctor の 1 項目として台帳の lint を提供し、 読み取り専用の台帳 adapter で台帳を読み、 解決できる設計 pointer（設計 doc の path と契約 id）を持たない open な契約と、 tracked な設計 doc か research への pointer 無しに設計の中身を持つ open な memo を名指す
  - id: FR52
    type: FR
    label: 設計 doc の散文の門
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC25] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: CI は全 tracked 設計 doc を検査し、 規範の印を持つ文が pointer（憲法の条・rules 行 id・要件 id・決定 id・契約 id のいずれか）を持ち数 + 単位を持たないことを確かめ、 違反する文を file と行で名指して非 0 で止める
  - id: FR53
    type: FR
    label: 契約 file の生成
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4, N-3], acceptance: [AC21] }
    ears:
      pattern: event
      condition: 設計 pointer（設計 doc の path と契約 id）を添えて intake が要求され、 その pointer が解決したとき
      response: 器は記録した base の設計 doc からその行を読み、 便の契約 file をその行から生成する
  - id: FR54
    type: FR
    label: 設計 pointer の拒否
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC21] }
    ears:
      pattern: unwanted
      condition: intake に添えた設計 pointer が解決しないとき（設計 doc・契約表の行・実装する設計の節のいずれかが無い）、 または契約 file が直接渡されたとき
      response: 器は断る理由（解決しないもの、 または契約 file の直接の受け渡し）を名指す typed な理由で契約を断り、 便を作らない
  - id: FR55
    type: FR
    label: 契約表の検査
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC26] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: CI は全 tracked 設計 doc の契約表の全行に、 intake と同じ write-set の閉包の導出（FR48）と設計 pointer の解決（FR54）を回し、 違反する行を file と行で名指して非 0 で止める

  - id: FR56
    type: FR
    label: 禁じる語列の command の拒否
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC27] }
    ears:
      pattern: unwanted
      condition: 席または runner の session が撃つ Bash の command が manifest の禁じる語列のいずれかに当たるとき
      response: 器は実行の前に deny し、 断る理由に規則の出所と当たった並びを告げ、 intake は契約と対象 repo の宣言 file の verify 各行に同じ判定を掛け、 当たる行を行番号付きで断り便を作らない

  - id: FR57
    type: FR
    label: host の面
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3, N-1], acceptance: [AC28, AC31] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は host 固有の宣言値（口座 label・席に積む plugin dir・起動引数）を state dir の host の面 1 file だけから読み、 tracked の manifest と同じ読み手と同じ拒否の形で検査し、 rules 行を持つ file・両面で重複する口座 label・schema 外の項目を行番号付きで typed に拒み、 file が無い host では 0 宣言として続き、 在るが読めない host では typed に止まる

  - id: FR58
    type: FR
    label: 口座の登録と退役
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC28] }
    ears:
      pattern: event
      condition: 口座の登録・退役・復帰が要求されたとき
      response: 登録では器が口座の設定 dir を state dir の下に作り、 席の前提の設定だけを書き、 host の面に宣言を 1 行足し、 login 用の起動 command を user へ渡し（credential は読まず書かない・既存の dir と宣言済みの口座 label は typed に断る）、 退役と復帰では設定 dir を可逆に動かして event を 1 件記録し、 席の登録 row（FR40）が持つ口座の退役は typed に断り、 退役の後はその口座を計測（FR33）と選定（FR36）の候補から外す（復帰で戻す）

  - id: FR59
    type: FR
    label: 席の起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC13, AC29, AC40] }
    ears:
      pattern: event
      condition: 器の口から席の起動が要求されたとき
      response: 器は席の役割（orchestrator）を必須で受け、 口座を、 役割の実効の口座（host の根の実効の記録が持ち、 記録が無い周は役割の口座の宣言を種にし、 どちらも使えない周だけ役割単位で 1 回 FR36 の session 用の規則で選び直して記録を書き換え、 書き換える周は前の記録を消さずに履歴の側へ可逆な move で移す・ADR-0041）が在って使える周はその口座に決め（引数が在って役割の実効の口座と違う周は typed に断る）、 それ以外の周は引数か session 用の口座選定（FR36・閾値未満の候補が無い周は FR69）で決め、 起動行を手書きの起動の雛形を読まずに導出し（起動行の構成は決定記録が正本）、 席の登録（FR40）を起動の前に書き、 target の窓の shell へ起動行を差し込み、 窓が無ければ作り tmux の session は作らず、 tmux の session が無い・入力欄に文字が在る・FR69 が断る周・口座が退役中・引数の口座が役割の実効の口座と違うのいずれかでは typed に断り key を 1 つも送らない

  - id: FR60
    type: FR
    label: 役割なしの起動（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC19] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は役割なしの対話 session を起こす subcommand を持たない（ADR-0045 §2 (2) で廃止）。 席の起動は役割を必須に受ける（FR59）。 不在は不在を測る歯が確かめる

  - id: FR61
    type: FR
    label: 導入先の同期
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC31] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は doctor の 1 項目として、 この host の導入先（install 帳簿が指す repo と worktree・席の登録 row の anchor）ごとに、 呼ばれる binary が自己申告する build 元 commit（測れない周は unknown）・plugin の読み込み元と hook 集合の digest・install 帳簿の記録・共有 cache の実体・scribe2 repo の HEAD を実測して 1 行に並べ、 食い違いを typed な語（none / binary / plugin / install）で名指し、 推測で埋めず、 自分の checkout を上流の既定 branch へ前進のみで揃え（揃えられない周は typed に断る）そこから binary を build して呼ばれる場所へ入れ、 その install を記録（sha・時刻・host）に残す 1 つの口を提供する

  - id: FR62
    type: FR
    label: hook 集合の食い違い（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC19] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は hook 集合の digest の食い違いを理由に席へ退避の合図を送らず、 席を作り直さない（ADR-0045 §2 (2) で廃止）。 食い違いの測定は導入先の同期（FR61）が doctor の行で名指す。 不在は不在を測る歯が確かめる

  - id: FR63
    type: FR
    label: statusline の描画（廃止）
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC19] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は開発 session の statusline を描く subcommand を持たず、 口座の設定に描画 command を書かない（ADR-0045 §2 (2) で廃止）。 不在は不在を測る歯が確かめる

  - id: FR64
    type: FR
    label: 管理 tick の駆動（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC18] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は tick の unit の導入と撤去の口を持たず、 host の駆動機構に unit を置かない（ADR-0045 §2 (2) で廃止）。 不在は不在を測る歯が確かめる

  - id: FR65
    type: FR
    label: 直命の表（廃止）
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC8] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は user の発言（直命）を event log に持たず、 復元の DATA を出さない（ADR-0045 §2 (2) で廃止）。 user の逐語は承認 event（FR16）にだけ載り、 裁定は台帳の notes が持つ。 不在は不在を測る歯が確かめる

  - id: FR66
    type: FR
    label: 取得の強制と自動退避（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC8] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は復元・退避の skill の起動に反応する hook・退避物の状態を注入する hook・自動圧縮の直前に AI が書く散文の退避物を書く hook・session の終端の理由を打刻する hook と、 skill そのものを持たない（ADR-0045 §2 (2) で廃止）。 器が session の開始と圧縮の直前に持つ口は FR42 の 2 つ（指示文と事実行の注入・圧縮の直前の 1 枠）だけである。 不在は不在を測る歯が確かめる

  - id: FR67
    type: FR
    label: 対話面の作法
    priority: should
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC17] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は orchestrator の席の指示文に user に向けて出す文の形（信頼度を上位に置く 1 体系の作法・本文は設計 doc 1 本が正本）を pointer 付きの 1 行で運び（指示文・rules 行には作法の則の本文を置かない）、 席でない process（runner / lens）には適用しない
  - id: FR68
    type: FR
    label: 便の自動起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC22, AC38] }
    ears:
      pattern: event
      condition: 便が終端の段（Landed / Failed / Stopped）に達したとき、 便を運ぶ器の process が退役したとき、 手動の 1 周が要求されたとき、 介入の印が記録された直後、 または回答 event（FR32）か approval.received（FR16）が記帳された直後
      response: 器の dispatcher は起動の列（台帳の open な契約のうち、 依存が閉じ ∧ 設計 pointer が解決し ∧ memo でなく ∧ 同じ契約の中身で終端に達した便（審査（FR49）FAIL の便を含む）が無い契約の並び）を orchestrator の介入 first → 契約の priority → 起票順で評価し、 終端でない段の便と write-set が交差せず（FR39 と同じ判定）∧ 受付（write-set の余地・host の memory の枠・同時走行の最大値〔rules 行 pipe.max_live・値は user 裁定 id 付き〕）を通る契約を、 席の操作なしに条件を満たす本数だけ起こし（本数の絞りは受付の host の memory の枠と同時走行の最大値が行い、 受付が最大値で断った契約は列に留めて理由を持つ）、 起動は通常の便の起動の段（受付 → 審査（FR49）→ runner の起動）をそのまま通り起動の前に待機の段を持たず、 契機が重なっても同じ契約を二重に起こさず、 同じ周で起こした便の write-set を次の候補の交差の相手に数え、 起こせない契約はまだ出ていない理由（依存 / 交差（Overlap）/ 受付 / 同時走行の最大値 / 終端に達した便（審査 FAIL を含む）/ hold）を閉じた型で持って列に留め、 hold の契約は起こさず release で戻し、 終端に達した便が起動の列から外した契約も release の印 1 つにつき 1 回だけ起動の列へ戻し（着地済みの便の契約は戻さず、 審査 FAIL の便の契約は中身が変わるまで戻さない・FR49）、 介入を起動の列の記録として残し、 便を運ぶ器の process が退役した便は同じ周で器が再開（FR37）を 1 回起こし（便を運ぶ器の process が残す所有者の印を持たない、 終端でない段の便は起こし直さない）、 所有者の印を持たなくても再開（FR14）を 1 回起こす便は次の 3 種に閉じ＝回答が記帳された Questioned の便（FR32 の回答を添える）・承認が記帳された Blocked の便（FR16 の承認を添える）・verdict が PASS の Gated の便（gate が再び要求されて〔FR8〕PASS が記録された便を含む）、 verdict が PASS でない Gated の便と verdict を読めない Gated の便は起こさず、 verdict が PASS の Gated の便のための契機は足さず、 3 種とも上の契機の周で拾い、 便を運ぶ器の process が生きている便と生死を読めない便には触らず、 周期の timer を持たず、 台帳が読めない周は 1 本も起こさず測れなかったことを記帳する
  - id: FR69
    type: FR
    label: 妥協の起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-3], acceptance: [AC40] }
    ears:
      pattern: unwanted
      condition: 席の起動（FR59）で、 session 用の閾値未満の口座の候補が 1 つも無いとき
      response: 上限に当たっていない測れた口座が 1 つ以上在る周は、 器は席を断らず、 その中で逼迫度が最小の口座で席を起こし、 妥協の理由を閉じた型で役割の実効の記録と起動の記録に残し、 席の指示文に妥協の口座で立ったことと理由を出し、 席は作業を止めて対話面で user の裁定を待つ。 上限に当たっていない測れた口座が 1 つも無い周は typed に断り key を 1 つも送らない
  - id: FR70
    type: FR
    label: 強制サイクル（廃止）
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1, N-2], acceptance: [AC18] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は強制サイクルの印と、 印の在る席の編集・Bash・agent の起動を断る hook を持たない（ADR-0045 §2 (2) で廃止）。 不在は不在を測る歯が確かめる
  - id: FR71
    type: FR
    label: 席の実測の口座の食い違いの検出（廃止）
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-1, N-3], acceptance: [AC18] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は session の開始で実測した口座を記録せず、 登録 row の口座との食い違いを判定しない（合図を送る管理 tick が無い・ADR-0045 §2 (2) で廃止）。 席の口座は席の起動（FR59）が登録 row に書く値だけが持つ。 不在は不在を測る歯が確かめる

nfr:
  - { id: NFR1, type: NFR, label: lens 予算,   category: 性能, target: 1 lens は 0.15M token 以内（目標値）,                                measure: lens 起動時の diff byte と cap の照合を verdict に記録,        vmethod: T, trace: { backward: [N-2], acceptance: [AC3] }, hero: { cat: 予算, big: "0.15", unit: M token, qual: lens 1 本あたりの上限 } }
  - { id: NFR2, type: NFR, label: 契約の大きさ, category: 大きさ, target: 1 契約の diff は 300 行程度・見積は 550 行以内,                      measure: PR の diff 行数と契約の見積を記録して照合,                   vmethod: A, trace: { backward: [N-4], acceptance: [AC2] }, hero: { cat: 小ささ, big: "300", unit: 行, qual: 1 契約の diff の目安 } }
  - { id: NFR3, type: NFR, label: 依存,        category: 依存, target: 実行時の直接依存 0 本・std だけで build（allowlist の外は歯が落とす）,   measure: cargo xtask check の deps-empty と cargo deny を CI で毎回,     vmethod: T, trace: { backward: [N-2], acceptance: [AC6] }, hero: { cat: 依存, big: "0", unit: 本, qual: 実行時の直接依存 } }
  - { id: NFR4, type: NFR, label: fail-closed, category: 安全, target: 不正入力を黙って落とす件数 0・読めない store は rc 2,                     measure: fixture 実走（壊した行・未知 kind）で全件 loud を確認,           vmethod: T, trace: { backward: [N-3], acceptance: [AC6] }, hero: { cat: 安全, big: "0", unit: 件, qual: 黙って落とす入力 } }
  - { id: NFR5, type: NFR, label: hook の予算,  category: 応答, target: hook は binary 1 本の 1 回呼出しで 2.0 秒以内・重い I/O を持たない,      measure: hook の wall time を注入計測の slot に記録,                   vmethod: T, trace: { backward: [N-2], acceptance: [AC7] }, hero: { cat: 速さ, big: "2.0", unit: 秒, qual: hook 1 回の上限 } }
  - { id: NFR6, type: NFR, label: host の資源,  category: 安全, target: 封じ込めの外で走る器の子 process 0 本・変異検査の並列度は並列の枠から, measure: 便ごとに封じ込めの有無・並列度・縮退の理由が record に残ることを fixture で確認, vmethod: T, trace: { backward: [N-1, N-2], acceptance: [AC20] }, hero: { cat: 資源, big: "0", unit: 本, qual: 封じ込めの外で走る子 process } }

constraints:
  - { id: CON1, label: 憲法,     text: 憲法（Always 17 / Ask-first 4 / Never 4）を本書の上位に置き、 矛盾する要件を書かない,            regulation: 憲法 v0.5.0 }
  - { id: CON2, label: 公開,     text: 本 repo は PUBLIC。 絶対 path・host 名・口座名・user 逐語を tracked file に書かない,             regulation: 憲法 A1（出す） }
  - { id: CON3, label: 歯,       text: test は Rust の 1 framework だけで、 bash / bats の歯を書かない,                                 regulation: 憲法 C12 }
  - { id: CON4, label: 作法,     text: 前の器（v1）の役割席・gate 席・QA 席・契約押印・tier ラベルを持ち込まない,                       regulation: ADR-0003 }
  - { id: CON5, label: 口,       text: binary は不可逆操作（force push・削除・公開・課金）の口を持たない,                               regulation: 憲法 A1 / N1 }
  - { id: CON6, label: headless, text: headless の runner / lens は permission を毎回明示・rate limit は stream-json で検知・context の上限は契約の大きさで受ける（開発 session の context は /compact で扱う）,   regulation: "" }

glossary:
  - { term: 契約,           en: contract,               plain_short: bead 1 本の約束,          def: 何を作り・何ができたら終わりかを表す 1 単位。 正本は設計 doc の契約表 1 行で、 器が便の契約 file を生成する。 台帳（beads）の 1 issue に対応する。 }
  - { term: runner,         en: runner,                 plain_short: 実装役の Claude,          def: 契約 1 本を worktree で実装する headless の Claude process。 席ではなく使い捨て。 }
  - { term: lens,           en: lens,                   plain_short: 審査役の Claude,          def: diff を読んで PASS / FAIL / INCONCLUSIVE を返す headless の Claude process。 }
  - { term: dispatcher,     en: dispatcher,             plain_short: 便を自動で起こす器の口,   def: 便を自動で起こし、 gate を通った便を land して merge する器の口（契機と条件は FR68・終端は FR50・ADR-0034・ADR-0045）。 席ではない。 }
  - { term: 起動の列,       en: dispatch queue,         plain_short: 起動を待つ契約の並び,     def: dispatcher が台帳から導く、 起動を待つ契約の並び（入る条件・順序・待ちの理由は FR68 が定める）。 land の順序（FR50）とは別の実体。 }
  - { term: 受付,           en: contract intake,        plain_short: 契約を便にする前の検査の段, def: 契約 file を便にする前に器が撃つ検査の段。 必須 field・verify の形・allowlist・write-set の余地・host の memory の枠・同時走行の最大値（FR68）を通った契約だけが便になる（交差の排他は FR39）。 変異検査の並列の枠（NFR6）とは別。 }
  - { term: priority,       en: contract priority,      plain_short: 台帳が持つ契約の優先度,    def: 台帳の bead が持つ契約の優先度（P0〜P4）。 起動の列の順序の 2 番目の鍵（FR68）。 要件の priority 欄（必須 / 推奨）とは別。 }
  - { term: Reviewed,       en: reviewed stage,         plain_short: 審査の判定を持つ便の段,    def: 便の段の 1 つ。 契約の審査（FR49）の verdict を持ち、 PASS でない便は runner を起こさず FAIL で終端する。 }
  - { term: 介入,           en: orchestrator intervention, plain_short: orchestrator が順番を動かす印, def: first（最優先へ）・hold（止める）・release（戻す）の 3 つの typed な印。 user の直命の対として記録され、 台帳の priority は書き換えず、 起動の列の記録として残る（FR68）。 }
  - { term: gate,           en: gate,                   plain_short: 機械検証と審査の段,       def: 契約の verify を実走し lens 1 本の verdict を採る段。 PASS でなければ land しない。 }
  - { term: land,           en: land,                   plain_short: main への着地,            def: worktree の成果を squash 1 commit で main に載せ、 main で歯を再実走すること。 }
  - { term: fleet,          en: fleet,                  plain_short: 便と席の状態の全体,       def: 正定義は複数 host にまたがる席・口座・lease・退役の全体（憲法 C3）。 MVP では便と席の現在地の全体を指し、 実体は event log 1 file。 }
  - { term: event log,      en: event log,              plain_short: 追記だけの記録,           def: 1 行 1 出来事を追記する file。 現在地はこれを replay して導く。 }
  - { term: manifest,       en: rules manifest,         plain_short: 規則の値の置き場,         def: 規則の値（閾値・有効 / 無効・裁定 id）を持つ tracked な TOML 1 file。 憲法 C1 の「値は manifest」の実体。 }
  - { term: verdict,        en: verdict,                plain_short: 審査の結果,               def: gate が返す 3 値（PASS / FAIL / INCONCLUSIVE）。 構造化 field が一次 truth。 }
  - { term: 3 クラス,       en: three classes,          plain_short: 人に聞く操作,             def: 消す / 出す / 使う の 3 分類。 これに当たる操作だけ人の承認を要する。 }
  - { term: write-set,      en: write-set,              plain_short: 触ってよい file の列,     def: 契約が宣言する、 編集してよい file の集合。 外への編集は編集の時点で止める。 }
  - { term: ".vessel",      en: vessel marker,          plain_short: 器の所属の目印,           def: repo root の固定名 file。 中身が name と version を言い、 どの器が仕えるかを決める。 }
  - { term: flip check,     en: flip check,             plain_short: test が先に落ちる確認,    def: 変更の test 差分だけを base に当てて新規・変更 test が RED になり、 HEAD では GREEN であることを機械で確かめる検査（憲法 C12.2）。 docs-only の変更は対象外（C12.3）。 }
  - { term: headless,       en: headless,               plain_short: 画面なしの実行,           def: 対話画面を持たず、 入力を受けて 1 回で答えを返す Claude の実行形（claude -p）。 }
  - { term: toy repo,       en: toy repo,               plain_short: 実験用の小さな repo,      def: 到達点を測るために一時 dir に作る、 外部依存の無い小さな git repo。 }
  - { term: 設計 doc,       en: design doc,             plain_short: 設計 1 本の文書,          def: 要望を SRS の要件に結び、 契約が複数出る元になる tracked markdown。 }
  - { term: 要件カタログ,   en: requirements catalog,   plain_short: 要件の一覧表,             def: 要件 doc の v2 行を scrub して写した一覧（requirements-catalog.html）。 FR との対応は同 page の §移行表 が持つ。 }
  - { term: 承認 event,     en: approval event,         plain_short: 承認の記帳,               def: approval.requested / approval.received の 2 種。 逐語を伴い fleet に残る。 }
  - { term: hook,           en: hook,                   plain_short: 編集の手前で動く番人,     def: Claude Code が tool を呼ぶ直前・直後に自動で走る短い処理。 器は編集を止める側（in-loop guard）と名乗りを出す側に使う。 }
  - { term: diff,           en: diff,                   plain_short: 変更の差分,               def: 変更前と後の違いだけを取り出したもの。 lens はこれを読んで審査する。 }
  - { term: worktree,       en: worktree,               plain_short: 便ごとの別の作業場所,     def: 同じ repo の別の branch を別 dir に取り出した作業場所。 runner は 1 便ごとに 1 つ切る。 }
  - { term: base,           en: base,                   plain_short: 変更の出発点,             def: 便を始めた時点の main の commit。 追随（FR34）で進みうる（記録された最新の base が基準）。 flip check と land はこれを基準に測る。 }
  - { term: INCONCLUSIVE,   en: inconclusive,           plain_short: 判定できなかった,         def: verdict の 3 値の 1 つ。 合格でも不合格でもなく「判断できない」で止まり、 land されない。 }
  - { term: CI,             en: continuous integration, plain_short: PR ごとの自動検査,        def: PR を出すたびに自動で走る検査（test・lint・xtask）。 緑でなければ merge しない。 }
  - { term: marker,         en: marker,                 plain_short: 所属の目印 file,          def: repo root に置く .vessel のこと。 中身が name と version を言い、 hook はこれを見て仕えるかを決める。 }
  - { term: commit,         en: commit,                 plain_short: 変更の 1 区切りの記録,    def: git に残す変更の 1 単位。 runner の完了判定は base からの commit が 1 件以上あるかで測る。 }
  - { term: 対話面の作法,   en: dialogue surface rules, plain_short: user への言い方の決まり,   def: orchestrator の席が user に向けて出す文の形の規則。 信頼度を上位に置く 1 体系で、 則の本文も数も設計 doc 1 本が正本。 雛形が pointer 付きの行で指し、 生成された指示文が運ぶ（FR67）。 }
  - { term: 歯,             en: test,                   plain_short: 落ちるべきときに落ちる test, def: 器を守る自動 test の総称（Rust の 1 framework・憲法 C12）。 「歯が落とす」= test が失敗して変更を止めること。 }
  - { term: RED,            en: red,                    plain_short: test が落ちる状態,        def: test が失敗する状態。 対は GREEN（全部通る）。 flip check は「base で RED・HEAD で GREEN」を確かめる。 }
  - { term: PR,             en: pull request,           plain_short: 取り込みの申請,           def: 変更を main に取り込むための申請。 CI が緑になってから squash merge する。 }
  - { term: docs-only,      en: docs-only,              plain_short: 文書だけの変更,           def: 変更が文書だけの PR。 flip check の test 差分の要件から除外される（憲法 C12.3）。 }
  - { term: 開発 session,   en: development session,    plain_short: 設計・契約・review を行う AI, def: 設計・契約・review を行う AI の session（Claude Code）。 orchestrator の席のように session をまたいで対話を続け、 runner と違い使い捨てではない。 文脈が溢れたら /compact で圧縮し、 session を跨ぐ記憶は台帳が持つ。 }
  - { term: orchestrator,   en: orchestrator,           plain_short: 人と話す唯一の席,       def: 席の唯一の役割。 user と話して承認と裁定を受け取り、 契約・設計・落ちる歯を書く席（仕事の範囲は FR30・権能は FR41・ADR-0045）。 }
  - { term: 質問 record,    en: question record,        plain_short: 実装役が返す質問の合図, def: runner が契約の不足を返して止まるときの typed な合図。 形式は ADR-0016 §2.2 が正本。 }
  - { term: Questioned,     en: questioned,             plain_short: 質問中の段,               def: 便の段の 1 つ。 runner の質問 record を受けて回答 event を待っている状態。 }
  - { term: Blocked,        en: blocked,                plain_short: 承認待ちの段,             def: 便の段の 1 つ。 3 クラスを名乗る契約が spawn の手前で承認 event を待っている状態。 }
  - { term: 口座残量,       en: account allowance,      plain_short: 口座の残りと reset 時刻,   def: 1 口座 1 時刻で読んだ、 5 時間窓・7 日窓・モデル別 7 日窓の残りと各 reset 時刻の組（FR33）。 runner が受ける上限 record（検出の合図）とは出所が違う。 }
  - { term: 追随,           en: follow,                 plain_short: main に追いつくこと,      def: land の前に、 便の base より進んだ main へ worktree の branch を rebase して gate をやり直すこと（規範は FR34・衝突の周の解き方は ADR-0019）。 land の要求 1 回につき 1 度で、 再び main が進んだ周は次の要求で追随する。 main は動かさない。 }
  - { term: 衝突,           en: conflict,               plain_short: 追随の rebase でぶつかること, def: 追随の rebase で、 先着の変更と同じ箇所が重なり器が自動では合わせられないこと（FR34 が記帳する）。 契約同士の write-set の交差（ADR-0019）とは別の概念。 }
  - { term: 上限停止,       en: limit stop,             plain_short: 口座の上限で止まること,    def: 便が口座の残量の上限に当たって止まること。 FR35 の event が記帳し、 別口座での再開は FR37。 }
  - { term: 口座選定,       en: account selection,      plain_short: どの口座を使うか決める,     def: manifest の口座（退役中を除く・FR58）と実測の残量だけから口座を決定的に選ぶこと（FR36）。 便用と session 用の 2 規則を持つ。 }
  - { term: 役割,           en: role,                   plain_short: 席の種類,                 def: 開発 session の席の種類（orchestrator の 1 つ・FR30 / FR40）。 役割の口座 = host の根の宣言 file が役割ごとに高々 1 つ持つ口座（宣言値・FR59 / FR36）。 }
  - { term: 権能,           en: capability,             plain_short: 役割に許された操作,        def: 役割ごとに許された操作の閉じた一覧。 rules 行が持ち（FR41）、 編集・実行の時点で執行される（FR45）。 }
  - { term: path 種別,      en: path kind,              plain_short: 編集先の file の分類,      def: 編集先の file を分ける閉じた分類。 種別ごとに要る権能が 1 つ対応し、 編集の時点で照合される（FR41 / FR45）。 種別に属する path の集合の出所は ADR-0047 が正本。 }
  - { term: 席の登録,       en: seat registration,      plain_short: 席と役割の記録,            def: 席の役割と anchor を鍵に、 target・口座 label・起動の雛形を項目として fleet の event log に記録すること（FR40）。 記録の無い席は権能を持たない。 }
  - { term: 並列の枠,       en: mutation parallel slot, plain_short: 変異検査の並列の枠,        def: host 単位で便の変異検査に配る並列の枠（NFR6）。 枠が無い host では縮退する（FR46）。 }
  - { term: 封じ込め,       en: confinement,            plain_short: memory 上限付きの箱,       def: 器が起こす子 process を memory の上限付きの箱の中で走らせること（NFR6）。 }
  - { term: 上限 record,      en: rate-limit record,      plain_short: 上限に当たった印,         def: claude が口座の上限を専用の record で伝える合図。 便の停止判定はこの record だけを入力にする（FR35・ADR-0012）。 }
  - { term: anchor,         en: anchor,                 plain_short: 対象 repo の本体,             def: 対象 repo の main checkout。 席と便の鍵の一部で、 1 つの anchor に orchestrator 1 席（FR40）。 }
  - { term: 席の指示文,   en: role brief,             plain_short: 席に差し込む指示,         def: 役割ごとの雛形と権能の rules 行から器が生成し、 session の文脈が初期化されるたびに注入する文（FR42）。 手書きの規範文は持たない。 }
  - { term: 設計 pointer,   en: design pointer,         plain_short: どの設計 doc のどの契約か, def: 設計 doc の path と契約 id の対。 intake の入力（FR53）で、 台帳の bead の受入条件が持つ 1 行でもある（FR2）。 }
  - { term: 台帳 adapter,   en: ledger adapter,         plain_short: 台帳への唯一の口,         def: 器が台帳を読む口（読み取り専用）と close を書く口。 台帳へ触る module はこれ 1 つ（FR50 / FR51）。 }
  - { term: 禁じる語列,     en: forbidden token sequence, plain_short: 撃ってはいけない語の並び, def: command のうち撃ってはいけない語の並び。 値は manifest の rules 行だけが持ち（並びの例は行を見る）、 器が実行の前に止め、 intake が verify 行に同じ判定を掛ける（FR56）。 }
  - { term: host の面,       en: host manifest,          plain_short: host ごとの宣言の置き場,   def: manifest の host の面。 state dir の 1 file が host 固有の宣言値を持ち、 tracked の manifest と同じ読み手で読まれる。 rules 行は置けない（FR57・ADR-0026）。 }
  - { term: 口座の登録,     en: account registration,   plain_short: 口座を器に足すこと,       def: 器の subcommand が口座の設定 dir・席の前提の設定・host の面の宣言を揃え、 login 用の起動 command を user へ渡すこと（FR58）。 login は user の手番で、 器は credential に触れない。 退役と復帰も同じ subcommand が担う。 }
  - { term: 席の起動,       en: seat launch,            plain_short: 器の subcommand で席を起こすこと, def: 役割を必須に受け、 口座を決め、 起動行を導出し、 席の登録を先に書いて target の窓の shell へ差し込むこと（FR59）。 器の subcommand 以外の起動経路を使わない。 }
  - { term: 同時走行の最大値, en: live run cap,           plain_short: 同時に走らせる便の最大本数, def: host で同時に走らせる便（終端でない段の便）の最大本数。 値は rules 行 pipe.max_live だけが持ち（user 裁定 id 付き）、 受付が終端でない便を数えて最大値以上の周は typed に断り、 その契約は起動の列に留まる（FR68）。 走っている便は止めない。 }
  - { term: host の根,       en: host root,              plain_short: 同じ host の全 project が共有する置き場, def: state dir の親の下に在る host 用の dir。 同じ host の全 project が共有し、 役割の口座の宣言 file（役割ごとに高々 1 つの口座 label・FR36 / FR59）と役割の実効の記録がここに在る。 host の面（project ごとの state dir の 1 file）とは別。 }
  - { term: 実効の口座,     en: effective role account, plain_short: その役割の席が使う口座,   def: 解決の時点で役割の席が使うと器が解いた口座（解き方は FR59・ADR-0041）。 同じ役割の席は project をまたいで同じ口座に揃う。 }
  - { term: 実効の記録,     en: effective role record,  plain_short: 使う口座の記録,           def: 器が host の根に書く、 役割ごとに高々 1 件の記録（役割・口座 label・時刻・妥協の理由）。 人が書く役割の口座の宣言とは別の file。 書き換えの規則は FR59 が正本（ADR-0041）。 }
  - { term: 妥協の起動,     en: compromise launch,      plain_short: 余裕が無くても席を立てること, def: 閾値未満の口座の候補が無い周に、 上限に当たっていない中で逼迫度が最小の口座で席を起こすこと。 理由を記録と席の指示文に出し、 席は作業を止めて user の裁定を待つ（FR69・ADR-0041）。 }
