      response: 器の host-guard は実行の前に deny し、 断る理由に当たった守る集合の記号か解けない形を告げ、 代わりの経路として tracked な file は git rm・それ以外は退役の mv を示す。 守る集合は host に依らない記号（state-dir / repo-tracked / repo-git）の閉じた列で rm の種類の rules 行が持ち、 実行時に解く。 その行が無い周は fail-closed で断り、 enabled が false の周は rm の種類だけを切る
