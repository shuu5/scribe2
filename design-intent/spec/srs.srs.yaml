  - { id: AC85, criterion: "bead 2 つと偽の lens と cap を越える diff の fixture で、 許可を持つ bead の便は gate の照合と gate が起こす lens の cap が許可の値で通り、 許可の値も越える diff は INCONCLUSIVE で verdict の記録が行と許可の値と裁定 id を持ち、 持たない bead の便は同じ diff が INCONCLUSIVE で、 許可を読んだ周の段の event と verdict の記録が行と値と裁定 id を持ち、 期限の後・便の着地の後・取り消しの後は manifest の値に、 同じ bead と行の新しい記帳の後はその値になり、 新しい記帳の期限が古い許可の期限より先に切れた後も古い許可へ戻らずに manifest の値を読み、 manifest の値が許可の値以上に上がった fixture は manifest の値を読み、 pipe show が 6 つの状態の語を出し、 2 つの語に当たる 5 組（landed と revoked・landed と superseded・revoked と expired・superseded と expired・expired と overtaken）で先の語を出して pipe dispatch ls が効いている許可だけを並べ、 許可を持つ bead の契約の審査と行の審査と memo の審査の lens が manifest の値を読み、 event log を読めない周の gate が rc 2 で止まって verdict を書かないことを歯が nextest で確かめる", metric_v: "許可の効き 2/2 + 許可の値の上限 1/1 + 持たない bead の止め 1/1 + 使用の記録 1/1 + 切れ方 4/4 + 古い許可へ戻らない 1/1 + manifest 以下の不効 1/1 + 状態の語 6/6 + 重なり 5/5 + 効いている許可の一覧 1/1 + 審査の lens の不効 3/3 + 読めない周の rc 2 1/1", metric_l: "上限の許可の効き", links: [FR111, FR9, NFR1, NFR4] }
  - { id: AC86, criterion: "器の hook の入口の歯で、 器の hook の subcommand を撃つ Bash・state dir の event log の path への Edit と Write と shell の書き込みの向け先・pipe gate に --rules を渡す Bash がそれぞれ実行の前に断られて形ごとの理由の語を名指し、 権能〔merge〕と〔launch〕を持つ fixture の席から pipe land と pipe resume に --rules を渡す Bash が同じく形の理由の語で断られ、 その権能を持たない orchestrator の席からの同じ 2 つが権能の guard の断り（欠けた権能と行 id）を先に出し、 event log を読むだけの command と --rules を持たない pipe gate・pipe land・pipe resume と手動の 1 周（pipe dispatch）に渡す --rules がこの断りに当たらないことを歯が nextest で確かめる", metric_v: "hook の subcommand の断り 1/1 + 書きの断り 3/3 + --rules の断り 3/3 + 権能の guard が先の断り 2/2 + 読むだけの不断 1/1 + --rules の無い 3 つの不断 3/3 + 手動の 1 周の不断 1/1", metric_l: "hook の subcommand と書きと差し替えの遮断", links: [FR112, FR45] }
  - { id: AC87, criterion: "toy repo（docs/design/ の直下に契約表の区間を持たない設計 doc を 1 つ持つ）が vessel 宣言の任意 key contract-tables で contracts/ を名乗り、 contracts/t.toml に実装する設計の節の無い契約表の行 1 つを置くと、 契約表の検査がその file と行だけを名指して非 0 で終わり、 key を消した同じ repo は contracts/t.toml を数えずに rc 0 で終わり、 contract-tables に tracked でない file を書いた宣言はその宣言の行を名指して非 0 で、 契約表の置き場の 2 つの file の stem が重なる fixture は重なる file を名指して非 0 で終わり、 key の値を壊した宣言の commit では、 契約表の置き場の読み・宣言済みの新規 file の読み・局面の行の読み手が既定の置き場に倒さずに読めないを返し、 列挙の 1 関数が dir の項目では既定の docs/design/ の直下の markdown を残したまま直下の .md と .toml だけを足し（下の dir と他の拡張子は足さない）、 file の項目はその path だけを足すことを歯が nextest で確かめる", metric_v: "契約表の置き場の toml の行の名指し 1/1 + key を消した repo の rc 0 1/1 + tracked に当たらない宣言の名指し 1/1 + stem の重なり 1/1 + 読めない宣言の不倒 3/3 + 列挙の形 3/3（足すだけ・直下だけ・file の完全一致）", metric_l: "契約表の置き場の検査", links: [FR55, FR47] }
  - { id: AC88, criterion: "key contract-tables を持たない toy repo で docs/design/ の外の toml の行を指す設計 pointer が、 契約表の置き場の外として typed な理由で断られて便が増えず、 同じ repo が key でその dir を名乗った後は同じ pointer から契約 file が生成されて便が作られることを歯が nextest で確かめる", metric_v: "契約表の置き場の外の断り 1/1 と便 0 + 名乗った後の生成 1/1", metric_l: "受付の pointer と契約表の置き場", links: [FR54, FR53, FR47] }
  - { id: AC89, criterion: "vessel 宣言が key remote を持つ toy repo で、 gate を通った便の着地の前に別の clone から remote の main を進めると、 便が remote の先端を fast-forward で取り込んで記帳し、 着地の commit が remote の先端を祖先に持ち終端の push が通って close し、 remote を読めない fixture では main を変えずに便を Gated に留めて理由の event を 1 件記帳し（2 周目は記帳し直さない）、 読めるよう戻した次の周に着地して close し、 列の上限 1 で先頭がその留めに在る間に撃った後続の便は、 番待ちの上限を越えて番を取らずに進んでも同じ取り込みの点で留まって main を変えず、 別の clone から remote の main を進めたうえで anchor の main に remote に無い commit を足して分けた fixture と、 fast-forward を git が断る fixture でも main を変えずに留め（読めない周から分かれた周へ理由が変われば 1 件ずつ記帳し、 理由の event はそれぞれ unreadable・diverged・ff-failed を持ち、 Failed は記帳しない）、 候補の木に 3 便を並べた fixture では列の先頭が取り込んでから列を着地させて 3 便とも close し、 remote に main が無い周・main と先端が同じ周・main が先を行く周は取り込まずに着地して close し、 --pr-cmd の着地と候補の木で先の便といっしょに着地した後続の撃ちは remote を読まず記帳もせず、 key remote を持たない repo では remote を読まないことを歯が nextest で確かめる", metric_v: "取り込みの記帳と着地と close 1/1 + 読めない周の留めと記帳 1 件と戻した後の着地 1/1 + 先頭の留めの間に番を取らずに進んだ後続の留め 1/1 + 分かれた周の留めと理由の変わりの記帳 2 件 1/1 + CAS が外れた周の留め 1/1 + 取り込まない 3 形の着地 3/3 + 除く撃ちの不読 2/2 + 列の取り込み 1/1 + 止めの語 3/3 + remote を持たない repo の不読 1/1 + 留めの便の Failed 0", metric_l: "着地の前の remote の main の取り込み", links: [FR11, FR10, FR50] }
requirements:
  - id: FR1
    type: FR
    label: 契約の検査
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC6, AC14, AC73] }
    ears:
      pattern: unwanted
      condition: 契約 file（契約表の行から生成した写し・必須 field の集合は生成の型が持つ）に必須 field の欠落・複数行の verify・write-set 0 本が在るとき
      response: 全件を行番号付きで集めて拒否し、 便を作らない
  - id: FR2
    type: FR
    label: 契約の pointer
    priority: must
    vmethod: I
    rationale_source: N-4
    trace: { backward: [N-4, N-5], acceptance: [AC2] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 契約は SRS の要件 id と設計 doc を pointer で持ち、 設計 1 本から契約が複数出る形を保つ（適用対象は本 SRS を根拠に起票する契約・v1 由来の既存 bead は対象外）
  - id: FR3
    type: FR
    label: 便の永続
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC4] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 各段は fleet の event log を replay して現在地を読み、 段の終わりに event を 1 件追記する（process の記憶に状態を持たない）
  - id: FR4
    type: FR
    label: runner の起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1, AC71, AC79] }
    ears:
      pattern: event
      condition: 便が Intake 段にあり spawn が要求されたとき
      response: "base を記録し、 worktree を切り、 write-set の allowlist（write-set で置き場だけ〔中身を変えない〕と印を付けた項目〔=〕は除く）を書いて runner を headless で起動する。 runner の stdin は、 契約の直後に共通 verify の節（便の写しの共通 verify の各行を、 gate と同じ 4 つの穴の埋め方〔base の sha・並列度の 2 つの穴に並列の枠を取らない並列度 1・契約の verify 行の filter 語〕で埋めた字。 写しを読めない周は読めない理由の 1 行、 行が 0 本の写しは なし の 1 行）を持つ"
  - id: FR5
    type: FR
    label: runner と lens の口
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1, AC2, AC10, AC67, AC69, AC70] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: "runner と lens は claude -p（headless・stdin に契約 / diff・stdout に構造化 1 行・permission を毎回明示・口座は環境変数で切替）の 1 形で呼ぶ。 器が起こす claude（runner・lens・口座残量の計測）は、 口座の自動 memory（claude が口座の設定 dir の下に cwd ごとに持ち、 起動時に読む記憶）を子の env で毎回切り、 親の値を継承させない。 lens には読みの道具だけを道具の列として渡し、 許可の問いを誰にも出さない mode（dontAsk）を毎回明示し、 許可の規則は渡さず、 lens の起動に渡された permission の値は使わない（dontAsk でない値の記録は FR99）。 lens の turn は rules 行 lens.max_turns（値は user 裁定 id 付き）を上限に持ち、 上限で終わった周の出力は判定を持たない周（FR9・FR49 の parse できない周）と読む"
  - id: FR6
    type: FR
    label: 完了判定
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC1, AC72] }
    ears:
      pattern: event
      condition: runner が終了したとき
      response: rc 0 かつ base からの commit が 1 件以上なら終わりの門（FR98）を経て Implemented、 それ以外は Failed と記帳する
  - id: FR7
    type: FR
    label: 入口の flip check
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC3] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 変更した .rs ごとに、 test 差分だけを base に当てて新規・変更 test が 1 本以上 RED になり、 かつ HEAD では GREEN であることを機械で確かめ、 docs-only でない変更に test 差分が無ければ拒む
  - id: FR8
    type: FR
    label: gate の機械検証
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC3, AC20, AC72, AC78, AC79] }
    ears:
      pattern: event
      condition: gate が要求されたとき
      response: "共通 verify と契約の verify の各行を worktree で実走して行ごとの rc を記録し、 1 本でも rc が 0 でなければ FAIL とする。 verify の実走の前の gate の write-set を照らす段は、 便の diff に在る write-set の置き場だけの項目（=）の file を名指して段を落とす（FAIL・done の項目ごとの歯の欄の有無に依らない）"
  - id: FR9
    type: FR
    label: lens の verdict
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC3, AC69, AC85] }
    ears:
      pattern: unwanted
      condition: lens が要るのに lens が無い・diff が効いている予算 cap（manifest の値か、 予算 cap の rules 行への上限の許可〔FR111〕がその bead の便の gate と gate が起こす lens に効く周はその値）を超える・stdout が parse できない・verdict が 3 値の外のとき
      response: PASS を名乗らず INCONCLUSIVE とする。 ただし lens は在るが lens の出力が parse できない周だけは、 同じ gate の中で lens を 1 回だけ撃ち直し、 撃ち直した lens の出力もなお parse できないときに INCONCLUSIVE とする（parse できたうえで規則が断った周は lens を撃ち直さない）
  - id: FR10
    type: FR
    label: land の前提
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC3, AC23, AC53, AC54, AC89] }
    ears:
      pattern: unwanted
      condition: "verdict が PASS でない、 または main の tip が記録した base と一致せず追随できない（base が main の祖先でない、 または worktree が clean でない）とき、 または FR50 が着地を止めている間、 または FR11 の着地の前の取り込み（候補の木を組む前）で remote の main の先端を読めない周・main と分かれている周・取り込みの CAS を git が断った周、 または裁定 id の実在（FR83）か未反映の裁定（FR84）の判定が便に当たる間"
      response: "land は main を変えない（便の中身を main に載せない。 FR11 の着地の前の取り込み〔remote に既に在る commit の fast-forward〕はこれに当たらず、 取り込んだ後の追随が落ちる周と再 gate が PASS でない周も取り込みを戻さない）。 verdict が PASS でない周と追随できない周は（取り込みの記帳を除き）event も変えず、 FR50 の push の前の走査・FR11 の着地の前の取り込み・FR83・FR84 が着地を止める間は便を Gated に留め、 留めの理由（止めた要件と、 当たった裁定 id か欄か、 取り込みの止めの閉じた 3 語〔unreadable・diverged・ff-failed〕）の event を記帳し（同じ理由が続く周は記帳し直さず、 理由が変われば 1 件記す）、 次の dispatch の周に同じ判定を撃ち直す。 取り込みの止めの間、 便は着地の番を持ち続けて後ろの便の着地も待たせ、 分かれた周は器が解かない（分かれた main を直すのは席の手）。 この留めは撃ち直しの上限の回数（FR11）にも追随の衝突の上限（FR34）にも数えず、 便を Failed にしない"
  - id: FR11
    type: FR
    label: land
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1, AC23, AC89] }
    ears:
      pattern: event
      condition: verdict が PASS で、 FR10 の留め（FR50・FR83・FR84）に当たらないとき
      response: vessel 宣言が任意 key remote（押す先）を持つ repo では、 便が着地の番を取った周と番を取らずに進む周（番待ちの上限を越えた周・列を導けない周）に（PR で着地する便・land を通らない 2 つの口〔終端だけの撃ち直し（pipe land --terminal-only・FR50）と着地の後の検出（pipe land --detection-only・ADR-0060）〕・候補の木で既に着地した便を除く）、 器は候補の木を組む前に remote の main の先端を読み、 main がその祖先なら CAS の fast-forward で取り込み、 取り込んだ事実を便の event に記帳する（着地の前の取り込み。 便の中身を載せない。 main と先端が同じ周・main が先を行く周・remote に main が無い周・vessel 宣言を読めない周は取り込まずに進む〔読めない周は終端が FR50 の読めない周で止める〕。 先端を読めない周・分かれた周〔祖先の判定を読めない周を含む〕・取り込みの CAS を git が断った周は main も remote も動かさずに FR10 の留め）。 取り込みの後に FR10 の base の前提（追随は FR34）を判じ、 揃った便について、 worktree の tree を squash 1 commit で main に載せる前に、 その commit の出ていく字面を FR50 の push の前と同じ公開の字面の走査に掛け、 当たる便（識別子に当たる便と読む上限を越える便）は main に載せずに Failed と記帳して止まり、 判定できない便（publish の種類の rules 行が無い周・解けない周・締め切りを越えた周）は main に載せずに理由を記帳して Gated に留まり、 次の dispatch の周に同じ判定を撃ち直す（rules 行が持つ上限の回数に達した便は Failed で終端する）。 候補の木に並べた便は、 断った便（Failed か Gated に留めた便）より後ろの便も main に載せずに並びへ戻す（候補の木を組み直して gate を撃ち直す）。 rules 行の enabled が false の周は走査しない。 通った便は squash 1 commit で main に載せ（tree 同一・CAS）、 main で verify を再実走し、 RED なら Failed と記帳して止まる
