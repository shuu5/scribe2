# scribe2 SRS（MVP）— folio S4 generator の入力 contract（機械 SSoT）
#
# 生成: folio plugin の design-system/generator にある assemble-srs.sh <本 file> → srs.html
#       → inject-prose.sh srs.prose.yaml → verify-srs（floor）→ ceiling（fidelity-srs / persona-walk-srs / completeness-critic-srs）
# 出所: 運用像 v1（user 裁定 2026-09-09・6 論点の grill）・要件 doc v0.1.10 の v2 行（写しは requirements-catalog.html）・憲法 v0.5.0。
# 読者 = この器で開発する人と AI。 専門語にはやさしい言い換えを併記する。 本 repo は PUBLIC ゆえ絶対 path・口座名・user 逐語は書かない。

meta:
  doc_id: SRS-SCRIBE2-MVP
  title: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  eyebrow_left: 要件定義書 (SRS)
  eyebrow_right: scribe2 — MVP
  subtitle: 契約は小さく・検証は機械が先・止まるときは記帳して止まる
  version: "0.35"
  date: "2026-10-02"
  reader: この器で開発する人と AI（Claude Code の session）。 専門語には必ずやさしい言い換えを併記する

approval:
  - role: 承認 (user)
    who: user
    when: 2026-10-02（版 0.35。 版ごとの裁定 id は台帳が持つ）
    stamp: 裁定済
  - role: レビュー (folio review lens)
    who: spec-review 5 軸 + SRS ceiling 3 lens
    when: 2026-10-02
    stamp: 実施
  - role: 作成 (開発 session)
    who: AI session (Claude Code)
    when: 2026-09-09 起草
    stamp: 作成

goals:
  - id: GOAL 1
    headline: 人を待たせない
    desc: 人の手番は 3 クラスの承認と台帳の問いへの裁定だけ。 それ以外の段で pipeline が人の入力を待って止まらない。
  - id: GOAL 2
    headline: 壊れたまま進まない
    desc: 検証が落ちた便・PASS を名乗れない便は記帳して止まり、 黙って land しない。
  - id: GOAL 3
    headline: 記憶に頼らない
    desc: 現在地は永続面（event log）から読め、 process が死んでも中断点から再開できる。

scope:
  in:
    - 契約の intake と便の登録
    - runner の起動と完了判定（便ごとの作業場所を切る）
    - 機械検証と lens 1 本による審査
    - squash land と verdict export
    - 3 クラス操作の停止と逐語回答による再開
    - manifest（規則の値）と event log（現在地）
    - 所属の目印と hook（名乗り・in-loop guard・計測 slot）
    - toy repo 5 便と自己ホスト 1 便の到達点計測
    - 口座残量の計測と記録
    - 追随
    - 上限停止した便の別口座での再開
    - 席の役割
    - 権能
    - 席の指示文の注入
    - 便の封じ込め
    - 並列の枠
    - 契約表からの契約 file の生成
    - 契約の審査
    - 便の自動起動
    - 口座の候補が無い席の起動の断り
    - write-set の閉包
    - land の終端
    - 台帳の lint
    - 設計 doc の散文の門
    - 契約表の検査
    - 禁じる語列の command の拒否
    - host-guard
    - host の面
    - 口座の登録
    - 口座の退役
    - 席の起動
    - 導入先の同期
    - 対話面の作法
    - 管理 tick
    - heartbeat の決め方
    - 裁定の指し示し
    - 発話の記帳と台帳の問いと裁定の結び
    - 裁定 id の実在
    - 未反映の裁定
    - 床の検査
    - 選択式の問いの遮断
    - memo の昇格条件と審査
    - 発話の仕分け
    - 席の問いの台帳化
    - 局面の出力
    - memo の処置
    - memo の自動の close
    - 器の便でない着地の発端
    - park の区画
    - PR で着地した便の close
    - 審査役の読みの道具
    - runner の終わりの門
    - merge の前の行の審査
    - 落ちた行の順番
    - done の項目の照らし
    - code の索引
    - 上限の許可
  out:
    - 席の自律機能（管理 tick の外）
    - interpreter 経路の中身の解析（v3）
    - lane 計画と席の dashboard（v3）
    - 台帳への write（close と notes 1 行の外）
    - 複数の対話面（v3）
    - rtk / graphify の有効化と SQLite 化（Ask-first）

actors:
  - { key: 人, name: 開発者,      role: 要望を出し 3 クラスの承認と台帳の問いへの裁定だけを行う人,                          external: false, tint: brand }
  - { key: 席, name: 開発 session, role: 設計・契約・落ちる歯・review を行う AI（Claude Code・実装は runner）, external: false, tint: violet }
  - { key: 実, name: runner,      role: 契約 1 本を worktree で実装する headless の Claude process,   external: false, tint: ok }
  - { key: 審, name: lens,        role: diff を読んで verdict を返す headless の Claude process,       external: false, tint: warn }
  - { key: CI, name: CI,          role: main と PR で歯（test / lint / 構造検査）を毎回撃つ外部 service, external: true,  tint: info }
  - { key: 帳, name: 台帳,        role: 契約（bead）と裁定の記帳先（beads・外部 OSS）,               external: true,  tint: info }
  - { key: 面, name: 裁定面,      role: 消費側の project の、 裁定を書く画面と server（器の答えの口を撃つ）, external: true,  tint: info }

upper_needs:
  - { id: N-1, need: 人の手が入らなくても AI が自律的に開発を安全に進められる（目的関数の 1 位・K1〜K3）, origin: 目的関数 §0-1,            short: 自律安全 }
  - { id: N-2, need: 無駄な消費は害。 1 便の見積と上限を持ち、 超えたら人手を介さず止まる,           origin: 憲法 C6・恒久直命,        short: 消費は害 }
  - { id: N-3, need: 規則の値は manifest に、 現在地は永続面に。 席の記憶や散文を判定入力にしない,     origin: 憲法 C1 / C3 / C15,       short: 記憶に頼らない }
  - { id: N-4, need: 契約が書き切れること。 QA の周回を繰り返さず、 検証は base で RED になる test で表す, origin: 裁定 2026-09-09（MVP 切り直し）, short: 契約は小さく }
  - { id: N-5, need: 前の版（v1）を使わず、 design-intent を拘束条件として自分で自分を作る,           origin: ADR-0003（v1 完全放棄）,   short: 自己開発 }

acceptance:
  - { id: AC1, criterion: toy repo で内容の異なる 5 契約（正常 / 改変 / test 追加 / gate FAIL / 承認 Blocked）が実 runner + 実 lens で通り（うち 1 契約は先着の便の land で main が進んだ後に追随して Landed・1 契約は追随で衝突を記帳し終端せずに解いて Landed）、 人由来の event が approval 以外に 0 件, metric_v: 5/5, metric_l: 便が人手 0 で通る, links: [FR4, FR5, FR6, FR11, FR12, FR22, FR34] }
  - { id: AC2, criterion: scribe2 自身で実 bead 1 本（契約は SRS の要件 id と設計 doc の pointer を持つ）を pipeline が PR 作成まで通し、 CI が緑（merge は人が押す）,                 metric_v: 1 便,  metric_l: 自己ホスト,       links: [FR2, FR5, FR22, NFR2] }
  - { id: AC3, criterion: verify RED・lens 不在・予算超過の便は必ず FAIL か INCONCLUSIVE で止まり、 land されない。 lens の出力が parse できない周は同じ gate の中で lens が 1 回だけ撃ち直され、 なお parse できなければ INCONCLUSIVE で止まり、 parse できたうえで規則が断った周は lens が撃ち直されない,               metric_v: 0 件 + lens の撃ち直し 1/1（撃ち直さない 1/1） + 撃ち直しの後の INCONCLUSIVE 1/1,  metric_l: 偽の PASS,        links: [FR7, FR8, FR9, FR10, NFR1] }
  - { id: AC4, criterion: process を殺して別 process で resume しても、 event log の中断点から Landed まで通る,                   metric_v: 1 回,  metric_l: 再開で完走,        links: [FR3, FR13, FR14] }
  - { id: AC5, criterion: 3 クラス操作を名乗る契約は Blocked で止まり、 逐語付きの approve が記帳されてから再開する,              metric_v: 0 件,  metric_l: 無承認の通過,      links: [FR15, FR16] }
  - { id: AC6, criterion: 不正な契約・rules manifest（欠落 / 未知 kind / 裁定 id 無し / 重複 id）は起動前に全件 loud で落ちる,     metric_v: 0 件,  metric_l: 黙って落とす入力,  links: [FR1, FR17, FR18, NFR3, NFR4] }
  - { id: AC7, criterion: write-set の外への Edit / Write は編集の時点で deny され、 hook の入口は marker が自分を言うときだけ仕える（host-guard の口は marker に依らず判定する・AC27 / AC44）,    metric_v: 0 件,  metric_l: 素通り,           links: [FR19, FR20, FR21, FR24, NFR5] }
  - { id: AC8, criterion: ADR-0045 で廃止した作業記憶と context の機構（退避・復元・消費の subcommand と退避物の置き場、 context の計測、 cap guard とその rules 行、 退避の合図、 直命の表と復元の DATA、 skill と skill の起動に反応する hook）が現物に無いことを、 不在を測る歯が nextest で確かめる。 該当する subcommand は器の使い方の行に無く（使い方の行数を母集団として出す）、 廃止した rules 行は manifest に無く（manifest の行数を母集団として出す）、 skill は 0 本（skill dir の file 数を母集団として出す）、 hook の宣言に廃止した hook の event（skill の起動・session の終端・編集の手前の cap guard）が無く、 圧縮の直前の宣言は FR42 の圧縮の直前の 1 枠を書く 1 件だけで（宣言の件数を母集団として出す）、 event の種類の閉じた一覧に直命の種類が無い（種類の数を母集団として出す）, metric_v: subcommand 0/N + rules 行 0/M + skill 0/2 + hook の宣言 0/H + 圧縮の直前の宣言 1/1 + event の種類 0/E, metric_l: 作業記憶と context の機構の不在, links: [FR23, FR25, FR26, FR29, FR65, FR66] }
  - { id: AC10, criterion: toy repo で verify 行が矛盾する契約 1 本を intake に出し、 runner の質問 record → Questioned → orchestrator の回答 event（機械由来）→ resume → Landed まで通り、 人由来の event が 0 件・席が自分の手で実装した commit が 0 件, metric_v: 1 便, metric_l: 質問で止まり回答で再開, links: [FR5, FR14, FR22, FR30, FR31, FR32] }
  - { id: AC11, criterion: live な口座 2 つ以上を持つ host で口座残量の計測を 1 回要求すると、 口座ごとの口座残量が出所付きで fleet の event log に 1 行ずつ増え、 器の外で同じ endpoint を読む独立した手段の値と残量が一致し（reset は 1 分以内）、 認証情報の無い口座は理由付きの「測れなかった」の行になる（0 の値の行にならない）, metric_v: 2 口座, metric_l: 実測値が一致, links: [FR33] }
  - { id: AC12, criterion: 偽の runner が上限 record で止まった便を、 器が別の口座（fixture）で resume して Landed まで通す。 実便で上限に当たった記録が 1 件以上得られたら、 別口座で Landed になった事実を記録に残す,   metric_v: 1 便,  metric_l: 別口座で完走,       links: [FR14, FR33, FR35, FR36, FR37] }
  - { id: AC13, criterion: "席の登録 row と群の今の口座を持つ fixture で、 便用の選定では便の repo を anchor に持つ席の登録 row の口座と各群の今の口座が候補から外れ、 置き場を共有する他の repo の席の登録 row の口座は候補に残り、 session 用の選定では自席の鍵（役割と anchor）の外の登録 row の口座が候補から外れ、 自席の鍵の row の口座は候補に残ることを歯が nextest で確かめる（選定の入力に置いた口座の数を母集団として出す）", metric_v: "便用の除外 2/2 + 便用の他の repo の残り 1/1 + session 用の除外 1/1 + 自席の row の残り 1/1", metric_l: "口座選定の除外の集合", links: [FR36, FR59] }
  - { id: AC14, criterion: 走っている便と write-set が 1 file でも交差する契約を intake が typed な理由で断り便が作られず、 その便が終端に達した後は同じ契約が通る,                         metric_v: 0 件,  metric_l: 交差した便の同時走行, links: [FR1, FR39] }
  - { id: AC15, criterion: orchestrator の登録 row を持つ席から回答・承認・go の記帳が通り、 同じ席から行に無い権能（便の起動）を試みると deny され（deny 文に欠けた権能と rules 行の id）、 同じ席から便 1 本を名指す停止は通り stop --all は deny され（FR13）、 同じ席から便 1 本を名指す終端の撃ち直しと pipe retire（畳むだけの指定を足した形を含む）は通り、 便 1 本を名指す形から外れた形（着地の全部・道具か規則を差し替える形・後ろに redirect か pipe か別の command が続く形・置き場か repo の値が席のものと違う形など・閉じた列は設計 doc の 1 節）は deny され、 役割の記録の無い席からは記帳も起動も deny される,        metric_v: 0 件 + 便 1 本を名指す停止 1/1 + stop --all の deny 1/1 + 名指しの撃ち直しと pipe retire と畳むだけの pipe retire 3/3 + 便 1 本を名指す形から外れた形の deny K/K（K = 設計 doc の閉じた列の形の数）,  metric_l: 権能の外の記帳,     links: [FR13, FR15, FR16, FR40, FR41, FR45, FR50, FR96] }
