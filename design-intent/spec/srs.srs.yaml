  - { id: AC26, criterion: fixture の設計 doc の契約表（write-set が閉包に足りない行・設計の節が無い行・適合の行の 3 行）で契約表の検査が違反 2 行を file と行付きで名指して非 0、 適合だけの fixture で 0 件・rc 0。 加えて tracked な設計 doc の契約表全件で 0 件, metric_v: 2/2 行 + 全件 0, metric_l: 契約表の違反の名指し, links: [FR55] }
  - { id: AC27, criterion: 禁じる語列に当たる Bash の command を席と runner の両方の経路で撃ち、 実行されずに deny され、 断る理由に規則の出所と当たった並びが出る。 禁じる語列に当たる verify 行を持つ契約が intake で行番号付きで断られる。 同じ先頭語で禁じる語列に当たらない command 2 本はこの規則では止まらない, metric_v: deny 2/2 + intake の拒否 1/1 + 通過 2/2, metric_l: 禁じる語列の command の拒否, links: [FR56] }
  - { id: AC28, criterion: tmp の state dir に host の面（口座 label・plugin dir・起動引数の 3 種）を置くと器が tracked の manifest と host の面の両方を数え、 両面で重複する口座 label・schema 外の項目・rules 行の混入を行番号付きで全件拒み、 file が無い host では 0 宣言で続き壊れた host では止まる。 口座の登録で口座の設定 dir と席の前提の設定と宣言 1 行が揃い、 既存の dir と宣言済みの口座 label は断られる。 退役で設定 dir が退役先へ動き event が 1 件残り、 復帰で元へ戻り event が 1 件残り、 席の登録 row が持つ口座の退役は断られ、 退役中の口座は選定と計測から外れる。 加えて実 host で 1 回、 口座を登録し user の login の後に doctor が credential の存在を示す, metric_v: 拒否 6/6 + 除外 2/2 + 登録 1/1 + 退役 1/1 + 復帰 1/1 + 実地 1 回, metric_l: host の面と口座の登録・退役, links: [FR57, FR58, FR36] }
  - { id: AC29, criterion: 偽の tmux と偽の claude（fixture）で席の起動を役割付きで撃つと、 窓が 1 回作られ、 器が導出した起動行が 1 回だけ差し込まれ、 席の登録が差し込みの前に 1 件書かれる。 tmux の session が無い・入力欄に文字が在る・口座の候補が無い・口座が退役中・引数の口座が役割の口座と違う、 のそれぞれで typed に断り key を 1 つも送らない。 加えて実 host で 1 回、 器の subcommand 以外の起動経路を使わずに席が立ち、 SessionStart の打刻と席の登録 row が揃う, metric_v: 起動 1/1 + 拒否 5/5 + 実地 1 回, metric_l: 器の subcommand からの席の起動, links: [FR36, FR40, FR59] }
  - { id: AC31, criterion: fixture の install 帳簿と偽の導入先 2 つ（片方は worktree）で doctor を撃つと、 導入先ごとに 1 行が出て食い違いの語が none / binary / plugin / install のそれぞれで出る。 build 元 commit は版の表示口と同じ値で、 build 元を測れない build では unknown と出て失敗にしない。 1 つの口の更新が偽の上流へ前進のみで揃えて偽の build 器で install の記録を 1 行残し、 揃えられない周は typed に断る, metric_v: 行 2/2 + 食い違い 4/4 + unknown 1/1 + 記録 1/1 + 拒否 1/1, metric_l: 導入先の同期の測定と 1 つの口の更新, links: [FR57, FR61] }
  - { id: AC38, criterion: 偽の台帳と偽の終端でない段の便で、 審査 PASS ∧ 依存 closed ∧ write-set の交差 0 ∧ 受付を通る契約が、 席の操作なしに便の終端の直後か手動の 1 周で受付と Reviewed の段を経て待機の段を挟まず Spawned になり、 条件を満たす契約が N 本なら同じ契機で N 本（同時走行の最大値の範囲内）起き、 最大値に達した周の契約は最大値の理由で起動の列に留まり、 交差する契約は交差の理由（Overlap）で起動の列に留まり、 typed な介入（first / hold / release）のうち first の印を持つ契約が契約の priority の高い契約より先に起き、 同じ介入では priority の高い契約が先に起き、 同じ介入と priority の契約は起票順に起き、 hold の契約は起きず release で戻り、 介入の印を記録した直後だけで 1 周が起き、 便を運ぶ process を殺した便は 1 周で再開が 1 回だけ起きて Landed まで通り、 終端に達した便が起動の列から外した契約は release の印 1 つで 1 回だけ起き直り（着地済みの便と審査 FAIL の便の契約は起き直らない）、 回答 event か approval.received を記帳した直後だけで 1 周が起き、 回答が記帳された Questioned の便と承認が記帳された Blocked の便は所有者の印が無くても再開が 1 回だけ起き（便を運ぶ process が生きている便には触らない）、 verdict が PASS で所有者の印の無い Gated の便も再開が 1 回だけ起き（verdict が PASS でない Gated の便と verdict を読めない Gated の便は起きない）、 手動の 1 周と便の終端の直後が重なっても起こす便が二重にならず（重複起動 0・起動試行を母集団）、 周期の timer の経路が 0（走査した契機の数を母集団として出す）、 台帳が読めない周は 1 本も起こさず unmeasured の 1 行が出る（列挙した契約数と起こした便数を母集団として出す）, metric_v: 自動起動 1/1 + 段の遷移 1/1 + 同じ契機 N/N（最大値の範囲内） + 最大値の待ち 1/1 + 交差の待ち 1/1 + first 1/1 + priority 1/1 + 起票順 1/1 + hold / release 2/2 + 印の直後の 1 周 1/1 + 退役した便の再開 1/1 + 終端の便の契約の起き直り 1/1（起き直らない 2/2） + 記帳の直後の 1 周 1/1 + 待ちが解けた便の再開 2/2（生きている便への再開 0） + PASS の Gated の再開 1/1（起きない 2/2） + 契機の重なりの重複起動 0/2 + timer の経路 0/K + unmeasured 1/1 + 母集団 = 列挙 N / 起動 M, metric_l: dispatcher の自動起動, links: [FR68] }
  - { id: AC39, criterion: Spawned の段で偽の runner を kill した便に resume を撃つと、 同じ worktree で runner が起き直り途中再開の節に前の runner の未 commit の変更の file 名が載り、 生きている偽の runner を持つ便は typed に断られて runner が 2 本にならない（試行した便数を母集団として出す）, metric_v: 起こし直し 1/1 + 未 commit の一覧 1/1 + 生存の断り 1/1, metric_l: runner が死んだ便の起こし直し, links: [FR37] }
  - { id: AC40, criterion: 閾値未満の口座の候補が 0 の fixture で席の起動が断られずに逼迫度が最小の口座で席を起こし、 妥協の理由が実効の記録と起動の記録と席の指示文に載り、 上限に当たっていない測れた口座が 0 の周だけ typed に断られて key が 1 つも送られず、 置き場が別の 2 席が同じ実効の口座に揃い、 役割の口座の宣言に余裕が戻っても実効の口座が変わらない（試行した起動の数を母集団として出す）, metric_v: 妥協の起動 1/1 + 理由の記録 3/3 + 全口座が上限の断り 1/1 + 断りの key 0 + 同じ口座への揃い 1/1 + 居続け 1/1, metric_l: 妥協の起動と実効の口座, links: [FR69, FR59] }
requirements:
  - id: FR1
    type: FR
    label: 契約の検査
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC6, AC14] }
    ears:
      pattern: unwanted
      condition: 契約 file（契約表の行から生成した写し・必須 field の集合は生成の型が持つ）に必須 field の欠落・複数行の verify・write-set 0 本が在るとき
      response: 全件を行番号付きで集めて拒否し、 便を作らない
  - id: FR2
    type: FR
    label: 契約の pointer
    priority: must
    vmethod: I
    rationale_source: N-4
    trace: { backward: [N-4, N-5], acceptance: [AC2] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 契約は SRS の要件 id と設計 doc を pointer で持ち、 設計 1 本から契約が複数出る形を保つ（適用対象は本 SRS を根拠に起票する契約・v1 由来の既存 bead は対象外）
  - id: FR3
    type: FR
    label: 便の永続
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC4] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 各段は fleet の event log を replay して現在地を読み、 段の終わりに event を 1 件追記する（process の記憶に状態を持たない）
  - id: FR4
    type: FR
    label: runner の起動
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1] }
    ears:
      pattern: event
      condition: 便が Intake 段にあり spawn が要求されたとき
      response: base を記録し、 worktree を切り、 write-set の allowlist を書いて runner を headless で起動する
  - id: FR5
    type: FR
    label: runner と lens の口
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1, AC2, AC10] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: runner と lens は claude -p（headless・stdin に契約 / diff・stdout に構造化 1 行・permission を毎回明示・口座は環境変数で切替）の 1 形で呼ぶ
  - id: FR6
    type: FR
    label: 完了判定
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC1] }
    ears:
      pattern: event
      condition: runner が終了したとき
      response: rc 0 かつ base からの commit が 1 件以上なら Implemented、 それ以外は Failed と記帳する
  - id: FR7
    type: FR
    label: 入口の flip check
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC3] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 変更した .rs ごとに、 test 差分だけを base に当てて新規・変更 test が 1 本以上 RED になり、 かつ HEAD では GREEN であることを機械で確かめ、 docs-only でない変更に test 差分が無ければ拒む
  - id: FR8
    type: FR
    label: gate の機械検証
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC3, AC20] }
    ears:
      pattern: event
      condition: gate が要求されたとき
      response: 契約の verify 各行を worktree で実走して行ごとの rc を記録し、 1 本でも rc が 0 でなければ FAIL とする
  - id: FR9
    type: FR
    label: lens の verdict
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC3] }
    ears:
      pattern: unwanted
      condition: lens が要るのに lens が無い・diff が予算 cap を超える・stdout が parse できない・verdict が 3 値の外のとき
      response: PASS を名乗らず INCONCLUSIVE とする。 ただし lens は在るが lens の出力が parse できない周だけは、 同じ gate の中で lens を 1 回だけ撃ち直し、 撃ち直した lens の出力もなお parse できないときに INCONCLUSIVE とする（parse できたうえで規則が断った周は lens を撃ち直さない）
  - id: FR10
    type: FR
    label: land の前提
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC3] }
    ears:
      pattern: unwanted
      condition: verdict が PASS でない、 または main の tip が記録した base と一致せず追随できない（base が main の祖先でない、 または worktree が clean でない）とき
      response: land は何もしない（main も event も変えない）
  - id: FR11
    type: FR
    label: land
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1] }
    ears:
      pattern: event
      condition: verdict が PASS で前提が揃ったとき
      response: worktree の tree を squash 1 commit で main に載せ（tree 同一・CAS）、 main で verify を再実走し、 RED なら Failed と記帳して止まる
  - id: FR12
    type: FR
    label: verdict export
    priority: should
    vmethod: T
    rationale_source: N-5
    trace: { backward: [N-5], acceptance: [AC1] }
    ears:
      pattern: event
      condition: land が成立したとき
      response: verdicts.jsonl に schema 版付きで 1 行 append し、 Landed と記帳する（跨版の観測面）
  - id: FR13
    type: FR
    label: stop
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC4, AC15] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: stop --all は live な runner を止め、 rc を 0（全部止まった / 対象なし）・1（残った）・2（state が読めない）の 3 値で返す冪等な 1 コマンドである。 便 1 本を名指す stop は終端でないその便だけを止めて Stopped を記帳し、 止め切れない周は記帳せず rc 1、 既に終端の便は記帳を増やさず rc 1、 verdict を読めない Gated の便は終端かどうかを決められないので止めずに rc 2 で断る。 停止の権能は rules 行 role.orchestrator が持ち（FR41）、 行が与えるのは便 1 本を名指す形だけで stop --all は与えない
  - id: FR14
    type: FR
    label: resume
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC4, AC10, AC12] }
    ears:
      pattern: event
      condition: 別 process で resume が要求されたとき
      response: event log の現在地から続きの段だけを通し、 Landed まで到達できる
  - id: FR15
    type: FR
    label: 承認の停止
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC5, AC15] }
    ears:
      pattern: event
      condition: 契約が不可逆操作（消す / 出す / 使う）を名乗る段に達したとき
      response: approval.requested を記帳して Blocked で止まり、 人の入力を待たずに process を終える
  - id: FR16
    type: FR
    label: 承認の再開
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC5, AC15] }
    ears:
      pattern: event
      condition: 人が approve を逐語付きで与えたとき
      response: approval.received（逐語付き）を記帳し、 次の resume で続きを通す
  - id: FR17
    type: FR
    label: rules manifest
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC6, AC17] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 規則の種類は閉じた enum と網羅 match で持ち、 値は tracked な manifest 1 file から起動時に読む
  - id: FR18
    type: FR
    label: rules の検査
    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC6, AC17] }
    ears:
      pattern: unwanted
      condition: manifest に未知 kind・id 重複・型不一致・user 由来で裁定 id の無い行が在るとき
      response: 起動前に全件を行番号付きで拒否する（黙って落とさない）
  - id: FR19
    type: FR
    label: marker と hook
    priority: must
    vmethod: T
    rationale_source: N-5
    trace: { backward: [N-5], acceptance: [AC7] }
    ears:
      pattern: state
      condition: marker（.vessel）が自分の NAME を言っている間
      response: hook は SessionStart で名乗りを出す
  - id: FR20
    type: FR
    label: in-loop guard
    priority: must
    vmethod: T
    rationale_source: N-4
    trace: { backward: [N-4], acceptance: [AC7, AC16] }
    ears:
      pattern: unwanted
      condition: 契約の write-set の外へ Edit / Write しようとしたとき
      response: 編集の時点で deny し、 policy が読めなければ fail-closed で deny する
  - id: FR21
    type: FR
    label: 注入計測の slot
    priority: should
    vmethod: T
    rationale_source: N-2
    trace: { backward: [N-2], acceptance: [AC7] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: hook は自分の出力 1 行を（who / what / when / bytes / tokens / wall）の schema で記録し、 v3 の計測 store を後付けできる形を保つ
  - id: FR22
    type: FR
    label: 人手 0 の計測
    priority: must
    vmethod: T
    rationale_source: N-1
    trace: { backward: [N-1], acceptance: [AC1, AC2, AC10, AC23] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 到達点の計測では人由来の event を数え、 approval 以外が 0 件であることを機械で示す
