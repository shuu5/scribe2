    priority: must
    vmethod: T
    rationale_source: N-3
    trace: { backward: [N-3], acceptance: [AC8] }
    ears:
      pattern: ubiquitous
      condition: 常時
      response: 器は開発 session の作業記憶の退避・復元・消費の subcommand と退避物の置き場を持たない（ADR-0045 §2 (2) で廃止。 FR42 の圧縮の直前の 1 枠は退避物に当たらない）。 文脈の圧縮は session 側の機構が担い、 session を跨ぐ記憶は台帳が持つ。 不在は不在を測る歯が確かめる
  - id: FR24
