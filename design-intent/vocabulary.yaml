    aliases: [post-landing detection]
    definition: 便が Landed に達した後に、 器が land から切り離した子 process で vessel 宣言の検出線の行 (detection-verify) を 1 回撃つこと (ADR-0060・proposed)。 着地した commit を tmp worktree に出して base はその親とし、 撃つ前に今の検出線の行と同じ受付札 (並列の枠) を取って封じ込めの箱と器の健康の遮断器を通る。 結果は verify-main.jsonl の kind=detection の record と RunDone stage=Landed の detail に残し、 着地は戻さず台帳には写さない (C12.4・C15)。
