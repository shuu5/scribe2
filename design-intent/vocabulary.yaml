# scribe2 canonical vocabulary (P-5: 1 entity = 1 canonical name)
#
# edit-SSoT: 本 file (Layer 1 consumer は flip しないため vocabulary.yaml が編集の正本、 folio ADR-0051 §2.3)。
# 出所: input/SPEC-excerpt.md §5 (OSS 依存) の用語を全件、 加えて §2 憲法 / §4 技術選定が使う概念を登録する。
#   §5 の owning spec (依存一覧の design-intent 文書) は未作成のため、 §5 由来の語は本 file が唯一の登録箇所。
# schema (folio rules §3): terms[] = { canonical (MUST), domain, definition (1 行), forbidden[], relationships[], flagged_ambiguities[] }
#   - domain: consumer = scribe2 所有の語 (folio が解説しない)。
#   - definition は「語が何を指すか」の指示的定義 + 条 id の参照に限る。 義務文と数値は書かない (正本は憲法の条と §3 rules 行)。
#   - definition は単一行で、 生の < > を書かない (矢印は → で表現)。
#   - forbidden は folio validate の vocabulary gate (substring 検出) に使うため、 本文に正当に現れ得る語は載せない。
#   - canonical 表記は SPEC の日本語表記を正とし、 型名そのものが概念の場合は型名 (大文字始まり) を canonical にする。
#   - 「面」の family は 提示面 / 対話面 / drift の面 を個別に登録する (構成要素「面」は語彙にしない)。
terms:
  # ---------------------------------------------------------------- §5 見出し (manifest / doctor)
  - canonical: manifest
    domain: consumer
    definition: repo 内 1 file (TOML) に置く、 規則の値・設定・依存の版の唯一の置き場。 形式と読み方の規範は C1、 照合は doctor。
    forbidden: [マニフェスト]
    relationships: [rules 行, doctor, 裁定 id]
  - canonical: doctor
    domain: consumer
    definition: 全 host の版・口座・退役・rules 行を照合する 1 コマンド (C3.2)。 改訂前の selfdev sub-command (成熟条件の測定) は ADR-0003 で廃止。
    relationships: [manifest, fleet]
  # ---------------------------------------------------------------- §5 core 依存
  - canonical: tailscale
    domain: consumer
    definition: core 依存。 提示面を tailnet 越しに配信する基盤。 tailnet serve の skill は v1 から移植する。
    relationships: [tailnet serve, 提示面]
  - canonical: tailnet serve
    domain: consumer
    definition: tailscale の tailnet 上で HTML を配信する提示手段。 提示面の既定の配信経路。
    relationships: [tailscale, 提示面]
  - canonical: 提示面
    domain: consumer
    definition: 人間へ成果物 (HTML) を見せる面。 配信は tailnet serve。
    relationships: [tailnet serve]
  - canonical: beads
    domain: consumer
    definition: issue と裁定を dolt backed の DB に持つ外部 OSS の issue tracker。 v2 の台帳の実体で、 bd 経由 (adapter) でのみ触る。
    relationships: [bd, adapter, 台帳, dolt push]
  - canonical: bd
    domain: consumer
    definition: beads の CLI。 v2 が台帳を読む唯一の口で、 JSON 出力を adapter で包んで使う。
    relationships: [beads, adapter]
  - canonical: 台帳
    domain: consumer
    definition: 作業 (issue) と裁定の記録。 実体は beads で、 v2 は自前の台帳を持たない。
    forbidden: [レジャー]
    relationships: [beads, bd]
  - canonical: dolt push
    domain: consumer
    definition: beads の共有 DB (dolt) を remote へ同期する操作。 admin lane だけが行う。
    relationships: [beads, admin lane]
  - canonical: git
    domain: consumer
    definition: core 依存。 成果の保存と統合の基盤。 v2 からは glue の 1 つとして adapter 経由で叩く。
    relationships: [glue, adapter]
  - canonical: tmux
    domain: consumer
    definition: core 依存。 席 (session) を載せる terminal multiplexer。 server 名の導出規則は C2.2。
    relationships: [席, NAME 定数, glue]
  - canonical: ssh
    domain: consumer
    definition: glue の 1 つ。 他 host の席や状態へ到達する経路で、 adapter 経由で叩く。
    relationships: [glue, adapter]
  - canonical: claude CLI
    domain: consumer
    definition: core 依存。 Claude Code の CLI。 席の実体 (AI session) を起動する glue の 1 つ。
    relationships: [席, glue]
  # ---------------------------------------------------------------- §5 day-1 optional adapter
  - canonical: day-1 optional adapter
    domain: consumer
    definition: seam だけを最初から用意し、 採否を K 指標で決める外部依存の枠。 rtk と graphify が該当する。 依存の追加は A3 の対象。
    relationships: [rtk, graphify, seam, K 指標]
  - canonical: rtk
    domain: consumer
    definition: tool 出力を圧縮する hook policy の 1 項目 (day-1 optional adapter)。 v1 実測の方針「一律 arm しない」を継承し、 機械経路には挟まない (v1 の実測は本 repo へ持ち越していない・SPIKE-tooling-report.md 冒頭)。
    relationships: [day-1 optional adapter]
  - canonical: graphify
    domain: consumer
    definition: land ごとに知識グラフを生成して context を供給する候補 (day-1 optional adapter)。 v1 では micro-bench のみ (v1 の実測は本 repo へ持ち越していない・SPIKE-tooling-report.md 冒頭)。
    relationships: [day-1 optional adapter, land]
  - canonical: K 指標
    domain: consumer
    definition: 器の成熟と運用の健全さを測る指標群 (K1〜K3)。 閾値は rules 行。 成熟条件と day-1 optional adapter の採否判断に使う。
    relationships: [rules 行, 成熟条件, day-1 optional adapter]
  - canonical: land
    domain: consumer
    definition: worker の成果を統合して着地させる操作 (merge)。 MVP では worktree の tree を squash 1 commit で main に載せ、 main で歯を再実走する (SRS FR11)。 graphify は land ごとに走る。 crate の land module が担う。
    relationships: [graphify, 便, gate, verdict export]
  - canonical: verdict export
    domain: consumer
    definition: land ごとの判定を schema 版付きで verdicts.jsonl に追記する面 (跨版の観測面・SRS FR12)。 次の版の器がこの記録を読む。
    relationships: [land, Verdict, 版 N+1]
  # ---------------------------------------------------------------- §4 技術選定が使う概念
  - canonical: glue
    domain: consumer
    definition: 外部 process (tmux / ssh / git / claude CLI) を叩く責務の領域。 core の外側にあり、 adapter が閉じ込める側。
    relationships: [adapter, tmux, ssh, git, claude CLI]
  - canonical: adapter
    domain: consumer
    definition: 外部 OSS や glue を閉じ込める実装層 (薄い wrapper)。 台帳は bd の wrapper 1 本、 glue は std::process の adapter、 day-1 optional adapter も同じ seam に置く。
    relationships: [bd, glue, seam, day-1 optional adapter]
  - canonical: seam
    domain: consumer
    definition: 外部要素 (依存・設定) を差し込む接合点。 adapter の seam は day-1 に用意し、 env seam は新設しない (C2.2)。
    relationships: [adapter, day-1 optional adapter, manifest]
  - canonical: 単一 static binary
    domain: consumer
    definition: 依存を静的 link した実行 file 1 つ。 閉じた toolchain で drift の面を構造から消す (ADR-0001)。
    relationships: [drift の面]
  - canonical: drift の面
    domain: consumer
    definition: v1 で場当たり修正を招いた env 層 (venv / mypy-baseline / bats / host 差) の総称。 v2 は構造から消す (ADR-0001)。
    relationships: [単一 static binary]
  - canonical: 境界 crate
    domain: consumer
    definition: 外部形式 (serde 等の derive) を扱う crate。 derive macro はここに閉じる (C13.2)。
    relationships: [adapter]
  - canonical: docs-only
    domain: consumer
    definition: PR の分類の 1 つで、 変更が文書のみのもの。 flip check の test 差分要件から除外される (C12.3)。 分類は CI が行う。
    relationships: [flip check]
  # ---------------------------------------------------------------- §2 憲法が使う概念
  - canonical: 順位
    domain: consumer
    definition: 憲法の線どうしがぶつかったときの決め方 (場当たり修正の禁止 → 膨張防止 → compile 速度)。 条ではなく全条に先立ち、 条 id の連番を持たない (憲法 §1)。
  - canonical: rules 行
    domain: consumer
    definition: manifest に置く規則の値 1 行 (閾値・有効/無効・裁定 id・裁定時刻・逐語)。 数値の置き場 (C1) で、 変更の手続きは C5。
    forbidden: [規則行]
    relationships: [manifest, 裁定 id, 検出線]
  - canonical: 裁定 id
    domain: consumer
    definition: user 裁定を一意に指す id (transcript の ts)。 rules 行の変更 (C5)、 閾値変更 (A2)、 憲法改訂 (N4) が要求する。
    relationships: [rules 行, 対話面, 承認 event]
  - canonical: RuleKind
    domain: consumer
    definition: 規則の種類を閉じた列挙で表す enum。 網羅 match 必須で、 未実装は compile error (C1)。
    relationships: [rules 行, Verdict]
  - canonical: Verdict
    domain: consumer
    definition: 規則の検査 (Rule::check) や gate が返す判定の型 (C1)。 gate の値は PASS / FAIL / INCONCLUSIVE の 3 値で、 構造化 field が一次 truth (SRS では値を小文字 verdict と書く)。
    relationships: [RuleKind, gate, 便, verdict export]
  - canonical: 席
    domain: consumer
    definition: 1 つの Claude Code session が占める作業単位。 役割は worker / admin (管理席) / planner。 状態は SeatState で運ぶ (C3.3)。
    forbidden: [シート]
    relationships: [fleet, 口座, lease, 管理席, planner]
  - canonical: 口座
    domain: consumer
    definition: Claude の利用枠 (subscription account)。 使い方の規範は C9、 状態は fleet の DB に host 列付きで持つ。
    forbidden: [アカウント]
    relationships: [fleet, lane, 席]
  - canonical: fleet
    domain: consumer
    definition: 複数 host にまたがる席・口座・lease・退役の全体。 状態の持ち方は C3。 MVP では便と席の現在地の全体を指し、 実体は event log 1 file (SRS FR3)。
    relationships: [席, 口座, lease, doctor, event log]
  - canonical: event log
    domain: consumer
    definition: 1 行 1 出来事を追記する file。 fleet の現在地はこれを replay して導く (C3・SRS FR3)。 MVP の永続面で、 process の記憶に状態を持たない。
    relationships: [fleet, 便, 承認 event]
  - canonical: lease
    domain: consumer
    definition: 席が口座や host を占有する期限付きの割当。 fleet の状態の一部。
    relationships: [席, 口座, fleet]
  - canonical: 退役
    domain: consumer
    definition: host / 席 / 口座を運用から外す操作。 可逆 move で行う (N1)。
    relationships: [fleet, doctor]
  - canonical: lane
    domain: consumer
    definition: 口座 1 つの消費枠の中で並走させる作業の流れ (席の列)。 lane 数の決め方は rules 行 (§3 R-C9-1)。
    forbidden: [レーン]
    relationships: [口座, admin lane]
  - canonical: admin lane
    domain: consumer
    definition: 管理席が担う実行経路。 dolt push・land など gate 通過後の操作を担う。
    relationships: [lane, 管理席, dolt push, gate]
  - canonical: 管理席
    domain: consumer
    definition: admin の役割を持つ席。 停止の検知と再起動の規範は C9。
    relationships: [席, admin lane]
  - canonical: planner
    domain: consumer
    definition: 席の役割の 1 つ (設計協調)。 改訂前の憲法 (C7) では唯一の対話面だったが、 ADR-0003 以後は対話面の identity を rules 行 R-C7-1 が持つ (初期値 = 開発 session が user 直)。
    forbidden: [プランナー]
    relationships: [対話面, 席, 開発 session]
  - canonical: 対話面
    domain: consumer
    definition: user と機械が承認や裁定をやり取りする面。 ちょうど 1 つ (C7)。 どの席かは rules 行 R-C7-1 の値で決まり、 MVP の初期値は開発 session が user と直接対話する形。
    relationships: [planner, 開発 session, 承認 event, rules 行]
  - canonical: relay 印
    domain: consumer
    definition: 改訂前の憲法 (C7・A1) で planner が user の承認を機械へ伝えていた印。 ADR-0003 以後、 承認の記帳は承認 event が担う (歴史的な語)。
    relationships: [planner, 承認 event]
  - canonical: 承認 event
    domain: consumer
    definition: user の承認を fleet に記帳する event (approval.requested / approval.received・逐語付き・C7.2)。 3 クラス操作の便はこれで止まり、 記帳された回答で再開する (SRS FR15 / FR16)。
    relationships: [対話面, 3 クラス, event log, 裁定 id]
  - canonical: 3 クラス
    domain: consumer
    definition: user 確認を要する操作の 3 分類 (消す / 出す / 使う)。 A1 の対象。 「出す」= public 化 (可視性の反転) ・外部送信 (他 repo への push・外部サービスへの送信・release / tag の公開)。 自 repo への push と PR 作成は含まない (A4.3 で可逆・ADR-0008)。
    relationships: [対話面, 承認 event, 自 repo への PR]
  - canonical: 自 repo への PR
    domain: consumer
    definition: 自分の repo へ branch を push して PR を作る操作。 main を動かさず branch も PR も閉じられるため A4.3 で可逆と扱い、 3 クラスの「出す」に当たらない (ADR-0008)。 pipeline の seam は --pr-cmd。
    relationships: [3 クラス, 承認 event, 便]
  - canonical: 開発 session
    domain: consumer
    definition: 設計・契約・実装・review を行う AI の session (Claude Code)。 MVP の対話面 (R-C7-1 の初期値) であり、 作業記憶の退避と復元の作法を守る (SRS FR23)。
    relationships: [対話面, 契約, 設計 doc, runner, lens]
  - canonical: 契約
    domain: consumer
    definition: 何を作り・何ができたら終わりかを 1 file に書いたもの。 台帳の 1 bead に対応し、 SRS の要件 id と設計 doc を pointer で持つ (C15・SRS FR2)。
    relationships: [台帳, 設計 doc, write-set, 便]
  - canonical: 設計 doc
    domain: consumer
    definition: 要望を SRS の要件に結び、 契約が複数出る元になる tracked markdown (docs/design/)。
    relationships: [契約, SRS]
  - canonical: SRS
    domain: consumer
    definition: MVP の要件定義書 (design-intent/spec/srs.html)。 folio SRS pack の生成物で、 機械 SSoT は srs.srs.yaml。 上位ニーズ・機能要件・受入基準を持つ。
    relationships: [要件カタログ, 契約, 設計 doc]
  - canonical: 要件カタログ
    domain: consumer
    definition: 要件 doc の v2 行を scrub して写した一覧 (design-intent/spec/requirements-catalog.html)。 SRS の FR が根拠で行 id を引く。
    relationships: [SRS]
  - canonical: write-set
    domain: consumer
    definition: 契約が宣言する、 編集してよい file の集合。 外への編集は編集の時点で止める (C16・SRS FR20)。
    relationships: [契約, in-loop guard]
  - canonical: in-loop guard
    domain: consumer
    definition: 仕様からの逸脱を編集の時点で止める guard (C16)。 MVP の形は write-set の外への Edit / Write を PreToolUse で deny する hook。 極性一覧に InLoop として載る。
    relationships: [write-set, 極性]
  - canonical: runner
    domain: consumer
    definition: 契約 1 本を worktree で実装する headless の Claude process (SRS FR4 / FR5)。 席ではなく使い捨て。 起動時に口座と対象 repo の settings を 1 つも読まない (ADR-0011)。
    relationships: [契約, headless, lens, 便, allowlist]
  - canonical: allowlist
    domain: consumer
    definition: 器が runner に与える「実行してよい command 名の列」。 値は対象 repo の vessel 宣言が持ち、 manifest の rules 行 runner.allowed_commands は宣言が名乗れる上限である (C1 / C10・ADR-0010)。 intake が上限と突合して便ごとに凍結し、 runner は凍結した写しから claude へ --allowedTools として渡し、 口座と対象 repo の settings を 1 つも読まない (ADR-0009 / ADR-0011)。 明示 allow の外は hook が deny する。
    relationships: [runner, vessel 宣言, manifest, rules 行, hook]
  - canonical: 共通 verify
    domain: consumer
    definition: どの便にも共通の検証 (flip check・test・lint・依存監査・変異検出) を対象 repo の vessel 宣言に置き、 intake が便ごとに凍結した写しを gate が契約 verify の前に撃つもの (C2・ADR-0009 / ADR-0010)。 契約の verify は便固有の行だけを持つ。
    relationships: [gate, vessel 宣言, 契約, 変異検出線]
  - canonical: 変異検出線
    domain: consumer
    definition: cargo-mutants で生成した変異のうち歯に撃墜されない数を測る検出線 (C12 R-C12-1)。 1 便では共通 verify の xtask mutants-diff が便の diff に対して測り、 極性 (記録のみ / deny) は manifest 行に従う (ADR-0009)。
    relationships: [共通 verify, gate, flip check]
  - canonical: lens
    domain: consumer
    definition: diff を読んで verdict (PASS / FAIL / INCONCLUSIVE) を返す headless の Claude process (SRS FR9)。 MVP の gate は lens 1 本。 runner と同じ起動形で、 口座と対象 repo の settings を 1 つも読まない (ADR-0011)。
    relationships: [gate, headless, Verdict]
  - canonical: headless
    domain: consumer
    definition: 対話画面を持たず、 入力を受けて 1 回で答えを返す Claude の実行形 (claude -p)。 口座は環境変数で切り替え、 permission は毎回明示し、 user / project / local の settings は読まない (ADR-0011)。
    relationships: [runner, lens]
  - canonical: toy repo
    domain: consumer
    definition: 到達点を測るために一時 dir に作る、 外部依存の無い小さな git repo (SRS AC1)。
    relationships: [便]
  - canonical: ".vessel"
    domain: consumer
    definition: repo root の固定名 marker file。 中身が name と version を言い、 どの器が仕えるかを決める (SPEC §7・SRS FR19)。
    relationships: [器, NAME 定数, vessel 宣言]
  - canonical: vessel 宣言
    domain: consumer
    definition: 対象 repo の root に marker の隣として置く tracked file .vessel.toml。 その repo の allowlist と共通 verify を repo 自身が名乗る宣言値で、 intake が manifest の上限と突合して便ごとに写しへ凍結する (C10・ADR-0010)。 marker そのものは変えない。
    relationships: [".vessel", allowlist, 共通 verify, manifest, intake]
  - canonical: Budget
    domain: consumer
    definition: 起動に必要な予算の型。 Precheck の実測を消費してしか作れず、 唯一の起動口 spawn が要求する (C6)。
    relationships: [Precheck, 検出線]
  - canonical: Precheck
    domain: consumer
    definition: 起動前の見積 (token 上限・検出線との照合) の実測。 Budget の唯一の生成元 (C6)。
    relationships: [Budget]
  - canonical: 検出線
    domain: consumer
    definition: 超えたら機械が検知して記録・起票する線。 PR は止めない。 CI が落とす deny 閾値とは区別する。
    relationships: [rules 行]
  - canonical: 歯
    domain: consumer
    definition: 違反を機械が止める仕組みのうち test / lint / CI gate を指す。 Rust の 1 framework だけで持つ (C12)。
    relationships: [flip check, KNOWN-RED 台帳]
  - canonical: gate
    domain: consumer
    definition: 便の成果物を独立に検証して Verdict を返す機構。 MVP は契約の verify の実走 + lens 1 本 (SRS FR8 / FR9)。 crate の gate module が担う。 歯 (test / lint / CI) とは別の entity。
    relationships: [Verdict, 便, land, lens]
  - canonical: flip check
    domain: consumer
    definition: CI が PR の test 差分だけを base に当てて RED、 HEAD で GREEN であることを確かめる検査 (C12.2)。
    relationships: [歯, docs-only]
  - canonical: KNOWN-RED 台帳
    domain: consumer
    definition: 落ちている test を許容するための一覧。 持たない (C12.6)。
    relationships: [歯]
  - canonical: 器
    domain: consumer
    definition: scribe の実行基盤 (plugin + binary + 席の運用) の 1 世代。 版の作り方の規範は C8。
    relationships: [版 N+1, 自己開発]
  - canonical: 自己開発
    domain: consumer
    definition: 器が自身の repo を開発すること。 ADR-0003 以後は既定で許可 (A4)。 user に先に聞くのは不可逆操作 (3 クラス) だけ。 拘束条件は design-intent (C8)。
    relationships: [器, 版 N+1, 3 クラス]
  - canonical: SelfDev
    domain: consumer
    definition: 改訂前の C8 が定めていた自己開発の許可状態 enum (Disabled / Enabled { ruling_id })。 ADR-0003 で廃止 (歴史的な語)。
    relationships: [自己開発]
  - canonical: 成熟条件
    domain: consumer
    definition: 改訂前の C8 で版の成熟を宣言するために同時に成り立つ条件の集合 (§3 R-C8-1)。 ADR-0003 で停止 (測らない・履歴として残す)。
    relationships: [自己開発, K 指標]
  - canonical: 版 N+1
    domain: consumer
    definition: 次世代の器。 改訂後の C8 では design-intent の下で作られ、 前の版を oracle にしない。 schema 非互換・C4 超えの着地先 (N4)。
    relationships: [器, 自己開発, verdict export]
  - canonical: 便
    domain: consumer
    definition: 契約 1 本の 1 往復 (intake → runner → gate → land)。 MVP の識別子は run id で (run は識別子 run id にのみ用い、 便の実体名には使わない)、 現在地は event log から導く。 到達点は便の本数で数える (SRS AC1 / AC2)。
    relationships: [Verdict, land, gate, 契約, event log]
  - canonical: NAME 定数
    domain: consumer
    definition: plugin 名 / crate / skill 名前空間 / state dir / env 接頭辞 / tmux server 名を導出する 1 定数 (C2.2)。
    relationships: [tmux]
  - canonical: Stage
    domain: consumer
    definition: 選定・除外・routing の適用順を列挙順で定める enum (C2)。
  - canonical: SeatState
    domain: consumer
    definition: 席の状態を運ぶ typed enum (C3.3 / C9)。
    relationships: [席, Completion]
  - canonical: Completion
    domain: consumer
    definition: 完了条件を表す唯一の enum。 待機 API の引数型 (C3.4)。
    relationships: [SeatState]
  - canonical: 極性
    domain: consumer
    definition: 失敗時に開く (FailOpen) か閉じる (FailClosed) かの性質。 型で持ち、 一覧は build 時に生成する (C11.2)。
  - canonical: Declared
    domain: consumer
    definition: 人が書いた宣言値の型 (C10)。
    relationships: [Measured, Effective]
  - canonical: Measured
    domain: consumer
    definition: 実測値の型。 値と出所 (Provenance) を持つ (C10)。
    relationships: [Declared, Derived]
  - canonical: Derived
    domain: consumer
    definition: 他の値から導出した値の型。 Independent を名乗れない (C10)。
    relationships: [Measured]
  - canonical: Effective
    domain: consumer
    definition: 効力を持つ値の型。 Declared から実測を経てのみ作られる (C10)。
    relationships: [Declared]
  - canonical: state dir
    domain: consumer
    definition: 器が状態 (event log・verdict export・注入計測) を置く dir。 既定は NAME 定数から導出し、 差し替えは CLI 引数だけで行う (env seam を持たない・ADR-0004 §2.4)。
    relationships: [NAME 定数, event log, verdict export]
  - canonical: run id
    domain: consumer
    definition: 便 1 本を一意に指す識別子 (bead id と UTC の時刻印から成る)。 event log と state dir 配下の dir 名に用いる。
    relationships: [便, event log, state dir]
  - canonical: measure tag
    domain: consumer
    definition: 構造検査が判定行に出す測定 1 本の名。 各 tag は測る対象と実測値を持ち、 列挙は ADR が記録する。
    relationships: [Measured]
  - canonical: paths-clean
    domain: consumer
    definition: index を母集団に、 tracked file の本文へ private path 形が残っていないことを測る measure tag。
    relationships: [measure tag]
  - canonical: integration test target
    domain: consumer
    definition: cargo が kind = test として build する 1 つの単位。 dir 形の統合 test は main.rs と
      その module を合わせて 1 と数え、 数は cargo metadata が返す targets で得る (R-C13-2 の数え方の単位・ADR-0007)。
    relationships: [歯]
  # ---------------------------------------------------------------- 開発 session の自律機能 (SRS v0.2 FR25〜FR27)
  - canonical: cap guard
    domain: consumer
    definition: 開発 session の context 使用量が rules 行の上限に達したとき、 退避以外の編集を止める hook の段 (SRS FR26)。 上限の値は rules 行が持つ。
    relationships: [開発 session, hook, manifest]
  - canonical: hook
    domain: consumer
    definition: 器が binary 1 本で仕える Claude Code の event の口 (PreToolUse 等)。
    relationships: [write-set, cap guard]
  - canonical: 管理 tick
    domain: consumer
    definition: 開発 session が黙っていないかを周期で見て、 条件が揃ったときだけ pointer 1 行を注入する仕組み (SRS FR27)。
    relationships: [開発 session, cycle]
  - canonical: cycle
    domain: consumer
    definition: 作業記憶を退避し、 session を作り直し、 退避物から復元する一周 (SRS FR27)。 退避物が無い session では起こさない。
    relationships: [管理 tick, 開発 session]
