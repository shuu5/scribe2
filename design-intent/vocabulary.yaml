    definition: rules 行が強制と名指す窓が閾値以上の席に管理 tick が印を書き、 印が在る間は退避に要る操作以外の編集・Bash・agent の起動の呼出を PreToolUse の guard が断る状態。 印は退避物の書き込み・立て直し・閾値未満の計測の 3 周で可逆な move で外れる (設計 docs/design/seat-autonomy.md §15)。
