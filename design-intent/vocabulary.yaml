    definition: 歯が差し替え口に据える偽物 (ADR-0062・proposed)。 撃たれた program と引数を覚えて歯が決めた結果を返し (spawn の終端は失敗だけ)、 site が差し替え口を通ることと結果の読みを測る。 据えた歯の thread の外へは効かない。
