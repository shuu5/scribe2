  - canonical: 実装役の箱
    domain: consumer
    aliases: [runner box]
    definition: 便の runner を起こす封じ込めの箱。 上限は 1 × gate.job_memory_mb で、 溢れた周は便を理由付きで終端し新しい便で起こし直す (ADR-0021 §2.2・ADR-0040)。
    relationships: [封じ込めの箱, 箱の上限の 2 種, runner, 起こし直し]
  - canonical: 検証行の箱
    domain: consumer
    aliases: [verify-line box]
    definition: gate と main 実測の共通の検証行を起こす封じ込めの箱。 上限は HostReserve のまま (ADR-0040 では変えない)。 受付が base の木で撃つ契約の検証行も gate の契約の検証行と同じ閉じ込めの 1 関数と箱で撃ち、 並列の枠の受付札は取らない (ADR-0059・accepted)。
    relationships: [封じ込めの箱, 箱の上限の 2 種, 共通 verify, gate, 契約の検証行, base の木]
  - canonical: 役割の口座
