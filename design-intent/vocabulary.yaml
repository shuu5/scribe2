    relationships: [台帳, 起票の門, effect, 発話 event, 裁定の行, 4 象限, 起動の列, 質問 record, asked, 後付けの結び, 答えの口, 案件]
  - canonical: effect
    domain: consumer
    definition: 台帳の問いの metadata の key。 答えを文書へ写すべき問い (document) か、 答えが操作で済む問い (operation) かの閉じた 2 値 (SRS FR81)。 未反映の裁定は document の問いだけを数える (SRS FR84)。
    relationships: [台帳の問い, 未反映の裁定]
  - canonical: 発話 event
    domain: consumer
    aliases: [utterance event]
    definition: user が器を導入した repo の対話の session へ打った prompt を model に読まれる前に逐語のまま残す event、 または裁定面の答えを答えの口が受けて残す event (kind UtteranceReceived・actor = human・発話を指す値は器が発話ごとに一意に振る ts で同じ秒の発話は秒より下の桁で分ける・発話の経路を全部が持ち、 対話の session の行は session も持つ・SRS FR82・ADR-0083・ADR-0087)。 記録の範囲は開いた問いの有無に依らない全 prompt (裁定 2026-09-28T09:04Z)。 器が入力欄へ差し込んだ行 (雛形の合図) と message の包みは残さない。 使い道と逐語を運ばない先は SRS FR65 が持ち (裁定の行の写し元・計測の分類・仕分け済みかの判定・問いの起票との前後の比べ・局面の出力の発話の部品・席が ts を名指して 1 件を読む口)、 人由来の event の数えには入れない (SRS FR22)。 状態の欄を持たず、 席の指示文にも復元にも運ばない。
    relationships: [裁定 event, 裁定の行, 台帳の問い, 雛形の合図, message の包み, 直命の表, 対話面, 仕分け, 仕分けの event, 未仕分けの発話, 発話の経路, 答えの口]
    flagged_ambiguities: ["発話 (発話 event・SRS FR82) と発言 (直命・直命の表の語・ADR-0045 で廃止した表の中身) は別。 発話 event は直命の表の復活ではない (SRS FR65・ADR-0083)"]
  - canonical: 裁定の行
    domain: consumer
    aliases: [ruling line]
    definition: 台帳の問いの notes に器の口 (seat ruling bind と答えの口) だけが書く 1 行 (裁定 id・問い・発話の ts・発話の経路・逐語の順の 5 欄・逐語は発話 event から写して最後の欄に置く・SRS FR82・ADR-0087)。 4 欄の既存の行は発話の経路を対話の session と読む。 席が notes に裁定の行を足す書きは起票の門が断る (SRS FR81)。 器を導入した別の repo の台帳は同じ形の行を自分の経路で書き (batch:… と policy:… の形の裁定 id を持ちうる)、 裁定 id の欄と別の束の欄を持ちうる。 batch:… と policy:… の形の引用は裁定 id の欄か束の欄に解け、 問い id の形は裁定 id の欄だけに解ける (SRS FR83・ADR-0083)。 器の口が書く行は束の欄を持たない。
