  - canonical: 過剰設計 5 観点
    domain: consumer
    aliases: [過剰設計の 5 観点, five overdesign findings]
    definition: lens の findings の閉じた category のうち過剰設計を指す 5 つ (delete / stdlib / native / yagni / shrink)。 宣言順に 0 件も書き、 欠けた周と母集団 0 の周は INCONCLUSIVE (設計 docs/design/pipeline.md §17・台帳 s2-07l.188)。 憲法 C17 の機械の面の 1 つで、 観点と決定はしごの段は 1 対 1 ではない。
    relationships: [lens, 決定はしご, 便の規模の record, Verdict]
  - canonical: 便の規模の record
    domain: consumer
    aliases: [run size record]
    definition: 便の diff の規模 (size / files / lines / pub_symbols) を閾値なしで残す record (台帳 s2-07l.189)。 憲法 C17 の機械の面の 1 つで、 拒む門ではなく検出線の側に在る。
    relationships: [便, 決定はしご, 過剰設計 5 観点, 検出線]
  - canonical: 憲法の生成 file
    domain: consumer
    aliases: [constitution generated file, 生成区間の移り先]
    definition: 憲法の規範文の生成区間 (constitution.html の機械層から gen-claude-md が抽出した規範文・印で囲む) の置き場となる tracked な生成 file 1 枚 (docs/constitution.md)。 正本は constitution.html で、 drift は xtask check の claude-md-constitution が測る。 CLAUDE.md はこの file を名指す pointer 1 行だけを残し、 席の指示文が憲法から運ぶのは順位と Ask-first / Never の pointer 行だけ、 C 条文は CI の門と PreToolUse の guard が執行する (ADR-0046・適用は scribe2 自身の repo に限る)。
    relationships: [席の指示文, 規範の印, rules 行, 対話面]
  - canonical: orchestrator
    domain: consumer
    aliases: [orchestrator seat, orchestrator の席]
    definition: 席の唯一の役割 (ADR-0045・proposed)。 user と話し承認と裁定を受け取る対話面の席 (R-C7-1 の値) で、 契約・設計・落ちる歯 (実行できる acceptance・tests/ に限った edit-code) を書き、 実装はせず便の起動・着地・merge は dispatcher に任せる。 前の名は planner で、 管理席は無い。 権能は rules 行 role.orchestrator が持つ。
    relationships: [対話面, 席, dispatcher, 権能, 台帳, planner]
  - canonical: path 種別
    domain: consumer
    aliases: [PathKind, path kind]
    definition: 編集先の file を分ける閉じた enum (列挙は core が持ち文書は写さない・ADR-0013 §2.1)。 種別ごとに要る権能が 1 つ対応し、 編集面の guard が照合する (SRS FR41 / FR45・ADR-0022 §2.3)。 分類は anchor からの相対 path の prefix だけで決め、 字面の語彙では判定しない。 種別に属する path の集合は対象 repo が vessel 宣言の任意 key で名乗り、 書かない repo は器の既定で分類する (ADR-0047・proposed)。 宣言 file 自身は常に code の種別で、 不正な宣言の周は fail-closed で全 file を code として扱う。
    relationships: [権能, vessel 宣言, 任意 key, 席, anchor]
  - canonical: 任意 key
    domain: consumer
    aliases: [optional key]
    definition: vessel 宣言の key のうち書かなくてよいもの。 「無い」は key の不在で表し (書いた空配列は不備・ADR-0010 §2.1)、 書かない宣言は器の既定で動く。 未知の key は読み口が断るので、 任意 key を足す便は読み口の key の列も同時に広げる。
    relationships: [vessel 宣言, path 種別, 検出線, 共通 verify]
  - canonical: 起動の権能
    domain: consumer
    aliases: [launch]
    definition: 便を起こす側の口 (受付・起動・再開・退役) (退役は名指しでない形・名指しの退役は ADR-0097 で決着の権能へ移る) に結ばれた権能。 ADR-0045 §2 (1) の後は席の rules 行に無く dispatcher の口ゆえ、 どの席からも撃てない。 便 1 本を終端へ倒す口は ADR-0048 で停止の権能へ移る (proposed)。
    relationships: [権能, dispatcher, 便, orchestrator]
  - canonical: 停止の権能
    domain: consumer
    aliases: [stop]
    definition: 走っている便 1 本を終端 Stopped へ倒す操作の権能 (ADR-0048・proposed)。 rules 行 role.orchestrator が持ち、 席が撃てるのは便を名指す形だけで、 生きている席を全部止める形と名指しを読めない呼び出しは起動の権能のまま (fail-closed) ＝どの席からも撃てない。
    relationships: [権能, 起動の権能, live な便, orchestrator, guard, 決着の権能, 名指しの窓]
  - canonical: 決着の権能
    domain: consumer
    aliases: [settle]
    definition: 止まった終端を閉じる 2 つの口 (終端だけの撃ち直し pipe land --terminal-only と pipe retire) を、 便 1 本を名指す窓の形に限って結んだ権能 (ADR-0097)。 rules 行 role.orchestrator が持つ。 窓から外れた呼び出しは、 撃ち直しの口は merge、 退役の口は launch を要る。
    relationships: [権能, 停止の権能, 起動の権能, 名指しの窓, 止まった終端, orchestrator]
    flagged_ambiguities: [dispatch の列外の理由 settled (終端に着いた便の契約を列に戻さない印) とは別。 settled は便の状態、 決着の権能は席の許可]
  - canonical: 名指しの窓
    domain: consumer
    aliases: [named window]
    definition: 権能 guard が器の口の 2 語の後ろから command 行の末尾までを読む範囲のうち、 --run・--state-dir・--repo・--rules とその値の対だけから成り --run がちょうど 1 回で、 値が - で始まらず shell の字を含まない形 (ADR-0048・ADR-0097)。 終端だけの撃ち直しの窓は加えて --terminal-only をちょうど 1 回持ち、 退役の窓は畳むだけの指定 --fold-only を 0 か 1 回持てる。 決着の権能の窓は --rules を持たず、 --state-dir と --repo の値は hook が解いた置き場と anchor と同じ字に限る。 停止の権能と決着の権能はこの形の呼び出しにだけ結ぶ。
    relationships: [停止の権能, 決着の権能, guard]
  - canonical: 止まった終端
    domain: consumer
    aliases: [stalled terminal]
    definition: 着地は済んだのに land の終端が契約を閉じられずに止まった便の終わり (CI の失敗・CI の結果が無い・push の失敗・close の失敗・宣言を読めない) と、 PR で着地して merge の後の照合を待つ便 (ADR-0097)。 終端だけの撃ち直しか退役の口で閉じる。
    relationships: [land の終端, PR で着地した便, 決着の権能, 着地の形]
  - canonical: project の群
    domain: consumer
    aliases: [project group, 群, かたまり]
    definition: 席の口座を持つ単位 (ADR-0049・proposed)。 名・置き場 (anchor) の列・候補の口座 label の順の列を host の面の表 1 つが宣言し、 群の中の席はどの置き場からでも同じ口座に居る。 置き場が project ごとに分かれていても同じ群に入れられる。 役割は 1 つになったので (ADR-0045)、 役割は単位として働かない。 群の表の Tier1〜Tier8 の行が宣言する (Tier9 の行は park の区画で群でない・SRS FR38・FR95)。
    relationships: [host の面, 群の今の口座, 便用の除外, 席, 口座選定, 役割の口座]
  - canonical: 群の今の口座
    domain: consumer
    aliases: [group effective account]
    definition: その群の席がいま実際に使っている口座 (ADR-0049)。 群は群の表の Tier1〜Tier8 の行で、 park の区画は持たない (ADR-0091)。 器が host の根に書く実効値で、 群ごとに高々 1 件。 宣言の候補の列 (人が書く宣言値) とは file も型も別で、 記録が無い周は種 (宣言順で前の群の種でない最初の候補・ADR-0069) になる (憲法 C10)。 記録が在るのに読めない周は typed に止まる。
    relationships: [project の群, host の根, 便用の除外, 実効の口座, 実効の記録, 口座選定, 群の予約]
  - canonical: 群の予約
    domain: consumer
    aliases: [group reservation, next]
    definition: 群ごとに周ごと導出する、 その群が次に移る口座 (ADR-0069・ADR-0074・SRS FR38)。 移り先の候補を残量の鍵 (7 日窓と役割の model の 7 日窓の残量の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順) で並べ、 群を宣言順に見て、 どの群の今の口座でもなく先の群の予約でもない先頭。 ADR-0074 で予約を持つのはその周に逼迫している群だけ (逼迫していない先の群は候補を測らず予約も持たない)。 記録せず lock の内側で導出し、 他の群の移動と予約を排他するが便の起動は排他しない。 doctor の群の行の next= の値。
    forbidden: [reserved file]
    relationships: [群の今の口座, project の群, 口座選定, 口座残量, 管理 tick, 残量の鍵]
  - canonical: 残量の鍵
    domain: consumer
    definition: 群の移り先の候補を並べる比較の値の組 (SRS FR38・ADR-0069)。 7 日窓と役割の model の 7 日窓の残量 (100 − 使用率) の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順。 役割の model の行が無い口座は最後。 5 時間窓は門にだけ効く。 便用の並べ順 (ADR-0042) とは別の関数。
    # forbidden から外した語（凍った決定記録の本文が使い、folio validate は全文の部分一致で数えるので外す・新しい文では使わない）: 並べ鍵・sort key
    relationships: [群の予約, 口座残量, 役割の model, 口座選定]
  - canonical: 役割の model
    domain: consumer
    definition: 席の役割ごとに rules 行 seat.model.<役割> が宣言する model (値は rules 行が持つ)。 残量の鍵 (ADR-0069) と逼迫の門 (ADR-0075) はこの model のモデル別 7 日窓だけを見る。
    relationships: [残量の鍵, 役割, 口座残量, 群の逼迫]
  - canonical: 便用の除外
    domain: consumer
    aliases: [run-purpose exclusion]
    definition: 便用の口座選定の候補から、 便の置き場 (anchor) の席の登録 row が持つ口座と、 宣言されたすべての群の候補の口座を外すこと (ADR-0049・proposed)。 次の選定から効き、 走行中の便は止めない。 便用の並べ順と 1 口座あたりの上限を置かないこと (ADR-0027 / ADR-0042) は変えない。
    relationships: [口座選定, project の群, 席の登録 row, 便, 退役]
  - canonical: 常設の承認
    domain: consumer
    aliases: [standing approval]
    definition: 憲法 A1 の「使う」に当たる操作のうち、 宣言そのものを user の承認と見なし、 以後の 1 回ごとは承認の event を記すだけで足りるとする形 (ADR-0049・proposed)。 群の宣言 (候補の口座の列) がこの形をとる。
    relationships: [承認 event, 対話面, project の群, 裁定 id]
  - canonical: 機械の復帰
    domain: consumer
    aliases: [mechanical resumption]
    definition: 席を起こし直した周に、 台帳の行と git の現在地と圧縮の直前の 1 枠だけから直前の流れを組んで session の開始で出す道 (ADR-0049)。 対話の記録の file は運ばない (複写しない・器は読まない)。 ADR-0067 の後は、 起こし直しが状態の打刻の最終行の会話 id を起動行の末尾に --resume で運ぶが、 復帰の道はこの 1 本のまま (--resume は claude が会話を開く口)。 圧縮・群の移動・異常終了の 3 つが同じ 1 本を通る。 ADR-0088 の後は、 局面の出力が持つ席の手番の閾値越えの件数と最古の 1 件も直近の流れの事実行に加わる (SRS FR42)。
    relationships: [席の指示文, 台帳, project の群, 席の起動, 局面の出力]
  - canonical: 硬い資源
    domain: consumer
    aliases: [hard resource]
    definition: 枯渇したときに host そのものを止めうる資源 (ADR-0050・proposed)。 memory と CPU の core と、 器が host に頼む scope の作成の 3 つ。 足りなくなっても遅くなるだけの資源と違い、 受付が枠を取って守る。
    relationships: [並列の枠, 受付札, 封じ込め, 器の健康の遮断器, job 1 つの値段]
  - canonical: job 1 つの値段
    domain: consumer
    aliases: [per-job thread price]
    definition: 変異検査の job 1 つが使う test の thread 本数 (ADR-0050・proposed)。 実測の core 数を rules 行 gate.mutants_jobs で割った値 (1 の床) を器の pure 関数 1 本が出す実効値で、 受付の枠の core の項の分母になり、 受け付けた枠が実効 jobs と対で行へ運ぶ。 ADR-0095 の後は、 受付を通らない便の箱と席の箱の CPU の上限の幅にもなり、 core 数は core 数の読み口の 1 本で測る。
    relationships: [実効 jobs, 並列の枠, 硬い資源, 受付札, 箱の CPU の上限, core 数の読み口]
  - canonical: 器の健康の遮断器
    domain: consumer
    aliases: [host health circuit breaker]
    definition: verify の行を撃つ前に走行可能な process と待ちの process を読み、 閾値と比べて空いている / 混んでいる / 測れないの 3 値を返す境界 (ADR-0050・proposed)。 混んだ周は待ち、 待ち切れなかった周は行を撃たず INCONCLUSIVE に倒す。 行為を止めうるので極性一覧に載る guard。 受付が base の木で撃つ契約の検証行も 1 行ごとにこれを通り、 閉じた行とそれ以後の行は「測れない」に写る (ADR-0059・accepted)。
    relationships: [極性一覧, guard, 硬い資源, 走行可能な process, 待ちの process, core あたりの倍率, base の木]
  - canonical: 走行可能な process
    domain: consumer
    aliases: [runnable process]
    definition: CPU を待っているか実際に走っている process (ADR-0050・proposed)。 器は host の面の走行可能を運ぶ欄の分子から読む (総 process 数を運ぶ分母と取り違えない)。 遮断器はこの数を閾値と比べる。
    relationships: [器の健康の遮断器, core あたりの倍率, 待ちの process]
  - canonical: 待ちの process
    domain: consumer
    aliases: [blocked process]
    definition: 割り込めない待ち (D 状態) に入った process (ADR-0050・proposed)。 器は host の面の待ちを運ぶ行から読む。 走行可能の山と対で host を止める面で、 遮断器はどちらか一方が閾値を超えれば混んでいると判ずる。
    relationships: [器の健康の遮断器, core あたりの倍率, 走行可能な process]
  - canonical: core あたりの倍率
    domain: consumer
    aliases: [per-core multiplier]
    definition: 遮断器の閾値を組み立てる Int の rules 行 2 本 (host.runnable_per_core / host.blocked_per_core・ADR-0050・proposed)。 閾値は倍率 × 実測の core 数で、 絶対値を tracked の manifest に焼かないので core 数の違う host でも同じ意味を持つ。
    relationships: [rules 行, 裁定 id, 器の健康の遮断器, 走行可能な process, 待ちの process]
  - canonical: 契約の歯の穴
    domain: consumer
    aliases: [contract-teeth hole]
    definition: 宣言 file の検出線の行に置く 4 つ目の穴 {teeth} (ADR-0052・proposed)。 器が契約の verify 行から導いた歯の名の列で埋め、 道具は受けた語をそのまま filter に使う。 語が無い周は空を表す閉じた 1 語で埋める。
    relationships: [検出線, 実効 jobs, 検出の母集団, filter の式]
  - canonical: 検出の母集団
    domain: consumer
    aliases: [detection population]
    definition: mutant ごとに走らせる歯の集合 (ADR-0052・proposed)。 package の lib の歯と bin の歯と、 契約が名指した歯。 この集合が捕まえない mutant が変異の生存として記録される (C12.4・R-C12-1)。
    relationships: [検出線, 契約の歯の穴, 歯]
  - canonical: filter の式
    domain: consumer
    aliases: [filter expression]
    definition: nextest が持つ test の選び方 (ADR-0052・proposed)。 歯の種類 (lib / bin / 統合) と名の正規表現を和で組め、 道具はこれで「単体の歯は全部・e2e の歯は名指した分だけ」を 1 行に表す。
    relationships: [検出の母集団, 契約の歯の穴]
  - canonical: 判断の置き場
    domain: consumer
    aliases: [decision placement]
    definition: 便が受付から着地まで通る判断 1 つずつについて、 計算できるなら code、 意味の判断なら lens (LLM)、 裁定なら人、 と決めた割り当て (ADR-0053・proposed)。 分解表が 19 本の判断に付けた。
    relationships: [lens, 裁定 id, 約束の行, shadow 計測]
  - canonical: shadow 計測
    domain: consumer
    aliases: [shadow measurement]
    definition: 判定 API や規則を pipeline の判断に挿さずに、 同じ入力で答えを出して記録だけ残し、 後から機械で取った正解と突き合わせて一致率と較正を測ること (ADR-0053・proposed)。 Jev の再検討はこの測り方で N ≥ 30 を集めてから行う。
    relationships: [判断の置き場, 検出線, 検出の母集団]
  - canonical: 測らない名乗り
    domain: consumer
    aliases: [declared unmeasured]
    definition: 対象 repo の宣言 file が任意の項目で「入口の flip は測らない」と名乗ること (ADR-0054)。 受付と契約表の検査は、 この名乗りが在る宣言だけを入口の行の欠けで断らず、 判定行に測らなかったことを残す。 ADR-0059 (accepted) の後は名乗りの語 3 つのうちの unmeasured で、 base の木を用意せず何も撃たない
    relationships: [vessel 宣言, flip check, 宣言の任意 key, 名乗りの語]
  - canonical: 宣言の任意 key
    domain: consumer
    aliases: [optional declaration key]
    definition: 対象 repo の宣言 file の key のうち、 無ければ現行の値で動き、 在れば器がその値を読む key (ADR-0047 の path の種別 3 本・ADR-0054 の entrance-flip)。 未知の key は読みの誤りとして断る。 entrance-flip の値は名乗りの語の閉じた 3 語 (ADR-0059・accepted)
    relationships: [vessel 宣言, 測らない名乗り, 名乗りの語]
  - canonical: 名乗りの語
    domain: consumer
    aliases: [declared word]
    definition: 宣言の任意 key entrance-flip の値で、 unmeasured (測らない)・detect (記す)・deny (止める) の閉じた 3 語 (ADR-0059・accepted・ADR-0054 の 1 語を広げた)。 3 語とも入口の行の欠けで断られず、 入口の flip の行との同居は矛盾として断られる。 detect と deny は受付に base の木で nextest の検証行を撃たせ、 deny は base で緑の行か測れない行が在る契約を受付で断らせる。 他の語・空・配列は読みの誤り
    relationships: [宣言の任意 key, 測らない名乗り, 受付, base で緑の行, 入口の RED]
  - canonical: 入口の RED
    domain: consumer
    aliases: [entrance RED]
    definition: 契約の検証行を base の木で撃つと「不在」か「落ちた」に写ること (base で緑でも測れないでもないこと・ADR-0059・accepted)。 台帳の規則「検証は base で RED になる歯」の機械の形で、 本 repo では flip check が、 detect か deny を名乗った消費側では受付が測る
    relationships: [flip check, base の木, base で緑の行, 名乗りの語, 歯]
  - canonical: base の木
    domain: consumer
    aliases: [base tree]
    definition: 受付と preflight が材料の読みの前に読んだ対象 repo の HEAD の sha を、 state dir の一時 dir に detach した worktree として checkout した作業木 (ADR-0059・accepted)。 detect か deny を名乗った契約の nextest の検証行を撃ち終えたら片付ける。 便の base (spawn が HEAD を読み直して決める) とは違いうる
    relationships: [受付, 入口の RED, base で緑の行, 名乗りの語]
  - canonical: base で緑の行
    domain: consumer
    aliases: [green-on-base line]
    definition: 契約の nextest の検証行のうち base の木で撃って rc 0 になった行 (ADR-0059・accepted)。 該当の歯が無い行 (不在)・落ちた行・撃たなかった行と rc から歯の有無を弁別できない行 (測れない) は含めない。 受付の 1 行と preflight の行の entrance=green-on-base の欄がこの行の本数と検証行の全本数を出し、 deny の名乗りでは 1 本以上で契約が断られる
    relationships: [入口の RED, base の木, 名乗りの語, 受付, 判定行]
  - canonical: 契約の検証行
    domain: consumer
    aliases: [contract verify line, verify 行]
    definition: 契約が持つ、 歯を撃つ command の 1 行 (契約表の行の verify の要素)。 gate は便の木で撃ち、 detect か deny を名乗った契約の受付は nextest の行だけを base の木でも撃つ (ADR-0059・accepted)。 vessel 宣言の共通 verify は含まない。 クラスの導出の入力はこの行だけ (ADR-0061・proposed)
    relationships: [契約表, 共通 verify, gate, 受付, base で緑の行, 入口の RED, クラスの導出]
    flagged_ambiguities: [既存の定義の「契約 verify」「契約の verify」は同じ行を指す, ADR-0061 の glossary の「verify 行」も同じ行を指す]
  - canonical: 消費側
    domain: consumer
    aliases: [consumer repo]
    definition: 本 repo 以外で、 scribe2 の binary を導入して自分の vessel 宣言と契約で便を回す repo (ADR-0054・ADR-0059・accepted)。 本 repo の xtask を持たず、 入口の RED を測るかは宣言の名乗りの語で選ぶ
    relationships: [vessel 宣言, 名乗りの語, 導入先, 入口の RED]
    flagged_ambiguities: [導入先は plugin と binary を積んだ場所 (install 帳簿と席の anchor) の集合で doctor が数える面、 消費側は宣言と契約で便を回す repo の役割の面]
  - canonical: 群の逼迫
    domain: consumer
    aliases: [group pressure]
    definition: 群の今の口座か群の席が居る口座の使用率が、 5 時間窓・7 日窓・モデル別窓のいずれかで閾値の rules 行の値以上である状態 (ADR-0055・proposed)。 便の終端の周・席自身の hook・管理 tick の判定の周が既存の計測の 1 本で鮮度つきに読み、 timer では測らない。 ADR-0066 (proposed) の後は管理 tick も群ごとに鮮度の窓に 1 回まで読み、 移動の判定は群の段と tick が共有の 1 本 (群の移動の判定) を呼ぶ。 ADR-0075 の後は、 モデル別窓は群の席の役割の model の窓だけを数える (5 時間窓と 7 日窓は全部・管理 tick の口座の門は自席の役割の model の窓)。
    relationships: [project の群, 群の今の口座, 便の終端の周, 移動を頼む記録, 退避の合図, rules 行, 役割の model]
  - canonical: 便の終端の周
    domain: consumer
    aliases: [run-end round]
    definition: 便が live で無くなった直後・手動・印の直後に撃たれる dispatch の 1 周 (設計 docs/design/dispatcher.md §5)。 ADR-0055 (proposed) はこの周に群の逼迫の段 (通知と移動) を置く。 時計では撃たれない。 ADR-0066 (proposed) の後も群の段は残り、 判定は管理 tick と共有の 1 本 (群の移動の判定) を同じ lock の内側で呼ぶ。 この周を timer で撃たない線は保つ。
    relationships: [群の逼迫, 管理 tick, 便]
  - canonical: 移動を頼む記録
    domain: consumer
    aliases: [move request record]
    definition: 席自身の hook が群の逼迫を読んだ周に host の根へ置く群ごとに高々 1 件の記録 (ADR-0055・proposed)。 席は自分を起こし直さず、 次の便の終端の周がこれを読んで鮮度に依らず計測し移動を判定する。 ADR-0066 (proposed) の後は次の管理 tick の判定の周も同じ 1 本で拾う (便の無い host で永久に待たない)。
    relationships: [群の逼迫, 便の終端の周, host の根, 群の今の口座]
  - canonical: 群の移動の判定
    domain: consumer
    aliases: [group move judgement]
    definition: 測る集合を取り、 計測し、 群の今の口座の逼迫を読み、 移り先を候補の順で 1 回決め、 群の今の口座の記録と承認 event (候補なしなら断りの event) を書き、 移動を頼む記録を履歴へ移す 1 本の関数 (ADR-0066・proposed・移り先の 3 条件と記録の形は ADR-0049・出力は閉じた 3 値)。 dispatch の 1 周の群の段と管理 tick が host の lock の内側で同じ 1 本を呼び、 契機ごとに判定を写さない (憲法 C2)。 退避の合図・起こし直し・席の pane への行は持たず、 他の置き場の席に触らない。
    relationships: [群の逼迫, 群の今の口座, 群の段, 管理 tick, 判定の打刻, 移動を頼む記録, 便の終端の周]
  - canonical: 判定の打刻
    domain: consumer
    aliases: [judgement stamp]
    definition: host の根の群用 dir に群ごとに 1 file (<群>.judged・ts の 1 行) で持つ、 最後に群の移動の判定を撃った UTC 秒 (ADR-0066・proposed)。 管理 tick はこれと鮮度の rules 行 (fleet.usage_fresh_s) を比べて判定を撃つかを決め、 撃った周に今の ts で書く。 rules 行は足さない。
    relationships: [群の移動の判定, 管理 tick, host の根, rules 行]
  - canonical: 群の段
    domain: consumer
    aliases: [group stage]
    definition: dispatch の 1 周の頭で走る、 群ごとの計測・通知・移動・起こし直しの続きの段 (設計 docs/design/account-lifecycle.md §19 / §20・ADR-0055)。 host の lock の内側で走り、 便の列の rc を変えない。 ADR-0066 (proposed) の後は判定を自分で持たず群の移動の判定の 1 本を呼び、 退避の合図・起こし直し・保留の event・席の pane への行は自分の置き場の席に今まで通り撃つ。
