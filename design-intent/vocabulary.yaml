# scribe2 canonical vocabulary (P-5: 1 entity = 1 canonical name)
#
# edit-SSoT: 本 file (Layer 1 consumer は flip しないため vocabulary.yaml が編集の正本、 folio ADR-0051 §2.3)。
# 出所: input/SPEC-excerpt.md §5 (OSS 依存) の用語を全件、 加えて §2 憲法 / §4 技術選定が使う概念を登録する。
#   §5 の owning spec (依存一覧の design-intent 文書) は未作成のため、 §5 由来の語は本 file が唯一の登録箇所。
# schema (folio rules §3): terms[] = { canonical (MUST), domain, definition (1 行), forbidden[], relationships[], flagged_ambiguities[] }
#   - domain: consumer = scribe2 所有の語 (folio が解説しない)。
#   - definition は「語が何を指すか」の指示的定義 + 条 id の参照に限る。 義務文と数値は書かない (正本は憲法の条と §3 rules 行)。
#   - definition は単一行で、 生の < > を書かない (矢印は → で表現)。
#   - forbidden は folio validate の vocabulary gate (substring 検出) に使うため、 本文に正当に現れ得る語は載せない。
#   - canonical 表記は SPEC の日本語表記を正とし、 型名そのものが概念の場合は型名 (大文字始まり) を canonical にする。
#   - 「面」の family は 提示面 / 対話面 / drift の面 を個別に登録する (構成要素「面」は語彙にしない)。
terms:
  # ---------------------------------------------------------------- §5 見出し (manifest / doctor)
  - canonical: manifest
    domain: consumer
    definition: repo 内 1 file (TOML) に置く、 規則の値・設定・依存の版の唯一の置き場。 形式と読み方の規範は C1、 照合は doctor。
    forbidden: [マニフェスト]
    relationships: [rules 行, doctor, 裁定 id]
  - canonical: doctor
    domain: consumer
    definition: 全 host の版・口座・退役・rules 行を照合する 1 コマンド (C3.2)。 改訂前の selfdev sub-command (成熟条件の測定) は ADR-0003 で廃止。
    relationships: [manifest, fleet]
  # ---------------------------------------------------------------- §5 core 依存
  - canonical: tailscale
    domain: consumer
    definition: core 依存。 提示面を tailnet 越しに配信する基盤。 tailnet serve の skill は v1 から移植する。
    relationships: [tailnet serve, 提示面]
  - canonical: tailnet serve
    domain: consumer
    definition: tailscale の tailnet 上で HTML を配信する提示手段。 提示面の既定の配信経路。
    relationships: [tailscale, 提示面]
  - canonical: 提示面
    domain: consumer
    definition: 人間へ成果物 (HTML) を見せる面。 配信は tailnet serve。
    relationships: [tailnet serve]
  - canonical: beads
    domain: consumer
    definition: issue と裁定を dolt backed の DB に持つ外部 OSS の issue tracker。 v2 の台帳の実体で、 bd 経由 (adapter) でのみ触る。
    relationships: [bd, adapter, 台帳, dolt push]
  - canonical: bd
    domain: consumer
    definition: beads の CLI。 v2 が台帳を読む唯一の口で、 JSON 出力を adapter で包んで使う。
    relationships: [beads, adapter]
  - canonical: 台帳
    domain: consumer
    definition: 作業 (issue) と裁定の記録。 実体は beads で、 v2 は自前の台帳を持たない。
    forbidden: [レジャー]
    relationships: [beads, bd, 台帳 adapter]
  - canonical: dolt push
    domain: consumer
    definition: beads の共有 DB (dolt) を remote へ同期する操作。 orchestrator の席が session の終端で 1 回行う (管理席と admin lane は ADR-0045 で廃止)。
    relationships: [beads, orchestrator, admin lane]
  - canonical: git
    domain: consumer
    definition: core 依存。 成果の保存と統合の基盤。 v2 からは glue の 1 つとして adapter 経由で叩く。
    relationships: [glue, adapter]
  - canonical: tmux
    domain: consumer
    definition: core 依存。 席 (session) を載せる terminal multiplexer。 server 名の導出規則は C2.2。
    relationships: [席, NAME 定数, glue]
  - canonical: ssh
    domain: consumer
    definition: glue の 1 つ。 他 host の席や状態へ到達する経路で、 adapter 経由で叩く。
    relationships: [glue, adapter]
  - canonical: claude CLI
    domain: consumer
    definition: core 依存。 Claude Code の CLI。 席の実体 (AI session) を起動する glue の 1 つ。
    relationships: [席, glue]
  # ---------------------------------------------------------------- §5 day-1 optional adapter
  - canonical: day-1 optional adapter
    domain: consumer
    definition: seam だけを最初から用意し、 採否を K 指標で決める外部依存の枠。 rtk と graphify が該当する。 依存の追加は A3 の対象。
    relationships: [rtk, graphify, seam, K 指標]
  - canonical: rtk
    domain: consumer
    definition: tool 出力を圧縮する hook policy の 1 項目 (day-1 optional adapter)。 v1 実測の方針「一律 arm しない」を継承し、 機械経路には挟まない (v1 の実測は本 repo へ持ち越していない・SPIKE-tooling-report.md 冒頭)。
    relationships: [day-1 optional adapter]
  - canonical: graphify
    domain: consumer
    definition: land ごとに知識グラフを生成して context を供給する候補 (day-1 optional adapter)。 v1 では micro-bench のみ (v1 の実測は本 repo へ持ち越していない・SPIKE-tooling-report.md 冒頭)。
    relationships: [day-1 optional adapter, land]
  - canonical: K 指標
    domain: consumer
    definition: 器の成熟と運用の健全さを測る指標群 (K1〜K3)。 閾値は rules 行。 成熟条件と day-1 optional adapter の採否判断に使う。
    relationships: [rules 行, 成熟条件, day-1 optional adapter]
  - canonical: land
    domain: consumer
    definition: worker の成果を統合して着地させる操作 (merge)。 MVP では worktree の tree を squash 1 commit で main に載せ、 main で歯を再実走する (SRS FR11)。 graphify は land ごとに走る。 crate の land module が担う。
    relationships: [graphify, 便, gate, verdict export, land の終端]
  - canonical: verdict export
    domain: consumer
    definition: land ごとの判定を schema 版付きで verdicts.jsonl に追記する面 (跨版の観測面・SRS FR12)。 次の版の器がこの記録を読む。
    relationships: [land, Verdict, 版 N+1]
  # ---------------------------------------------------------------- §4 技術選定が使う概念
  - canonical: glue
    domain: consumer
    definition: 外部 process (tmux / ssh / git / claude CLI) を叩く責務の領域で、 adapter が閉じ込める側。 ADR-0062 (proposed) の後は、 何を叩くかを起動の記述として組むのは core で、 実際に叩くのは境界 crate が持つ差し替え口の実物 1 つ。
    relationships: [adapter, tmux, ssh, git, claude CLI, 起動の記述, 差し替え口]
  - canonical: adapter
    domain: consumer
    definition: 外部 OSS や glue を閉じ込める実装層 (薄い wrapper)。 台帳は bd の wrapper 1 本、 glue は std::process の adapter (ADR-0062・proposed の後は差し替え口の実物 1 つ)、 day-1 optional adapter も同じ seam に置く。
    relationships: [bd, glue, seam, day-1 optional adapter, 差し替え口]
  - canonical: seam
    domain: consumer
    definition: 外部要素 (依存・設定) を差し込む接合点。 adapter の seam は day-1 に用意し、 env seam は新設しない (C2.2)。
    relationships: [adapter, day-1 optional adapter, manifest]
  - canonical: 単一 static binary
    domain: consumer
    definition: 依存を静的 link した実行 file 1 つ。 閉じた toolchain で drift の面を構造から消す (ADR-0001)。
    relationships: [drift の面]
  - canonical: drift の面
    domain: consumer
    definition: v1 で場当たり修正を招いた env 層 (venv / mypy-baseline / bats / host 差) の総称。 v2 は構造から消す (ADR-0001)。
    relationships: [単一 static binary]
  - canonical: 境界 crate
    domain: consumer
    definition: core の外側に置く crate (crates/<NAME>-boundary・binary もここが持つ)。 外部形式 (serde 等の derive) を扱う面 (C13.2) がここに閉じる。 core に依存し core からは見えない。 子 process (tmux / git / claude / curl / cargo / systemd / sh) を起こす I/O 面は ADR-0033 がここへ分けると置き、 ADR-0062 (proposed) の後は差し替え口の実物 1 つ (起動の記述を std の Command へ写して撃つ 1 file・boundary-spawn が 1 本に閉じる) を持って bin の main の先頭で据える。 行数の上限 R-C4-5 を持つ。
    relationships: [adapter, core, 単一 static binary, 差し替え口]
  - canonical: core
    domain: consumer
    definition: 器の本体の crate (crates/<NAME>・lib vessel)。 型・閉じた enum・判定の純関数・state dir と repo の file の読み書きを持つ。 src の本体で std の Command を組まない (xtask check の core-spawn・ADR-0033 の 0 本を ADR-0062 が本体で 0 と読む)。 ADR-0062 (proposed) の後は、 子 process を撃つ関数と driver の関数も core に残り、 起動の記述を組んで差し替え口へ渡して起こす。 行数の上限 R-C4-1 は src の本体 (in-file の歯を除く) だけを数える。
    relationships: [境界 crate, 単一 static binary, 歯, 起動の記述, 差し替え口]
  - canonical: docs-only
    domain: consumer
    definition: PR の分類の 1 つで、 変更が文書のみのもの。 flip check の test 差分要件から除外される (C12.3)。 分類は CI が行う。
    relationships: [flip check]
  # ---------------------------------------------------------------- §2 憲法が使う概念
  - canonical: 順位
    domain: consumer
    definition: 憲法の線どうしがぶつかったときの決め方 (場当たり修正の禁止 → 膨張防止 → compile 速度)。 条ではなく全条に先立ち、 条 id の連番を持たない (憲法 §1)。
  - canonical: rules 行
    domain: consumer
    definition: manifest に置く規則の値 1 行 (閾値・有効/無効・裁定 id・裁定時刻・逐語)。 数値の置き場 (C1) で、 変更の手続きは C5。
    forbidden: [規則行]
    relationships: [manifest, 裁定 id, 検出線]
  - canonical: 裁定 id
    domain: consumer
    definition: user 裁定を一意に指す id。 閉じた 3 形 (器の口 (seat ruling bind と答えの口) が発行する問い id の形・消費側の台帳が自分の経路で書く batch:… と policy:… で始まる形) を持ち、 台帳の問いの notes の裁定の行が持つ (SRS FR82・ADR-0083・ADR-0087)。 追跡された file の引用はこの 3 形で数え (問い id の形は問いの部分が repo の台帳の接頭辞で始まるものだけ・batch:… と policy:… の形と opt-in の線の後の時刻の形は vessel 宣言の ruling-fixtures の一覧に同じ字面が在れば数えない)、 batch:… と policy:… の形は台帳の裁定の行の裁定 id の欄か束の欄に解け、 opt-in の線より前の時刻の形 (user と UTC の分・ADR-0037 の裁定 event の ts) は数えるだけにする (SRS FR83・ADR-0083)。 rules 行の変更 (C5)、 閾値変更 (A2)、 憲法改訂 (N4) が要求する。 裁定面の記帳 id とは別。
    relationships: [rules 行, 対話面, 承認 event, 裁定 event, 裁定の行, 問い id の形, 時刻の形, opt-in の線, 判断の欄, 答えの口]
  - canonical: 裁定 event
    domain: consumer
    aliases: [RulingReceived]
    definition: 器の口 seat ruling bind か答えの口が台帳の問いと発話 event を結んだときに 1 件記帳する event の kind (actor = human・欄は SRS FR82・機械の key の名の正本は ADR-0087・ADR-0083)。 席の道具の呼び出しが逐語を渡して記帳する口 (ADR-0037 の seat ruling add) は持たない (ADR-0083 が ADR-0037 を部分 supersede・ADR-0087)。 便の不可逆操作の承認 (承認 event・ApprovalReceived) とは別の kind で、 到達点の計測では承認と同じ側に発話の経路ごとに数える (SRS FR22)。
    relationships: [裁定 id, 承認 event, 発話 event, 裁定の行, 台帳の問い, 対話面, rules 行, 答えの口, 発話の経路, asked]
  - canonical: RuleKind
    domain: consumer
    definition: 規則の種類を閉じた列挙で表す enum。 網羅 match 必須で、 未実装は compile error (C1)。
    relationships: [rules 行, Verdict]
  - canonical: Verdict
    domain: consumer
    definition: 規則の検査 (Rule::check) や gate が返す判定の型 (C1)。 gate の値は PASS / FAIL / INCONCLUSIVE の 3 値で、 構造化 field が一次 truth (SRS では値を小文字 verdict と書く)。
    relationships: [RuleKind, gate, 便, verdict export]
  - canonical: 席
    domain: consumer
    definition: 1 つの Claude Code session が占める作業単位。 役割の値は core が持つ閉じた enum (runner と lens は席ではない・ADR-0022 §2.1)。 状態は SeatState で運ぶ (C3.3)。
    forbidden: [シート]
    relationships: [fleet, 口座, lease, orchestrator, dispatcher]
  - canonical: 口座
    domain: consumer
    definition: Claude の利用枠 (subscription account)。 使い方の規範は C9、 状態は fleet の DB に host 列付きで持つ。
    # forbidden から外した語（凍った決定記録の本文が使い、folio validate は全文の部分一致で数えるので外す・新しい文では使わない）: アカウント
    relationships: [fleet, lane, 席]
  - canonical: fleet
    domain: consumer
    definition: 複数 host にまたがる席・口座・lease・退役の全体。 状態の持ち方は C3。 MVP では便と席の現在地の全体を指し、 実体は event log 1 file (SRS FR3)。
    relationships: [席, 口座, lease, doctor, event log]
  - canonical: event log
    domain: consumer
    definition: 1 行 1 出来事を追記する file。 fleet の現在地はこれを replay して導く (C3・SRS FR3)。 MVP の永続面で、 process の記憶に状態を持たない。
    relationships: [fleet, 便, 承認 event]
  - canonical: lease
    domain: consumer
    definition: 席が口座や host を占有する期限付きの割当。 fleet の状態の一部。
    relationships: [席, 口座, fleet]
    flagged_ambiguities: [受付札 (ADR-0021 の受付の印) は lease ではない]
  - canonical: 退役
    domain: consumer
    definition: host / 席 / 口座を運用から外す操作。 可逆 move で行う (N1)。 口座の退役は account retire (dir の mv + event) で、 復帰は account restore (ADR-0026 §2.2)。
    relationships: [fleet, doctor, 口座の登録]
  - canonical: host の manifest
    domain: consumer
    definition: manifest の host の面。 state dir の 1 file (host.toml) が host 固有の宣言値 (口座 label・席に積む plugin dir・起動引数) を持ち、 tracked の面と同じ loader が読む。 ADR-0064 (proposed) の後は tick の宣言の表 [[tick]] も持つ。 ADR-0076 の後は端末の表 [[device]] も持つ。 rules 行は置けない (C10.2 の読み・ADR-0026 §2.1)。
    # forbidden から外した語（凍った決定記録の本文が使い、folio validate は全文の部分一致で数えるので外す・新しい文では使わない）: 私用 manifest・overlay
    relationships: [manifest, state dir, 口座, 端末の表]
    flagged_ambiguities: [SRS の用語集では表示名を「host の面」とする (生成器は manifest を部分文字列に持つ用語を term-inline の曖昧化として拒む)。 同一 entity で正本は本 entry]
  - canonical: 端末の表
    domain: consumer
    aliases: [device table, "[[device]]"]
    definition: host の manifest の表で、 持ち主の端末 1 つにつき 1 行 (ADR-0076・ADR-0080)。 必須の欄は name (host の面で一意)・ssh (ssh の宛先)・chrome (端末の上の Chrome の path)・os (linux / macos / windows)、 任意の欄は display (X の画面の番号)・ime-env (KEY=VALUE の列)・profile-dir (専用の profile の dir)・display-env (画面を開くための KEY=VALUE の列・ime-env と同じ検査・display と同じ行には書けない)。 host の面にだけ置け、 読み手が形を行番号つきで検査し、 doctor は host の行に名の列だけを出す。 器は値を使わない (消費側の表示面が使う)。
    relationships: [host の manifest, doctor, state dir, 画面の env]
  - canonical: 画面の env
    domain: consumer
    aliases: [display env, display-env]
    definition: "端末の表の任意の欄 display-env の値で、 端末の上で Chrome の窓を画面に出すための環境変数の組 (例: Wayland の WAYLAND_DISPLAY と XDG_RUNTIME_DIR・ADR-0080)。 KEY=VALUE の文字列の列で、 ime-env と同じ 1 つの関数が形を検査する。 X の画面の番号 1 つを持つ欄 display とは別の欄で、 同じ行に両方は書けない (X の DISPLAY も display-env に書ける)。 器は値を使わない。"
    forbidden: [画面の番号の列]
    relationships: [端末の表, host の manifest]
  - canonical: 口座の登録
    domain: consumer
    definition: 器の subcommand account add が口座の設定 dir・席の前提の設定・host の manifest の宣言を揃え、 login 用の起動 command を user へ渡すこと (ADR-0026 §2.2)。 login は user の手番で、 器は credential に触れない。 trust の印は ADR-0065 (proposed) の後は席の起動が置く (account add は書かない)。
    relationships: [口座, host の manifest, 退役, doctor, trust の印]
  - canonical: trust の印
    domain: consumer
    aliases: [trust flag]
    definition: 口座の設定 dir の .claude.json に在る、 anchor ごとの「この folder を信じる」の記録 (projects の下のその anchor の hasTrustDialogAccepted・Claude Code の私有形式)。 true なら起動の trust dialog は出ない。 doctor は読むだけ (trust= の行)。 ADR-0065 (proposed) の後は席の起動の 1 本が起動行の前に true に置く (書く相手は今起こす口座 × 今の anchor の 1 組・credential と settings は触らない)。
    relationships: [口座, anchor, 席の起動, 口座の登録, doctor]
  - canonical: 席の起動
    domain: consumer
    definition: 器の subcommand seat launch が役割 (必須) と口座 (指定か session 用の選定) から起動行を導出し、 席の登録を先に書いて tmux の窓の shell へ差し込むこと (ADR-0026 §2.3)。 立て直しと同じ経路で、 器の subcommand 以外の起動経路を使わない。 ADR-0063 (proposed) の後は、 引数の無い形が置き場 (repo の local 設定)・役割 (orchestrator)・target (repo の dir 名)・口座 (群の今の口座か選定) を既定から解く。 ADR-0064 (proposed) の後は、 席を立てた周に tick の宣言が在れば tick の unit の install を面の値で撃ち、 結果を起動の 1 行の末尾に足す (断りは起動の rc を変えない)。 ADR-0065 (proposed) の後は、 登録を書いた後・起動行を差し込む前に、 選んだ口座の設定 dir の .claude.json に anchor の trust の印を置く (結果は閉じた言葉で 1 行の末尾に添え、 起動は止めない)。 ADR-0072 で起動行の頭に席の箱が付く (行が 0 / 読めない周と道具の無い host は素の行)。
    # forbidden から外した語（folio validate は全文の部分一致で数えるので、claude や class の字にも当たる・新しい文では使わない）: cla
    forbidden: [cld, wrapper 起動]
    relationships: [席, 席の登録, 起動行の導出, 口座]
  - canonical: 起動行の導出
    domain: consumer
    definition: "席の起動行を pure な関数 1 本が組むこと: 口座の設定 dir と agent view を切る env・器自身の plugin (anchor)・host の manifest の plugin dir と起動引数。 穴は口座の dir 1 つで、 雛形 file は読まない (ADR-0026 §2.3)。 役割なしの起動 (SRS FR60・ADR-0028 §2.5) は同じ関数から役割・席の登録・権能の 3 要素を除いた形。 1 つ目の plugin の枠は anchor の下の生成 dir で、 消費側の anchor ではその project の plugin の置き場になり、 版を跨いで保つ (ADR-0082)。"
    relationships: [席の起動, host の manifest, 役割なしの起動]
  - canonical: 役割なしの起動
    domain: consumer
    definition: 器の subcommand account shell が口座 label (必須) から役割を持たない対話 session の起動行を導出し、 窓が与えられれば差し込み、 与えられなければ 1 行を出すこと (SRS FR60・ADR-0028 §2.5)。 席の登録は書かず権能は無い。 前の版の口座切替 wrapper の後継。
    # forbidden から外した語（folio validate は全文の部分一致で数えるので、claude や class の字にも当たる・新しい文では使わない）: cla
    forbidden: [wrapper 起動, 素起動]
    relationships: [席の起動, 起動行の導出, 口座, 席の登録]
  - canonical: 導入先
    domain: consumer
    definition: 本 repo 以外で器の plugin (hook の配線) と binary を積む project とその worktree (SRS FR61)。 母集団は口座の設定 dir の install 帳簿と席の登録 row の anchor から導く。 帳簿と cache は読むだけで書かない (ADR-0028 §2.3)。
    # forbidden から外した語（凍った決定記録の本文が使い、folio validate は全文の部分一致で数えるので外す・新しい文では使わない）: consumer project
    forbidden: [利用側 repo]
    relationships: [doctor, 読み込み元, build 元 commit, 席の登録, install 帳簿, plugin の読み込み元, anchor]
    flagged_ambiguities: [folio の domain tag consumer は語彙の所有者の印であって導入先ではない]
  - canonical: build 元 commit
    domain: consumer
    definition: binary が build 時に焼いた source の HEAD の sha (12 桁・tracked の変更が在れば +dirty・測れなければ unknown)。 --version と doctor が名乗り、 SessionStart の記録と doctor の導入先の行が比べる (SRS FR61・ADR-0028 §2.1)。
    relationships: [導入先, 読み込み元, doctor]
  - canonical: 読み込み元
    domain: consumer
    definition: 席が起動時に受けた plugin root と、 そこに在る hooks.json の digest (依存なしの決定的な関数) の対。 SessionStart の hook が席の打刻の置き場に 1 行で記録する (SRS FR61・ADR-0028 §2.2)。 cache か作業ツリーかを器は推測しない。
    # forbidden から外した語（凍った決定記録の本文が使い、folio validate は全文の部分一致で数えるので外す・新しい文では使わない）: plugin cache
    forbidden: [配線の出所]
    relationships: [導入先, hook 集合の食い違い, build 元 commit]
  - canonical: hook 集合の食い違い
    domain: consumer
    definition: 席の読み込み元の記録の digest と、 同じ場所に今在る hooks.json の digest が違う状態 (SRS FR62)。 管理 tick が退避の合図を注入し、 退避後の終了の手と立て直しの既存の経路で同じ target・同じ口座に席を作り直す (ADR-0028 §2.4)。 binary だけの食い違いでは作り直さない。
    forbidden: [hook drift, plugin の古さ]
    relationships: [読み込み元, 退避の合図, cycle, 管理 tick, 作業記憶]
  - canonical: lane
    domain: consumer
    definition: 口座 1 つの消費枠の中で並走させる作業の流れ (席の列)。 lane 数の決め方は rules 行 (§3 R-C9-1)。
    forbidden: [レーン]
    relationships: [口座, admin lane]
  - canonical: admin lane
    domain: consumer
    definition: 管理席が担っていた実行経路 (dolt push・land など gate 通過後の操作)。 管理席の廃止 (ADR-0045) とともに消えた歴史的な語で、 着地と merge は dispatcher が持つ (SRS FR50 / FR68)。
    relationships: [lane, 管理席, dispatcher]
  - canonical: 管理席
    domain: consumer
    definition: 廃止した役割 (ADR-0045・歴史的な語)。 前の配送構造 (ADR-0016 §2.1) で runner の質問と gate の判定を planner へ中継し go の後に land した席。 席の役割は orchestrator の 1 つで、 便の起動・着地・merge は dispatcher が行う (SRS FR30 / FR68)。
    forbidden: [運転席]
    relationships: [席, orchestrator, dispatcher, 質問 record]
  - canonical: planner
    domain: consumer
    definition: orchestrator の前の名 (ADR-0045 で改名・歴史的な語)。 役割の行 role.planner は無く、 対話面の identity (rules 行 R-C7-1) の値は orchestrator の登録 row を持つ席 (ADR-0022 §2.5・ADR-0045)。
    forbidden: [プランナー]
    relationships: [orchestrator, 対話面, 席]
  - canonical: 対話面
    domain: consumer
    definition: user と機械が承認をやり取りする面。 ちょうど 1 つ (C7)。 どの席かは rules 行 R-C7-1 の値で決まり、 値は役割 orchestrator の登録 row を持つ席 (ADR-0022 §2.5・ADR-0045)。 承認・回答・go の記帳はその席からだけ受理される。 台帳の問いへの裁定は、 対話の session の発話 event か、 裁定面が答えの口へ渡した発話 event と結んで受ける (SRS FR82・ADR-0087)。
    relationships: [orchestrator, 開発 session, 承認 event, rules 行, 裁定面, 答えの口, 発話の経路]
    flagged_ambiguities: [対話面 (承認を受けるただ 1 つの面・C7) と裁定面 (消費側の画面・答えの口で台帳の問いへの答えだけを渡し承認 event を書かない・ADR-0087) は別の面]
  - canonical: relay 印
    domain: consumer
    definition: 改訂前の憲法 (C7・A1) で planner が user の承認を機械へ伝えていた印。 ADR-0003 以後、 承認の記帳は承認 event が担う (歴史的な語)。
    relationships: [planner, 承認 event]
  - canonical: 承認 event
    domain: consumer
    definition: user の承認を fleet に記帳する event (approval.requested / approval.received・逐語付き・C7.2)。 3 クラス操作の便はこれで止まり、 記帳された回答で再開する (SRS FR15 / FR16)。
    relationships: [対話面, 3 クラス, event log, 裁定 id]
  - canonical: 3 クラス
    domain: consumer
    definition: user 確認を要する操作の 3 分類 (消す / 出す / 使う)。 A1 の対象。 「出す」= public 化 (可視性の反転) ・外部送信 (他 repo への push・外部サービスへの送信・release / tag の公開)。 自 repo への push と PR 作成は含まない (A4.3 で可逆・ADR-0008)。 契約表の行では、 クラスの導出が verify 行から導いた集合を classes が含まない行を契約表の検査が断る (ADR-0061・proposed)。
    relationships: [対話面, 承認 event, 自 repo への PR, クラスの導出]
  - canonical: 自 repo への PR
    domain: consumer
    definition: 自分の repo へ branch を push して PR を作る操作。 main を動かさず branch も PR も閉じられるため A4.3 で可逆と扱い、 3 クラスの「出す」に当たらない (ADR-0008)。 pipeline の seam は --pr-cmd。
    relationships: [3 クラス, 承認 event, 便]
  - canonical: クラスの語列表
    domain: consumer
    aliases: [class command table]
    definition: 3 クラスごとの command の語の並びを持つ manifest の rules 行 1 つ (id は runner.class_commands・ADR-0061・proposed)。 各要素は先頭の 1 語がクラスの名で、 残りが語列。 語列は allowlist の語で始まり、 禁じる語列を含まない。 値は裁定 id 付きの user 裁定だけが変える (C5)。
    relationships: [3 クラス, クラスの導出, rules 行, 禁じる語列, allowlist, 裁定 id]
  - canonical: クラスの導出
    domain: consumer
    aliases: [class derivation]
    definition: 契約表の行の verify 行をクラスの語列表に当てて得る 3 クラスの集合 (ADR-0061・proposed)。 照合は禁じる語列と同じ 1 本で、 宛先は解かない。 行の classes がこれを含まない行は契約表の検査が断る (受付が in-loop・contracts check は事後の知らせ)。 write-set と land の口は入力にしない。
    relationships: [クラスの語列表, 3 クラス, 契約表, 契約の検証行, 受付, 自 repo への PR]
  - canonical: 開発 session
    domain: consumer
    definition: 設計・契約・review を行う AI の session (Claude Code)。 登録された席 (役割は orchestrator の 1 つ・ADR-0022 §2.1・ADR-0045) で動くときだけ権能を持ち、 対話面はその席 (R-C7-1)。 実装は runner が便で行い、 席は実装しない (ADR-0045 §2)。
    relationships: [対話面, 契約, 設計 doc, runner, lens]
  - canonical: 契約
    domain: consumer
    definition: 何を作り・何ができたら終わりかを表す 1 単位。 正本は設計 doc の契約表 1 行で、 器が便の契約 file を生成する (C15・SRS FR2 / FR47・ADR-0023 §2.1 / §2.2)。 台帳の 1 bead に対応し、 SRS の要件 id と設計 doc を pointer で持つ。
    relationships: [台帳, 設計 doc, write-set, 便, 契約表]
  - canonical: 設計 doc
    domain: consumer
    definition: 要望を SRS の要件に結び、 契約が複数出る元になる tracked markdown (docs/design/)。 末尾に契約表の区間を 0 か 1 つ持つ (SRS FR47・ADR-0023 §2.1)。
    relationships: [契約, SRS]
  - canonical: SRS
    domain: consumer
    definition: MVP の要件定義書 (design-intent/spec/srs.html)。 folio SRS pack の生成物で、 機械 SSoT は srs.srs.yaml。 上位ニーズ・機能要件・受入基準を持つ。
    relationships: [要件カタログ, 契約, 設計 doc]
  - canonical: 要件カタログ
    domain: consumer
    definition: 要件 doc の v2 行を scrub して写した一覧 (design-intent/spec/requirements-catalog.html)。 SRS の FR が根拠で行 id を引く。
    relationships: [SRS]
  - canonical: write-set
    domain: consumer
    definition: 契約が宣言する、 編集してよい file の集合。 外への編集は編集の時点で止める (C16・SRS FR20)。
    relationships: [契約, in-loop guard, write-set の閉包]
  - canonical: in-loop guard
    domain: consumer
    definition: 仕様からの逸脱を編集の時点で止める guard (C16)。 MVP の形は write-set の外への Edit / Write を PreToolUse で deny する hook。 極性一覧に InLoop として載る。 Bash の command guard (ADR-0025) も同じ境界の in-loop guard である。
    relationships: [write-set, 極性, command guard]
  - canonical: runner
    domain: consumer
    definition: 契約 1 本を worktree で実装する headless の Claude process (SRS FR4 / FR5)。 席ではなく使い捨て。 起動時に口座と対象 repo の settings を 1 つも読まない (ADR-0011)。
    relationships: [契約, headless, lens, 便, allowlist]
  - canonical: allowlist
    domain: consumer
    definition: 器が runner に与える「実行してよい command 名の列」。 値は対象 repo の vessel 宣言が持ち、 manifest の rules 行 runner.allowed_commands は宣言が名乗れる上限である (C1 / C10・ADR-0010)。 intake が上限と突合して便ごとに凍結し、 runner は凍結した写しから claude へ --allowedTools として渡し、 口座と対象 repo の settings を 1 つも読まない (ADR-0009 / ADR-0011)。 明示 allow の外は hook が deny する。 許可の内側で禁じる語列は manifest の rules 行 runner.denied_commands が対で持ち、 宣言は緩められない (ADR-0025 §2.1)。
    relationships: [runner, vessel 宣言, manifest, rules 行, hook, command guard]
  - canonical: 禁じる語列
    domain: consumer
    definition: 許す command の内側で撃ってはいけない語の並び (例 cargo mutants・git push --force)。 値は manifest の rules 行 runner.denied_commands だけが持ち (ADR-0025 §2.1)、 command guard が実行の前に止め、 intake が verify 行に、 dispatcher が vessel 宣言の floor-check の行に同じ判定を掛ける (SRS FR56・FR85・ADR-0084)。
    relationships: [command guard, allowlist, rules 行, manifest, 床の検査]
  - canonical: command guard
    domain: consumer
    definition: hook の PreToolUse が Bash の command を shell の区切りごとに語に分け、 rules 行 runner.denied_commands の語列に当たる segment を実行の前に deny する guard (ADR-0025 §2.2)。 全席共通の in-loop guard で、 極性一覧に InLoop / FailClosed として載る。 intake は同じ関数を verify 行に掛ける (ADR-0025 §2.3)。
    relationships: [hook, in-loop guard, allowlist, rules 行, 極性一覧]
  - canonical: 共通 verify
    domain: consumer
    definition: どの便にも共通の deny する検証 (flip check・test・lint・依存監査) を対象 repo の vessel 宣言に置き、 intake が便ごとに凍結した写しを gate が契約 verify の前に撃つもの (C2・ADR-0009 / ADR-0010)。 検出線の行は別の列 (detection-verify・ADR-0021 §2.4) に置き、 gate でなく便の着地の後に着地後の検出が撃つ (ADR-0060・proposed)。 契約の verify は便固有の行だけを持つ。
    relationships: [gate, vessel 宣言, 契約, 変異検出線, 着地後の検出]
  - canonical: 変異検出線
    domain: consumer
    definition: cargo-mutants で生成した変異のうち歯に撃墜されない数を測る検出線 (C12 R-C12-1)。 1 便では vessel 宣言の検出線の列 (detection-verify) にある xtask mutants-diff が便の diff に対して測り、 極性 (記録のみ / deny) は manifest 行に従う (ADR-0009 / ADR-0021)。 並列度は実効 jobs。 1 便で測る時点は gate の中でなく便の着地の後で、 着地後の検出が撃ち、 生存が出ても着地は戻さない (ADR-0060・proposed)。
    relationships: [共通 verify, gate, flip check, 着地後の検出]
  - canonical: lens
    domain: consumer
    definition: diff を読んで verdict (PASS / FAIL / INCONCLUSIVE) を返す headless の Claude process (SRS FR9)。 MVP の gate は lens 1 本。 runner と同じ起動形で、 口座と対象 repo の settings を 1 つも読まない (ADR-0011)。
    relationships: [gate, headless, Verdict]
  - canonical: headless
    domain: consumer
    definition: 対話画面を持たず、 入力を受けて 1 回で答えを返す Claude の実行形 (claude -p)。 口座は環境変数で切り替え、 permission は毎回明示し、 user / project / local の settings は読まない (ADR-0011)。
    relationships: [runner, lens]
  - canonical: toy repo
    domain: consumer
    definition: 到達点を測るために一時 dir に作る、 外部依存の無い小さな git repo (SRS AC1)。
    relationships: [便]
  - canonical: ".vessel"
    domain: consumer
    definition: repo root の固定名 marker file。 中身が name と version を言い、 どの器が仕えるかを決める (SPEC §7・SRS FR19)。
    relationships: [器, NAME 定数, vessel 宣言]
  - canonical: vessel 宣言
    domain: consumer
    definition: repo が器に、 許す command・共通 verify・任意の確かめを名乗る設定 file (marker の隣に置く tracked file .vessel.toml)。 intake が manifest の上限と突合して便ごとに写しへ凍結する (C10・ADR-0010)。 任意 key に ruling-check (裁定 id の実在・SRS FR83)・ruling-fixtures (裁定 id の引用に数えない見本の字面の閉じた一覧・完全一致だけで書式は何も外さない・ruling-check と同じく版を跨ぐ形・SRS FR83・ADR-0083)・floor-check (床の検査・SRS FR85)・question-route (選択式の問いの断り文の 1 行・SRS FR86)・remote (押す先・持たない repo の便は push も CI の照合もせずに閉じる・SRS FR50)・close-check (起票の門の close の段への加わり・ADR-0097) を持てる。 ruling-check を持たない repo では器は裁定 id の引用を数えも断りもせず doctor の行がその旨を出し (未反映の裁定の数えは key に依らない)、 floor-check を持たない repo では床の検査を撃たない。 marker そのものは変えない。 close-check を持たない repo では起票の門は close の理由を見ない。
    relationships: [".vessel", allowlist, 共通 verify, manifest, intake, opt-in の線, 床の検査, 裁定 id, close-check]
  - canonical: Budget
    domain: consumer
    definition: 起動に必要な予算の型。 Precheck の実測を消費してしか作れず、 唯一の起動口 spawn が要求する (C6)。
    relationships: [Precheck, 検出線]
  - canonical: Precheck
    domain: consumer
    definition: 起動前の見積 (token 上限・検出線との照合) の実測。 Budget の唯一の生成元 (C6)。
    relationships: [Budget]
  - canonical: 検出線
    domain: consumer
    definition: 超えたら機械が検知して記録・起票する線。 PR は止めない。 CI が落とす deny 閾値とは区別する。
    relationships: [rules 行]
  - canonical: 歯
    domain: consumer
    definition: 違反を機械が止める仕組みのうち test / lint / CI gate を指す。 Rust の 1 framework だけで持つ (C12)。
    relationships: [flip check, KNOWN-RED 台帳]
  - canonical: gate
    domain: consumer
    definition: 便の成果物を独立に検証して Verdict を返す機構。 MVP は契約の verify の実走 + lens 1 本 (SRS FR8 / FR9)。 crate の gate module が担う。 歯 (test / lint / CI) とは別の entity。
    relationships: [Verdict, 便, land, lens]
  - canonical: flip check
    domain: consumer
    definition: CI が PR の test 差分だけを base に当てて RED、 HEAD で GREEN であることを確かめる検査 (C12.2)。 本 repo の入口の RED を測る形で、 名乗った消費側の受付は test 差分を重ねずに契約の検証行そのものを base の木で撃つ (ADR-0059・accepted)。
    relationships: [歯, docs-only, 入口の RED, 契約の検証行]
  - canonical: KNOWN-RED 台帳
    domain: consumer
    definition: 落ちている test を許容するための一覧。 持たない (C12.6)。
    relationships: [歯]
  - canonical: 器
    domain: consumer
    definition: scribe の実行基盤 (plugin + binary + 席の運用) の 1 世代。 版の作り方の規範は C8。
    relationships: [版 N+1, 自己開発]
  - canonical: 自己開発
    domain: consumer
    definition: 器が自身の repo を開発すること。 ADR-0003 以後は既定で許可 (A4)。 user に先に聞くのは不可逆操作 (3 クラス) だけ。 拘束条件は design-intent (C8)。
    relationships: [器, 版 N+1, 3 クラス]
  - canonical: SelfDev
    domain: consumer
    definition: 改訂前の C8 が定めていた自己開発の許可状態 enum (Disabled / Enabled { ruling_id })。 ADR-0003 で廃止 (歴史的な語)。
    relationships: [自己開発]
  - canonical: 成熟条件
    domain: consumer
    definition: 改訂前の C8 で版の成熟を宣言するために同時に成り立つ条件の集合 (§3 R-C8-1)。 ADR-0003 で停止 (測らない・履歴として残す)。
    relationships: [自己開発, K 指標]
  - canonical: 版 N+1
    domain: consumer
    definition: 次世代の器。 改訂後の C8 では design-intent の下で作られ、 前の版を oracle にしない。 schema 非互換・C4 超えの着地先 (N4)。
    relationships: [器, 自己開発, verdict export]
  - canonical: 便
    domain: consumer
    definition: 契約 1 本の 1 往復 (intake → runner → gate → land)。 MVP の識別子は run id で (run は識別子 run id にのみ用い、 便の実体名には使わない)、 現在地は event log から導く。 到達点は便の本数で数える (SRS AC1 / AC2)。
    relationships: [Verdict, land, gate, 契約, event log]
  - canonical: NAME 定数
    domain: consumer
    definition: plugin 名 / crate / skill 名前空間 / state dir / env 接頭辞 / tmux server 名を導出する 1 定数 (C2.2)。
    relationships: [tmux]
  - canonical: Stage
    domain: consumer
    definition: 選定・除外・routing の適用順を列挙順で定める enum (C2)。
  - canonical: SeatState
    domain: consumer
    definition: 席の状態を運ぶ typed enum (C3.3 / C9)。
    relationships: [席, Completion]
  - canonical: Completion
    domain: consumer
    definition: 完了条件を表す唯一の enum。 待機 API の引数型 (C3.4)。
    relationships: [SeatState]
  - canonical: 極性
    domain: consumer
    definition: guard の性質の対。 いつ止めるか (InLoop / PostHoc) と、 測れない周にどちらへ倒れるか (FailClosed / FailOpen)。 値は境界の定数が運び、 一覧は集めるだけ (C11.2・ADR-0014 §2.1)。
    relationships: [guard, 極性一覧, in-loop guard]
  - canonical: guard
    domain: consumer
    definition: 行為 (編集・起動・merge・書込・session の作り直し) を止めうる判定を返す境界。 状態を選ぶだけの判定は guard ではない (ADR-0014 §2.1)。 全数は閉じた enum が数えきる。
    relationships: [極性, 極性一覧]
  - canonical: 極性一覧
    domain: consumer
    definition: 全 guard を 1 行 1 guard で並べた core の出力 (subcommand polarity) を外形 snapshot として pin した tracked 生成物 (C11.2 / C12.5・ADR-0014 §2.2)。 構造検査の門はこの生成物の集計行を読む (C16.2・ADR-0014 §2.3)。
    relationships: [極性, guard, 判定行]
  - canonical: Declared
    domain: consumer
    definition: 人が書いた宣言値の型 (C10)。
    relationships: [Measured, Effective]
  - canonical: Measured
    domain: consumer
    definition: 実測値の型。 値と出所 (Provenance) を持つ (C10)。
    relationships: [Declared, Derived]
  - canonical: Derived
    domain: consumer
    definition: 他の値から導出した値の型。 Independent を名乗れない (C10)。
    relationships: [Measured]
  - canonical: Effective
    domain: consumer
    definition: 効力を持つ値の型。 Declared から実測を経てのみ作られる (C10)。
    relationships: [Declared]
  - canonical: state dir
    domain: consumer
    definition: 器が状態 (event log・verdict export・注入計測) を置く dir。 既定は NAME 定数から導出し、 差し替えは CLI 引数だけで行う (env seam を持たない・ADR-0004 §2.4)。
    relationships: [NAME 定数, event log, verdict export]
  - canonical: run id
    domain: consumer
    definition: 便 1 本を一意に指す識別子 (bead id と UTC の時刻印から成る)。 event log と state dir 配下の dir 名に用いる。
    relationships: [便, event log, state dir]
  - canonical: measure tag
    domain: consumer
    definition: 構造検査が判定行に出す測定 1 本の名。 各 tag は測る対象と実測値を持つ。 列挙の SSOT は機械側 (判定行と実装) で、 文書は pointer だけを持つ (ADR-0013 §2.1)。
    relationships: [Measured, 判定行]
  - canonical: paths-clean
    domain: consumer
    definition: index を母集団に、 tracked file の本文へ private path 形が残っていないことを測る measure tag。
    relationships: [measure tag]
  - canonical: integration test target
    domain: consumer
    definition: cargo が kind = test として build する 1 つの単位。 dir 形の統合 test は main.rs と
      その module を合わせて 1 と数え、 数は cargo metadata が返す targets で得る (R-C13-2 の数え方の単位・ADR-0007)。
    relationships: [歯]
  # ---------------------------------------------------------------- 開発 session の自律機能 (SRS v0.3 FR25〜FR29)
  - canonical: cap guard
    domain: consumer
    definition: 開発 session の context 使用量が rules 行の上限に達したとき、 退避以外の編集を止める hook の段 (SRS FR26)。 上限の値は rules 行が持つ。
    relationships: [開発 session, hook, manifest]
  - canonical: hook
    domain: consumer
    definition: 器が binary 1 本で仕える Claude Code の event の口 (PreToolUse 等)。
    relationships: [write-set, cap guard]
  - canonical: backoff
    domain: consumer
    aliases: [合図の backoff]
    definition: 同じ相手に同じ働きかけを繰り返すとき、 反応が無ければ次までの間隔を段ごとに伸ばし、 列が尽きたら打ち切る形。 管理 tick の打刻の合図の待ちの列は梯子の列 (規範は SRS FR27・写さない)。
    relationships: [管理 tick, 打刻の合図, 席, 梯子の列, 黙りの初段]
  - canonical: 梯子の列
    domain: consumer
    aliases: [合図の梯子]
    definition: 管理 tick の打刻の合図の待ちを段ごとに並べた、 空でない昇順の秒の列 (rules 行 1 本・ADR-0068)。 段の待ち・打ち切り・先頭への戻りの規範は SRS FR27 (写さない)。
    relationships: [backoff, 管理 tick, 黙りの初段]
  - canonical: 黙りの初段
    domain: consumer
    definition: 管理 tick が席を「黙っている」と判じる、 最後の打刻からの経過の閾値 (rules 行 1 本・秒)。 梯子の列の先頭とは別の値で、 既定が同じでも同じ実体ではない。 規範は SRS FR27 (写さない)。
    relationships: [管理 tick, 梯子の列, 状態の打刻]
  - canonical: 変化の digest
    domain: consumer
    aliases: [change digest]
    definition: 席に変化があったかを比べるための値 = 席の状態の打刻の最終行の時刻の 1 値。 読める形で梯子の記録に残し、 fleet の event log・context・台帳・pane の字面は入れない (ADR-0058)。
    relationships: [管理 tick, 席, 打刻の合図, 開発 session]
  - canonical: 管理 tick
    domain: consumer
    definition: 開発 session が黙っていないかを周期で見て、 条件が揃ったときだけ続きを促す打刻の合図を 1 行注入する仕組み (SRS FR27・ADR-0058)。 無変化の席には backoff で合図の間隔を伸ばし、 24 時間で止める。 退避の合図と cycle は ADR-0045 で廃止のまま。 ADR-0066 の後は、 自席の anchor が群に属する周に群の移動の判定を群ごとに鮮度の窓 (fleet.usage_fresh_s) に 1 回まで host の lock の内側で撃ち (lock を取れない周は撃たず今の列へ)、 判定の周だけ計測を起こしてよい (退避と起こし直しは自席の移動の門のまま)。 管理 tick の周は局面の出力の部分の書き直しの契機でもある (SRS FR27 / FR90・ADR-0088)。
    relationships: [開発 session, 打刻の合図, backoff, 変化の digest, tick の unit, 群の移動の判定, 判定の打刻, 移動の門, 局面の出力, alarm]
  - canonical: statusline
    domain: consumer
    definition: 開発 session の画面の下に Claude Code が描く 1 行。 器の口 (seat statusline) が stdin の payload だけから組み、 管理 tick の context 計測が pane から読む入力でもある (SRS FR25 / FR29・ADR-0029 §2.1 / §2.2)。 描く形と読む形は同じ 1 つの規則で、 口座の設定の statusLine は器の口座の口が書く (ADR-0029 §2.3)。
    relationships: [管理 tick, 開発 session, 口座, doctor]
  - canonical: tick の unit
    domain: consumer
    definition: 管理 tick を席ごとに周期で撃つ host の systemd user unit (service と timer の対)。 器の口 (seat tick install) が NAME・target・置き場・binary・rules 行の間隔から 1 関数で導出して書き、 有効化まで撃つ (ADR-0030 §2.1〜§2.4)。 撤去は退役 dir への移動で、 doctor が席ごとに有無と一致を名指す (ADR-0030 §2.5)。 ADR-0064 (proposed) の後は、 席の起動が席を立てた周に tick の宣言の値で同じ 1 本を撃つ。
    relationships: [管理 tick, 席の登録, doctor, manifest, tick の宣言, 席の起動]
  - canonical: tick の宣言
    domain: consumer
    aliases: [tick declaration]
    definition: host の manifest の表 [[tick]] (ADR-0064・proposed)。 unit を置く dir の絶対 path (unit-dir) と unit が撃つ器の絶対 path (binary) の 2 欄を持つ 0 か 1 行の表で、 vessel 宣言と同じ形。 席の起動と doctor と init が読み、 器は書かない (人が雛形の置き場の面に 1 度だけ書く)。
    relationships: [host の manifest, tick の unit, 席の起動, doctor, init, 雛形の置き場]
  - canonical: 席の状態
    domain: consumer
    definition: 開発 session が turn を走らせているか (Busy) 止めているか (Idle) の閉じた enum。 出所は hook の打刻 (UserPromptSubmit → Busy・Stop / SessionStart → Idle) で、 pane の字面は判定入力にしない (憲法 C3.3・ADR-0015 §2.1)。
    relationships: [開発 session, 管理 tick, cycle, 状態の打刻]
  - canonical: 状態の打刻
    domain: consumer
    definition: 席の中で hook が state.jsonl へ append する 1 行 (state / event / ts / sid)。 target は生成 hooks.json の shell 行が渡す pane id から解く (ADR-0015 §2.2)。 無い・読めない・古い周は注入しない (ADR-0015 §2.3)。
    relationships: [席の状態, hook, 管理 tick, turn の終わりの止め]
  - canonical: 席の起こし直し
    domain: consumer
    aliases: [seat relaunch]
    definition: 群の移動の周の群の段と、 窓が shell に戻った席を見た管理 tick が、 同じ target に席の起動 (SRS FR59) で席を立て直すこと (SRS FR27 / FR28 / FR38・ADR-0067)。 状態の打刻の最終行の会話 id を運び、 対話の記録の file は複写しない。 runner の起こし直し (追随の衝突・ADR-0019) とは別の語。
    relationships: [席の起動, 管理 tick, 群の今の口座, 会話 id, 機械の復帰]
  - canonical: 会話 id
    domain: consumer
    aliases: [conversation id, session id, sid]
    definition: claude が 1 つの会話 (session) に付ける id (UUID の形)。 席の hook が状態の打刻の各行に残し、 席の起こし直し (群の段・管理 tick) は最終行の値を起動行の末尾に --resume で運ぶ (ADR-0067・SRS FR38 / FR59)。 器は対話の記録の file を読まず、 形が UUID でない周は運ばない。
    relationships: [状態の打刻, 起動行, 機械の復帰, 移動の門]
    flagged_ambiguities: [会話 id (claude の session の id) と、 仕分けの 3 つの形の 1 つの会話 (台帳を変えずに仕分け済みにする形・SRS FR88) は別]
  - canonical: 打刻の合図
    domain: consumer
    aliases: [heartbeat]
    definition: 管理 tick が idle の開発 session に注入する 1 行 (SRS FR27・ADR-0058)。 台帳の現在地から続きを進めるよう促す。 無変化なら梯子の列の順で間隔が伸びる。 heartbeat はこの合図の呼び名で (ADR-0070・SRS FR78)、 席ごとに決められ (明示の記録・seat heartbeat on|off|default|status・実効の値の決まる順は SRS FR78・ADR-0092)、 合図を送らない席でも管理 tick は止まらない。 前の器に在った、 席が自分で打つ生存の判子の口と file はこの語で呼ばない。
    relationships: [管理 tick, 開発 session, 梯子の列, 明示の記録, heartbeat の実効の値, 最後の周の打刻]
    flagged_ambiguities: [ADR-0058 の本文では heartbeat は管理 tick の呼び名 (frozen・供覧のみ)]
  - canonical: 明示の記録
    domain: consumer
    aliases: [明示 on の記録, 明示 off の記録, 停止の記録]
    definition: 席の状態の dir に置く 1 行の file (時刻) で、 明示 on と明示 off の 2 種 (SRS FR78・ADR-0092)。 器の口 seat heartbeat on / off だけが一方を置いて他方を消し、 default が両方を消す (可逆)。 heartbeat の実効の値の決まる順の先頭で、 2 つとも在る周と在るのに読めない周は off と読む。 ADR-0070 の停止の記録は明示 off の記録にあたり、 同じ置き場と形のまま明示 off と読む。 書き手は器の口 1 本で、 管理 tick は書かない。
    forbidden: [heartbeat-off flag, pause file]
    relationships: [打刻の合図, 管理 tick, 最後の周の打刻, heartbeat の実効の値]
    flagged_ambiguities: [記録の file の有無は実効の値でない (外の読み手は器の口の出力を読む)]
  - canonical: 最後の周の打刻
    domain: consumer
    definition: 管理 tick が周ごとに席の状態の dir へ書く 1 行 (時刻・判定・理由・SRS FR78・ADR-0070)。 rc 1 の周も書く。 event log には書かない。 健全かはこれを読む側が判じる。
    relationships: [管理 tick, 健全, 明示の記録]
  - canonical: 健全
    domain: consumer
    definition: 管理 tick が周期どおり周っていること = 最後の周の打刻の時刻から今までの経過が周期の rules 行の 2 倍以内 (SRS FR78・ADR-0070)。 読み手 (seat tick status・doctor・外の画面) が導き、 管理 tick は判じない。
    # forbidden から外した語（凍った決定記録の本文が使い、folio validate は全文の部分一致で数えるので外す・新しい文では使わない）: tick の健康
    forbidden: [alive]
    relationships: [最後の周の打刻, 管理 tick, doctor]
  - canonical: 退避の猶予
    domain: consumer
    aliases: [move grace]
    definition: 群が別の口座へ移った席へ器が /exit を送るまでの待ち (SRS FR38・ADR-0071・ADR-0073)。 rules 行 seat.move_grace_s (整数の秒・値 300・user 裁定 id つき) が持ち、 起点は合図の記録に書いた時刻 (ADR-0073 が群の記録の時刻から改めた)。 0 は待たない。 ADR-0079 で待ちでなく上限になり、 応え終えた印が真の席はそれより前に /exit を受ける。 管理 tick の移動の門と群の段の続きの周が同じ 1 関数で /exit を判じる。
    forbidden: [grace period, 退避の待ち]
    relationships: [移動の門, 退避の合図, 合図の記録, 群の今の口座, 管理 tick, 応え終えた印]
  - canonical: 応え終えた印
    domain: consumer
    aliases: [notice turn ended]
    definition: 群の移動の退避で、 席が合図を受けた turn を終えた印 (SRS FR38・ADR-0079)。 席の状態の打刻のうち合図の記録の時刻以後の busy が 1 つ以上在り、 読めた打刻の最終行が Stop の idle なら真、 打刻が無い・読めない・読めた行が 0・最終行が SessionStart の idle (圧縮の後にも打たれる) なら偽。 turn の終わりだけを表し、 作業記憶を書き終えたかは表さない。 hook/group.rs の 1 関数が判じ、 真なら退避の猶予を待たずに /exit を送る。 打刻は /exit を早めるためにだけ読み、 偽の席も猶予の上限で移る。
    forbidden: [保存の証拠, 保存完了フラグ, saved flag]
    relationships: [状態の打刻, 合図の記録, 退避の猶予, 移動の門]
  - canonical: 合図の記録
    domain: consumer
    definition: 席の状態の dir に置く 1 行の file (移り先の口座・群の今の口座の記録の時刻か種の印・合図を書いた時刻・SRS FR38・ADR-0071・ADR-0073)。 同じ移動 (移り先と記録の時刻が同じ) の記録が在れば管理 tick は退避の合図を送り直さず、 退避の猶予はその時刻から数える。 書き手も読み手も 1 関数で、 群の段の移動の周と管理 tick の合図の周が書く。 前の移動の記録は害なく残る。 ADR-0079 で時刻は両入口とも合図を送る前に取り (群の段は席ごとに送る直前)、 応え終えた印もその時刻から読む。
    forbidden: [move-signal flag, signal mark]
    relationships: [退避の合図, 退避の猶予, 移動の門]
  - canonical: 退避の合図
    domain: consumer
    definition: 開発 session に作業記憶の退避を促す 1 行。 管理 tick (ADR-0045 で廃止) が context 使用量の上限で注入した形 (SRS FR29) と、 群の移動の周に dispatch の 1 周が古い席の pane へ注入する形 (ADR-0055・proposed) の 2 つが在り、 後者は台帳と git に残して終えることを促す。 ADR-0066 (proposed) の後も送り手は 2 系統 (便の終端の周の群の段は自分の置き場の席へ・他の置き場の席は各席の管理 tick の移動の門が自席へ) で、 群の移動の判定の 1 本は送らない。 ADR-0071 で字面は hook/group.rs の 1 関数 (群の名・移り先・退避の猶予の残りの秒) になり、 群の段と管理 tick の移動の門が同じ 1 行を送る (移動につき 1 回・合図の記録で数える)。 ADR-0079 で字面は、 新しい subagent を起こさず、 走っている subagent は /exit で落ちる前提で依頼の要旨と出力 file の path を台帳へ書き、 作業記憶を残して turn を終えるよう案内する形になる。
    relationships: [管理 tick, cap guard, 退避物, 群の逼迫, 便の終端の周, 群の段, 移動の門]
  - canonical: cycle
    domain: consumer
    definition: 作業記憶を退避し、 session を作り直し、 退避物から復元する一周 (SRS FR28)。 退避物が無い session では起こさない。
    relationships: [管理 tick, 開発 session]
  - canonical: 配送構造
    domain: consumer
    definition: runner の質問に誰が答え、 誰が land するかの席の配置 (便を起こすのは席でなく dispatcher・SRS FR68・ADR-0034)。 既定は anchor ごとに orchestrator 1 席で、 質問には orchestrator が答え、 着地と merge は dispatcher が持つ (ADR-0045・前の既定「planner 1 席 + 管理席 1 席」は ADR-0016 §2.1・SRS FR30 / FR40)。
    relationships: [orchestrator, dispatcher, 便]
  - canonical: Blocked
    domain: consumer
    definition: 便の段の 1 つ。 3 クラスを名乗る契約が spawn の手前で承認 event を待っている状態 (SRS FR15 / FR16)。
    relationships: [承認 event, 3 クラス, 便]
  - canonical: 質問 record
    domain: consumer
    definition: runner が契約の不足を返して止まるときに stdout の最終行へ書く JSON 1 つ (question / about)。 要件は SRS FR31、 形式は ADR-0016 §2.2 が正本。
    relationships: [runner, Questioned, 回答 event, 契約]
  - canonical: Questioned
    domain: consumer
    definition: 便の段の 1 つ。 runner の質問 record を受けて回答 event を待っている状態 (SRS FR31 / FR32・ADR-0016 §2.2・Blocked と同型)。
    relationships: [質問 record, 回答 event, 便]
  - canonical: 回答 event
    domain: consumer
    definition: 契約の所有者 (orchestrator の席) が質問に答えて fleet に記帳する event (QuestionAnswered・逐語付き・actor は machine)。 user の言葉は承認 event にだけ載る (SRS FR32・ADR-0016 §2.3・ADR-0045)。
    relationships: [質問 record, Questioned, 承認 event, orchestrator]
  - canonical: 上限 record
    domain: consumer
    definition: claude が口座の使用上限を伝える専用種別の record (rate_limit_event)。 status と使用率を構造化 field で持ち、 器の上限判定はこの record だけを入力にする (ADR-0012 §2.1)。
    relationships: [runner, 口座]
  - canonical: 上限 status
    domain: consumer
    definition: 上限 record の status のうち「便を止める」ことを表す値の閉じた集合。 実測で採れた値だけを入れ、 集合に無い status では止めない (ADR-0012 §2.1・未知は claude の rc へ落ちる)。
    relationships: [上限 record]
  - canonical: 判定行
    domain: consumer
    definition: 構造検査が違反 0 の周にだけ出す 1 行。 measure tag とその実測値を並べる。 measure の列挙はこの現物が SSOT であり、 文書は列挙を写さない (ADR-0013 §2.1)。 契約表の検査の 1 行・受付の 1 行・preflight の行も同じ 1 行 1 事実の形で、 ADR-0059 (accepted) は受付の 1 行と preflight の行に entrance=green-on-base の欄を足し、 契約表の検査の entrance= の欄に名乗りの語を写す。
    relationships: [measure tag, 構造検査, 受付, base で緑の行]
  - canonical: 宣言順
    domain: consumer
    definition: 閉じた enum の variant が宣言された順序。 適用順序はこれだけから取り、 順序の散文注記を持たない (憲法 C2)。 充足形は「閉じた enum + 全 variant の const slice + 網羅 match + 並びが判別子の昇順と一致することを測る歯」の 4 つ組である (ADR-0013 §2.2)。
    relationships: [判別子順 pin]
  - canonical: 判別子順 pin
    domain: consumer
    definition: const slice の並びが判別子の昇順 (0, 1, 2, …) と一致することを測る歯。 並べ替え・重複・中間の欠番を捕まえるが、 末尾に足した variant の入れ忘れは捕まえない (ADR-0013 §2.3)。
    relationships: [宣言順]
  # ---------------------------------------------------------------- SRS v0.5 (FR33 / AC8 改訂)
  - canonical: 口座残量
    domain: consumer
    definition: 1 口座 1 時刻で読んだ、 5 時間窓・7 日窓・モデル別 7 日窓の残りと各 reset 時刻の組 (SRS FR33)。 口座の endpoint 由来で、 runner が受ける上限 record (claude の record 由来・検出の合図) とは別の entity。
    # forbidden から外した語（凍った決定記録の本文が使い、folio validate は全文の部分一致で数えるので外す・新しい文では使わない）: quota
    forbidden: [クォータ]
    relationships: [口座, fleet, 上限 record, Measured]
  - canonical: 暫定行
    domain: consumer
    definition: 作業記憶の「命令・制約」行のうち出所 pointer を持たない行、 または持っていても器が形で分類できない行 (SRS FR23 / AC8・ADR-0018 §2.2)。 復元の DATA に印付きで列挙され、 次の cycle に引き継がれない。
    forbidden: [仮の行, 暫定命令]
    relationships: [作業記憶, 退避物, 出所 pointer, 憲法]
  # ---------------------------------------------------------------- ADR-0017 (口座残量の計測の形)
  - canonical: 口座 label
    domain: consumer
    definition: manifest の account 行が口座を指すために持つ不透明な符丁 (ADR-0017 §2.3)。 本当の口座の識別子・host 名・path のいずれでもなく、 credential の場所は state dir 配下の同名 dir から解く。
    relationships: [口座, manifest, state dir, 口座残量]
  - canonical: 実測行
    domain: consumer
    definition: 口座残量を 1 口座 1 窓で event log に追記した行 (ADR-0017 §2.1)。 出所 (口座 label・endpoint・時刻) を持つ Measured で、 読めなかった回は使用率を持たない「測れなかった」の行になる。 reset 時刻は任意で、 消費の無い窓 (使用率 0・reset 無し) は「測れた 0%・reset 未定」の Measured 行として reset 時刻を持たず、 選定と逼迫度はそれを古くない実測として数える (ADR-0024 §2.1 / §2.2)。
    relationships: [口座残量, event log, Measured, 上限 record]
  # ---------------------------------------------------------------- ADR-0018 (作業記憶の退避・復元・消費)
  - canonical: 作業記憶
    domain: consumer
    definition: 開発 session が cycle を跨いで運ぶ一時層の記憶。 session id で一意な退避物 (file) として退避し、 復元の DATA と brief を経て消費する (SRS FR23 / ADR-0018)。 規則の置き場ではない (憲法 N2)。
    relationships: [開発 session, 退避物, cycle, 暫定行]
  - canonical: 退避物
    domain: consumer
    definition: 作業記憶を書き出した file。 file 名は session id で一意、 frontmatter で席を名乗り、 消費は同一 suffix (.consumed.md) への move で表す (SRS FR23)。 器の subcommand (seat externalize / rebrief / consume) だけが書き・読み・移す (ADR-0018 §2.1 / §2.3)。
    relationships: [作業記憶, cycle, 管理 tick]
  - canonical: 出所 pointer
    domain: consumer
    definition: 席の指示文の雛形の行が行末の出所の印 (→ 器の SSOT:) の後ろに持つ、 実在を照合できる器の repo の文書への参照 (ADR-0022 §2.4・ADR-0090)。 器は形を閉じた enum (PointerKind) で分類し、 宣言順を優先順位とする (ADR-0018 §2.2)。 形の列挙は機械側 (PointerKind::ALL と外形 snapshot) が正本で、 本 file は写さない。 印の後ろの参照が 1 本でも分類できない行と、 参照を 1 本も持たない行は pointer 行でない (ADR-0090)。 もとは作業記憶の命令行が本文末に持つ参照 (ADR-0018 §2.2) で、 作業記憶は ADR-0045 §2 (2) で廃止。
    relationships: [席の指示文, 出所の印, 分類できない参照, 宣言順, 作業記憶, 暫定行]
  # ---------------------------------------------------------------- ADR-0019 (並列の便の受付と衝突)
  - canonical: 追随
    domain: consumer
    definition: land の前に、 便の base より進んだ main へ worktree の branch を rebase して gate をやり直すこと (要件は SRS FR34 が正本・設計は pipeline.md §5.4)。 衝突した周は終端にせず runner を起こし直して write-set の内側で解かせ、 runner の終了後に器が base を進めて記帳する (ADR-0019 §2.2)。
    relationships: [land, 便, runner, write-set]
  - canonical: write-set の交差
    domain: consumer
    definition: 2 つの契約の write-set (path の集合・末尾 / の dir は配下を含む) の共通部分が空でないこと。 intake は live な便と交差する契約を受け付けない (ADR-0019 §2.1)。
    relationships: [write-set, 契約, 便]
  - canonical: 衝突
    domain: consumer
    definition: 追随の rebase で、 先着の変更と同じ箇所が重なり器が自動では合わせられないこと (SRS FR34 が記帳を求め、 解き方は ADR-0019 §2.2 の起こし直し)。 契約同士の write-set の交差 (ADR-0019 §2.1 が intake で断る) とは別の概念。
    relationships: [追随, 起こし直し, write-set の交差]
  - canonical: live な便
    domain: consumer
    definition: 終端でない run。 終端 = 段が Landed / Failed / Stopped のいずれか、 または Gated で verdict が FAIL、 または Reviewed で verdict が PASS でない (契約の審査)。 intake の排他が照合する母集団で、 同時走行の最大値が数える母集団でもあり、 pipe stop --run で 1 本だけ終端に倒せる (ADR-0019 §2.1・ADR-0035)。
    relationships: [便, write-set の交差, 契約, 同時走行の最大値, 中間生成物]
  - canonical: 中間生成物
    domain: consumer
    aliases: [build output, intermediates]
    definition: build や test や依存の取り込みが便の worktree の中に作る dir のうち、 器が対応する言語の決まった名を持つもの (target・node_modules・.venv・__pycache__・.mypy_cache・.pytest_cache・.ruff_cache・.expo の閉じた 8 つ)。 commit した木と toolchain と lock file から作り直せる。 器は運転手の終端の周ごとに、 live でない便の worktree (元の場所か退役先) から、 この名の dir で git が追う file を持たないものを消す (ADR-0081・dispatcher.md §30)。 無視の規則が無視する file 全部ではない (鍵や local の設定は含まない)。 ADR-0096 の後は、 席の起草の置き場の .git を持つ写しの中の、 書きの線より前のものも消す。
    relationships: [live な便, 退役, 起草の置き場]
  - canonical: runner の印
    domain: consumer
    aliases: [印の file, runner mark]
    definition: 器が便ごとに runner へ写す消費側の plugin の写しの root に書く、 中身の空の file 1 つ。 名は NAME に -runner を付けた語。 消費側の hook は自分の plugin の置き場にこの file が在るかで runner の中かを判じる。 器は書くだけで読まず、 器自身の plugin の写し・anchor の生成 dir・便の worktree には書かない (ADR-0082・consumer-sync.md §19)。 環境変数ではない。
    relationships: [runner, 起動行の導出, hook, 消費側]
  - canonical: 起こし直し
    domain: consumer
    definition: land の追随が衝突した run で、 同じ worktree と契約に「追随」節を添えて runner をもう 1 回 spawn すること。 回数は rules 行 pipe.follow_retries が上限で、 その判定は guard (ADR-0019 §2.2 / §2.4)。
    relationships: [追随, runner, guard]
  - canonical: 並列の枠
    domain: consumer
    aliases: [受付の枠]
    definition: host 単位で便の変異検査に配る並列の枠 (SRS NFR6)。 契約を便にする前の検査の段 (受付) とは別。 置き場は state dir の親の下の host 用 dir で project をまたぎ、 枠 1 組は受付札 1 つで表す (ADR-0021 §2.3)。 器が管理する状態ではなく受付の一時的な印。 ADR-0095 の後は、 gate の共通 verify・検出線・契約の verify の全部の行が枠を取る (穴 {jobs} を持たない行は job 1 つ)。
    relationships: [受付札, 実効 jobs, 封じ込め, 検出線]
  - canonical: 受付札
    domain: consumer
    definition: 受付が配った枠を表す file (pid・run・jobs・時刻を持つ)。 生きている process の札だけを数え、 死んだ札と読めない札は回収する (ADR-0021 §2.3)。 fleet の lease (席の期限付き割当) とは別の実体。
    relationships: [並列の枠, 実効 jobs]
  - canonical: 封じ込め
    domain: consumer
    definition: 器が起こす子 process (verify 行・runner・lens) を memory の上限付きの cgroup scope の内側で走らせること。 溢れて止められるのは scope の内側だけで、 封じられない host では並列度を下げて進む (ADR-0021 §2.2)。
    relationships: [並列の枠, 極性一覧, runner]
  - canonical: 実効 jobs
    domain: consumer
    definition: 変異検査に実際に渡す並列度。 rules 行の上限 (宣言値) と受付が測った枠 (測定値) の小さい方で、 vessel 宣言の検出線の穴に器が埋める (ADR-0021 §2.1)。
    relationships: [並列の枠, 変異検出線, vessel 宣言]
  - canonical: 役割
    domain: consumer
    definition: 開発 session の席の種類。 閉じた enum の値で (列挙は core が持ち文書は写さない・ADR-0013 §2.1・値は orchestrator の 1 つ = ADR-0045)、 席の登録 row が持つ。 窓名や env の慣習では決めない (SRS FR40・ADR-0022 §2.1)。
    relationships: [席, orchestrator, 権能, 席の登録]
  - canonical: 権能
    domain: consumer
    definition: 役割ごとに許された操作の閉じた一覧 (列挙は core が持ち文書は写さない・ADR-0013 §2.1)。 値は役割ごとの rules 行が持ち (ADR-0022 §2.2)、 hook が tool 呼出しの境界で執行する (SRS FR41・ADR-0022 §2.3)。
    relationships: [役割, rules 行, hook, 対話面]
  - canonical: 席の登録
    domain: consumer
    definition: 席の役割と anchor を鍵に、 target・口座 label・起動の雛形を項目として fleet の event log に記録すること (SRS FR40・ADR-0022 §2.1)。 記録の無い席は権能を持たない。 pane id は鍵にも項目にも置かない。
    relationships: [席, 役割, fleet]
  - canonical: 上限停止
    domain: consumer
    definition: 便が口座残量の上限に当たって止まること。 Failed でない再開できる段で (SRS FR35・ADR-0020 §2.1)、 別口座での再開は SRS FR37。 開発 session の側の退避と立て直し (ADR-0020 §2.4) は ADR-0045 で廃止 (SRS FR38)。
    relationships: [口座残量, 口座, 口座選定]
  - canonical: 口座選定
    domain: consumer
    definition: manifest の口座と実測の口座残量から 1 本の純関数が口座を選ぶこと (SRS FR36・ADR-0020 §2.2)。 便用 (使い切る側・7 日窓の reset が最も近い口座から・同点は走行中の便が少ない口座・1 口座あたりの便数で候補を絞らない・ADR-0027 §2.1 / §2.2・1 つ目の鍵は ADR-0042) と session 用 (余裕を残す側) の 2 規則を持ち、 値は rules 行 R-C9-1。
    relationships: [口座, 口座残量, rules 行, 上限停止, 便用の並べ鍵]
  - canonical: install 帳簿
    domain: consumer
    definition: 開発 session の harness が plugin の install を記録する帳簿（記録 sha・install 先・scope）。 台帳（beads）でも event log でもない外部の記録で、 器は読むだけで書かない（SRS FR61）。
    relationships: [導入先, plugin の読み込み元, 台帳, event log]
    flagged_ambiguities: [台帳（beads）と install 帳簿は別物]
  - canonical: plugin の読み込み元
    domain: consumer
    definition: 開発 session が hook 宣言（hooks.json）と skill を実際に読む場所（path と hook 集合の digest で実測する値・SRS FR61 / FR62）。 host の面が宣言する plugin dir（Declared）とは別で、 実測でだけ分かる。
    relationships: [導入先, install 帳簿, plugin dir, 管理 tick]
    flagged_ambiguities: [plugin dir（宣言値）と plugin の読み込み元（実測値）は別物]
  - canonical: anchor
    domain: consumer
    definition: 対象 repo の main checkout。 席と便の鍵の一部で、 1 つの anchor に orchestrator 1 席 (SRS FR40・ADR-0022 §2.1・ADR-0045)。 便の worktree はここから切る。
    relationships: [席, 席の登録, worktree, 役割]
  - canonical: 席の指示文
    domain: consumer
    definition: 席の役割ごとに、 tracked な雛形 1 枚と権能の rules 行から器が生成して session の開始・clear・圧縮後に注入する文 (SRS FR42・ADR-0022 §2.4)。 雛形の外に手書きの規範文を持たず、 hook で塞ぐ事項は書かない。 ADR-0096 の後は 12 行で、 12 行目が起草の置き場の path を穴で渡す。
    relationships: [役割, 権能, hook, 開発 session, 起草の置き場]
  - canonical: 圧縮の直前の 1 枠
    domain: consumer
    aliases: [precompact slot]
    definition: 圧縮が始まる直前に、 器が席の直前の発言を逐語で書く高々 1 つの記録 (SRS FR42・設計 docs/design/seat-roles.md)。 置き場は state dir の席ごとの置き場で repo の外。 圧縮の後の session の開始で 1 回だけ出して消す。 AI が書く散文の退避物ではない (SRS FR23 / FR66)。
    relationships: [席の指示文, state dir, hook, 開発 session]
    flagged_ambiguities: ["枠: 圧縮の直前の 1 枠 (席の記録) と並列の枠 (変異検査の並列・SRS NFR6) と host の memory の枠 (受付) は別義"]
  - canonical: 席の queue
    domain: consumer
    definition: 席に向けた dispatch・席宛ての質問・裁定済みの次の行動の集合として前の器が持っていた実体。 器は持たず、 続きの pointer を queue から注入しない (ADR-0045・SRS FR43)。 席の次の仕事は台帳の現在値が持ち、 管理 tick が台帳の現在地から続きを促す (ADR-0058)。
    relationships: [管理 tick, 席, 席の状態]
  - canonical: 席間の連絡
    domain: consumer
    definition: 開発 session の席どうしの message を届ける経路。 器は持たない (ADR-0045・SRS FR44)。 器から席の入力欄への差し込みの用途の列の正本は SRS FR44 (写さない)。
    relationships: [席, 管理 tick, 開発 session, 裁定の指し示し, 注入の口]
  - canonical: 裁定の指し示し
    domain: consumer
    aliases: [ruling pointer]
    definition: 器の口 seat deliver が、 裁定面の記帳 id 1 つだけを入れた指し示しの雛形の 1 行を待ちの席へ差し込むこと (SRS FR79・ADR-0077)。 裁定の逐語と続きの指示は持たず、 送る前の確かめは管理 tick と同じ入力欄の門。 任意の文を運ぶ注入の口 (seat inject) とは別の口で、 注入の口は器に無い (ADR-0045)。
    relationships: [裁定面, 裁定面の記帳 id, 席, 管理 tick, 状態の打刻, 入力欄の門, 席間の連絡, 注入の口]
    flagged_ambiguities: [口の名 seat deliver はこの口 1 つを指し、 管理 tick・起こし直し・便の終端の周の通知が共用する code の送達の関数の全体ではない]
  - canonical: 裁定面
    domain: consumer
    aliases: [ruling surface]
    definition: 消費側の project が持つ、 user が裁定を書き込む画面と server (器の外の置き場)。 器はこの面を持たず、 面が自分の置き場に裁定を書いた後に裁定の指し示しの口を撃つ (ADR-0077)。 台帳の問いへの答えは、 面が器の答えの口を撃って裁定の行と裁定 event (発話の経路は裁定面) にし、 承認 event にはしない (SRS FR82・ADR-0087)。
    relationships: [裁定の指し示し, 裁定面の記帳 id, 対話面, 消費側, 答えの口, 発話の経路, 裁定 event]
    flagged_ambiguities: [面への書き込みは器の外の置き場への書き込みで、 器の裁定 event・承認 event ではない。 ただし台帳の問いへの答えを答えの口へ渡した分は器の裁定 event (発話の経路は裁定面) になる (ADR-0087)。 承認 event はどの分も受けず、 器が承認を受ける面は対話面 1 つのまま]
  - canonical: 裁定面の記帳 id
    domain: consumer
    aliases: [記帳 id]
    definition: 裁定面が自分の置き場で裁定に付けた識別子。 裁定の指し示しの口が受けて送る行に入れる外からの値はこれ 1 つで、 形の規範は SRS FR79 (写さない)。
    relationships: [裁定面, 裁定の指し示し, 裁定 id]
    flagged_ambiguities: [器の裁定 id (器が打った裁定 event の時刻) とは別の entity で、 器は記帳 id の実在も中身も確かめない]
  - canonical: 入力欄の門
    domain: consumer
    aliases: [input gate]
    definition: 器が席の入力欄へ 1 行を送る前に入力欄を読み、 人の打ちかけや読めないときには 1 key も送らない仕組み (ADR-0058)。 管理 tick の打刻の合図・群の通知・便の終端の周の通知・裁定の指し示しが同じ 1 本を通る。
    relationships: [管理 tick, 打刻の合図, 裁定の指し示し, 便の終端の周の通知, 状態の打刻]
  - canonical: 注入の口
    domain: consumer
    aliases: [seat inject]
    definition: 席の入力欄へ任意の文を送る subcommand。 器に無い (ADR-0045 で廃止・不在は歯が測る)。 裁定の指し示しの口とは別。
    relationships: [席間の連絡, 裁定の指し示し]
  - canonical: 便の終端の周の通知
    domain: consumer
    aliases: [pipe notify]
    definition: 器の dispatcher が便の終端の周に orchestrator の席の入力欄へ送る 1 行 (落ちた便の段か、 起こした便 0 で候補の在る周の idle)。 形と契機は設計 dispatcher.md §19 / §21 が持ち、 SRS FR44 の差し込みの用途の列の 1 つ。
    relationships: [便の終端の周, dispatcher, 入力欄の門, 席間の連絡, 局面の出力, 処置の待ち]
    flagged_ambiguities: [pipeline の設計の段の通知 (段ごとに stderr と record へ残す行) とは別]
  - canonical: 契約表
    domain: consumer
    definition: tracked な設計 doc が末尾に持つ機械が読む区間の表。 1 行 = 契約 1 本で、 契約の正本 (SRS FR47・ADR-0023 §2.1)。 欄の集合の正本は core の型で、 文書は生成物 contracts/schema.toml を pointer で指す (ADR-0013 §2.1)。 読み手は rules manifest と同じ 1 組の parser (ADR-0010 §2.1)。
    relationships: [契約, 設計 doc, 設計 pointer, write-set の閉包, 契約 id]
  - canonical: 見込み行数
    domain: consumer
    aliases: [growth]
    definition: 契約表の行の任意の欄 growth が file ごとに宣言する、 その便でその file が増える行数の見込み。 size は既定の 1 file あたりの見込みで、 growth は名指した file だけを上書きする (ADR-0057・contract-source.md §46)。 受付の上限の余地の判定にだけ効き、 上限そのものは gate が測る (憲法 C10)。
    relationships: [契約表, 受付, 上限の余地, write-set]
  - canonical: 上限の余地
    domain: consumer
    aliases: [cap headroom]
    definition: write-set の .rs file の上限 (R-C4-2) と base の行数の差。 受付が file ごとの見込み行数と比べ、 見込みが余地を超える file を名指して断る (contract-source.md §3 / §46・ADR-0057)。 core の合計 (R-C4-1) も見込みの和で同じ式を 1 回。
    relationships: [受付, 見込み行数, write-set, 便]
  - canonical: 設計 pointer
    domain: consumer
    definition: 設計 doc の path と契約 id の対。 intake の入力 (SRS FR53) で、 台帳の bead の受入条件が持つ 1 行でもある (SRS FR2)。
    relationships: [契約表, 台帳, 契約 id]
  - canonical: write-set の閉包
    domain: consumer
    definition: 契約の行が宣言した閉じた型を、 網羅 match・literal 構築・件数 pin で持つ source file の集合 (SRS FR48)。 write-set に足りなければ intake が契約を断る。 字面の走査で求めるため下界であり、 限界は歯が固定する (ADR-0023 §2.3)。
    relationships: [write-set, 契約表, 便, in-loop guard]
  - canonical: 約束の行
    domain: consumer
    definition: 契約表の行の子行。 親の行 id・番号・約束の文・触る file・名指す識別子・歯の完全名・置き場・fixture の形・観測する結果の閉じた 9 欄を持ち、 器はここから write-set と verify と done を導く (ADR-0051 §4)。 欄の集合の正本は core の型 (ADR-0013 §2.1)。
    relationships: [契約表, 契約, write-set の閉包, 歯, Promised の行]
  - canonical: Promised の行
    domain: consumer
    definition: 約束の行を 1 つでも持つ契約表の行。 手書きの write-set と done を持てず、 導出の入力も約束の行から組まれる (ADR-0051 §4)。 手書きの行と導出の行に並ぶ 3 つ目の弁別で、 着地済みの行は移さない。
    relationships: [約束の行, 契約表, write-set の閉包]
  - canonical: 4 象限
    domain: consumer
    definition: 台帳の bead の label intake:memo の有無と受入条件の設計 pointer の有無の組み合わせ (ADR-0051 §4)。 label だけが memo、 pointer だけが契約、 両方在る形と両方無い形は違反で、 台帳 lint が名指す (SRS FR51)。 epic と decision の型の bead と、 label intake:question の台帳の問いは母集団の外 (SRS FR51・ADR-0083)。
    relationships: [台帳, 契約, 設計 pointer, memo の 4 節, memo, 台帳の問い]
  - canonical: memo の 4 節
    domain: consumer
    definition: memo の本文が必ず持つ 4 つの見出し — 出所 (run id・PR・裁定 id・user 逐語の在り処)・観測 (実測の事実)・候補 (0 個以上・却下も書く)・昇格条件 (要件 id か 要 ADR か 要 裁定・機械が判じる引き金の行を 1 つ以上持つ・SRS FR87)。 欠けは台帳 lint が数える (ADR-0051 §4・SRS FR51)。 出所の節の発話は人が読む写しで、 発話からの発端の結びの正本は仕分けの event (SRS FR88・ADR-0087)。
    relationships: [台帳, 4 象限, 引き金, memo, 発端, 仕分けの event]
  - canonical: 台帳の plan
    domain: consumer
    definition: 全設計 doc の契約表の未着地の行から xtask が出す bd の graph の JSON (ADR-0051 §4)。 title・受入条件の pointer 行・親の epic・label・depends の edge・出所の memo への edge を行から写す。 撃つのは席の手番で、 器は台帳へ書かない (ADR-0045 §2)。
    relationships: [台帳, 契約表, 設計 pointer]
  - canonical: 写しの工程
    domain: consumer
    definition: 設計者 (AI) が節の散文の約束を読み、 write-set と verify と done を手で欄に写す工程。 契約の審査で落ちた理由の 87 % の出所で、 ADR-0051 が器の導出に置き換える対象。
    relationships: [約束の行, 契約表, 契約の審査]
  - canonical: 契約の審査
    domain: consumer
    definition: intake の直後に、 契約とそれが実装する設計と要件を lens が読んで判定する段 (SRS FR49)。 実装後の gate の lens (SRS FR9) とは別の段で、 判定が合格でない便は runner を起こさない (ADR-0019 §2.1 の終端の定義に足す・ADR-0023 §2.7)。
    relationships: [lens, 便, Stage, gate]
  - canonical: land の終端
    domain: consumer
    aliases: [着地の終端]
    definition: 着地した便の台帳の close を着地の形で書く器の手の総称で、 経路は 3 つ — main に着地した便の、 公開の字面の走査を通った後の remote への push・push の先端の commit の CI の結果の照合・台帳の close と、 その typed な記帳 (SRS FR50)・vessel 宣言が任意 key remote を持たない repo の、 走査と push と CI の照合を撃たない CI の照合なしの close (SRS FR50)・PR で着地した便の、 merge の後の pipe retire の照合と close (SRS FR96)・ADR-0094。 着地の事実の正本は器の record で、 commit の trailer はそこからの導出面 (ADR-0023 §2.5)。 台帳へ書くのは便の close (close の理由は着地の形) と memo の自動の close (SRS FR93) だけで、 着地の形の close を書くのは land の終端だけ (SRS FR81 (d))。 台帳の問いの裁定の行と close は bind と答えの口の書き (SRS FR82・ADR-0089)。
    relationships: [land, 便, 台帳 adapter, trailer, Completion, 公開の字面の走査, push の先端, 着地の形]
  - canonical: push の先端
    domain: consumer
    aliases: [push tip]
    definition: land の終端が push した main の最後の commit (最後に着地した commit)。 候補の木に並べた順に着地した便のうち先端でない便は、 自分の着地 commit を含む先端の commit の CI の結果で照合する (SRS FR50)。
    relationships: [land の終端, 候補の木, 着地の列]
    # forbidden から外した語（凍った決定記録の本文が使い、folio validate は全文の部分一致で数えるので外す・新しい文では使わない）: 列の先端
    flagged_ambiguities: [着地の列の「先頭」(最初に着地する便) と逆の端, remote の先端 (FR80 が GitHub に問う push の前の値) とは別, "remote の main の先端 (SRS FR96 の PR の照合が読む merge の後の remote の main の最後の commit) とは別", "main の先端 (SRS FR85 の床の検査が撃つ main の最新の commit・push の前後を問わない) とは別"]
  - canonical: 台帳 adapter
    domain: consumer
    definition: 器が台帳へ触る唯一の module。 読みは読み取り専用で、 書きは land の終端の便の close と memo の自動の close (SRS FR50 / FR96 / FR93)、 bind と答えの口の裁定の行と問いの close (SRS FR82) だけ (ADR-0023 §2.2・ADR-0083・ADR-0089)。 起票・受入条件の記帳は席の仕事。
    relationships: [台帳, bd, land の終端, doctor, 裁定の行, 答えの口, memo]
  - canonical: 散文の門
    domain: consumer
    definition: tracked な設計 doc の、 規範の印を持つ文が pointer を持ち数 + 単位を持たないことを CI が確かめる検査 (SRS FR52)。
    relationships: [規範の印, 設計 doc]
  - canonical: 規範の印
    domain: consumer
    definition: 設計 doc の文を規範文と見なす語の閉じた列 (SRS FR52)。 印を持つ文は散文の門の対象。
    relationships: [散文の門, 設計 doc]
  - canonical: 契約 id
    domain: consumer
    definition: "設計 doc の file 名の stem と行の id の対 (doc id # row id) で表す契約の識別子 (ADR-0023 §2.1)。 doc id は append-only で、 台帳の pointer 行・commit の trailer・外部の道具の追跡表が同じ形を鍵にする。"
    relationships: [契約表, 設計 pointer, trailer, 台帳]
  - canonical: trailer
    domain: consumer
    definition: commit の message の末尾の機械が読む行。 器の便の squash commit は契約 id と要件 id の 2 行を既存の便 id の行と 1 組で書き、 着地の事実の record からの導出面で外部の道具が読む唯一の口 (ADR-0023 §2.5)。 器の便でない commit は発端の trailer を 1 行以上持つ (SRS FR92・ADR-0088)。 trailer を持たない既存の commit は「まだ分からない」と読む。
    relationships: [land の終端, 契約 id, 便, event log, 発端の trailer, merge の門]
  - canonical: 直命の表
    domain: consumer
    definition: user が対話面で言った発言を器が 1 件ずつ持つ記録 (event log の DirectiveIssued / DirectiveClosed・ADR-0031 §2.1)。 ADR-0045 §2 (2) で廃止し、 器は持たない (SRS FR65)。 発話 event は SRS FR65 の使い道 (裁定の行の写し元・計測の分類・仕分け済みかの判定・問いの起票との前後の比べ・局面の出力の発話の部品・席が名指す 1 件の読み) にだけ使い、 状態の欄を持たず、 仕分け済みかは別の event から導き、 席の指示文にも復元にも運ばないので、 この表の復活ではない (線引きは ADR-0083 と ADR-0087)。
    relationships: [event log, 出所 pointer, 作業記憶, 対話面, 直命, 決定記録, 発話 event]
  - canonical: 直命
    domain: consumer
    definition: user が対話面 (orchestrator の席) で言った発言のうち、 席の行動を拘束するもの。 器は直命の表を持たず (ADR-0045 §2 (2)・SRS FR65)、 続くかどうかの判定は user が行う。 発話 event (SRS FR82) は直命の記録ではない。
    relationships: [直命の表, 対話面, 承認 event, 発話 event]
    flagged_ambiguities: ["発言 (直命の語) と発話 (発話 event・SRS FR82) は別"]
  - canonical: 決定記録
    domain: consumer
    aliases: [ADR]
    definition: design-intent/decisions/ 配下の 1 決定 1 file の記録 (frozen・改訂は supersede する新 file)。 直命や契約の前提 pointer の宛先の 1 種で、 置き換わった (superseded) ことが直命の確認候補の理由になる (SRS FR65)。
    relationships: [直命の表, 出所 pointer, 憲法]
  - canonical: 対話面の作法
    domain: consumer
    definition: orchestrator の席が user に向けて出す文の形の規則 (信頼度を上位に置く 1 体系・ADR-0032 §2.2)。 則の本文も数も設計 doc dialogue-surface.md が正本で、 orchestrator の雛形が pointer 付きの行で指し、 生成された指示文が運ぶ (SRS FR67・ADR-0045)。
    relationships: [対話面, 役割, 作業記憶, 席の指示文]
    flagged_ambiguities: ["作法: 作業記憶の作法 (FR23・器が守る機械の作法の列) と対話面の作法 (FR67・文の形) は別義"]
  - canonical: 自動圧縮
    domain: consumer
    definition: 開発 session の文脈が上限に達したときに harness が自動で行う要約。 直前の hook で器が現在地と持ち越し分だけの退避物を書く (SRS FR66・ADR-0031 §2.3)。
    relationships: [作業記憶, 席, 対話面]
  - canonical: dispatcher
    domain: consumer
    definition: 台帳から起動の列を導き、 live 便との write-set の交差・受付 (余地・host の memory・同時走行の最大値) を満たす便を、 便の終端の直後・手動の 1 周・介入の印の直後に自動で起こし、 gate を通った便を land して merge する器の口 (SRS FR68 / FR50・ADR-0034・ADR-0045・設計 docs/design/dispatcher.md)。 周期の timer は持たない。 席ではない。
    relationships: [起動の列, 介入, 便, 契約の審査, write-set, 受付]
  - canonical: 起動の列
    domain: consumer
    aliases: [dispatch queue]
    definition: 台帳の open な契約のうち、 dispatcher が起動を待つものの並び。 入る条件・順序・待ちの理由・release で戻す範囲は SRS FR68 が定める (写さない)。 land の順序 (SRS FR50) とは別の実体。
    relationships: [dispatcher, 介入, 着地]
    flagged_ambiguities: ["列: 起動の列 (dispatcher・起動を待つ契約) と着地の列 (pipe/queue.rs・push の順序) と梯子の列 (管理 tick の合図の待ちの列) は別義"]
  - canonical: regate
    domain: consumer
    definition: gate の判定が FAIL の Gated の便を、 裁定の逐語つきで同じ worktree の Implemented へ 1 段戻す器の口 (pipe regate・SRS FR77・設計 docs/design/pipeline.md の節)。 戻された便を dispatcher が拾う条件は SRS FR68 が定める (写さない)。
    relationships: [gate, dispatcher, 起動の列, 便, 所有者の印]
    flagged_ambiguities: ["regate: 本項 (FAIL の Gated の便を Implemented へ戻す口・pipe regate) と追随の再 gate (land の追随で gate を撃ち直すこと・記録の skipped=regate) は別義"]
  - canonical: 所有者の印
    domain: consumer
    aliases: [運転手の札]
    definition: 便を運ぶ器の process (driver) が便の記録に置く所有の印。 無い・印の process が退役・印の process が生きている・在るのに読めない、 の 4 値で読み、 dispatcher の再開の候補の判定と regate の受付が読む (SRS FR68 / FR77・設計 docs/design/dispatcher.md)。 設計 doc の「運転手の札」は同じ実体。
    relationships: [dispatcher, regate, 便]
  - canonical: 受付
    domain: consumer
    aliases: [contract intake]
    definition: 契約 file を便にする前に器が撃つ検査の段。 必須 field・verify の形・allowlist・write-set の余地・host の memory の枠・同時走行の最大値 (SRS FR68) を通った契約だけが便になる (交差の排他は SRS FR39)。 変異検査の並列の枠 (SRS NFR6) とは別。 上限の読み・材料の読み・契約表の検査・宣言と上限の突き合わせ (freeze) は入口の lock の前に 1 周 1 回撃ち、 lock の中の判定はその突き合わせの結果 (有効値と名乗りの語) を借りて宣言を読み直さない (ADR-0059・accepted)。 detect か deny を名乗った宣言の契約では、 lock の前に nextest の検証行を base の木で撃って base で緑の行の本数を残し、 deny の契約は base で緑か測れない行が在れば断る (ADR-0059・accepted)。 preflight は同じ判定を便を作らずに撃つ口。
    relationships: [dispatcher, 並列の枠, write-set, 便, base で緑の行, 名乗りの語, 契約の検証行, 受付の断りの event]
  - canonical: priority
    domain: consumer
    aliases: [契約の priority]
    definition: 台帳の bead が持つ契約の優先度 (P0〜P4)。 起動の列の順序の 2 番目の鍵 (SRS FR68)。 SRS の要件の priority 欄 (必須 / 推奨) とは別。
    relationships: [起動の列, 介入, orchestrator, 台帳]
  - canonical: Reviewed
    domain: consumer
    definition: 便の段の 1 つ。 契約の審査 (SRS FR49) の verdict を持ち、 PASS でない便は runner を起こさず FAIL で終端する (ADR-0045)。
    relationships: [契約の審査, 便, dispatcher]
  - canonical: 介入
    domain: consumer
    aliases: [orchestrator intervention, planner intervention]
    definition: orchestrator が起動の列の順番を動かす typed な印。 first (最優先へ)・hold (止める)・release (戻す) の 3 つで、 台帳の priority は書き換えず、 起動の列の記録として残り、 記録の直後に dispatcher の 1 周を起こす (ADR-0034 §2・ADR-0045・SRS FR68)。 first を持つ契約は床の検査の不合格の間も待たない (器は直す便かを判じない・SRS FR85・ADR-0084)。
    relationships: [dispatcher, 起動の列, orchestrator, 床の検査]
  - canonical: plugin の実体
    domain: consumer
    aliases: [plugin payload]
    definition: Claude Code に渡す plugin の中身 = plugin.json (名乗り)・hooks.json (hook の一覧)・skills (復元と退避の作法) の 3 つ。 前 2 つは gen-manifest の生成物、 skills は tracked の実体。 生成 dir に置く (ADR-0038・設計 docs/design/seat-autonomy.md §14)。
    relationships: [生成 dir, marketplace の source, hook, 導入先の同期]
  - canonical: 生成 dir
    domain: consumer
    aliases: [generated plugin dir]
    definition: plugin の実体を置く repo 内の dir。 置き場は core の定数 1 つが正本 (xtask は tracked の core から読む・NAME と同じ形) で、 gen-manifest が中身を起こし、 xtask check が tracked との drift 0 を測る。 器の作業物 (worktree 群・build 生成物・台帳) と同じ木に置かない (ADR-0038)。
    relationships: [plugin の実体, marketplace の source, 席の起動]
  - canonical: marketplace の source
    domain: consumer
    aliases: [marketplace source]
    definition: marketplace.json の plugins[].source。 plugin の install はこの dir を丸ごと cache へ写す。 repo 全体 (./) でなく生成 dir を指す (ADR-0038)。 marketplace.json 自体は repo root の .claude-plugin に残る。
    relationships: [生成 dir, plugin の実体, 再 install]
  - canonical: 再 install
    domain: consumer
    aliases: [reinstall]
    definition: marketplace の source が変わった後、 各口座 × project で plugin を入れ直す user の手番。 器は代筆せず、 古い install は doctor の導入先の行に古い root として出る (ADR-0038・SRS FR61)。
    relationships: [marketplace の source, 導入先の同期, doctor]
  - canonical: 同時走行の最大値
    domain: consumer
    aliases: [live run cap]
    definition: host で同時に走る live な便の本数の上限。 値は rules 行 pipe.max_live が持ち (user 裁定 id 付き・憲法 C5)、 受付が便を作る前に live な便を数えて値以上の周は typed に断り、 dispatcher はその契約を列に留めて次の契機で再判定する。 走行中の便には効かない。 env・launcher の変数・host の宣言 file には置かない (ADR-0035)。 並列の枠 (変異検査の並列度・memory の枠) とは別。
    relationships: [live な便, 受付, dispatcher, 起動の列, rules 行, 並列の枠]
    flagged_ambiguities: ["上限: 同時走行の最大値 (便の本数・pipe.max_live) と並列の枠 (変異検査の並列度・memory) と上限停止 (口座の使用上限) は別義"]
  - canonical: 着地の列
    domain: consumer
    aliases: [landing queue]
    definition: Gated ∧ verdict PASS の便の並び。 先に gate を通った便が先に着地し (ADR-0021 §2.5)、 順番の鍵は event log の replay で導く。 候補の木はこの列の先頭から積む (ADR-0039)。
    relationships: [land, gate, 候補の木, 追随, 列の長さの上限]
  - canonical: 候補の木
    domain: consumer
    aliases: [candidate tree]
    definition: main の先端に着地の列の先頭から N 本を順に rebase して作る 1 つの worktree。 gate はこの木に対して 1 回撃ち、 緑なら列の順に着地する。 rebase が衝突した便は積まず列から外れて起こし直しへ進む (ADR-0039)。
    relationships: [着地の列, gate, 共通 verify, 衝突, 起こし直し, 列を解く]
  - canonical: 列を解く
    domain: consumer
    aliases: [dissolve the train]
    definition: 候補の木の gate が赤だった周に、 N 本の並びを捨てて先頭 1 本だけの既存の経路 (追随 → 再 gate) に戻すこと。 どの便が赤かの帰属はしない (ADR-0039)。
    relationships: [候補の木, 着地の列, 追随, gate]
  - canonical: 検出線の持ち越し
    domain: consumer
    aliases: [carried detection line]
    definition: 便の diff の patch-id が前周の記録と同じ周に、 前周の検出線 (変異の生存) の record を持ち越しの印付きで写して撃たないこと。 記録が無い・patch-id が違う周は撃つ。 持ち越した値は実測と型で区別する (C10・ADR-0039)。 ADR-0060 (proposed) の後は gate が検出線を撃たないので、 この持ち越しは役目を終える。
    relationships: [検出線, 変異検出線, patch-id, 実測行, 候補の木, 着地後の検出]
  - canonical: patch-id
    domain: consumer
    aliases: [patch id]
    definition: git patch-id --stable が diff の中身だけから計算する指紋。 行番号や base が変わっても diff の中身が同じなら同じ値になり、 衝突無しの rebase で便の diff が変わらなかったことを測る鍵 (ADR-0039)。
    relationships: [検出線の持ち越し, 追随, 衝突]
  - canonical: 列の長さの上限
    domain: consumer
    aliases: [train max]
    definition: 候補の木に積む便の数の上限。 rules 行 land.train_max の値で、 裁定 id 付きで manifest が持つ (C5・ADR-0039)。
    relationships: [rules 行, 裁定 id, manifest, 候補の木, 着地の列]
  - canonical: 席の箱
    domain: consumer
    aliases: [seat box]
    definition: 席 (人と話す claude とその subagent の Bash) の起動行の頭に置く memory 上限付きの systemd の scope (SRS FR59 / NFR6・ADR-0072)。 上限は rules 行 seat.memory_max_mb (MiB・既定 32768・user 裁定 id つき)。 語列と unit 名は封じ込めの箱と同じ 1 関数で、 CPU の重みは付けない。 ADR-0095 の後は job 1 つの値段の箱の CPU の上限を持つ (core 数を読めない周は付けない)。 行が 0 / 読めない周と systemd-run が PATH に無い host は素の行に縮退し、 起動の 1 行の scope= に理由が出る。 溢れて殺されるのは箱の中の process だけで、 claude が死んだ周は管理 tick が起こし直す。
    # forbidden から外した語（凍った決定記録の本文が使い、folio validate は全文の部分一致で数えるので外す・新しい文では使わない）: 席の cgroup の防壁
    forbidden: [seat cgroup]
    relationships: [封じ込めの箱, 席の起動, 起動行の導出, 管理 tick, rules 行]
  - canonical: 封じ込めの箱
    domain: consumer
    aliases: [箱, confinement scope]
    definition: 封じ込めが process を閉じ込める memory 上限付きの囲い (systemd-run --user --scope で作る transient scope)。 上限を超えると殺されるのはその中の process だけ (ADR-0021 §2.2・ADR-0040)。 ADR-0072 で席の箱も同じ語列と unit 名の関数で組む (席は CPU の重みを付けない)。 ADR-0095 で箱の CPU の上限も持つ (語の順は MemoryMax → CPUWeight → CPUQuota → OOMPolicy)。
    relationships: [封じ込め, 箱の上限の 2 種, 実装役の箱, 検証行の箱, 箱の CPU の上限]
  - canonical: 箱の上限の 2 種
    domain: consumer
    aliases: [two limit kinds]
    definition: 封じ込めの箱の上限の決め方の 2 通り。 PerJob(n) = n × gate.job_memory_mb と HostReserve = MemTotal − host.reserve_memory_mb。 実装役・審査役・claude の箱は PerJob(1)、 検証行の箱は HostReserve (ADR-0040)。
