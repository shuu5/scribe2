  - canonical: 決定はしご
    domain: consumer
    aliases: [decision ladder]
    definition: 変更を提案・実装する前に通る段 (rung) の列 (要るか → 既に在るか → 標準 library か入っている依存で足りるか → 1 行で書けるか → 最小実装)。 段の順は憲法 C17 の条文の記述が正本で enum の宣言順ではなく、 最初に成立した段で止まる。 走査・record・rules 行・仕掛けを足す提案が先に消すものを名指す義務は C17.2。 出所は ADR-0044 (研究 RESEARCH-ponytail §2)。 機械の面は既に在る 過剰設計 5 観点 と 便の規模の record で、 判断は lens と 契約の審査 の散文に残る。
