  - canonical: host の根
    domain: consumer
    aliases: [host root]
    definition: state dir の親の下の host 用 dir (NAME-host)。 同じ host の全 project が共有する置き場で、 受付札 (並列の枠・ADR-0021 §2.3) と群の置き場 (群の今の口座の記録・移動を頼む記録・群の段の lock と履歴・ADR-0049) がここに在る。 env を読まず state dir から導く。 state の真実は置かない (憲法 C3)。
