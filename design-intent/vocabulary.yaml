  - canonical: 実効の口座
    domain: consumer
    aliases: [effective role account]
    definition: 役割の席が使うと器が役割ごとに解く口座 (ADR-0041)。 器は持たず、 群の今の口座に置き換わった (ADR-0049)。 席の口座は群の今の口座か口座の引数か session 用の口座選定 (SRS FR36) で決まり (SRS FR59)、 便用の除外は便の repo を anchor に持つ席の登録 row の口座と各群の今の口座 (SRS FR36)。
