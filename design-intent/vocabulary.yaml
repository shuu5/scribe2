    flagged_ambiguities: ["裁定の行 (台帳の notes の 1 行) と判断の欄 (rules 行の ruling 欄・ADR の approval の裁定の欄・設計の節の裁定の欄) は別"]
  - canonical: 問い id の形
    domain: consumer
    definition: 裁定 id の閉じた 3 形の 1 つで、 器の口 (seat ruling bind と答えの口) が発行する形 (問いの bead の id・コロン・UTC の年月日と時分・ハイフン・通し番号。 器の口が発行する通し番号は 1・SRS FR82・ADR-0087)。 通し番号の欄は消費側の台帳の行の形と揃えるために持つ。 引用に数えるのは問いの部分が repo の台帳の id の接頭辞で始まるものだけで、 ほかの接頭辞の同じ形の字面 (test の見本など) は数えも断りもしない。 判断の欄はこの形の数える id を要る (SRS FR83)。
    relationships: [裁定 id, 台帳の問い, 判断の欄, 答えの口]
  - canonical: 時刻の形
    domain: consumer
    definition: 裁定を user と UTC の時刻だけで指す引用の形 (台帳の問いに結べない)。 opt-in の線より前の引用は数えるだけにし、 線の後に足された引用は、 vessel 宣言の ruling-fixtures の一覧に同じ字面が在るものを除き、 受付と着地で断る (SRS FR83)。
    relationships: [裁定 id, opt-in の線]
  - canonical: opt-in の線
    domain: consumer
    definition: vessel 宣言の ruling-check が main の履歴で初めて true になった commit (SRS FR83)。 線より前から在る時刻の形の引用は数えるだけにする。
    relationships: [vessel 宣言, 時刻の形, 裁定 id]
  - canonical: close-check
    domain: consumer
    aliases: [閉じの門への加わり]
    definition: vessel 宣言の任意 key で、 値は真偽だけ (ADR-0097)。 true を持つ repo の席の close に、 起票の門の close の段 (理由の無い close・close の理由の文法の外・席の着地の形・理由を渡せない口を断る) が掛かる。 false・key が無い・宣言 file が HEAD に無い・git を撃てない repo には掛からず、 宣言が在って読めない repo には同じ判定が掛かる。 局面の出力は、 main の先端の宣言が true を持つ repo の閉じだけを、 close-check の線より後に限って misfit に数える (SRS FR90)。 key を知らない古い binary は key を持つ宣言を丸ごと読めない。
    relationships: [vessel 宣言, 任意 key, 起票の門, close の理由の文法, close-check の線]
  - canonical: close-check の線
    domain: consumer
    definition: 局面の出力の全部の書き直しが main の先端の vessel 宣言で close-check を初めて true と読んだ時刻。 state dir ごとに 1 度だけ記帳し、 後の書き直しは動かさず、 切り替えの線より前にはならない。 閉じに由来する misfit はこの線より後の閉じだけに掛ける (SRS FR90・FR91)。
    relationships: [close-check, 切り替えの線, misfit]
    flagged_ambiguities: ["close-check の線 (閉じの misfit の数えの境・SRS FR90) と opt-in の線 (ruling-check が main の履歴で初めて true になった commit・SRS FR83) と切り替えの線 (この版の器の最初の全部の書き直し・SRS FR90) は別"]
  - canonical: 判断の欄
    domain: consumer
    definition: 裁定を引くべき欄の閉じた 3 種 (rules 行の ruling 欄・ADR の approval の裁定の欄・設計の節の裁定の欄)。 着地の差分が足すか変える判断の欄は、 問いの部分が台帳の接頭辞で始まる問い id の形の裁定 id を要り、 台帳の bead の id だけの引用は数えない (SRS FR83)。 vessel 宣言の ruling-check を true から外す差分も同じく裁定 id を要る。
    relationships: [裁定 id, 問い id の形, rules 行, 決定記録, 設計 doc]
  - canonical: 未反映の裁定
    domain: consumer
    aliases: [unreflected ruling]
    definition: effect が document の閉じた台帳の問いの裁定 id のうち、 main の追跡された file が 1 つも引かないもの (SRS FR84・ADR-0083)。 経過時間では判じず、 vessel 宣言の ruling-check に依らず数える。 その id を引く契約と問いに blocks される契約だけを起動の列で待たせ、 着地の留めに掛ける (SRS FR10)。
    relationships: [台帳の問い, effect, 裁定 id, 起動の列, alarm, doctor]
  - canonical: 床の検査
    domain: consumer
    aliases: [floor check]
    definition: vessel 宣言の任意 key floor-check が名乗る、 main がこれだけは通るべきと repo が決めた最低限の検査の 1 行を、 dispatch の周に main の最新の commit ごとに 1 回撃つ検査 (SRS FR85・ADR-0084)。 rc 0 だけが合格で、 不合格の間は介入 first の印を持つ契約 (直す便かは判じない) のほかは起動の列の全部の契約が待つ。 時間の上限は rules 行 floor.timeout_s が持つ。 便ごとの gate とは別。
    relationships: [vessel 宣言, 起動の列, 封じ込め, 禁じる語列, alarm, doctor, gate]
    flagged_ambiguities: ["床: 床の検査 (main の最低限の検査・SRS FR85) と、 管理 tick の段の床 (ADR-0058・設計 seat-heartbeat の段) と、 thread 本数の下限 (1 の床) は別義。 SRS は裸の「床」を書かず「床の検査」と書く"]
  - canonical: alarm
    domain: consumer
    definition: 管理 tick の打刻の合図の末尾に足す閉じた語 (unreflected・floor・unsorted・owned)。 置き場の file だけを読んで決め、 台帳も git も撃たない (SRS FR27)。 unsorted は局面の出力に未仕分けの発話 (SRS FR88) が 1 つ以上在る周、 owned は局面の出力が持つ席の手番の閾値越え (SRS FR90) の件数が 1 以上の周で、 どちらも局面の出力の値を読むだけで、 局面の出力が古さの印を持つ周は unsorted と owned の語に閉じた 1 語 stale を添える (SRS FR27 / FR94・ADR-0087・ADR-0088)。 合図を送らない周の席には届かず、 doctor の行だけが知らせる。
    relationships: [管理 tick, 打刻の合図, 未反映の裁定, 床の検査, doctor, 局面の出力, 未仕分けの発話, 席の手番の閾値越え, 古さの印]
  - canonical: 雛形の合図
    domain: consumer
    definition: 器が席の入力欄へ差し込む行の総称 (SRS FR44 の閉じた一覧 = 起動行・打刻の合図・群の逼迫の通知と移動の通知と退避の合図・park の区画の移動の退避の合図・便の終端の周の通知・裁定の指し示し)。 発話 event はこれを記帳しない (SRS FR82)。
    relationships: [打刻の合図, 便の終端の周の通知, 裁定の指し示し, 発話 event]
  - canonical: message の包み
    domain: consumer
    aliases: [cross-session-message]
    definition: 別の session から届いた message を入力欄へ渡すときの包み。 発話 event はこれを記帳しない (SRS FR82)。
    relationships: [発話 event]
  - canonical: 引き金
    domain: consumer
    aliases: [trigger line]
    definition: memo の昇格条件の節に置く、 機械が判じる 1 行。 形は閉じた 5 つ (再発・同梱・依存・期日・着地)、 1 つでも満ちた memo (昇格の行が全部の memo は判じない) は引き金の満ちた memo になり、 keep の記帳の無いものは memo の局面で処置の待ち (memo-actionable) に出る (SRS FR87 / FR91・ADR-0085・ADR-0089)。 読める引き金の行を持たず memo-promoting にも memo-asking にも当たらない memo は misfit (memo-actionable より先に判じる)。 引き金の行を持たない memo の create と、 昇格条件の節を引き金の行の無い本文へ書き換える update は起票の門が断る (SRS FR81)。 字面の文法は設計 doc (ledger-form) が持つ。
    relationships: [memo, memo の 4 節, 引き金の満ちた memo, 起票の門, 処置の待ち, memo の局面]
  - canonical: memo
    domain: consumer
    definition: 台帳の bead のうち label intake:memo を持ち、 受入条件の設計 pointer を持たない覚え書き (契約にする前の段・4 象限)。 本文に memo の 4 節を持ち、 起動の列に入らず (SRS FR68)、 昇格条件の節に引き金の行を持つ (SRS FR87)。 開いた memo は memo の局面の 4 語のどれかにいて (当たらない memo は misfit)、 close の理由は close の理由の文法の memo の 3 形 (昇格済み・まとめた・見送り) に限る (SRS FR91・ADR-0089)。
    relationships: [4 象限, memo の 4 節, 引き金, 昇格, 台帳, memo の局面, 処置の待ち, 昇格の行, close の理由の文法, 発端, 案件]
  - canonical: 昇格
    domain: consumer
    aliases: [promote, promotion]
    definition: memo を契約へ上げる処置 (memo の審査の判定の値は promote)。 memo の acceptance に設計 pointer を書いて契約にする形と、 memo を残して契約を分け、 notes に昇格の行を足して分けた契約から discovered-from を張る形の 2 つ (SRS FR91・ADR-0089)。 器は自分では行わず、 処置の待ちの memo を知らせる (SRS FR87 / FR91)。
    relationships: [memo, 引き金の満ちた memo, 処置, memo の審査, 契約, 昇格の行, discovered-from, 処置の待ち]
  - canonical: 引き金の満ちた memo
    domain: consumer
    aliases: [昇格の待ち]
    definition: 引き金の行が 1 つでも満ちた memo (SRS FR87・ADR-0085 の呼び名は昇格の待ち)。 昇格の行が全部の memo は判じない (SRS FR87・ADR-0089)。 keep の記帳の無いものは memo の局面で処置の待ち (memo-actionable) にいて、 処置が付くまで起こす便が 0 の周の便の終端の周の通知が知らせ直し、 知らせと台帳の lint が数えるのは局面が memo-actionable の memo (SRS FR87 / FR51 / FR91)。
    relationships: [memo, 引き金, 処置, 便の終端の周の通知, doctor, 処置の待ち, memo の局面]
    flagged_ambiguities: [引き金の満ちた memo (SRS FR87) と処置の待ち (memo-actionable・SRS FR91) は別。 満ちた引き金に keep の記帳が付いた memo は memo-waiting で、 処置の待ちは処置の無い昇格か close の審査の判定を持つ memo と、 昇格の行を持ち辿れる開いた契約が無く自動の close の条件を満たさない memo も含む, 昇格の待ちは ADR-0085 (frozen) の呼び名で、 SRS は使わない]
  - canonical: 処置
    domain: consumer
    definition: 処置の待ちの memo (memo-actionable) に orchestrator の席が付ける始末の閉じた 4 種 (昇格・close・引き金の書き直し・keep の記帳)。 付くまで器は周ごとに知らせ直す (SRS FR87)。 昇格は 2 つの形で、 close の理由は memo の 3 つの形 (昇格済み・まとめた・見送り) に限る (SRS FR91・ADR-0089)。
    relationships: [引き金の満ちた memo, 昇格, memo, orchestrator, 処置の待ち, close の理由の文法]
  - canonical: memo の審査
    domain: consumer
    definition: 引き金の満ちない memo のうち間隔 (rules 行 memo.triage_interval_h) の過ぎたものを、 起こす便が 0 の周に本数 (rules 行 memo.triage_per_round) まで読むだけの lens に掛ける段 (SRS FR87・ADR-0085)。 判定は promote / close / keep で、 器は判定で memo を close せず台帳に書かない。 口座は便用の規則で選び、 封じ込めの内側で撃つ。
    relationships: [memo, lens, 昇格, 封じ込め, 口座選定, dispatcher]
    flagged_ambiguities: ["memo の審査 (memo を読む lens・SRS FR87) と、 契約の審査 (intake の直後に契約を読む lens・SRS FR49) と、 事前審査 (起動の列の待ちの行に受付の断りを予想する段) は別の段"]
  - canonical: 事前審査
    domain: consumer
    definition: dispatcher が起動の列の待ちの行に先に掛け、 受付が断りうる理由を予想して置き場の file に残す段 (設計 dispatcher)。 結果は待ちの理由・起こす判定・受付のどれも読まない (予想は通行証にしない)。
    relationships: [dispatcher, 起動の列, 受付]
    flagged_ambiguities: ["事前審査 (予想・lens を撃たない) と契約の審査 (SRS FR49・lens の判定) は別"]
  - canonical: 選択式の問いの遮断
    domain: consumer
    aliases: [choice question block]
    definition: 器の plugin の hook の入口が、 marker が器の NAME を言う repo で AskUserQuestion を実行の前に deny し、 問いの経路を告げること (SRS FR86・ADR-0084)。 通す値も切る rules 行も例外の印も持たない。
    relationships: [hook, 問いの経路, 台帳の問い, marker, 極性一覧]
  - canonical: 問いの経路
    domain: consumer
    aliases: [question route]
    definition: 選択式の問いを止めた周に器が告げる道 (SRS FR86・ADR-0084)。 平文の返答で問うことと、 user の裁定が要る問いを台帳の問い (SRS FR81) として立てることに、 vessel 宣言の任意 key question-route の 1 行が加わる。
    relationships: [選択式の問いの遮断, 台帳の問い, vessel 宣言]
  - canonical: 常設の memo
    domain: consumer
    definition: 昇格しない控え (裁定の控え・方針の一覧) としての memo の型。 器は持たない (SRS FR87・ADR-0085・裁定 2026-09-28T07:47Z)。 方針は ADR と設計 doc に、 裁定は台帳の問いに置き、 状態 pinned も memo を判定から外さない。
    relationships: [memo, 台帳の問い]
  - canonical: 候補なしの理由
    domain: consumer
    aliases: [no-candidate reason, NoCandidateReason]
    definition: 口座選定が候補を返さない周の閉じた型の 4 語 (over-threshold・all-limited・unmeasured・excluded の宣言順・excluded は SRS FR36 の session 用の除外集合に当たる口座)。 選定は口座ごとに 1 つを付け、 外れた口座の語のうち宣言順で前の 1 つに畳む。 口座が 0 の周は unmeasured。 席の起動の断りの行に載る (SRS FR36 / FR69・ADR-0086・憲法 C2)。
    relationships: [口座選定, 席の起動, 妥協の起動]
  # ---------------------------------------------------------------- 案件の一生: 発話の仕分けと席の問い・局面の出力と継ぎ目・memo の局面と処置 (SRS v0.29・ADR-0087〜0089)
  - canonical: 仕分け
    domain: consumer
    aliases: [sorting, 発話の仕分け]
    definition: user の発話の行き先を決める閉じた 3 つの形 (SRS FR88・ADR-0087)。 要望 (開いた memo へ発端として結ぶ・仕分けの event の sorting は request)・答え (台帳の問いへ結んで裁定にする・裁定 event)・会話 (台帳を変えずに仕分け済みにする・仕分けの event の sorting は chat・3 クラスの承認と runner への回答と go に使った発話も会話で、 承認 event と回答 event には結ばない)。 要望と会話で器は台帳を書かず、 仕分けが正しいかは器が判じない。
    forbidden: [発話の閉じ方]
    relationships: [発話 event, 仕分けの口, 仕分けの event, 未仕分けの発話, 裁定 event, memo, 発端]
    flagged_ambiguities: [仕分け (発話の行き先・SRS FR88) と処置 (memo に付ける始末・SRS FR87) は別, 仕分けの会話 (台帳を変えずに仕分け済みにする形) と会話 id (claude の session の id) は別, ADR-0087 の glossary は未仕分けの発話との部分文字列を避けて発話の仕分けと書く (同じ語)]
  - canonical: 仕分けの口
    domain: consumer
    aliases: [utterance sort]
    definition: 発話の ts と、 要望なら開いた memo の id を受けて、 要望か会話の仕分けを記帳する器の口 (SRS FR88・ADR-0087)。 発話 event が無い周・名指した memo が開いた memo でない周・要望か答えの仕分けを持つ発話に会話を付ける周は何も書かずに理由を名指して断り、 台帳を書かない。
    relationships: [仕分け, 仕分けの event, 発話 event, memo, turn の終わりの止め]
  - canonical: 仕分けの event
    domain: consumer
    aliases: [UtteranceSorted]
    definition: 仕分けの口が要望か会話の仕分けを 1 件記帳する event の kind (actor = machine・key は utterance〔発話の ts〕・sorting〔request か chat〕・bead〔request のときだけ・memo の id〕・ADR-0087)。 発端の結びの正本で (SRS FR88)、 1 つの発話から複数の memo へは複数件。 人由来の event の数えには入らない (SRS FR22)。
    relationships: [仕分け, 仕分けの口, 発話 event, 発端, memo, event log]
  - canonical: 未仕分けの発話
    domain: consumer
    aliases: [unsorted utterance]
    definition: 発話 event のうち、 仕分けの event も裁定 event の結びも持たないもの (SRS FR88・ADR-0087)。 判定は event だけを読む 1 つの関数で、 turn の終わりの判定と局面の出力が同じ入力に同じ結果を出し、 doctor の行と管理 tick の alarm の語 unsorted は局面の出力の判定の結果を読む (SRS FR94)。
    relationships: [発話 event, 仕分け, turn の終わりの止め, 局面の出力, alarm, doctor]
  - canonical: turn の終わりの止め
    domain: consumer
    aliases: [turn-end stop]
    definition: 器が発話 event を記帳する対話の session (runner と lens を除く) で turn が終わる周に、 その session の未仕分けの発話のうち止めでまだ告げていないものが 1 つ以上在れば、 turn の終わりの判定の hook が 1 度だけ終わりを止め、 その session の未仕分けの発話の ts を全部並べて仕分けの口を告げること (SRS FR88・ADR-0087)。 止めた周は、 登録された席の session なら状態の打刻を idle にしない。 告げ済みの未仕分けの発話だけの周は止めず、 判定の入力を読めない周は止めずに読めないことを event に記帳する (fail-open)。 逐語は運ばない (SRS FR65)。
    relationships: [未仕分けの発話, 仕分けの口, hook, 状態の打刻]
    flagged_ambiguities: [止めの理由は器から席の入力欄への差し込み (SRS FR44 の閉じた一覧) ではない]
  - canonical: 発話の経路
    domain: consumer
    aliases: [utterance channel]
    definition: 発話 event・裁定 event・裁定の行が持つ、 字が来た道の閉じた 2 値 (対話の session と裁定面・機械の値は chat と gui・SRS FR82・ADR-0087)。 対話の session は発話の記帳の hook が prompt の入口で記帳した字、 裁定面は答えの口が command の字面の外 (標準入力) で受けた字。 計測は裁定 event を経路ごとに数え (SRS FR22)、 4 欄の既存の裁定の行は対話の session と読む。
    relationships: [発話 event, 裁定 event, 裁定の行, 対話面, 裁定面, 答えの口]
    flagged_ambiguities: [発話の経路 (字が来た道・SRS FR82) と問いの経路 (選択式の問いを止めた周に告げる道・ADR-0084) は別, 発話の経路の値 chat と仕分けの event の sorting の値 chat は同じ字で別の欄]
  - canonical: 答えの口
    domain: consumer
    aliases: [answer mouth, seat ruling answer]
    definition: 裁定面が台帳の問いへの答えを器に渡す器の口 (SRS FR82・ADR-0087)。 問いの bead の id を受け、 逐語を command の字面の外 (標準入力) で受ける。 空白だけの逐語・閉じた問い・台帳の問いでない bead の周は発話 event も書かずに理由を名指して断り、 通る周は発話の経路が裁定面の発話 event と、 bind と同じ書き (裁定 id の発行・裁定の行・close・裁定 event) を 1 周で行って裁定 id を 1 行返す。 承認の受理面でなく承認 event を記帳しない (C7)。 席の道具の呼び出しがこの口の command を撃とうとするときは器の hook の入口が実行の前に断り (起票の門とは別の判定)、 席が起こした子 process の撃ちは門の外。
    relationships: [裁定面, 発話 event, 裁定 event, 裁定の行, 裁定 id, 発話の経路, hook, 承認 event]
    flagged_ambiguities: [答えの口 (裁定を受け承認 event を書かない) と便の承認の口 (承認 event を受ける・SRS FR16) は別]
  - canonical: asked
    domain: consumer
    definition: 台帳の問いの metadata の key で、 問いのきっかけの閉じた 2 値 (SRS FR89・ADR-0087)。 seat は席が user の判断を求めた問い、 user は user の先立つ指示や方針を受けるために席が起こした問い。 create の欠けと値の外は起票の門が断り (SRS FR81)、 asked を持たない問いの結びは doctor の行が asked 無しとして別に数える。 値の正しさは器が判じない。
    relationships: [台帳の問い, 起票の門, 後付けの結び, 裁定 event, effect]
  - canonical: 後付けの結び
    domain: consumer
    aliases: [late-raised binding]
    definition: 台帳の問いが、 結んだ発話より後に起票された結び (SRS FR89・ADR-0087)。 doctor が asked の値ごとの件数と裁定 id で出す。 asked が seat の分は、 席が対話の session だけで問うてから問いを起こした形。
    relationships: [asked, 台帳の問い, 裁定 event, doctor]
  - canonical: 案件
    domain: consumer
    aliases: [case]
    definition: 根の部品 1 つ (memo か台帳の問い) と、 そこから結び (SRS FR90) で辿れる部品と結びの束 (ADR-0088)。 1 つの発話は複数の案件の根へ仕分けられる。
    relationships: [部品, 局面, 手番, 発端, memo, 台帳の問い]
    flagged_ambiguities: [案件 (部品の束) と issue (台帳の bead 1 本) は別の語]
  - canonical: 部品
    domain: consumer
    aliases: [part]
    definition: 局面の出力 (SRS FR90) が局面と手番を導く単位で、 閉じた 9 種 (発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・器の便でない着地の commit・ADR-0088)。 発話の部品は ts・session・行き先だけを持ち逐語を持たない (ADR-0087)。
    relationships: [案件, 局面, 手番, 局面の出力, 発端]
  - canonical: 局面
    domain: consumer
    aliases: [lifecycle position]
    definition: 部品が一生のどこにいるかを表す閉じた語 (SRS FR90・ADR-0088)。 優先の順は enum の宣言順 (C2)。 語の一覧と優先の順・局面と理由から手番への対応・misfit の理由の語の一覧は設計 doc の 1 節が正本で、 memo の局面の語と順は SRS FR91 が持つ。 どの局面にも当たらない部品と SRS FR91・FR92 が定める部品は misfit。
    relationships: [部品, 案件, 手番, 局面の出力, misfit, 便の段, memo の局面]
    flagged_ambiguities: [局面 (部品の位置・SRS FR90) と便の段 (便の進み) と Stage (C2 の選定の enum) は別の語。 便の段の値は便の部品の局面へ写るが、 便の段を局面と呼ばない]
  - canonical: 便の段
    domain: consumer
    definition: 便が一周のどこにいるかを表す閉じた段 (終端の段は Landed・Failed・Stopped・SRS FR68)。 全ての値は便の部品の局面へ漏れなく写り、 局面の理由は便の段と終端の語をそのまま使う (SRS FR90・ADR-0088)。
    relationships: [便, 局面, Blocked, Questioned, Reviewed, 局面の出力]
    flagged_ambiguities: [便の段 (便の進み) と局面 (部品の位置・SRS FR90) と Stage (C2 の選定の enum) と群の段 (群の移動の周の段) は別]
  - canonical: 手番
    domain: consumer
    aliases: [next mover]
    definition: 局面ごとに次に動く番が誰にあるかを表す閉じた 6 値 (user・seat・vessel・runner・ci・none・SRS FR90・ADR-0088)。 局面と理由から手番への対応は設計 doc の 1 節が正本。 手番が seat のまま年齢の閾値を越えた部品 (要件の部品を除く) は席の手番の閾値越え。
    forbidden: [手番を無駄]
    relationships: [局面, 部品, 席の手番の閾値越え, 局面の出力]
    flagged_ambiguities: [手番 (次に動く番・SRS FR90) は量を指さない。 frozen の ADR-0058 の「1 手番を消費」は席の turn の量 (token と手間) の意味の別義で、 局面の出力の手番ではない]
  - canonical: 席の手番の閾値越え
    domain: consumer
    definition: 要件の部品を除き、 手番が seat の部品のうち局面ごとの年齢の閾値 (rules 行 lifecycle.age_h・値は user 裁定 id 付き) を越えたもの (SRS FR90・ADR-0088)。 局面の出力がその件数と最古の 1 件を持ち、 管理 tick の周の部分の書き直しが年齢とともに書き直す。 doctor の行・直近の流れの事実行・alarm の語 owned は出力の値を読むだけ (SRS FR94 / FR42 / FR27)。
    relationships: [手番, 局面の出力, alarm, doctor, 管理 tick]
  - canonical: 局面の出力
    domain: consumer
    definition: 局面の関数の出力で、 state dir の下の fleet/lifecycle.json と同じ dir の古さの印 lifecycle.stale の組 (ADR-0088 が ADR-0004 §2.2 の面 2 を部分 supersede)。 lifecycle.json は版の欄・局面の語の一覧・入力の印・生成の時刻・席の手番の閾値越えの件数と最古の 1 件と、 部品ごとの局面・手番・since・理由・結びを持ち、 一時 file からの rename で丸ごと入れ替わる導出物で、 逐語を載せず、 消えても全部の書き直しで戻る (SRS FR90)。 close した部品を載せる窓は表示にだけ掛け、 局面が終わりでない閉じた部品には掛けない。 読み手は同じ判定の結果を使って自前の判定を持たず、 古い出力を古いと示し、 出力が無いか読めない周は読めないことを示す (SRS FR94)。 器は同じ中身を text で出す口と全部を書き直す口を持つ。
    relationships: [局面, 部品, 手番, 入力の印, 古さの印, 書き直しの契機, 席の手番の閾値越え, event log, state dir]
    flagged_ambiguities: [局面の出力 (lifecycle.json と lifecycle.stale の組・SRS FR90) と lifecycle.json (その本体の 1 file・ADR-0088 の glossary の語) は範囲が違う。 lifecycle.json を局面の出力の別名にしない]
  - canonical: 入力の印
    domain: consumer
    aliases: [input mark]
    definition: 局面の出力と古さの印が持つ、 書き直しが読んだ台帳・event log・main の状態の目印 (SRS FR90・ADR-0088 の値は台帳の印・event log の長さ・main の sha)。 書き手は印が今の file より古い書きを捨て、 読み手は出力の印を自分が読める今の印と比べて古い出力を古いと示す (SRS FR94・比べる組は読み手ごとに設計 doc の 1 節)。
    relationships: [局面の出力, 古さの印]
  - canonical: 古さの印
    domain: consumer
    aliases: [stale mark, lifecycle.stale]
    definition: 局面の出力に付く印で、 本体と同じ dir の file lifecycle.stale (SRS FR90・ADR-0088)。 起票の門が席の道具の呼び出しの台帳の書きを通したときと、 merge の門が器の便でない merge の command を通したときに、 書き直さずに時刻と付けた時点の入力の印を書き、 印を付けた後に始まり、 印の種類に対応する入力の印 (起票の門の印は台帳の印・merge の門の印は main の印) が印の持つ値より新しい全部の書き直しだけが消す (部分の書き直しは消さず、 書きが落ちた周の印は次にその入力が動くまで残る)。 書き直しが入力を読めない周も書き直さずに印を付ける。 読み手はこの印で古い出力を古いと示し (SRS FR94)、 管理 tick は alarm の語に stale を添える (SRS FR27)。 書き直しの契機ではない。
    relationships: [局面の出力, 入力の印, 起票の門, merge の門, 書き直しの契機, alarm]
  - canonical: 書き直しの契機
    domain: consumer
    aliases: [rewrite triggers]
    definition: 局面の出力を書き直す時の 2 層 (SRS FR90・ADR-0088)。 全部の書き直しは dispatch の周・器が台帳を書いた直後 (bind・答えの口・land の終端の close・memo の自動の close)・全部を書き直す口の周で、 event log と時刻で決まる部分 (発話・仕分けで結んだ発端・便の局面・年齢と席の手番の閾値越え・期日の引き金の満ち) だけの書き直しは管理 tick の周と発話 event か仕分けの event の記帳の直後 (台帳も git も撃たず event log の大きさに依らない読み・SRS NFR5)。 席の台帳の書きと器の便でない merge は書き直さず古さの印を置くだけ。
    relationships: [局面の出力, 古さの印, 管理 tick, dispatcher, land の終端, 答えの口]
  - canonical: misfit
    domain: consumer
    definition: 局面の出力で、 どの局面にも当たらない部品と、 SRS FR91・FR92 が定める形 (読める引き金の無い memo・閉じの誤り・台帳に無い発端・event log に無い便を名指す器の便の trailer など) の部品に付ける局面の値 (SRS FR90・ADR-0088・ADR-0089)。 閉じた理由の語 (一覧と字面は設計 doc の 1 節) を添え、 手番は seat。 判定はこの版の land (切り替えの線) より後の閉じ・問いの create・着地の commit だけに掛け、 線の前の記録は数えない (SRS FR90)。
    relationships: [局面, 部品, 発端, close の理由の文法, memo の局面]
    flagged_ambiguities: [切り替えの線 (misfit の判定の境・SRS FR90) と opt-in の線 (裁定 id の引用の数えの境・SRS FR83) は別]
  - canonical: 発端
    domain: consumer
    aliases: [origin]
    definition: 部品を生んだ上流 (SRS FR88 / FR92)。 memo なら生んだ発話で、 その結びの正本は仕分けの event で memo の出所の節は人が読む写し (ADR-0087)。 器の便でない着地の commit なら発端の trailer が名指す台帳の bead (ADR-0088)。
    relationships: [部品, 案件, 仕分けの event, memo, 発端の trailer, merge の門]
  - canonical: 発端の trailer
    domain: consumer
    definition: 器の便でない commit の本文が持つ、 台帳の bead の id を 1 本以上名指す trailer の行 (SRS FR92・ADR-0088)。 名は既存の trailer と同じく NAME から導き (NAME の頭を大文字にした語に -Source・本 repo では Scribe2-Source)、 merge の門が merge の前に、 CI の main の検査が main の先端で形だけを確かめる。 台帳に無い発端は局面の出力が misfit で数える。
    relationships: [trailer, 発端, merge の門, 部品, NAME 定数]
  - canonical: merge の門
    domain: consumer
    aliases: [merge gate]
    definition: 器の hook の入口が、 席の道具の呼び出しの PR の merge の command を実行の前に読み、 渡す commit の本文が発端の trailer か器の便の trailer を持たなければ欠けを名指して断る段 (SRS FR92・ADR-0088)。 trailer の形だけを見て台帳を読まない。 器の便でない merge を通したときは書き直さずに古さの印を置く (SRS FR90)。 事後の検出は CI の main の検査。
    relationships: [発端の trailer, trailer, 古さの印, 着地の列, hook]
  - canonical: 受付の断りの event
    domain: consumer
    aliases: [IntakeRefused]
    definition: 起動の列の周に受付が断った契約ごとに受付が記帳する event の kind (key は bead と refuse・SRS FR68・ADR-0088)。 局面の関数は入力として読むだけ (SRS FR90)。
    relationships: [受付, 起動の列, event log, 局面の出力]
  - canonical: memo の局面
    domain: consumer
    definition: 開いた memo の居場所の閉じた 4 語 (宣言順に memo-promoting＝昇格の途中・memo-asking＝問いの返事待ち・memo-actionable＝処置の待ち・memo-waiting＝引き金待ち・SRS FR91・ADR-0089)。 読める引き金の行を持たず memo-promoting にも memo-asking にも当たらない memo (memo-actionable より先に判じる) と、 どれにも当たらない memo は局面の出力で misfit。 優先は列挙の宣言順だけ。
    relationships: [memo, 局面, 処置の待ち, 引き金の満ちた memo, 引き金, misfit]
    flagged_ambiguities: [memo-actionable (局面の値) と、 前の器が消した棚卸しの印 MEMO-DUE (ADR-0085) は別物]
  - canonical: 処置の待ち
    domain: consumer
    aliases: [memo-actionable]
    definition: memo の局面 memo-actionable の中身 (SRS FR91・ADR-0089)。 引き金が満ちて keep の記帳 (SRS FR87) の無い memo・処置の無い昇格か close の審査の判定を持つ memo・昇格の行を持ち辿れる開いた契約が無く自動の close の条件 (SRS FR93) を満たさない memo (辿れる契約が 0 本を含む) で、 keep の判定を持つ memo と満ちた引き金に keep の記帳が付いた memo は含まない (memo-waiting)。 手番は seat。 便の終端の周の通知・台帳の lint・memo の判定の通知は局面の出力の判定の結果で数える (SRS FR87 / FR51 / FR94)。
    relationships: [memo の局面, 引き金の満ちた memo, 処置, memo の審査, 局面の出力]
  - canonical: 昇格の行
    domain: consumer
    aliases: [promotion line]
    definition: memo を残して契約を分ける昇格で memo の notes に足す閉じた文法の 1 行 (頭の語 昇格 に全部か一部と契約 id の列を続ける形・全部の行はその memo から分けた契約の全部を並べる・字面の正本は ADR-0089・SRS FR91)。 複数在れば最後の行で判じる。 全部の行の memo は引き金の判定と審査から外れ (SRS FR87)、 最後の行が全部で、 行の契約 id の列と discovered-from で辿れる契約の列が一致して 1 本以上在り、 全部が着地の形で閉じ、 子の開いた台帳の問いと処置の無い昇格か close の審査の判定を持たない memo を器が昇格済みの形で閉じる (SRS FR93)。
    relationships: [memo, 昇格, 処置, discovered-from, 着地の形, memo の局面]
  - canonical: close の理由の文法
    domain: consumer
    aliases: [closed-reason grammar]
    definition: bead の close の理由を種類ごとの閉じた形の和に限る決まり (SRS FR91 は形の名だけ・頭の字面の正本は ADR-0089・着地の形の尾は ADR-0094・値の形と語の切り方の正本は設計 docs/design/ledger-form.md §16)。 契約は着地 (landed と着地 commit id)・重複・後継・取り下げ、 台帳の問いと decision の型の bead は裁定 (裁定 id)、 memo は昇格済み (契約 id の列)・まとめた・見送り (裁定 id)、 epic は完了と取り下げの形。 和の外 (理由の無い close を含む) と land の終端の外の着地の形の close は起票の門が字面で断り (SRS FR81 (d)・close-check を宣言した repo と宣言を読めない repo・ADR-0097)、 種類との食い違い・解けない id・自分の裁定の行にも裁定 event にも無い裁定 id・memo の子の問いの裁定でない見送り・まとめ先が開いた memo でないまとめたは局面の出力が misfit で数える。
    relationships: [起票の門, 着地の形, 処置, memo, 契約, 台帳の問い, 裁定 id, misfit, close-check]
  - canonical: 着地の形
    domain: consumer
    aliases: [landed form]
    definition: close の理由が landed と着地 commit id で始まる閉じ (SRS FR50・字面の正本は ADR-0089)。 land の終端だけが書き (CI の結果か CI の照合なしの note と共に・SRS FR50・FR96)、 席の道具の呼び出しのこの形の close は起票の門が断る (SRS FR81 (d)) (close-check を宣言した repo・ADR-0097)。 昇格の行が全部の memo は、 辿れる契約が全部この形で閉じたときだけ器が閉じる (SRS FR93)。
    relationships: [land の終端, close の理由の文法, 昇格の行, 起票の門]
  - canonical: discovered-from
    domain: consumer
    definition: 台帳の依存の辺の種類の 1 つで、 memo を残して契約を分ける昇格で分けた契約から memo へ張る辺 (SRS FR91・ADR-0089)。 memo から辿れる開いた契約が在れば memo は memo-promoting で、 辿れる契約の列が最後の昇格の行の列と一致しない memo は自動の close をされない (SRS FR93)。
    relationships: [昇格, 昇格の行, memo の局面, 台帳]
  # ---------------------------------------------------------------- 席の指示文の出所の印 (ADR-0090)
  - canonical: 出所の印
    domain: consumer
    definition: 席の指示文の雛形の各行の末尾に置き、 その後ろが器の repo の文書への出所 pointer だと示す字 (→ 器の SSOT:・ADR-0090)。 前の版の字 (→ SSOT:) だけを持つ行は pointer を持たない行と読む。 字の正本は器の中の定数 1 つで、 xtask が同じ字の写しを持つ。
    relationships: [出所 pointer, 席の指示文, 分類できない参照]
  - canonical: 分類できない参照
    domain: consumer
    definition: 出所の印の後ろに在るが PointerKind のどの形にも当たらない参照 (ADR-0090)。 1 本でも持つ行は雛形の違反で、 行の分類は最初の 1 本の字を持つ値を返す。
    relationships: [出所の印, 出所 pointer, 席の指示文]
  - canonical: 群の表
    domain: consumer
    aliases: [group table]
    definition: host の面が持つ置き場のかたまりの宣言の表 (SRS FR38・FR57)。 行の名は Tier1〜Tier9 に限り、 Tier1〜Tier8 の行は群 (口座を占め、 群の今の口座を持つ) を、 Tier9 の行は park の区画 (口座を占めない・SRS FR95) を宣言する。 SRS で修飾の無い「群」は Tier1〜Tier8 の行の群だけを指す (ADR-0091)。
    relationships: [project の群, park の区画, host の面, 隣の private repo]
  - canonical: park の区画
    domain: consumer
    aliases: [park lot, Tier9]
    definition: 群の表の名 Tier9 の行が宣言する置き場のまとまり (SRS FR95・ADR-0091)。 群ではなく、 群の今の口座・種・群の予約・群の移動の判定・移動を頼む記録を持たず、 park の区画の行が並べた口座と置き場の席の row の口座は、 口座選定・群の移り先・群の予約のどれからも除かない。 席は口座の引数か行が並べた口座からの session 用の選定の口座に居て、 park の移り先の判定が口座を返した周だけ移る。 heartbeat の既定は off (SRS FR78)。
    forbidden: [park の群, 普通の群]
    relationships: [群の表, park の移り先の判定, 口座選定, heartbeat の実効の値, 隣の private repo]
    flagged_ambiguities: [群でないものに群の名を付けない (park の群・普通の群は禁止語)]
  - canonical: park の移り先の判定
    domain: consumer
    aliases: [park move target]
    definition: park の区画の席の移り先の口座を返す判定 (SRS FR95・ADR-0091)。 row の口座の計測の記録の最新値が session 用の閾値 (SRS FR36) のいずれか以上の周だけ口座を返す。 条件の全部は SRS FR95 が持つ。
    relationships: [park の区画, 口座選定, 管理 tick, 計測]
    flagged_ambiguities: [群の移動の判定 (SRS FR38・ADR-0066) とは別]
  - canonical: 公開の除外の表
    domain: consumer
    aliases: [publish exclusion table]
    definition: host の面が持つ、 隣の private repo の名の当たりを数えない無害な字句の表 (SRS FR80・ADR-0093)。 字句のまま持ち、 行は裁定 id を持つ (欄が無いか空の行を持つ面は SRS FR57 の読みで断る)。 行を求める台帳の問いは effect を operation で立てる (document で立てた問いは未反映の裁定 〔SRS FR84〕 に数えられ、 待たせる側に倒れる)。 字句は台帳の問いと裁定の行にも残る (台帳の同期先は公開の面でない)。
    forbidden: [除外の一覧の digest]
    relationships: [識別子の 4 形, 公開の字面の走査, host の面, 隣の private repo]
    flagged_ambiguities: [口座選定の除外 (SRS FR36 の便用の除外・除外集合) とは別]
  - canonical: PR で着地した便
    domain: consumer
    aliases: [PR-landed run]
    definition: --pr-cmd の形で Landed に達し、 main を動かさず自 repo への PR を作った便 (SRS FR96・ADR-0094)。 land の終端の push の経路 (SRS FR50) の外に置く。 台帳の close は PR の merge の後に器の口 pipe retire (便 1 本を名指す形は席の決着の権能・それ以外は launch の権能の口・ADR-0097) が、 merge の commit が remote の main の先端の祖先であることと先端の CI の success を照合してから着地の形で撃ち、 畳むだけの指定 (--fold-only) は照合も close もせずに畳む。
    relationships: [自 repo への PR, land の終端, 着地の形, 便]
  - canonical: heartbeat の実効の値
    domain: consumer
    aliases: [effective heartbeat]
    definition: 管理 tick が席へ合図を送るかを決める on / off (SRS FR78・ADR-0092)。 明示の記録 → 群の表の行の任意 key heartbeat → 種類の既定 (群は on・park の区画は off・どの行にも属さない席は on) の順で決まり、 決まり方を explicit・group・default の閉じた 3 語で名乗る。
    relationships: [明示の記録, 決まり方, 打刻の合図, 群の表]
    flagged_ambiguities: [実効の口座 (役割の席の口座・器に無い) と実効 jobs とは別義]
  - canonical: 決まり方
    domain: consumer
    aliases: [heartbeat source]
    definition: heartbeat の実効の値がどこで決まったかを名乗る閉じた 3 語 (SRS FR78)。 explicit = 明示の記録 (2 つとも在る・読めない周の off を含む)・group = 群の表の行の key・default = 種類の既定 (群の表のどの行にも属さない席を含む)。
    relationships: [heartbeat の実効の値, 明示の記録]
    flagged_ambiguities: [口の default (明示の記録を両方消す操作) と決まり方の default (種類の既定で決まったこと) は別]
  - canonical: row の口座
    domain: consumer
    aliases: [登録 row の口座]
    definition: 席の登録 row が持つ口座 (SRS FR40)。 群の表のどの行にも属さない席の起こし直しの口座で、 park の区画の席では park の移り先の判定が口座を返さない周の起こし直しの口座 (SRS FR95・ADR-0091)。 群の席は row の口座でなく群の今の口座に居る。
    relationships: [登録 row, park の区画, park の移り先の判定, 群の今の口座, 口座選定]
  - canonical: session 用の閾値
    domain: consumer
    aliases: [session selection threshold]
    definition: session 用の口座選定が候補にする口座の使用率の上限の rules 行 (SRS FR36・今の行は R-C9-1 の 1 本・窓別の行は user 裁定で足す)。 この値未満の口座だけが候補になり、 park の区画の席が移る線もこの行のいずれか以上 (SRS FR95・ADR-0091)。
    relationships: [口座選定, rules 行, park の移り先の判定]
    flagged_ambiguities: [群の逼迫の閾値 (5 時間窓・7 日窓・モデル別窓の rules 行 3 本・SRS FR38) とは別]
  # ---------------------------------------------------------------- 箱の CPU の幅 (ADR-0095)
  - canonical: 箱の CPU の上限
    domain: consumer
    aliases: [box CPU quota, CPUQuota]
    definition: 封じ込めの箱と席の箱に付ける CPU 時間の上限 (systemd の CPUQuota・ADR-0095)。 受付が配った行は job 数 × thread 数 × 100% (縮退と測れない周は 100%)、 それ以外の便の箱と席の箱は job 1 つの値段 × 100%。 core 数を読めない周は付けない。 CPU の重み (gate.cpu_weight) とは別で、 上限の中の Rust の道具は読む core 数が上限の幅まで縮む。
    relationships: [封じ込めの箱, 席の箱, job 1 つの値段, 並列の枠]
    flagged_ambiguities: [箱の上限の 2 種 (memory の上限の種) とは別]
  - canonical: core 数の読み口
    domain: consumer
    aliases: [host core reader]
    definition: 受付と器の健康の遮断器と箱の CPU の上限が読む host の core 数の 1 本 (ADR-0095)。 この process の /proc/self/status の Cpus_allowed_list の区間の列を数え、 affinity と cpuset は数に効き、 cgroup の CPU 時間の上限は効かない (席の箱の中の driver も host の core 数を読む)。 環境変数は読まない。
    relationships: [job 1 つの値段, 並列の枠, 器の健康の遮断器, 箱の CPU の上限]
  # ---------------------------------------------------------------- 席の起草の置き場 (ADR-0096)
  - canonical: 起草の置き場
    domain: consumer
    aliases: [seat drafts area]
    definition: 席ごとに器が持つ、 試作の repo の写しを置く dir (state dir の seat の下の、 潰した target の dir の drafts・ADR-0096)。 器は dir を作らず、 席の指示文の 12 行目が絶対 path を渡し、 席の git が写しを作る。 運転手の終端の周の掃除が、 置き場の .git を持つ写し (起草の木) から、 書きの線より前の中間生成物だけを消し、 写しは消さない。
    relationships: [席の指示文, 中間生成物, 書きの線, 退役]
    flagged_ambiguities: [Claude Code の session の一時 dir (器の外・器は掃かない) とは別]
  - canonical: 書きの線
    domain: consumer
    aliases: [write cutoff]
    definition: 今から rules 行 seat.drafts_stale_h の時間を引いた時刻 (ADR-0096)。 起草の木の中間生成物の dir は、 その dir 自身と下の全 entry の mtime の最新がこの線より前のときだけ消える。 便の worktree には掛けない。
    relationships: [起草の置き場, 中間生成物, rules 行]
