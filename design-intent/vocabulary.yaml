    flagged_ambiguities: ["実効: 実効の口座 (役割の席が使う口座・器に無い) と実効 jobs (変異検査の並列度) は別義", "実測の口座と 1 字差: 実効 = 器が解く口座 / 実測 = session の開始時に測った現物の口座"]
  - canonical: 実測の口座
    domain: consumer
    aliases: [measured account, 実口座]
    definition: session の開始時に器が測って出所付きで記録していた、 その session が実際に立っている口座 (歴史的な語)。 管理 tick とともに ADR-0045 で廃止し、 席の口座は登録 row の値 (実効の口座の写し) だけが持つ (SRS FR71)。
    relationships: [実効の口座, 席の登録 row]
  - canonical: 実効の記録
    domain: consumer
    aliases: [effective role record]
    definition: 役割の実効の口座を器が host の根に役割ごとに高々 1 件書く記録 (role と口座 label と ts・ADR-0041)。 器は持たず、 群の今の口座の記録に置き換わった (ADR-0049)。 SRS の glossary も同じ扱い (FR36 / FR59 は読まない)。
    relationships: [実効の口座, 役割の口座, host の根, 群の今の口座]
  - canonical: 妥協の起動
    domain: consumer
    aliases: [compromise launch]
    definition: 閾値未満の口座の候補が無い周に、 上限に当たっていない測れた口座のうち閾値以上の口座、 それも無ければ他の役割の口座との同居も入れた口座で席を起こすこと (ADR-0041 の 2 段・設計 docs/design/seat-roles.md §18)。 器は持たず、 席の起動は理由の語 no-account と候補が無い理由の閉じた 4 語で断る (SRS FR69・ADR-0086 が ADR-0041 のこの部分を supersede・裁定 2026-09-28T09:04Z)。 群の移動も妥協しない (ADR-0049)。
    relationships: [実効の口座, 実効の記録, 口座選定, 席の起動, 妥協の通知, 候補なしの理由]
    flagged_ambiguities: ["over-threshold: ADR-0041 の妥協の段の名 (閾値以上でも当たっていない口座で起こす段) と、 SRS FR69 の断りの理由の語 (閾値以上の実測だけで候補が無い) は同じ字で別義。 前者は器に無い"]
  - canonical: 妥協の通知
    domain: consumer
    aliases: [compromise notice]
    definition: 既に立っている席の口座が閾値以上で選び直しの候補が無い周に、 管理 tick が同じ口座・同じ窓につき 1 回だけ注入する合図 (ADR-0041・設計 docs/design/seat-roles.md §18)。 器は持たない (役割の選び直しは ADR-0049 で群の移動に置き換わり、 群の移動は候補が無い周に移らず通知する・SRS FR38)。
