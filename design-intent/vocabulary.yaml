# scribe2 canonical vocabulary (P-5: 1 entity = 1 canonical name)
#
# edit-SSoT: 本 file (Layer 1 consumer は flip しないため vocabulary.yaml が編集の正本、 folio ADR-0051 §2.3)。
# 出所: input/SPEC-excerpt.md §5 (OSS 依存) の用語を全件、 加えて §2 憲法 / §4 技術選定が使う概念を登録する。
#   §5 の owning spec (依存一覧の design-intent 文書) は未作成のため、 §5 由来の語は本 file が唯一の登録箇所。
# schema (folio rules §3): terms[] = { canonical (MUST), domain, definition (1 行), forbidden[], relationships[], flagged_ambiguities[] }
#   - domain: consumer = scribe2 所有の語 (folio が解説しない)。
#   - definition は「語が何を指すか」の指示的定義 + 条 id の参照に限る。 義務文と数値は書かない (正本は憲法の条と §3 rules 行)。
#   - definition は単一行で、 生の < > を書かない (矢印は → で表現)。
#   - forbidden は folio validate の vocabulary gate (substring 検出) に使うため、 本文に正当に現れ得る語は載せない。
#   - canonical 表記は SPEC の日本語表記を正とし、 型名そのものが概念の場合は型名 (大文字始まり) を canonical にする。
#   - 「面」の family は 提示面 / 対話面 / drift の面 を個別に登録する (構成要素「面」は語彙にしない)。
terms:
  # ---------------------------------------------------------------- §5 見出し (manifest / doctor)
  - canonical: manifest
    domain: consumer
    definition: repo 内 1 file (TOML) に置く、 規則の値・設定・依存の版の唯一の置き場。 形式と読み方の規範は C1、 照合は doctor。
    forbidden: [マニフェスト]
    relationships: [rules 行, doctor, 裁定 id]
  - canonical: doctor
    domain: consumer
    definition: 全 host の版・口座・退役・rules 行を照合する 1 コマンド (C3.2)。 改訂前の selfdev sub-command (成熟条件の測定) は ADR-0003 で廃止。
    relationships: [manifest, fleet]
  # ---------------------------------------------------------------- §5 core 依存
  - canonical: tailscale
    domain: consumer
    definition: core 依存。 提示面を tailnet 越しに配信する基盤。 tailnet serve の skill は v1 から移植する。
    relationships: [tailnet serve, 提示面]
  - canonical: tailnet serve
    domain: consumer
    definition: tailscale の tailnet 上で HTML を配信する提示手段。 提示面の既定の配信経路。
    relationships: [tailscale, 提示面]
  - canonical: 提示面
    domain: consumer
    definition: 人間へ成果物 (HTML) を見せる面。 配信は tailnet serve。
    relationships: [tailnet serve]
  - canonical: beads
    domain: consumer
    definition: issue と裁定を dolt backed の DB に持つ外部 OSS の issue tracker。 v2 の台帳の実体で、 bd 経由 (adapter) でのみ触る。
    relationships: [bd, adapter, 台帳, dolt push]
  - canonical: bd
    domain: consumer
    definition: beads の CLI。 v2 が台帳を読む唯一の口で、 JSON 出力を adapter で包んで使う。
    relationships: [beads, adapter]
  - canonical: 台帳
    domain: consumer
    definition: 作業 (issue) と裁定の記録。 実体は beads で、 v2 は自前の台帳を持たない。
    forbidden: [レジャー]
    relationships: [beads, bd]
  - canonical: dolt push
    domain: consumer
    definition: beads の共有 DB (dolt) を remote へ同期する操作。 admin lane だけが行う。
    relationships: [beads, admin lane]
  - canonical: git
    domain: consumer
    definition: core 依存。 成果の保存と統合の基盤。 v2 からは glue の 1 つとして adapter 経由で叩く。
    relationships: [glue, adapter]
  - canonical: tmux
    domain: consumer
    definition: core 依存。 席 (session) を載せる terminal multiplexer。 server 名の導出規則は C2.2。
    relationships: [席, NAME 定数, glue]
  - canonical: ssh
    domain: consumer
    definition: glue の 1 つ。 他 host の席や状態へ到達する経路で、 adapter 経由で叩く。
    relationships: [glue, adapter]
  - canonical: claude CLI
    domain: consumer
    definition: core 依存。 Claude Code の CLI。 席の実体 (AI session) を起動する glue の 1 つ。
    relationships: [席, glue]
  # ---------------------------------------------------------------- §5 day-1 optional adapter
  - canonical: day-1 optional adapter
    domain: consumer
    definition: seam だけを最初から用意し、 採否を K 指標で決める外部依存の枠。 rtk と graphify が該当する。 依存の追加は A3 の対象。
    relationships: [rtk, graphify, seam, K 指標]
  - canonical: rtk
    domain: consumer
    definition: tool 出力を圧縮する hook policy の 1 項目 (day-1 optional adapter)。 v1 実測の方針「一律 arm しない」を継承し、 機械経路には挟まない (v1 の実測は本 repo へ持ち越していない・SPIKE-tooling-report.md 冒頭)。
    relationships: [day-1 optional adapter]
  - canonical: graphify
    domain: consumer
    definition: land ごとに知識グラフを生成して context を供給する候補 (day-1 optional adapter)。 v1 では micro-bench のみ (v1 の実測は本 repo へ持ち越していない・SPIKE-tooling-report.md 冒頭)。
    relationships: [day-1 optional adapter, land]
  - canonical: K 指標
    domain: consumer
    definition: 器の成熟と運用の健全さを測る指標群 (K1〜K3)。 閾値は rules 行。 成熟条件と day-1 optional adapter の採否判断に使う。
    relationships: [rules 行, 成熟条件, day-1 optional adapter]
  - canonical: land
    domain: consumer
    definition: worker の成果を統合して着地させる操作 (merge)。 MVP では worktree の tree を squash 1 commit で main に載せ、 main で歯を再実走する (SRS FR11)。 graphify は land ごとに走る。 crate の land module が担う。
    relationships: [graphify, 便, gate, verdict export]
  - canonical: verdict export
    domain: consumer
    definition: land ごとの判定を schema 版付きで verdicts.jsonl に追記する面 (跨版の観測面・SRS FR12)。 次の版の器がこの記録を読む。
    relationships: [land, Verdict, 版 N+1]
  # ---------------------------------------------------------------- §4 技術選定が使う概念
  - canonical: glue
    domain: consumer
    definition: 外部 process (tmux / ssh / git / claude CLI) を叩く責務の領域。 core の外側にあり、 adapter が閉じ込める側。
    relationships: [adapter, tmux, ssh, git, claude CLI]
  - canonical: adapter
    domain: consumer
    definition: 外部 OSS や glue を閉じ込める実装層 (薄い wrapper)。 台帳は bd の wrapper 1 本、 glue は std::process の adapter、 day-1 optional adapter も同じ seam に置く。
    relationships: [bd, glue, seam, day-1 optional adapter]
  - canonical: seam
    domain: consumer
    definition: 外部要素 (依存・設定) を差し込む接合点。 adapter の seam は day-1 に用意し、 env seam は新設しない (C2.2)。
    relationships: [adapter, day-1 optional adapter, manifest]
  - canonical: 単一 static binary
    domain: consumer
    definition: 依存を静的 link した実行 file 1 つ。 閉じた toolchain で drift の面を構造から消す (ADR-0001)。
    relationships: [drift の面]
  - canonical: drift の面
    domain: consumer
    definition: v1 で場当たり修正を招いた env 層 (venv / mypy-baseline / bats / host 差) の総称。 v2 は構造から消す (ADR-0001)。
    relationships: [単一 static binary]
  - canonical: 境界 crate
    domain: consumer
    definition: 外部形式 (serde 等の derive) を扱う crate。 derive macro はここに閉じる (C13.2)。
    relationships: [adapter]
  - canonical: docs-only
    domain: consumer
    definition: PR の分類の 1 つで、 変更が文書のみのもの。 flip check の test 差分要件から除外される (C12.3)。 分類は CI が行う。
    relationships: [flip check]
  # ---------------------------------------------------------------- §2 憲法が使う概念
  - canonical: 順位
    domain: consumer
    definition: 憲法の線どうしがぶつかったときの決め方 (場当たり修正の禁止 → 膨張防止 → compile 速度)。 条ではなく全条に先立ち、 条 id の連番を持たない (憲法 §1)。
  - canonical: rules 行
    domain: consumer
    definition: manifest に置く規則の値 1 行 (閾値・有効/無効・裁定 id・裁定時刻・逐語)。 数値の置き場 (C1) で、 変更の手続きは C5。
    forbidden: [規則行]
    relationships: [manifest, 裁定 id, 検出線]
  - canonical: 裁定 id
    domain: consumer
    definition: user 裁定を一意に指す id (transcript の ts)。 rules 行の変更 (C5)、 閾値変更 (A2)、 憲法改訂 (N4) が要求する。
    relationships: [rules 行, 対話面, 承認 event]
  - canonical: RuleKind
    domain: consumer
    definition: 規則の種類を閉じた列挙で表す enum。 網羅 match 必須で、 未実装は compile error (C1)。
    relationships: [rules 行, Verdict]
  - canonical: Verdict
    domain: consumer
    definition: 規則の検査 (Rule::check) や gate が返す判定の型 (C1)。 gate の値は PASS / FAIL / INCONCLUSIVE の 3 値で、 構造化 field が一次 truth (SRS では値を小文字 verdict と書く)。
    relationships: [RuleKind, gate, 便, verdict export]
  - canonical: 席
    domain: consumer
    definition: 1 つの Claude Code session が占める作業単位。 役割の値は core が持つ閉じた enum (runner と lens は席ではない・ADR-0022 §2.1)。 状態は SeatState で運ぶ (C3.3)。
    forbidden: [シート]
    relationships: [fleet, 口座, lease, 管理席, planner]
  - canonical: 口座
    domain: consumer
    definition: Claude の利用枠 (subscription account)。 使い方の規範は C9、 状態は fleet の DB に host 列付きで持つ。
    forbidden: [アカウント]
    relationships: [fleet, lane, 席]
  - canonical: fleet
    domain: consumer
    definition: 複数 host にまたがる席・口座・lease・退役の全体。 状態の持ち方は C3。 MVP では便と席の現在地の全体を指し、 実体は event log 1 file (SRS FR3)。
    relationships: [席, 口座, lease, doctor, event log]
  - canonical: event log
    domain: consumer
    definition: 1 行 1 出来事を追記する file。 fleet の現在地はこれを replay して導く (C3・SRS FR3)。 MVP の永続面で、 process の記憶に状態を持たない。
    relationships: [fleet, 便, 承認 event]
  - canonical: lease
    domain: consumer
    definition: 席が口座や host を占有する期限付きの割当。 fleet の状態の一部。
    relationships: [席, 口座, fleet]
    flagged_ambiguities: [受付札 (ADR-0021 の受付の印) は lease ではない]
  - canonical: 退役
    domain: consumer
    definition: host / 席 / 口座を運用から外す操作。 可逆 move で行う (N1)。
    relationships: [fleet, doctor]
  - canonical: lane
    domain: consumer
    definition: 口座 1 つの消費枠の中で並走させる作業の流れ (席の列)。 lane 数の決め方は rules 行 (§3 R-C9-1)。
    forbidden: [レーン]
    relationships: [口座, admin lane]
  - canonical: admin lane
    domain: consumer
    definition: 管理席が担う実行経路。 dolt push・land など gate 通過後の操作を担う。
    relationships: [lane, 管理席, dolt push, gate]
  - canonical: 管理席
    domain: consumer
    definition: 役割 管理席 を持つ席 (Role の variant 名は core が持つ)。 anchor ごとに 1 席 (SRS FR30 / FR40・ADR-0022 §2.6)。 停止の検知と再起動の規範は C9。 配送構造での仕事 (契約を pipeline に流す・runner の質問を planner へ中継する・go の後に land する) は SRS FR30 (ADR-0016 §2.1) で、 権能の執行は ADR-0022 §2.3。
    forbidden: [運転席]
    relationships: [席, admin lane, planner, 質問 record]
  - canonical: planner
    domain: consumer
    definition: 席の役割の 1 つ (設計協調)。 契約・裁定・land の go を担い、 runner の質問に契約の修正か回答 event で応える (SRS FR30 / FR32・ADR-0016 §2.1 / §2.3)。 対話面の identity は rules 行 R-C7-1 が持ち (ADR-0003)、 その値は planner の席 (ADR-0022 §2.5)。 anchor ごとに 1 席 (SRS FR40)。
    forbidden: [プランナー]
    relationships: [対話面, 席, 開発 session]
  - canonical: 対話面
    domain: consumer
    definition: user と機械が承認や裁定をやり取りする面。 ちょうど 1 つ (C7)。 どの席かは rules 行 R-C7-1 の値で決まり、 値は役割 planner の登録 row を持つ席 (ADR-0022 §2.5)。 承認・回答・go の記帳はその席からだけ受理される。
    relationships: [planner, 開発 session, 承認 event, rules 行]
  - canonical: relay 印
    domain: consumer
    definition: 改訂前の憲法 (C7・A1) で planner が user の承認を機械へ伝えていた印。 ADR-0003 以後、 承認の記帳は承認 event が担う (歴史的な語)。
    relationships: [planner, 承認 event]
  - canonical: 承認 event
    domain: consumer
    definition: user の承認を fleet に記帳する event (approval.requested / approval.received・逐語付き・C7.2)。 3 クラス操作の便はこれで止まり、 記帳された回答で再開する (SRS FR15 / FR16)。
    relationships: [対話面, 3 クラス, event log, 裁定 id]
  - canonical: 3 クラス
    domain: consumer
    definition: user 確認を要する操作の 3 分類 (消す / 出す / 使う)。 A1 の対象。 「出す」= public 化 (可視性の反転) ・外部送信 (他 repo への push・外部サービスへの送信・release / tag の公開)。 自 repo への push と PR 作成は含まない (A4.3 で可逆・ADR-0008)。
    relationships: [対話面, 承認 event, 自 repo への PR]
  - canonical: 自 repo への PR
    domain: consumer
    definition: 自分の repo へ branch を push して PR を作る操作。 main を動かさず branch も PR も閉じられるため A4.3 で可逆と扱い、 3 クラスの「出す」に当たらない (ADR-0008)。 pipeline の seam は --pr-cmd。
    relationships: [3 クラス, 承認 event, 便]
  - canonical: 開発 session
    domain: consumer
    definition: 設計・契約・実装・review を行う AI の session (Claude Code)。 登録された席 (役割 planner / 管理席・ADR-0022 §2.1) で動くときだけ権能を持ち、 対話面はそのうち planner の席 (R-C7-1)。 作業記憶の退避と復元の作法を守る (SRS FR23)。
    relationships: [対話面, 契約, 設計 doc, runner, lens]
  - canonical: 契約
    domain: consumer
    definition: 何を作り・何ができたら終わりかを 1 file に書いたもの。 台帳の 1 bead に対応し、 SRS の要件 id と設計 doc を pointer で持つ (C15・SRS FR2)。
    relationships: [台帳, 設計 doc, write-set, 便]
  - canonical: 設計 doc
    domain: consumer
    definition: 要望を SRS の要件に結び、 契約が複数出る元になる tracked markdown (docs/design/)。
    relationships: [契約, SRS]
  - canonical: SRS
    domain: consumer
    definition: MVP の要件定義書 (design-intent/spec/srs.html)。 folio SRS pack の生成物で、 機械 SSoT は srs.srs.yaml。 上位ニーズ・機能要件・受入基準を持つ。
    relationships: [要件カタログ, 契約, 設計 doc]
  - canonical: 要件カタログ
    domain: consumer
    definition: 要件 doc の v2 行を scrub して写した一覧 (design-intent/spec/requirements-catalog.html)。 SRS の FR が根拠で行 id を引く。
    relationships: [SRS]
  - canonical: write-set
    domain: consumer
    definition: 契約が宣言する、 編集してよい file の集合。 外への編集は編集の時点で止める (C16・SRS FR20)。
    relationships: [契約, in-loop guard]
  - canonical: in-loop guard
    domain: consumer
    definition: 仕様からの逸脱を編集の時点で止める guard (C16)。 MVP の形は write-set の外への Edit / Write を PreToolUse で deny する hook。 極性一覧に InLoop として載る。
    relationships: [write-set, 極性]
  - canonical: runner
    domain: consumer
    definition: 契約 1 本を worktree で実装する headless の Claude process (SRS FR4 / FR5)。 席ではなく使い捨て。 起動時に口座と対象 repo の settings を 1 つも読まない (ADR-0011)。
    relationships: [契約, headless, lens, 便, allowlist]
  - canonical: allowlist
    domain: consumer
    definition: 器が runner に与える「実行してよい command 名の列」。 値は対象 repo の vessel 宣言が持ち、 manifest の rules 行 runner.allowed_commands は宣言が名乗れる上限である (C1 / C10・ADR-0010)。 intake が上限と突合して便ごとに凍結し、 runner は凍結した写しから claude へ --allowedTools として渡し、 口座と対象 repo の settings を 1 つも読まない (ADR-0009 / ADR-0011)。 明示 allow の外は hook が deny する。
    relationships: [runner, vessel 宣言, manifest, rules 行, hook]
  - canonical: 共通 verify
    domain: consumer
    definition: どの便にも共通の deny する検証 (flip check・test・lint・依存監査) を対象 repo の vessel 宣言に置き、 intake が便ごとに凍結した写しを gate が契約 verify の前に撃つもの (C2・ADR-0009 / ADR-0010)。 検出線の行は別の列 (detection-verify・ADR-0021 §2.4) に置き、 契約の verify は便固有の行だけを持つ。
    relationships: [gate, vessel 宣言, 契約, 変異検出線]
  - canonical: 変異検出線
    domain: consumer
    definition: cargo-mutants で生成した変異のうち歯に撃墜されない数を測る検出線 (C12 R-C12-1)。 1 便では vessel 宣言の検出線の列 (detection-verify) にある xtask mutants-diff が便の diff に対して測り、 極性 (記録のみ / deny) は manifest 行に従う (ADR-0009 / ADR-0021)。 並列度は実効 jobs。
    relationships: [共通 verify, gate, flip check]
  - canonical: lens
    domain: consumer
    definition: diff を読んで verdict (PASS / FAIL / INCONCLUSIVE) を返す headless の Claude process (SRS FR9)。 MVP の gate は lens 1 本。 runner と同じ起動形で、 口座と対象 repo の settings を 1 つも読まない (ADR-0011)。
    relationships: [gate, headless, Verdict]
  - canonical: headless
    domain: consumer
    definition: 対話画面を持たず、 入力を受けて 1 回で答えを返す Claude の実行形 (claude -p)。 口座は環境変数で切り替え、 permission は毎回明示し、 user / project / local の settings は読まない (ADR-0011)。
    relationships: [runner, lens]
  - canonical: toy repo
    domain: consumer
    definition: 到達点を測るために一時 dir に作る、 外部依存の無い小さな git repo (SRS AC1)。
    relationships: [便]
  - canonical: ".vessel"
    domain: consumer
    definition: repo root の固定名 marker file。 中身が name と version を言い、 どの器が仕えるかを決める (SPEC §7・SRS FR19)。
    relationships: [器, NAME 定数, vessel 宣言]
  - canonical: vessel 宣言
    domain: consumer
    definition: 対象 repo の root に marker の隣として置く tracked file .vessel.toml。 その repo の allowlist と共通 verify を repo 自身が名乗る宣言値で、 intake が manifest の上限と突合して便ごとに写しへ凍結する (C10・ADR-0010)。 marker そのものは変えない。
    relationships: [".vessel", allowlist, 共通 verify, manifest, intake]
  - canonical: Budget
    domain: consumer
    definition: 起動に必要な予算の型。 Precheck の実測を消費してしか作れず、 唯一の起動口 spawn が要求する (C6)。
    relationships: [Precheck, 検出線]
  - canonical: Precheck
    domain: consumer
    definition: 起動前の見積 (token 上限・検出線との照合) の実測。 Budget の唯一の生成元 (C6)。
    relationships: [Budget]
  - canonical: 検出線
    domain: consumer
    definition: 超えたら機械が検知して記録・起票する線。 PR は止めない。 CI が落とす deny 閾値とは区別する。
    relationships: [rules 行]
  - canonical: 歯
    domain: consumer
    definition: 違反を機械が止める仕組みのうち test / lint / CI gate を指す。 Rust の 1 framework だけで持つ (C12)。
    relationships: [flip check, KNOWN-RED 台帳]
  - canonical: gate
    domain: consumer
    definition: 便の成果物を独立に検証して Verdict を返す機構。 MVP は契約の verify の実走 + lens 1 本 (SRS FR8 / FR9)。 crate の gate module が担う。 歯 (test / lint / CI) とは別の entity。
    relationships: [Verdict, 便, land, lens]
  - canonical: flip check
    domain: consumer
    definition: CI が PR の test 差分だけを base に当てて RED、 HEAD で GREEN であることを確かめる検査 (C12.2)。
    relationships: [歯, docs-only]
  - canonical: KNOWN-RED 台帳
    domain: consumer
    definition: 落ちている test を許容するための一覧。 持たない (C12.6)。
    relationships: [歯]
  - canonical: 器
    domain: consumer
    definition: scribe の実行基盤 (plugin + binary + 席の運用) の 1 世代。 版の作り方の規範は C8。
    relationships: [版 N+1, 自己開発]
  - canonical: 自己開発
    domain: consumer
    definition: 器が自身の repo を開発すること。 ADR-0003 以後は既定で許可 (A4)。 user に先に聞くのは不可逆操作 (3 クラス) だけ。 拘束条件は design-intent (C8)。
    relationships: [器, 版 N+1, 3 クラス]
  - canonical: SelfDev
    domain: consumer
    definition: 改訂前の C8 が定めていた自己開発の許可状態 enum (Disabled / Enabled { ruling_id })。 ADR-0003 で廃止 (歴史的な語)。
    relationships: [自己開発]
  - canonical: 成熟条件
    domain: consumer
    definition: 改訂前の C8 で版の成熟を宣言するために同時に成り立つ条件の集合 (§3 R-C8-1)。 ADR-0003 で停止 (測らない・履歴として残す)。
    relationships: [自己開発, K 指標]
  - canonical: 版 N+1
    domain: consumer
    definition: 次世代の器。 改訂後の C8 では design-intent の下で作られ、 前の版を oracle にしない。 schema 非互換・C4 超えの着地先 (N4)。
    relationships: [器, 自己開発, verdict export]
  - canonical: 便
    domain: consumer
    definition: 契約 1 本の 1 往復 (intake → runner → gate → land)。 MVP の識別子は run id で (run は識別子 run id にのみ用い、 便の実体名には使わない)、 現在地は event log から導く。 到達点は便の本数で数える (SRS AC1 / AC2)。
    relationships: [Verdict, land, gate, 契約, event log]
  - canonical: NAME 定数
    domain: consumer
    definition: plugin 名 / crate / skill 名前空間 / state dir / env 接頭辞 / tmux server 名を導出する 1 定数 (C2.2)。
    relationships: [tmux]
  - canonical: Stage
    domain: consumer
    definition: 選定・除外・routing の適用順を列挙順で定める enum (C2)。
  - canonical: SeatState
    domain: consumer
    definition: 席の状態を運ぶ typed enum (C3.3 / C9)。
    relationships: [席, Completion]
  - canonical: Completion
    domain: consumer
    definition: 完了条件を表す唯一の enum。 待機 API の引数型 (C3.4)。
    relationships: [SeatState]
  - canonical: 極性
    domain: consumer
    definition: guard の性質の対。 いつ止めるか (InLoop / PostHoc) と、 測れない周にどちらへ倒れるか (FailClosed / FailOpen)。 値は境界の定数が運び、 一覧は集めるだけ (C11.2・ADR-0014 §2.1)。
    relationships: [guard, 極性一覧, in-loop guard]
  - canonical: guard
    domain: consumer
    definition: 行為 (編集・起動・merge・書込・session の作り直し) を止めうる判定を返す境界。 状態を選ぶだけの判定は guard ではない (ADR-0014 §2.1)。 全数は閉じた enum が数えきる。
    relationships: [極性, 極性一覧]
  - canonical: 極性一覧
    domain: consumer
    definition: 全 guard を 1 行 1 guard で並べた core の出力 (subcommand polarity) を外形 snapshot として pin した tracked 生成物 (C11.2 / C12.5・ADR-0014 §2.2)。 構造検査の門はこの生成物の集計行を読む (C16.2・ADR-0014 §2.3)。
    relationships: [極性, guard, 判定行]
  - canonical: Declared
    domain: consumer
    definition: 人が書いた宣言値の型 (C10)。
    relationships: [Measured, Effective]
  - canonical: Measured
    domain: consumer
    definition: 実測値の型。 値と出所 (Provenance) を持つ (C10)。
    relationships: [Declared, Derived]
  - canonical: Derived
    domain: consumer
    definition: 他の値から導出した値の型。 Independent を名乗れない (C10)。
    relationships: [Measured]
  - canonical: Effective
    domain: consumer
    definition: 効力を持つ値の型。 Declared から実測を経てのみ作られる (C10)。
    relationships: [Declared]
  - canonical: state dir
    domain: consumer
    definition: 器が状態 (event log・verdict export・注入計測) を置く dir。 既定は NAME 定数から導出し、 差し替えは CLI 引数だけで行う (env seam を持たない・ADR-0004 §2.4)。
    relationships: [NAME 定数, event log, verdict export]
  - canonical: run id
    domain: consumer
    definition: 便 1 本を一意に指す識別子 (bead id と UTC の時刻印から成る)。 event log と state dir 配下の dir 名に用いる。
    relationships: [便, event log, state dir]
  - canonical: measure tag
    domain: consumer
    definition: 構造検査が判定行に出す測定 1 本の名。 各 tag は測る対象と実測値を持つ。 列挙の SSOT は機械側 (判定行と実装) で、 文書は pointer だけを持つ (ADR-0013 §2.1)。
    relationships: [Measured, 判定行]
  - canonical: paths-clean
    domain: consumer
    definition: index を母集団に、 tracked file の本文へ private path 形が残っていないことを測る measure tag。
    relationships: [measure tag]
  - canonical: integration test target
    domain: consumer
    definition: cargo が kind = test として build する 1 つの単位。 dir 形の統合 test は main.rs と
      その module を合わせて 1 と数え、 数は cargo metadata が返す targets で得る (R-C13-2 の数え方の単位・ADR-0007)。
    relationships: [歯]
  # ---------------------------------------------------------------- 開発 session の自律機能 (SRS v0.3 FR25〜FR29)
  - canonical: cap guard
    domain: consumer
    definition: 開発 session の context 使用量が rules 行の上限に達したとき、 退避以外の編集を止める hook の段 (SRS FR26)。 上限の値は rules 行が持つ。
    relationships: [開発 session, hook, manifest]
  - canonical: hook
    domain: consumer
    definition: 器が binary 1 本で仕える Claude Code の event の口 (PreToolUse 等)。
    relationships: [write-set, cap guard]
  - canonical: 管理 tick
    domain: consumer
    definition: 開発 session が黙っていないかを周期で見て、 条件が揃ったときだけ打刻の合図か退避の合図を 1 行注入する仕組み (SRS FR27 / FR29)。
    relationships: [開発 session, cycle, 打刻の合図, 退避の合図]
  - canonical: 席の状態
    domain: consumer
    definition: 開発 session が turn を走らせているか (Busy) 止めているか (Idle) の閉じた enum。 出所は hook の打刻 (UserPromptSubmit → Busy・Stop / SessionStart → Idle) で、 pane の字面は判定入力にしない (憲法 C3.3・ADR-0015 §2.1)。
    relationships: [開発 session, 管理 tick, cycle, 状態の打刻]
  - canonical: 状態の打刻
    domain: consumer
    definition: 席の中で hook が state.jsonl へ append する 1 行 (state / event / ts / sid)。 target は生成 hooks.json の shell 行が渡す pane id から解く (ADR-0015 §2.2)。 無い・読めない・古い周は注入しない (ADR-0015 §2.3)。
    relationships: [席の状態, hook, 管理 tick]
  - canonical: 打刻の合図
    domain: consumer
    definition: 管理 tick が idle の開発 session に注入する 1 行 (SRS FR27)。 heartbeat を打って続きを進めるよう促す。
    relationships: [管理 tick, 開発 session]
  - canonical: 退避の合図
    domain: consumer
    definition: context 使用量が rules 行の上限以上の開発 session に、 管理 tick が idle を待たず注入する 1 行 (SRS FR29)。 作業記憶の退避を促す。
    relationships: [管理 tick, cap guard, 退避物]
  - canonical: cycle
    domain: consumer
    definition: 作業記憶を退避し、 session を作り直し、 退避物から復元する一周 (SRS FR28)。 退避物が無い session では起こさない。
    relationships: [管理 tick, 開発 session]
  - canonical: 配送構造
    domain: consumer
    definition: 便を誰が流し、 runner の質問に誰が答え、 誰が land するかの席の配置。 既定は planner 1 席 + 管理席 N 席 (SRS FR30・ADR-0016 §2.1)。
    relationships: [planner, 管理席, 便]
  - canonical: Blocked
    domain: consumer
    definition: 便の段の 1 つ。 3 クラスを名乗る契約が spawn の手前で承認 event を待っている状態 (SRS FR15 / FR16)。
    relationships: [承認 event, 3 クラス, 便]
  - canonical: 質問 record
    domain: consumer
    definition: runner が契約の不足を返して止まるときに stdout の最終行へ書く JSON 1 つ (question / about)。 要件は SRS FR31、 形式は ADR-0016 §2.2 が正本。
    relationships: [runner, Questioned, 回答 event, 契約]
  - canonical: Questioned
    domain: consumer
    definition: 便の段の 1 つ。 runner の質問 record を受けて回答 event を待っている状態 (SRS FR31 / FR32・ADR-0016 §2.2・Blocked と同型)。
    relationships: [質問 record, 回答 event, 便]
  - canonical: 回答 event
    domain: consumer
    definition: 契約の所有者 (planner) が質問に答えて fleet に記帳する event (QuestionAnswered・逐語付き・actor は machine)。 user の言葉は承認 event にだけ載る (SRS FR32・ADR-0016 §2.3)。
    relationships: [質問 record, Questioned, 承認 event, planner]
  - canonical: 上限 record
    domain: consumer
    definition: claude が口座の使用上限を伝える専用種別の record (rate_limit_event)。 status と使用率を構造化 field で持ち、 器の上限判定はこの record だけを入力にする (ADR-0012 §2.1)。
    relationships: [runner, 口座]
  - canonical: 上限 status
    domain: consumer
    definition: 上限 record の status のうち「便を止める」ことを表す値の閉じた集合。 実測で採れた値だけを入れ、 集合に無い status では止めない (ADR-0012 §2.1・未知は claude の rc へ落ちる)。
    relationships: [上限 record]
  - canonical: 判定行
    domain: consumer
    definition: 構造検査が違反 0 の周にだけ出す 1 行。 measure tag とその実測値を並べる。 measure の列挙はこの現物が SSOT であり、 文書は列挙を写さない (ADR-0013 §2.1)。
    relationships: [measure tag, 構造検査]
  - canonical: 宣言順
    domain: consumer
    definition: 閉じた enum の variant が宣言された順序。 適用順序はこれだけから取り、 順序の散文注記を持たない (憲法 C2)。 充足形は「閉じた enum + 全 variant の const slice + 網羅 match + 並びが判別子の昇順と一致することを測る歯」の 4 つ組である (ADR-0013 §2.2)。
    relationships: [判別子順 pin]
  - canonical: 判別子順 pin
    domain: consumer
    definition: const slice の並びが判別子の昇順 (0, 1, 2, …) と一致することを測る歯。 並べ替え・重複・中間の欠番を捕まえるが、 末尾に足した variant の入れ忘れは捕まえない (ADR-0013 §2.3)。
    relationships: [宣言順]
  # ---------------------------------------------------------------- SRS v0.5 (FR33 / AC8 改訂)
  - canonical: 口座残量
    domain: consumer
    definition: 1 口座 1 時刻で読んだ、 5 時間窓・7 日窓・モデル別 7 日窓の残りと各 reset 時刻の組 (SRS FR33)。 口座の endpoint 由来で、 runner が受ける上限 record (claude の record 由来・検出の合図) とは別の entity。
    forbidden: [クォータ, quota]
    relationships: [口座, fleet, 上限 record, Measured]
  - canonical: 暫定行
    domain: consumer
    definition: 作業記憶の「命令・制約」行のうち出所 pointer を持たない行、 または持っていても器が形で分類できない行 (SRS FR23 / AC8・ADR-0018 §2.2)。 復元の DATA に印付きで列挙され、 次の cycle に引き継がれない。
    forbidden: [仮の行, 暫定命令]
    relationships: [作業記憶, 退避物, 出所 pointer, 憲法]
  # ---------------------------------------------------------------- ADR-0017 (口座残量の計測の形)
  - canonical: 口座 label
    domain: consumer
    definition: manifest の account 行が口座を指すために持つ不透明な符丁 (ADR-0017 §2.3)。 本当の口座の識別子・host 名・path のいずれでもなく、 credential の場所は state dir 配下の同名 dir から解く。
    relationships: [口座, manifest, state dir, 口座残量]
  - canonical: 実測行
    domain: consumer
    definition: 口座残量を 1 口座 1 窓で event log に追記した行 (ADR-0017 §2.1)。 出所 (口座 label・endpoint・時刻) を持つ Measured で、 読めなかった回は使用率を持たない「測れなかった」の行になる。
    relationships: [口座残量, event log, Measured, 上限 record]
  # ---------------------------------------------------------------- ADR-0018 (作業記憶の退避・復元・消費)
  - canonical: 作業記憶
    domain: consumer
    definition: 開発 session が cycle を跨いで運ぶ一時層の記憶。 session id で一意な退避物 (file) として退避し、 復元の DATA と brief を経て消費する (SRS FR23 / ADR-0018)。 規則の置き場ではない (憲法 N2)。
    relationships: [開発 session, 退避物, cycle, 暫定行]
  - canonical: 退避物
    domain: consumer
    definition: 作業記憶を書き出した file。 file 名は session id で一意、 frontmatter で席を名乗り、 消費は同一 suffix (.consumed.md) への move で表す (SRS FR23)。 器の subcommand (seat externalize / rebrief / consume) だけが書き・読み・移す (ADR-0018 §2.1 / §2.3)。
    relationships: [作業記憶, cycle, 管理 tick]
  - canonical: 出所 pointer
    domain: consumer
    definition: 作業記憶の命令行が本文末に持つ、 実在を照合できる carrier 参照。 器は形を閉じた enum (PointerKind) で分類し、 宣言順を優先順位とする (ADR-0018 §2.2)。 形の列挙は機械側 (PointerKind::ALL と外形 snapshot) が正本で、 本 file は写さない。 持たない行・分類できない行は暫定行。
    relationships: [作業記憶, 暫定行, 宣言順]
  # ---------------------------------------------------------------- ADR-0019 (並列の便の受付と衝突)
  - canonical: 追随
    domain: consumer
    definition: land の前に、 便の base より進んだ main へ worktree の branch を rebase して gate をやり直すこと (要件は SRS FR34 が正本・設計は pipeline.md §5.4)。 衝突した周は終端にせず runner を起こし直して write-set の内側で解かせ、 runner の終了後に器が base を進めて記帳する (ADR-0019 §2.2)。
    relationships: [land, 便, runner, write-set]
  - canonical: write-set の交差
    domain: consumer
    definition: 2 つの契約の write-set (path の集合・末尾 / の dir は配下を含む) の共通部分が空でないこと。 intake は live な便と交差する契約を受け付けない (ADR-0019 §2.1)。
    relationships: [write-set, 契約, 便]
  - canonical: 衝突
    domain: consumer
    definition: 追随の rebase で、 先着の変更と同じ箇所が重なり器が自動では合わせられないこと (SRS FR34 が記帳を求め、 解き方は ADR-0019 §2.2 の起こし直し)。 契約同士の write-set の交差 (ADR-0019 §2.1 が intake で断る) とは別の概念。
    relationships: [追随, 起こし直し, write-set の交差]
  - canonical: live な便
    domain: consumer
    definition: 終端でない run。 終端 = 段が Landed / Failed / Stopped のいずれか、 または Gated で verdict が FAIL。 intake の排他が照合する母集団で、 pipe stop --run で 1 本だけ終端に倒せる (ADR-0019 §2.1)。
    relationships: [便, write-set の交差, 契約]
  - canonical: 起こし直し
    domain: consumer
    definition: land の追随が衝突した run で、 同じ worktree と契約に「追随」節を添えて runner をもう 1 回 spawn すること。 回数は rules 行 pipe.follow_retries が上限で、 その判定は guard (ADR-0019 §2.2 / §2.4)。
    relationships: [追随, runner, guard]
  - canonical: 受付の枠
    domain: consumer
    definition: host 単位の受付が便の変異検査に配る並列の枠。 置き場は state dir の親の下の host 用 dir で project をまたぎ、 枠 1 組は受付札 1 つで表す (ADR-0021 §2.3)。 器が管理する状態ではなく受付の一時的な印。
    relationships: [受付札, 実効 jobs, 封じ込め, 検出線]
  - canonical: 受付札
    domain: consumer
    definition: 受付が配った枠を表す file (pid・run・jobs・時刻を持つ)。 生きている process の札だけを数え、 死んだ札と読めない札は回収する (ADR-0021 §2.3)。 fleet の lease (席の期限付き割当) とは別の実体。
    relationships: [受付の枠, 実効 jobs]
  - canonical: 封じ込め
    domain: consumer
    definition: 器が起こす子 process (verify 行・runner・lens) を memory の上限付きの cgroup scope の内側で走らせること。 溢れて止められるのは scope の内側だけで、 封じられない host では並列度を下げて進む (ADR-0021 §2.2)。
    relationships: [受付の枠, 極性一覧, runner]
  - canonical: 実効 jobs
    domain: consumer
    definition: 変異検査に実際に渡す並列度。 rules 行の上限 (宣言値) と受付が測った枠 (測定値) の小さい方で、 vessel 宣言の検出線の穴に器が埋める (ADR-0021 §2.1)。
    relationships: [受付の枠, 変異検出線, vessel 宣言]
  - canonical: 役割
    domain: consumer
    definition: 開発 session の席の種類。 閉じた enum の値で (列挙は core が持ち文書は写さない・ADR-0013 §2.1)、 席の登録 row が持つ。 窓名や env の慣習では決めない (SRS FR40・ADR-0022 §2.1)。
    relationships: [席, planner, 管理席, 権能, 席の登録]
  - canonical: 権能
    domain: consumer
    definition: 役割ごとに許された操作の閉じた一覧 (列挙は core が持ち文書は写さない・ADR-0013 §2.1)。 値は役割ごとの rules 行が持ち (ADR-0022 §2.2)、 hook が tool 呼出しの境界で執行する (SRS FR41・ADR-0022 §2.3)。
    relationships: [役割, rules 行, hook, 対話面]
  - canonical: 席の登録
    domain: consumer
    definition: 席の役割と anchor を鍵に、 target・口座 label・起動の雛形を項目として fleet の event log に記録すること (SRS FR40・ADR-0022 §2.1)。 記録の無い席は権能を持たない。 pane id は鍵にも項目にも置かない。
    relationships: [席, 役割, fleet]
  - canonical: 上限停止
    domain: consumer
    definition: 便または開発 session が口座残量の上限に当たって止まること。 便では Failed でない再開できる段 (SRS FR35・ADR-0020 §2.1)、 session では退避と立て直しの契機 (SRS FR38・ADR-0020 §2.4)。
    relationships: [口座残量, 口座, 口座選定]
  - canonical: 口座選定
    domain: consumer
    definition: manifest の口座と実測の口座残量から 1 本の純関数が口座を選ぶこと (SRS FR36・ADR-0020 §2.2)。 便用 (使い切る側) と session 用 (余裕を残す側) の 2 規則を持ち、 値は rules 行 R-C9-1。
    relationships: [口座, 口座残量, rules 行, 上限停止]
  - canonical: anchor
    domain: consumer
    definition: 対象 repo の main checkout。 席と便の鍵の一部で、 1 つの anchor に planner 1 席・管理席 1 席 (SRS FR40・ADR-0022 §2.1)。 便の worktree はここから切る。
    relationships: [席, 席の登録, worktree, 役割]
  - canonical: 席の指示文
    domain: consumer
    definition: 席の役割ごとに、 tracked な雛形 1 枚と権能の rules 行から器が生成して session の開始・clear・圧縮後に注入する文 (SRS FR42・ADR-0022 §2.4)。 雛形の外に手書きの規範文を持たず、 hook で塞ぐ事項は書かない。
    relationships: [役割, 権能, hook, 開発 session]
  - canonical: 席の queue
    domain: consumer
    definition: 席に向けた dispatch・席宛ての質問・裁定済みの次の行動の集合。 管理 tick は queue が空でない idle の席に続きの pointer を注入し、 queue が承認と裁定の待ちだけのときを正当な idle とする (SRS FR43)。
    relationships: [管理 tick, 席, 席の状態]
  - canonical: 席間の連絡
