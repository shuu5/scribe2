    relationships: [雛形の置き場, host-template, state dir, host の manifest, ".vessel", vessel 宣言, project の群, 席の起動, doctor]
  # ---------------------------------------------------------------- 台帳の問いと裁定・床の検査・選択式の問い・memo の引き金・候補なしの断り (SRS v0.28・ADR-0083〜0086)
  - canonical: 台帳の問い
