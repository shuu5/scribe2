  - canonical: 同じ木の主実測
    domain: consumer
    aliases: [same-tree main check]
    definition: 便が main に着地した直後の検査 (主実測・ADR-0021 §2.4) のうち、 着地する commit の木の sha が gate の verdict の tree と一致する周のもの。 木の sha の一致を gate の測定の再現と見なし、 ① write-set 照合・② 共通 verify・④ 契約 verify の全段を撃たず主実測の省略の record 1 本で残して着地を進める。 全段は ③ 検出線を含まない (検出線は gate でも主実測でも撃たず、 着地後の検出が撃つ・ADR-0060・proposed)。 一致しない周と tree の無い verdict の周は全段撃つ。 候補の木の主実測も同じ 1 関数を通る (ADR-0043・設計 docs/design/gate-cost.md §27)。
    relationships: [主実測の省略の record, 候補の木, 検出線の持ち越し, 検証行の箱, gate, land, 着地後の検出]
