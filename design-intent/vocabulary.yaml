    flagged_ambiguities: ["強制サイクル: SRS の用語集は表示名を強制サイクルとする (SRS の生成器は cycle を部分文字列に持つ用語を拒む)。 正本の名は強制 cycle"]
  - canonical: 便用の並べ鍵
    domain: consumer
    aliases: [run ordering key]
    definition: 便用の口座選定が候補を並べる比較の値の組。 1 つ目 = 口座単位の 7 日窓の古くない最新の実測行が持つ reset 時刻 (早い順・その reset を持たない口座は候補のまま最後)、 2 つ目 = 走行中の便数 (少ない順)、 3 つ目 = label (辞書順)。 5 時間窓とモデル別 7 日窓の reset は鍵に使わず、 それらの窓は当たっている口座を候補から外す判定にだけ効く。 session 用の順序 (逼迫度が最小) とは別 (ADR-0042・ADR-0027 §2.2 の 1 つ目の鍵を supersede・設計 docs/design/account-autonomy.md §19)。
