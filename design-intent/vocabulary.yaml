    domain: consumer
    aliases: [main skip record]
    definition: 同じ木の主実測の周に verify-main.jsonl へ 1 本だけ書く record (kind=main skipped=main tree=<sha> reason=same-tree)。 既存の skip record と同じ閉じた口から作り、 どの木の測定を再現と見なしたかを木の sha で必ず持つ (C10)。 schema は 1 のまま field を足さず、 読み手は skipped の非空で従来どおり拾う (ADR-0043)。
