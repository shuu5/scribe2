# vessel 宣言（ADR-0010 §2.1 / §2.5）。この repo を対象に便を起こす器へ、許してよい
# command と「どの便でも撃つ検証」を宣言する。値は器の上限（rules 行
# runner.allowed_commands）の内側でなければ intake が便を起こさない。
schema = 1
allowed-commands = ["cargo", "git"]
common-verify = ["cargo xtask flip-check --base {base}", "cargo nextest run --workspace --no-tests=fail --no-fail-fast","cargo clippy --workspace --all-targets -- -D warnings", "cargo xtask check", "cargo deny check bans licenses sources"]
# 検出線（C12.4・落ちても deny しない行）。gate は共通 verify の後・契約 verify の前に撃ち、
# land の main 実測は木が gate と同じなら撃ち直さない（ADR-0021 §2.4）。deny に昇格した行は
# 同じ便で common-verify へ戻す。`{jobs}` / `{threads}` は器の受付が実測から決める実効値
# （設計 gate-cost.md §3.3 / §31・道具は値を持たない）。`{teeth}` は器が契約の verify 行から導く
# filter 語（`,` 区切り・0 本は `-`・設計 gate-cost.md §34）。
detection-verify = ["cargo xtask mutants-diff --base {base} --jobs {jobs} --threads {threads} --teeth {teeth}"]
# land の終端（設計 contract-source.md §5・`s2-07l.382`）。**器に既定は無い**——push は repo の外へ
# 出す行為（憲法 A1 の「出す」）なので、押す先はここで名指した repo の便だけが終端を持つ。
# `ci-cmd` は書かない＝既定の 1 行（forge の CLI・`{sha}` は 40 桁）を撃つ。
remote = "origin"
# close の理由の門に加わる（設計 ledger-form.md §16・ADR-0097）。理由の無い close・和の外の理由・席の着地の形の close を
# 起票の門が断る。契約の close は land の終端が書く。
close-check = true
# merge の門の 2 つ目の判定（設計 row-review.md §4・§6）。契約表の動いた PR の head は、行の審査の記録が pass でなければ merge を断る。
row-review = true
# 索引の宣言（設計 reverse-index.md §4 形 1・ADR-0105）。code の事実は外の索引から読む（器は Cargo の依存を足さない）。
# `index-scip`: 1 行ごとに SCIP の file を 1 つ出す（rust-analyzer・版は rust-toolchain.toml の channel が固定する・穴は `{tree}` と `{out}`）。
# `index-roles`: 1 行ごとに構文の役（§5 の 9 語）の一致を stdout に 1 行 1 件の JSON で出す（ast-grep 0.45.3・規則は .config/index-roles.yml・穴は `{tree}`）。
index-scip = ["rust-analyzer scip {tree} --output {out}"]
index-roles = ["ast-grep scan --rule .config/index-roles.yml --json=stream {tree}"]
