[package]
name = "scribe2"
version = "0.1.0"
edition = "2021"
# 二択の SPDX 式（全文は repo root の LICENSE-MIT / LICENSE-APACHE）。裁定と経緯は
# 台帳 s2-0wu が持つ。deny.toml の private ignore を外す前提でもある。
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "vessel"

[lints]
workspace = true

[dependencies]

[dev-dependencies]
insta = { version = "1.48.0", default-features = false }
# 性質の量産（憲法 C12.7）。derive は入れない（C13.2）・default feature も使わない。
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
