# 同型の審査 FAIL の停止の回数（本・設計 contract-source.md §23・`s2-07l.396`）。受付（pipe intake / preflight）は同じ
# bead の便を新しい順に読み、同じ理由の型（crates 側の FindingKind）の FAIL が PASS で途切れるまでこの本数続き、
# 契約 file と節の本文がともに不変の周を same-kind-repeated で断る（焼き直しは書き直す）。行の無い manifest は
# 受付を 1 byte も動かさない（rc 2・pipe.land_wait_s と同じ極性）。

[[rule]]
id = "review.same_kind_stop"
kind = "ReviewSameKindStop"
value = 2
enabled = true
ruling = "user 2026-09-16T05:53Z"
ruled_at = "2026-09-16"

# 入口の flip check（cargo xtask flip-check）の免除経路の閉じ方（設計 pipeline.md §7・`s2-07l.170`）。
# docs_only_faces: .rs の差が無い便を docs-only と読む path の面（/ で終わる要素は接頭辞・他は path の完全一致）。
# 面の外の file を 1 本でも含む便は no-test-diff で落ちる（plugin/ と rules/ は生成物と規則で docs でない）。
# marks_per_pr: 1 便が足してよい札（retroactive / moved）の本数の上限。超えた便は too-many-marks で落ちる。
# 読み手は xtask の flipcheck.rs と limits.rs の FlipLimits の 1 本（core は値を消費しない）。

[[rule]]
id = "flip.docs_only_faces"
kind = "FlipDocsOnlyFaces"
value = ["docs/", "design-intent/", ".beads/", "README.md", "CLAUDE.md"]
enabled = true
ruling = "user 2026-09-22T06:48Z"
ruled_at = "2026-09-22"

[[rule]]
id = "flip.marks_per_pr"
kind = "FlipMarksPerPr"
value = 16
enabled = true
ruling = "user 2026-09-22T06:48Z"
ruled_at = "2026-09-22"

# 起票の門（hook の pre-tool-use・Bash）が断る台帳 write の形（設計 vessel-hook.md §10・`s2-07l.169`）。値は形の 1 語の
# 閉じた列で、列に載る形だけを断る: notes-replace（--notes の置換）/ memory-subcommand（remember / recall / memories）/
# create-without-parent（--parent を持たない create）/ bd-outside-bdw（台帳の script を経ない bd の書き込み）。判定は
# core の hook::ledger_guard の 1 関数が持つ。行が無い・読めない・不発効の周は bd / bdw の command を通さない（fail-closed）。

[[rule]]
id = "ledger.denied_writes"
kind = "LedgerDeniedWrites"
value = ["notes-replace", "memory-subcommand", "create-without-parent", "bd-outside-bdw"]
enabled = true
ruling = "user 2026-09-22T08:44Z"
ruled_at = "2026-09-22"

# host の破壊防止の見張り（subcommand host-guard・設計 vessel-hook.md §11・ADR-0056）が読む種類ごとの行。語列の 3 行
# （git の履歴破壊 / tmux server の破壊 / 台帳の破壊）は runner.denied_commands と同じ照合（先頭語一致 + 残りの語の包含）で、
# enabled = false は host-guard の口だけを切る（command guard は 3 行を enabled に関わらず読む）。host_guard.git は
# runner.denied_commands の git の 7 語列の写し（重複を外すのは行 f）。rm の行の値は守る集合の記号（判定は行 c）。
# host_guard.tmux は前の器の tmux の見張りが global option の位置で止めた 3 形（kill-server / -C / -f）、host_guard.ledger
# は台帳の bead と dolt の履歴の破壊の 4 語列。見張り自身の設定の編集の種類は行を持たない（切れない唯一の種類）。
# 行が無い・列でない周は fail-closed。4 行とも同じ裁定（user 裁定 2026-09-20 JST・UTC の分で id を書く）。

[[rule]]
id = "host_guard.git"
kind = "HostGuardDeniedCommands"
value = ["git push --force", "git push -f", "git reset --hard", "git branch -D", "git clean -f", "git stash drop", "git stash clear"]
enabled = true
ruling = "user 2026-09-19T15:28Z"
ruled_at = "2026-09-19"

[[rule]]
id = "host_guard.tmux"
kind = "HostGuardDeniedCommands"
value = ["tmux kill-server", "tmux -C", "tmux -f"]
enabled = true
ruling = "user 2026-09-19T15:28Z"
ruled_at = "2026-09-19"

[[rule]]
id = "host_guard.ledger"
kind = "HostGuardDeniedCommands"
value = ["bd delete", "dolt reset --hard", "dolt branch -D", "dolt branch -d"]
enabled = true
ruling = "user 2026-09-19T15:28Z"
ruled_at = "2026-09-19"

[[rule]]
id = "host_guard.rm"
kind = "HostGuardRmProtected"
value = ["state-dir", "repo-tracked", "repo-git"]
enabled = true
ruling = "user 2026-09-19T15:28Z"
ruled_at = "2026-09-19"

# 管理 tick（seat tick・設計 seat-heartbeat.md §2 形 5 / §10 形 5〜7・ADR-0058 §2・ADR-0068）の 3 行。tick_interval_s は
# timer の周期（秒・unit を書く口が読む）、tick_stale_s は黙りの閾値（settle の基準）・Busy の古さの 2 役（秒）、
# pointer_ladder_s は合図の梯子の列（秒の文字列・非空・狭義に昇順・段 n の待ちは列の n 番目・列を越えた段は送らない）。
# 読めない周は tick が no-rule で断る（既定値に倒さない）。3 行とも同じ裁定（梯子の列と周期の裁定）。

[[rule]]
id = "seat.tick_interval_s"
kind = "SeatTickIntervalS"
value = 15
enabled = true
ruling = "user 2026-09-25T14:39Z"
ruled_at = "2026-09-25"

[[rule]]
id = "seat.tick_stale_s"
kind = "SeatTickStaleS"
value = 1800
enabled = true
ruling = "user 2026-09-25T14:39Z"
ruled_at = "2026-09-25"

[[rule]]
id = "seat.pointer_ladder_s"
kind = "SeatPointerLadderS"
value = ["1800", "3600", "10800", "21600", "43200", "86400"]
enabled = true
ruling = "user 2026-09-25T14:39Z"
ruled_at = "2026-09-25"

# 群の移動の退避の猶予（秒・設計 seat-heartbeat.md §13 形 1・ADR-0071）。起点は群の記録の ts で、猶予の内側は退避の合図の
# 1 行だけを送り、/exit は猶予を越えてから送る（席の裏の subagent を落とさない）。0 は猶予なし（記録の直後に /exit）。
