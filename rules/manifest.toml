# subcommand）と Edit 系（path 種別）の 2 面でこの行を読んで止める。席は orchestrator の 1 つで、src の編集
# （edit-code）は行に無く、歯（crates/<crate>/tests/）だけが edit-tests で開く。便の起動と着地と merge（launch /
# merge）は器の dispatcher の口ゆえ行に並ばない。便 1 本を名指す停止（stop・pipe stop --run <id>）は席が撃てる
