# 規則の値の正本（憲法 C1「規則はデータ」）。機械が実行時に読む規則はこの file だけである。
# 全行に user の裁定 id（ruling）と裁定の日付（ruled_at）が要る（憲法 C5）。裁定の無い行は
# loader が拒む。user の逐語は書かない（本 repo は PUBLIC・SRS CON2）。
# enabled も全行に要る（裁定 id 'user 2026-09-11T23:59Z'）。省略を true で埋めると、書き
# 忘れた行が黙って効く側へ倒れる——発効は書かれた事実であって既定ではない。
# 行 id は憲法 §3 の行 id を接頭辞として持つ（compound 行は . で枝分かれ）か、MVP の運用値の
# <領域>.<名> である。種類の一覧は crates 側の RuleKind が持つ。

schema = 1

